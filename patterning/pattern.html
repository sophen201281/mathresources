<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tape Measure + Canvas + Objects</title>
<style>
body{
margin:0;
overflow:hidden;
background:#eef2f7;
font-family:Arial;
}
/* ---------- UI ---------- */
#display{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
background:white;
padding:10px 18px;
border-radius:10px;
font-size:22px;
font-weight:bold;
z-index:1000;
}
#toolbar{
position:fixed;
top:60px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
background:white;
padding:8px;
border-radius:10px;
z-index:1000;
}
#toolbar select,
#toolbar button{
padding:8px;
font-size:16px;
}
/* ---------- CANVAS ---------- */
#drawCanvas{
position:absolute;
inset:0;
z-index:1;
touch-action:none;
}
/* ---------- SCENE ---------- */
#scene{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
}
/* ---------- OBJECTS ---------- */
.object{
position:absolute;
z-index:200;
touch-action:none;
user-select:none;
}
.table{
width:180px;
height:80px;
background:#9c6b3d;
border:3px solid #6d4825;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-weight:bold;
}
.pencil{
width:180px;
height:18px;
background:#f4c542;
}
/* ---------- TAPE ---------- */
#hook{
position:absolute;
width:14px;
height:34px;
background:#333;
z-index:500;
transform-origin:center;
touch-action:none;
}
#tape{
position:absolute;
height:28px;
background:#fff5a0;
border-top:1px solid black;
border-bottom:1px solid black;
overflow:hidden;
transform-origin:left center;
z-index:300;
touch-action:none;
}
.tick{
position:absolute;
width:1px;
background:black;
bottom:0;
}
.label{
position:absolute;
font-size:12px;
top:1px;
}
#case{
position:absolute;
width:70px;
height:50px;
background:orange;
border-radius:12px;
z-index:600;
transform-origin:center;
touch-action:none;
}
#rotate{
position:absolute;
width:34px;
height:34px;
border-radius:50%;
background:#2d7cff;
color:white;
display:flex;
justify-content:center;
align-items:center;
z-index:700;
touch-action:none;
}
</style>
</head>
<body>
<div id="display">44.0 cm</div>
<div id="toolbar">
<select id="objectSelect">
<option value="">Select Object</option>
<option value="table">Table</option>
<option value="pencil">Pencil</option>
</select>
<button id="drawBtn">Draw</button>
<button id="eraserBtn">Eraser</button>
<button onclick="clearCanvas()">Clear</button>
</div>
<canvas id="drawCanvas"></canvas>
<div id="scene">
<div id="tape"></div>
<div id="hook"></div>
<div id="case"></div>
<div id="rotate">↻</div>
</div>
<script>
/* ================= CANVAS ================= */
const canvas=document.getElementById("drawCanvas");
const ctx=canvas.getContext("2d");
let drawing=false;
let erasing=false;
function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);
document.getElementById("drawBtn").onclick=()=>{
erasing=false;
};
document.getElementById("eraserBtn").onclick=()=>{
erasing=true;
};
canvas.onpointerdown=e=>{
drawing=true;
ctx.beginPath();
ctx.moveTo(e.clientX,e.clientY);
};
canvas.onpointermove=e=>{
if(!drawing)return;
ctx.globalCompositeOperation =
erasing ? "destination-out" : "source-over";
ctx.lineWidth = erasing ? 18 : 2;
ctx.lineTo(e.clientX,e.clientY);
ctx.stroke();
};
window.onpointerup=()=>{
drawing=false;
ctx.beginPath();
};
function clearCanvas(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}
/* ================= TAPE ================= */
const hook=document.getElementById("hook");
const tape=document.getElementById("tape");
const box=document.getElementById("case");
const rot=document.getElementById("rotate");
const display=document.getElementById("display");
const scene=document.getElementById("scene");
let anchorX=120;
let anchorY=320;
let length=220;
let angle=0;
let action=null;
let dragging=null;
/* SCALE */
for(let i=0;i<3000;i++){
const tick=document.createElement("div");
tick.className="tick";
tick.style.left=(i*5)+"px";
if(i%10===0){
tick.style.height="24px";
const label=document.createElement("div");
label.className="label";
label.innerText=i/10;
label.style.left=(i*5)+"px";
tape.appendChild(label);
}else if(i%5===0){
tick.style.height="16px";
}else{
tick.style.height="10px";
}
tape.appendChild(tick);
}
/* UPDATE */
function update(){
const rad=angle*Math.PI/180;
hook.style.left=(anchorX-7)+"px";
hook.style.top=(anchorY-17)+"px";
hook.style.transform=`rotate(${angle}deg)`;
tape.style.left=anchorX+"px";
tape.style.top=(anchorY-14)+"px";
tape.style.width=length+"px";
tape.style.transform=`rotate(${angle}deg)`;
const endX=anchorX+Math.cos(rad)*length;
const endY=anchorY+Math.sin(rad)*length;
box.style.left=(endX-30)+"px";
box.style.top=(endY-25)+"px";
box.style.transform=`rotate(${angle}deg)`;
rot.style.left=(endX+40)+"px";
rot.style.top=(endY-5)+"px";
display.innerText=(length/5).toFixed(1)+" cm";
}
/* STATES */
function reset(){
action=null;
dragging=null;
}
/* TAPE ACTIONS */
hook.onpointerdown=e=>{
reset();
action="hook";
e.stopPropagation();
};
tape.onpointerdown=e=>{
reset();
action="pull";
e.stopPropagation();
};
box.onpointerdown=e=>{
reset();
action="pull";
e.stopPropagation();
};
rot.onpointerdown=e=>{
reset();
action="rotate";
e.stopPropagation();
};
/* MOVE */
window.addEventListener("pointermove",e=>{
const x=e.clientX;
const y=e.clientY;
/* OBJECT DRAG */
if(dragging){
dragging.style.left=(x-dragging.offsetWidth/2)+"px";
dragging.style.top=(y-dragging.offsetHeight/2)+"px";
return;
}
if(!action)return;
if(action==="hook"){
anchorX=x;
anchorY=y;
}
if(action==="pull"){
length=Math.max(40,Math.hypot(x-anchorX,y-anchorY));
}
if(action==="rotate"){
angle=Math.atan2(y-anchorY,x-anchorX)*180/Math.PI;
}
update();
});
window.addEventListener("pointerup",reset);
/* ================= OBJECTS ================= */
document.getElementById("objectSelect")
.addEventListener("change",function(){
const type=this.value;
if(!type)return;
const obj=document.createElement("div");
obj.classList.add("object",type);
obj.style.left="250px";
obj.style.top="250px";
if(type==="table") obj.innerHTML="TABLE";
obj.onpointerdown=e=>{
dragging=obj;
e.stopPropagation();
};
scene.appendChild(obj);
this.value="";
});
update();
</script>
</body>
</html>
