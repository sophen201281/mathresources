        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Battambang', cursive, sans-serif;

        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Layout */
        .navbar {
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 24px;
            color: #2c3e50;
            margin-right: auto;
        }

        /* Controls styling */
        .button1 {
            background: #3498db;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px !important;
            transition: background 0.2s;
        }

        .button1:hover {
            background: #2980b9;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-preset {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ddd;
        }

        .color-preset.active {
            border-color: #333;
        }

        input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }

        input[type="range"] {
            width: 100px;
            cursor: pointer;
        }

        nav ul {
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: #34495e;
            font-weight: bold;
            font-size: 16px !important;
        }

        /* Main Workspace Structure */
        main {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        /* Canvas Wrapper */
        .canvas-container {
            width: 100%;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background-color: #fafafa;
            /* Fallback background image can be re-enabled here */
            /* background-image: url('images/P.png'); */
            background-size: cover;
            touch-action: none; /* Prevents screen scrolling while drawing on mobile */
        }

        /* Number Cards Row Grids */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-row {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
        }

        .card-row button {
            width: 100%;
            aspect-ratio: 1.5;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-row button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* Distinct color theme layers for place values */
        .row-thousands button { background: #e74c3c; }
        .row-hundreds button { background: #e67e22; }
        .row-tens button { background: #2ecc71; }
        .row-ones button { background: #9b59b6; }

        /* Media Queries for Mobile Responsiveness */
        @media (max-width: 768px) {
            .navbar .container {
                justify-content: space-between;
            }
            .logo {
                width: 100%;
                text-align: center;
                margin-bottom: 5px;
            }
            .card-row {
                grid-template-columns: repeat(5, 1fr); /* 5x2 row grid layout on small viewports */
            }
            .card-row button {
                font-size: 12px;
            }
        }
    </style>

    <!-- Canvas Drawing Script Implementation -->
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let drawing = false;
        let strokeColor = '#000000';
        let strokeWidth = 5;
        let restoreHistory = [];

        // Scale canvas internal resolution to match displayed viewport sizes safely
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.width * (9 / 16); // Forces crisp 16:9 ratio grid mapping
            clearCanvas();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', resizeCanvas);

        // Capture Drawing Events (Mouse and Touch Screen compatible)
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            drawing = true;
            // Capture canvas state snapshot before new brush path for instant single-step history undos
            restoreHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            draw(e);
        }

        function stopDrawing() {
            drawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!drawing) return;
            e.preventDefault();
            const coords = getCoordinates(e);

            ctx.lineWidth = strokeWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = strokeColor;

            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchmove', draw, { passive: false });

        // Utility Canvas Actions
        function changeColor(color, element) {
            strokeColor = color;
            document.querySelectorAll('.color-preset').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        function changeWidth(width) {
            strokeWidth = width;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function restore() {
            if (restoreHistory.length > 0) {
                ctx.putImageData(restoreHistory.pop(), 0, 0);
            }
        }
