<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Arrow Place Value Cards + Drawing</title>
<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#eef3ff;
    touch-action:none;
}
h2{
    position:fixed;
    top:0;
    width:100%;
    text-align:center;
    margin:6px 0;
    z-index:3000;
    pointer-events:none;
    font-size:22px;
}
/* ---------- TOOLBAR ---------- */
#toolbar{
    position:fixed;
    top:40px;
    left:8px;
    z-index:3000;
    background:white;
    padding:8px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    max-width:190px;
}
button{
    margin:3px;
    padding:6px 9px;
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}
input{
    width:70px;
    padding:5px;
    margin:3px;
    border-radius:6px;
    border:1px solid #aaa;
    font-size:14px;
}
.onesBtn{ background:#ffd966; }
.tensBtn{ background:#93c47d; color:white; }
.hundredsBtn{ background:#6fa8dc; color:white; }
.thousandsBtn{ background:#8e7cc3; color:white; }
.drawBtn{
    background:#ff8c42;
    color:white;
}
.eraseBtn{
    background:#e06666;
    color:white;
}
.clearBtn{
    background:#5c6bc0;
    color:white;
}
.homeBtn{
    background:#26a69a;
    color:white;
}
/* ---------- CANVAS ---------- */
#drawCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    touch-action:none;
}
/* ---------- PLAY AREA ---------- */
#playArea{
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
}
/* ---------- CARDS ---------- */
.card{
    position:absolute;
    height:52px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding-left:12px;
    font-size:24px;
    font-weight:bold;
    user-select:none;
    cursor:grab;
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
    border:2px solid rgba(0,0,0,0.15);
    pointer-events:auto;
}
.card::after{
    content:"";
    position:absolute;
    right:-22px;
    top:0;
    width:0;
    height:0;
    border-top:26px solid transparent;
    border-bottom:26px solid transparent;
}
/* ---------- CARD SIZES ---------- */
.ones{
    width:60px;
    background:#ffd966;
    z-index:4;
}
.ones::after{
    border-left:22px solid #ffd966;
}
.tens{
    width:92px;
    background:#93c47d;
    color:white;
    z-index:3;
}
.tens::after{
    border-left:22px solid #93c47d;
}
.hundreds{
    width:125px;
    background:#6fa8dc;
    color:white;
    z-index:2;
}
.hundreds::after{
    border-left:22px solid #6fa8dc;
}
.thousands{
    width:158px;
    background:#8e7cc3;
    color:white;
    z-index:1;
}
.thousands::after{
    border-left:22px solid #8e7cc3;
}
.number{
    letter-spacing:10px;
}
</style>
</head>
<body>
<h2>🔢 Arrow Place Value Cards</h2>
<div id="toolbar">
    <!-- NUMBER INPUTS -->
    <div>
        <input id="onesInput" type="number" min="0" max="9" value="0">
        <button class="onesBtn" onclick="createCard('ones')">
            Ones
        </button>
    </div>
    <div>
        <input id="tensInput" type="number" min="0" max="9" value="1">
        <button class="tensBtn" onclick="createCard('tens')">
            Tens
        </button>
    </div>
    <div>
        <input id="hundredsInput" type="number" min="0" max="9" value="4">
        <button class="hundredsBtn" onclick="createCard('hundreds')">
            Hundreds
        </button>
    </div>
    <div>
        <input id="thousandsInput" type="number" min="0" max="9" value="3">
        <button class="thousandsBtn" onclick="createCard('thousands')">
            Thousands
        </button>
    </div>
    <hr>
    <button class="drawBtn" onclick="setTool('draw')">
        ✏️ Draw
    </button>
    <button class="eraseBtn" onclick="setTool('erase')">
        🩹 Erase
    </button>
    <button class="clearBtn" onclick="clearCanvas()">
        🧹 Clear
    </button>
    <button class="homeBtn" onclick="goHome()">
        🏠 Home
    </button>
</div>
<canvas id="drawCanvas"></canvas>
<div id="playArea"></div>
<script>
/* ---------- CANVAS ---------- */
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);
let currentTool = "draw";
let drawing = false;
function setTool(tool){
    currentTool = tool;
}
function clearCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
}
canvas.addEventListener("pointerdown",(e)=>{
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.clientX, e.clientY);
});
canvas.addEventListener("pointermove",(e)=>{
    if(!drawing) return;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if(currentTool === "erase"){
        ctx.lineWidth = 35;
        ctx.globalCompositeOperation = "destination-out";
    }
    else{
        ctx.lineWidth = 4;
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = "black";
    }
    ctx.lineTo(e.clientX, e.clientY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.clientX, e.clientY);
});
function stopDrawing(){
    drawing = false;
    ctx.beginPath();
}
canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointerleave", stopDrawing);
/* ---------- PLAY AREA ---------- */
const playArea = document.getElementById("playArea");
/* ---------- GET USER VALUES ---------- */
function getValue(type){
    if(type === "ones"){
        return document.getElementById("onesInput").value;
    }
    if(type === "tens"){
        return document.getElementById("tensInput").value + "0";
    }
    if(type === "hundreds"){
        return document.getElementById("hundredsInput").value + "00";
    }
    if(type === "thousands"){
        return document.getElementById("thousandsInput").value + "000";
    }
}
/* ---------- CREATE CARD ---------- */
function createCard(type){
    const card = document.createElement("div");
    card.className = `card ${type}`;
    const number = document.createElement("div");
    number.className = "number";
    number.innerText = getValue(type);
    card.appendChild(number);
    /* TOP CENTER */
    const centerX = window.innerWidth / 2 - 80;
    card.style.left = centerX + "px";
    card.style.top = "90px";
    playArea.appendChild(card);
    makeDraggable(card);
}
/* ---------- MANUAL CARD ---------- */
function createManualCard(value,type,x,y){
    const card = document.createElement("div");
    card.className = `card ${type}`;
    const number = document.createElement("div");
    number.className = "number";
    number.innerText = value;
    card.appendChild(number);
    card.style.left = x + "px";
    card.style.top = y + "px";
    playArea.appendChild(card);
    makeDraggable(card);
}
/* ---------- HOME BUTTON ---------- */
function goHome(){
    const cards = document.querySelectorAll(".card");
    let startX = window.innerWidth / 2 - 120;
    cards.forEach((card,index)=>{
        card.style.left = (startX + index * 35) + "px";
        card.style.top = "220px";
    });
}
/* ---------- DRAG + DOUBLE TAP DELETE ---------- */
function makeDraggable(card){
    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;
    let lastTap = 0;
    card.addEventListener("pointerdown",(e)=>{
        /* DOUBLE TAP DELETE */
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if(tapLength < 300 && tapLength > 0){
            card.remove();
            return;
        }
        lastTap = currentTime;
        /* DRAGGING */
        dragging = true;
        offsetX = e.clientX - card.offsetLeft;
        offsetY = e.clientY - card.offsetTop;
        card.style.cursor = "grabbing";
        card.setPointerCapture(e.pointerId);
        e.stopPropagation();
    });
    card.addEventListener("pointermove",(e)=>{
        if(!dragging) return;
        card.style.left = (e.clientX - offsetX) + "px";
        card.style.top = (e.clientY - offsetY) + "px";
    });
    card.addEventListener("pointerup",()=>{
        dragging = false;
        card.style.cursor = "grab";
    });
}
/* ---------- START EXAMPLE ---------- */
createManualCard("3000","thousands",210,220);
createManualCard("400","hundreds",245,220);
createManualCard("10","tens",280,220);
createManualCard("0","ones",315,220);
</script>
</body>
</html>
