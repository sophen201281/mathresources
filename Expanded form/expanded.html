<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>បណ្ណព្រួយតម្លៃលេខតាមខ្ទង់</title>

<style>

* { box-sizing: border-box; }

body {

    margin: 0;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #eef3ff;

    touch-action: none;

    height: 100dvh;

}

/* ---------- TITLE ---------- */

h2 {

    position: fixed;

    top: 0;

    width: 100%;

    text-align: center;

    margin: 6px 0;

    z-index: 3000;

    pointer-events: none;

    font-size: 22px;

}

/* ---------- TOOLBAR ---------- */

#toolbar {

    position: fixed;

    bottom: 0;

    left: 0;

    width: 100%;

    z-index: 3000;

    background: rgba(255, 255, 255, 0.95);

    padding: 6px 10px 10px;

    border-radius: 14px 14px 0 0;

    box-shadow: 0 -4px 16px rgba(0,0,0,0.15);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 4px;

    backdrop-filter: blur(4px);

    padding-bottom: calc(8px + env(safe-area-inset-bottom));

}

.toolbar-row {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 6px;

    width: 100%;

}

.toolbar-row input[type="number"] {

    width: 44px;

    padding: 4px;

    border-radius: 6px;

    border: 1px solid #aaa;

    font-size: 16px;

    text-align: center;

}

.toolbar-row button {

    padding: 5px 10px;

    border: none;

    border-radius: 7px;

    font-weight: bold;

    font-size: 13px;

    cursor: pointer;

}

.onesBtn { background: #ffd966; }

.tensBtn { background: #93c47d; color: white; }

.hundredsBtn { background: #6fa8dc; color: white; }

.thousandsBtn { background: #8e7cc3; color: white; }

.drawBtn { background: #ff8c42; color: white; }

.eraseBtn { background: #e06666; color: white; }

.clearBtn { background: #5c6bc0; color: white; }

.homeBtn {

    background: #26a69a;

    color: white;

    text-decoration: none;

    padding: 5px 10px;

    border-radius: 7px;

    font-size: 13px;

}

/* ---------- CANVAS ---------- */

#drawCanvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    z-index: 1;

    touch-action: none;

}

#playArea {

    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;

}

/* ---------- CARDS ---------- */

.card {

    position: absolute;

    height: 60px;

    border-radius: 8px;

    display: flex;

    align-items: center;

    padding-left: 12px;

    font-size: 24px;

    font-weight: bold;

    user-select: none;

    cursor: grab;

    box-shadow: 0 3px 8px rgba(0,0,0,0.2);

    pointer-events: auto;

    will-change: transform, left, top;

}

.card::after {

    content: "";

    position: absolute;

    right: -22px;

    top: 0;

    border-top: 30px solid transparent;

    border-bottom: 30px solid transparent;

}

/* TYPES */

.ones { width: 60px; background: #ffd966; }

.ones::after { border-left: 22px solid #ffd966; }

.tens { width: 92px; background: #93c47d; color: white; }

.tens::after { border-left: 22px solid #93c47d; }

.hundreds { width: 125px; background: #6fa8dc; color: white; }

.hundreds::after { border-left: 22px solid #6fa8dc; }

.thousands { width: 158px; background: #8e7cc3; color: white; }

.thousands::after { border-left: 22px solid #8e7cc3; }

.number { letter-spacing: 10px; }

/* ---------- RESPONSIVE ---------- */

@media (max-width: 700px) {

    h2 { font-size: 17px; }

    .card { height: 52px; font-size: 20px; }

    .ones { width: 52px; }

    .tens { width: 78px; }

    .hundreds { width: 108px; }

    .thousands { width: 136px; }

    .number { letter-spacing: 6px; }

    .toolbar-row button,

    .homeBtn {

        font-size: 11px;

        padding: 4px 7px;

    }

}

@media (max-width: 420px) {

    h2 { font-size: 14px; }

    .card { height: 44px; font-size: 16px; }

    .ones { width: 44px; }

    .tens { width: 66px; }

    .hundreds { width: 92px; }

    .thousands { width: 118px; }

    .number { letter-spacing: 4px; }

}

@media (max-width: 360px) {

    .toolbar-row input { width: 30px; font-size: 13px; }

    .toolbar-row button { font-size: 10px; padding: 3px 5px; }

}

</style>

</head>

<body>

<h2>បណ្ណព្រួយតម្លៃលេខតាមខ្ទង់</h2>

<canvas id="drawCanvas"></canvas>

<div id="playArea"></div>

<div id="toolbar">

    <div class="toolbar-row">

        <input id="thousandsInput" type="number" value="1"><button class="thousandsBtn">ពាន់</button>

        <input id="hundredsInput" type="number" value="2"><button class="hundredsBtn">រយ</button>

        <input id="tensInput" type="number" value="3"><button class="tensBtn">ដប់</button>

        <input id="onesInput" type="number" value="4"><button class="onesBtn">រាយ</button>

    </div>

    <div class="toolbar-row">

        <button class="drawBtn" id="drawBtn">✏️សរសេរ</button>

        <button class="eraseBtn" id="eraseBtn">🩹លុប</button>

        <button class="clearBtn" id="clearBtn">🧹សម្អាត</button>

        <a class="homeBtn" href="../index.html">🏡 Home</a>

    </div>

</div>

<script>

const canvas = document.getElementById("drawCanvas");

const ctx = canvas.getContext("2d");

const playArea = document.getElementById("playArea");

let drawing = false;

let tool = "draw";

/* ---------- CANVAS ---------- */

function resize() {

    const dpr = window.devicePixelRatio || 1;

    canvas.width = innerWidth * dpr;

    canvas.height = innerHeight * dpr;

    canvas.style.width = innerWidth + "px";

    canvas.style.height = innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}

resize();

addEventListener("resize", resize);

canvas.addEventListener("pointerdown", e => {

    drawing = true;

    ctx.beginPath();

    ctx.moveTo(e.clientX, e.clientY);

});

canvas.addEventListener("pointermove", e => {

    if (!drawing) return;

    ctx.lineWidth = tool === "erase" ? 30 : 4;

    ctx.globalCompositeOperation = tool === "erase"

        ? "destination-out"

        : "source-over";

    ctx.lineTo(e.clientX, e.clientY);

    ctx.stroke();

});

addEventListener("pointerup", () => drawing = false);

/* ---------- TOOL ---------- */

document.getElementById("drawBtn").onclick = () => tool = "draw";

document.getElementById("eraseBtn").onclick = () => tool = "erase";

document.getElementById("clearBtn").onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);

/* ---------- CARDS ---------- */

function value(type) {

    return {

        ones: +onesInput.value,

        tens: tensInput.value + "0",

        hundreds: hundredsInput.value + "00",

        thousands: thousandsInput.value + "000"

    }[type];

}

function createCard(type, btn) {

    const card = document.createElement("div");

    card.className = "card " + type;

    card.innerText = value(type);

    playArea.appendChild(card);

    const rect = btn.getBoundingClientRect();

    card.style.left = rect.left + "px";

    card.style.top = (innerHeight - 120) + "px";

    let dx, dy, dragging = false;

    card.addEventListener("pointerdown", e => {

        dragging = true;

        dx = e.clientX - card.offsetLeft;

        dy = e.clientY - card.offsetTop;

        card.setPointerCapture(e.pointerId);

    });

    card.addEventListener("pointermove", e => {

        if (!dragging) return;

        card.style.left = (e.clientX - dx) + "px";

        card.style.top = (e.clientY - dy) + "px";

    });

    card.addEventListener("pointerup", () => dragging = false);

}

document.querySelector(".onesBtn").onclick = e => createCard("ones", e.target);

document.querySelector(".tensBtn").onclick = e => createCard("tens", e.target);

document.querySelector(".hundredsBtn").onclick = e => createCard("hundreds", e.target);

document.querySelector(".thousandsBtn").onclick = e => createCard("thousands", e.target);

</script>

</body>

</html>
