<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>បណ្ណព្រួយតម្លៃលេខតាមខ្ទង់</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    overflow:hidden;

    font-family:Arial, sans-serif;

    background:#eef3ff;

    touch-action:none;

}

h2{

    position:fixed;

    top:0;

    width:100%;

    text-align:center;

    margin:6px 0;

    z-index:3000;

    pointer-events:none;

    font-size:22px;

}

/* ---------- TOOLBAR ---------- */

#toolbar{

    position:fixed;

    top:42px;

    left:8px;

    z-index:3000;

    background:white;

    padding:8px;

    border-radius:10px;

    box-shadow:0 2px 8px rgba(0,0,0,0.2);

    width:180px;

}

.toolbar-row{

    display:flex;

    align-items:center;

    margin-bottom:4px;

}

button{

    margin:2px;

    padding:6px 9px;

    border:none;

    border-radius:7px;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;

}

input{

    width:70px;

    padding:5px;

    margin-right:4px;

    border-radius:6px;

    border:1px solid #aaa;

    font-size:14px;

}

.onesBtn{

    background:#ffd966;

}

.tensBtn{

    background:#93c47d;

    color:white;

}

.hundredsBtn{

    background:#6fa8dc;

    color:white;

}

.thousandsBtn{

    background:#8e7cc3;

    color:white;

}

.drawBtn{

    background:#ff8c42;

    color:white;

}

.eraseBtn{

    background:#e06666;

    color:white;

}

.clearBtn{

    background:#5c6bc0;

    color:white;

}

.homeBtn{

    background:#26a69a;

    color:white;

    text-decoration:none;

    display:inline-block;

    padding:6px 9px;

    border-radius:7px;

    font-size:12px;

    font-weight:bold;

}

/* ---------- CANVAS ---------- */

#drawCanvas{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    z-index:1;

    touch-action:none;

}

/* ---------- PLAY AREA ---------- */

#playArea{

    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;

}

/* ---------- CARDS ---------- */

.card{

    position:absolute;

    height:52px;

    border-radius:8px;

    display:flex;

    align-items:center;

    justify-content:flex-start;

    padding-left:12px;

    font-size:24px;

    font-weight:bold;

    user-select:none;

    cursor:grab;

    box-shadow:0 3px 8px rgba(0,0,0,0.2);

    border:2px solid rgba(0,0,0,0.15);

    pointer-events:auto;

}

.card::after{

    content:"";

    position:absolute;

    right:-22px;

    top:0;

    width:0;

    height:0;

    border-top:26px solid transparent;

    border-bottom:26px solid transparent;

}

/* ---------- CARD TYPES ---------- */

.ones{

    width:60px;

    background:#ffd966;

    z-index:4;

}

.ones::after{

    border-left:22px solid #ffd966;

}

.tens{

    width:92px;

    background:#93c47d;

    color:white;

    z-index:3;

}

.tens::after{

    border-left:22px solid #93c47d;

}

.hundreds{

    width:125px;

    background:#6fa8dc;

    color:white;

    z-index:2;

}

.hundreds::after{

    border-left:22px solid #6fa8dc;

}

.thousands{

    width:158px;

    background:#8e7cc3;

    color:white;

    z-index:1;

}

.thousands::after{

    border-left:22px solid #8e7cc3;

}

.number{

    letter-spacing:10px;

}

</style>

</head>

<body>

<h2>បណ្ណព្រួយតម្លៃលេខតាមខ្ទង់</h2>

<div id="toolbar">

    <div class="toolbar-row">

        <input id="onesInput" type="number" min="0" max="9" value="0">

        <button class="onesBtn" id="onesBtn">

            រាយ

        </button>

    </div>

    <div class="toolbar-row">

        <input id="tensInput" type="number" min="0" max="9" value="1">

        <button class="tensBtn" id="tensBtn">

            ដប់

        </button>

    </div>

    <div class="toolbar-row">

        <input id="hundredsInput" type="number" min="0" max="9" value="4">

        <button class="hundredsBtn" id="hundredsBtn">

            រយ

        </button>

    </div>

    <div class="toolbar-row">

        <input id="thousandsInput" type="number" min="0" max="9" value="3">

        <button class="thousandsBtn" id="thousandsBtn">

            ពាន់

        </button>

    </div>

    <hr>

    <button class="drawBtn" onclick="setTool('draw')">

        ✏️សរសេរ

    </button>

    <button class="eraseBtn" onclick="setTool('erase')">

        🩹លុប

    </button>

    <button class="clearBtn" onclick="clearCanvas()">

        🧹សម្អាត

    </button>

    <a href="../index.html" class="homeBtn">

        🏡 Home

    </a>

</div>

<canvas id="drawCanvas"></canvas>

<div id="playArea"></div>

<script>

/* =========================================================

   CANVAS

========================================================= */

const canvas = document.getElementById("drawCanvas");

const ctx = canvas.getContext("2d");

let currentTool = "draw";

let drawing = false;

/* SAVE DRAWING */

let savedCanvas = document.createElement("canvas");

/* ---------- RESIZE ---------- */

function resizeCanvas(){

    /* SAVE OLD DRAWING */

    savedCanvas.width = canvas.width;

    savedCanvas.height = canvas.height;

    const savedCtx = savedCanvas.getContext("2d");

    savedCtx.clearRect(

        0,

        0,

        savedCanvas.width,

        savedCanvas.height

    );

    savedCtx.drawImage(canvas,0,0);

    /* DEVICE PIXEL RATIO */

    const dpr = window.devicePixelRatio || 1;

    canvas.width = window.innerWidth * dpr;

    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + "px";

    canvas.style.height = window.innerHeight + "px";

    /* RESET SCALE */

    ctx.setTransform(1,0,0,1,0,0);

    /* SCALE */

    ctx.scale(dpr,dpr);

    /* RESTORE DRAWING */

    ctx.drawImage(

        savedCanvas,

        0,

        0,

        savedCanvas.width,

        savedCanvas.height,

        0,

        0,

        window.innerWidth,

        window.innerHeight

    );

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

}

resizeCanvas();

/* FIX ROTATION */

let resizeTimeout;

window.addEventListener("resize",()=>{

    clearTimeout(resizeTimeout);

    resizeTimeout = setTimeout(()=>{

        resizeCanvas();

    },150);

});

/* ---------- POSITION ---------- */

function getCanvasPos(e){

    const rect = canvas.getBoundingClientRect();

    return{

        x:e.clientX - rect.left,

        y:e.clientY - rect.top

    };

}

function setTool(tool){

    currentTool = tool;

}

function clearCanvas(){

    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );

}

/* ---------- DRAW ---------- */

canvas.addEventListener("pointerdown",(e)=>{

    drawing = true;

    const pos = getCanvasPos(e);

    ctx.beginPath();

    ctx.moveTo(pos.x,pos.y);

    canvas.setPointerCapture(e.pointerId);

});

canvas.addEventListener("pointermove",(e)=>{

    if(!drawing) return;

    const pos = getCanvasPos(e);

    if(currentTool === "erase"){

        ctx.lineWidth = 35;

        ctx.globalCompositeOperation = "destination-out";

    }else{

        ctx.lineWidth = 4;

        ctx.globalCompositeOperation = "source-over";

        ctx.strokeStyle = "black";

    }

    ctx.lineTo(pos.x,pos.y);

    ctx.stroke();

});

function stopDrawing(){

    drawing = false;

    ctx.beginPath();

}

canvas.addEventListener("pointerup",stopDrawing);

canvas.addEventListener("pointercancel",stopDrawing);

canvas.addEventListener("pointerleave",(e)=>{

    if(e.buttons === 1) return;

    stopDrawing();

});

/* =========================================================

   PLAY AREA

========================================================= */

const playArea = document.getElementById("playArea");

/* =========================================================

   GET VALUE

========================================================= */

function getValue(type){

    if(type === "ones"){

        return document.getElementById("onesInput").value;

    }

    if(type === "tens"){

        return document.getElementById("tensInput").value + "0";

    }

    if(type === "hundreds"){

        return document.getElementById("hundredsInput").value + "00";

    }

    if(type === "thousands"){

        return document.getElementById("thousandsInput").value + "000";

    }

}

/* =========================================================

   CREATE CARD

========================================================= */

function createCard(type,buttonElement){

    const card = document.createElement("div");

    card.className = `card ${type}`;

    const number = document.createElement("div");

    number.className = "number";

    number.innerText = getValue(type);

    card.appendChild(number);

    playArea.appendChild(card);

    const rect = buttonElement.getBoundingClientRect();

    let x = rect.right + 18;

    let y = rect.top;

    const cardWidth = card.offsetWidth;

    if(x + cardWidth > window.innerWidth - 10){

        x = window.innerWidth - cardWidth - 10;

    }

    card.style.left = x + "px";

    card.style.top = y + "px";

    makeDraggable(card);

}

/* BUTTON EVENTS */

document.getElementById("onesBtn").onclick = function(){

    createCard("ones",this);

};

document.getElementById("tensBtn").onclick = function(){

    createCard("tens",this);

};

document.getElementById("hundredsBtn").onclick = function(){

    createCard("hundreds",this);

};

document.getElementById("thousandsBtn").onclick = function(){

    createCard("thousands",this);

};

/* =========================================================

   MANUAL CARD

========================================================= */

function createManualCard(value,type,x,y){

    const card = document.createElement("div");

    card.className = `card ${type}`;

    const number = document.createElement("div");

    number.className = "number";

    number.innerText = value;

    card.appendChild(number);

    card.style.left = x + "px";

    card.style.top = y + "px";

    playArea.appendChild(card);

    makeDraggable(card);

}

/* =========================================================

   DRAG + DOUBLE TAP DELETE

========================================================= */

function makeDraggable(card){

    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;

    let lastTap = 0;

    card.addEventListener("pointerdown",(e)=>{

        const currentTime = new Date().getTime();

        const tapLength = currentTime - lastTap;

        /* DOUBLE TAP DELETE */

        if(tapLength < 300 && tapLength > 0){

            card.remove();

            return;

        }

        lastTap = currentTime;

        dragging = true;

        offsetX = e.clientX - card.offsetLeft;

        offsetY = e.clientY - card.offsetTop;

        card.style.cursor = "grabbing";

        card.setPointerCapture(e.pointerId);

        e.stopPropagation();

    });

    card.addEventListener("pointermove",(e)=>{

        if(!dragging) return;

        let x = e.clientX - offsetX;

        let y = e.clientY - offsetY;

        x = Math.max(

            0,

            Math.min(window.innerWidth - card.offsetWidth,x)

        );

        y = Math.max(

            0,

            Math.min(window.innerHeight - card.offsetHeight,y)

        );

        card.style.left = x + "px";

        card.style.top = y + "px";

    });

    card.addEventListener("pointerup",()=>{

        dragging = false;

        card.style.cursor = "grab";

    });

}

/* =========================================================

   START EXAMPLE

========================================================= */

createManualCard("3000","thousands",210,220);

createManualCard("400","hundreds",245,220);

createManualCard("10","tens",280,220);

createManualCard("0","ones",315,220);

</script>

</body>

</html>
