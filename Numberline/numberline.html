<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Canvas + Number Line + Walker + Clouds</title>

<style>

*{

box-sizing:border-box;

}

body{

margin:0;

padding:15px;

font-family:Arial,sans-serif;

background:#f2f2f2;

display:flex;

flex-direction:column;

align-items:center;

}

.toolbar{

display:flex;

gap:10px;

margin-bottom:15px;

flex-wrap:wrap;

}

button{

padding:10px 16px;

font-size:16px;

border:none;

border-radius:8px;

cursor:pointer;

}

.active{

outline:3px solid blue;

}

#drawCanvas{

width:95%;

max-width:1000px;

height:350px;

border:3px solid black;

background:white;

touch-action:none;

display:block;

}

.number-line-container{

width:75%;

max-width:700px;

margin-top:80px;

position:relative;

padding-bottom:170px;

}

.line{

width:100%;

height:4px;

background:black;

position:relative;

}

.marker{

position:absolute;

top:-15px;

transform:translateX(-50%);

display:flex;

flex-direction:column;

align-items:center;

}

.tick{

width:3px;

height:30px;

background:black;

}

.marker input{

width:60px;

padding:5px;

margin-top:8px;

font-size:18px;

text-align:center;

pointer-events:auto;

touch-action:auto;

z-index:20;

}

/* WALKER */

#walker{

position:absolute;

top:-75px;

left:0;

font-size:55px;

transform:

translateX(-50%)

scaleX(-1);

touch-action:none;

user-select:none;

cursor:grab;

z-index:15;

}

/* CLOUD */

.cloud{

position:absolute;

font-size:60px;

left:40px;

top:-150px;

cursor:grab;

touch-action:none;

user-select:none;

z-index:15;

}

</style>

</head>

<body>

<div class="toolbar">

<button id="drawBtn">

Draw

</button>

<button id="eraserBtn">

Eraser

</button>

<button onclick="clearCanvas()">

Clear

</button>

</div>

<canvas id="drawCanvas"></canvas>

<div class="number-line-container"

id="container">

<div id="walker">

🚶

</div>

<div class="cloud">

🌧️

</div>

<div class="line"

id="line">

</div>

</div>

<script>

/* ---------------- Container ---------------- */

const container =

document.getElementById(

"container"

);

/* ---------------- Canvas ---------------- */

const canvas =

document.getElementById(

"drawCanvas"

);

const ctx =

canvas.getContext("2d");

function resizeCanvas(){

const r =

canvas.getBoundingClientRect();

canvas.width =

r.width;

canvas.height =

r.height;

}

resizeCanvas();

window.addEventListener(

"resize",

resizeCanvas

);

let drawing=false;

let eraseMode=false;

const drawBtn =

document.getElementById(

"drawBtn"

);

const eraserBtn =

document.getElementById(

"eraserBtn"

);

drawBtn.classList.add(

"active"

);

drawBtn.onclick=()=>{

eraseMode=false;

drawBtn.classList.add(

"active"

);

eraserBtn.classList.remove(

"active"

);

};

eraserBtn.onclick=()=>{

eraseMode=true;

eraserBtn.classList.add(

"active"

);

drawBtn.classList.remove(

"active"

);

};

function getPos(e){

const rect =

canvas.getBoundingClientRect();

if(e.touches){

return{

x:

e.touches[0].clientX

- rect.left,

y:

e.touches[0].clientY

- rect.top

};

}

return{

x:e.clientX-rect.left,

y:e.clientY-rect.top

};

}

function startDraw(e){

drawing=true;

const p =

getPos(e);

ctx.beginPath();

ctx.moveTo(

p.x,

p.y

);

}

function draw(e){

if(!drawing) return;

const p =

getPos(e);

ctx.lineWidth =

eraseMode

? 25

: 3;

ctx.lineCap =

"round";

ctx.globalCompositeOperation =

eraseMode

? "destination-out"

: "source-over";

ctx.lineTo(

p.x,

p.y

);

ctx.stroke();

e.preventDefault();

}

function stopDraw(){

drawing=false;

ctx.beginPath();

}

canvas.addEventListener(

"mousedown",

startDraw

);

canvas.addEventListener(

"mousemove",

draw

);

canvas.addEventListener(

"mouseup",

stopDraw

);

canvas.addEventListener(

"mouseleave",

stopDraw

);

canvas.addEventListener(

"touchstart",

startDraw,

{passive:false}

);

canvas.addEventListener(

"touchmove",

draw,

{passive:false}

);

canvas.addEventListener(

"touchend",

stopDraw

);

function clearCanvas(){

ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);

}

/* ---------------- Number Line ---------------- */

const line =

document.getElementById(

"line"

);

for(let i=0;i<11;i++){

const marker =

document.createElement(

"div"

);

marker.className =

"marker";

marker.style.left =

(i*10)+"%";

marker.innerHTML=`

<div class="tick"></div>

<input

type="number"

value="${i}"

>

`;

line.appendChild(

marker

);

}

/* ---------------- Walker ---------------- */

const walker =

document.getElementById(

"walker"

);

let walkDrag=false;

let previousX=0;

walker.addEventListener(

"pointerdown",

e=>{

walkDrag=true;

walker.setPointerCapture(

e.pointerId

);

}

);

walker.addEventListener(

"pointermove",

e=>{

if(!walkDrag) return;

const rect =

container.getBoundingClientRect();

let x =

e.clientX

- rect.left;

x =

Math.max(

0,

Math.min(

rect.width,

x

)

);

walker.style.left =

x+"px";

if(x>previousX){

walker.style.transform=

"translateX(-50%) scaleX(-1)";

}else if(

x<previousX

){

walker.style.transform=

"translateX(-50%) scaleX(1)";

}

previousX=x;

}

);

walker.addEventListener(

"pointerup",

()=>walkDrag=false

);

/* ---------------- Clouds ---------------- */

function makeCloud(cloud){

let dragging=false;

let lastTap=0;

cloud.addEventListener(

"pointerdown",

e=>{

dragging=true;

cloud.setPointerCapture(

e.pointerId

);

}

);

cloud.addEventListener(

"pointermove",

e=>{

if(!dragging) return;

const rect =

container.getBoundingClientRect();

cloud.style.left =

(e.clientX

- rect.left)

+"px";

cloud.style.top =

(e.clientY

- rect.top)

+"px";

});

cloud.addEventListener(

"pointerup",

()=>{

dragging=false;

const now=

Date.now();

if(

now-lastTap

<300

){

const copy=

cloud.cloneNode(true);

copy.style.left=

(parseInt(

cloud.style.left

)+60)+"px";

copy.style.top=

(parseInt(

cloud.style.top

)+20)+"px";

container.appendChild(

copy

);

makeCloud(

copy

);

}

lastTap=

now;

});

}

document

.querySelectorAll(

".cloud"

)

.forEach(

makeCloud

);

</script>

</body>

</html>
