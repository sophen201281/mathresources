<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Canvas + Number Line</title>

<style>

*{
box-sizing:border-box;
user-select:none;
}

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#e9ecef;
display:flex;
flex-direction:column;
align-items:center;
}

.toolbar{
display:flex;
gap:10px;
margin-bottom:10px;
flex-wrap:wrap;
}

button{
padding:10px 16px;
font-size:16px;
border:none;
border-radius:10px;
cursor:pointer;
}

.canvas-wrapper{
position:relative;
width:95%;
max-width:1100px;
height:480px;
background:white;
border:2px solid #222;
overflow:hidden;
}

#drawCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
touch-action:none;
z-index:1;
}

.overlay{
position:absolute;
inset:0;
pointer-events:none;
z-index:10;
}

/* Number line */

#line{
position:absolute;
top:50%;
left:8%;
width:84%;
height:4px;
background:#222;
transform:translateY(-50%);
}

.marker{
position:absolute;
top:50%;
transform:translate(-50%,-50%);
display:flex;
flex-direction:column;
align-items:center;
pointer-events:none;
}

.tick{
width:3px;
height:24px;
background:#111;

position:absolute;
top:50%;
left:50%;

transform:translate(-50%,-50%);
}

.marker input{
width:55px;
margin-top:38px;
text-align:center;
pointer-events:auto;
position:relative;
z-index:5;
}

/* Draggable */

.item{
position:absolute;
pointer-events:auto;
touch-action:none;
transform:translateX(-50%);
cursor:grab;
}

#walker{
top:calc(50% - 80px);
left:8%;
font-size:55px;
z-index:20;
}

.cloud{
top:120px;
left:120px;
font-size:60px;
z-index:15;
}

.selected{
outline:3px solid orange;
border-radius:10px;
}

</style>
</head>

<body>

<div class="toolbar">

<button id="drawBtn">
សរសេរ
</button>

<button id="eraserBtn">
លុប
</button>

<button onclick="clearCanvas()">
សម្អាត
</button>

<button id="addCloudBtn">
ពពក
</button>

<button id="deleteBtn">
លុបពពក
</button>

</div>

<div class="canvas-wrapper" id="wrapper">

<canvas id="drawCanvas"></canvas>

<div class="overlay" id="overlay">

<div id="walker" class="item">
🚶
</div>

<div class="item cloud">
⛈️
</div>

<div id="line"></div>

</div>

</div>

<script>

/* Canvas */

const canvas =
document.getElementById("drawCanvas");

const ctx =
canvas.getContext("2d");

function resize(){

const r =
canvas.getBoundingClientRect();

canvas.width =
r.width;

canvas.height =
r.height;

}

resize();

window.addEventListener(
"resize",
resize
);

let drawing=false;

let eraseMode=false;

const drawBtn =
document.getElementById(
"drawBtn"
);

const eraserBtn =
document.getElementById(
"eraserBtn"
);

drawBtn.onclick=()=>{

eraseMode=false;

};

eraserBtn.onclick=()=>{

eraseMode=true;

};

function getPos(e){

const r =
canvas.getBoundingClientRect();

return{

x:
(e.touches?
e.touches[0].clientX:
e.clientX)-r.left,

y:
(e.touches?
e.touches[0].clientY:
e.clientY)-r.top

};

}

function start(e){

drawing=true;

const p =
getPos(e);

ctx.beginPath();

ctx.moveTo(
p.x,
p.y
);

}

function draw(e){

if(!drawing) return;

const p =
getPos(e);

ctx.lineCap=
"round";

ctx.lineWidth=
eraseMode ? 25 : 3;

ctx.globalCompositeOperation=
eraseMode
? "destination-out"
: "source-over";

ctx.lineTo(
p.x,
p.y
);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(
p.x,
p.y
);

e.preventDefault();

}

function stop(){

drawing=false;

ctx.beginPath();

}

canvas.addEventListener(
"mousedown",
start
);

canvas.addEventListener(
"mousemove",
draw
);

canvas.addEventListener(
"mouseup",
stop
);

canvas.addEventListener(
"touchstart",
start,
{passive:false}
);

canvas.addEventListener(
"touchmove",
draw,
{passive:false}
);

canvas.addEventListener(
"touchend",
stop
);

function clearCanvas(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}

/* Number line */

const overlay =
document.getElementById(
"overlay"
);

const startP=8;
const widthP=84;

for(let i=0;i<11;i++){

const marker =
document.createElement(
"div"
);

marker.className=
"marker";

marker.style.left=
(startP+(widthP/10)*i)
+"%";

marker.innerHTML=
`
<div class="tick"></div>
<input value="${i}">
`;

overlay.appendChild(
marker
);

}

/* Selection */

let selected=null;

function select(el){

document
.querySelectorAll(
".selected"
)
.forEach(
x=>x.classList.remove(
"selected"
)
);

selected=el;

if(el){

el.classList.add(
"selected"
);

}

}

document.getElementById(
"deleteBtn"
).onclick=()=>{

if(
selected &&
selected.id!=="walker"
){

selected.remove();

selected=null;

}

};

/* Drag */

function makeDraggable(el){

let drag=false;

let lastX=0;

let lastTap=0;

el.addEventListener(
"pointerdown",
e=>{

drag=true;

select(el);

e.stopPropagation();

}
);

document.addEventListener(
"pointerup",
()=>drag=false
);

document.addEventListener(
"pointermove",
e=>{

if(!drag) return;

const rect =
wrapper.getBoundingClientRect();

let x =
e.clientX
- rect.left;

let y =
e.clientY
- rect.top;

if(el.id==="walker"){

const leftEdge =
rect.width*0.08;

const rightEdge =
rect.width*0.92;

x=Math.max(
leftEdge,
Math.min(
rightEdge,
x
)
);

}

el.style.left=
x+"px";

if(
el.classList.contains(
"cloud"
)
){

el.style.top=
y+"px";

}

if(el.id==="walker"){

if(x>lastX){

el.style.transform=
"translateX(-50%) scaleX(-1)";

}else{

el.style.transform=
"translateX(-50%) scaleX(1)";

}

lastX=x;

}

}
);

el.addEventListener(
"pointerup",
()=>{

const now=
Date.now();

if(
el.classList.contains(
"cloud"
)
&&
now-lastTap<300
){

const copy=
el.cloneNode(true);

copy.style.left=
(parseFloat(
el.style.left
)+60)+"px";

copy.style.top=
(parseFloat(
el.style.top
)+30)+"px";

overlay.appendChild(
copy
);

makeDraggable(
copy
);

}

lastTap=now;

}
);

}

document
.querySelectorAll(
".item"
)
.forEach(
makeDraggable
);

/* Add cloud */

document.getElementById(
"addCloudBtn"
).onclick=()=>{

const cloud =
document.createElement(
"div"
);

cloud.className=
"item cloud";

cloud.innerHTML=
"🌧️";

cloud.style.left=
"150px";

cloud.style.top=
"120px";

overlay.appendChild(
cloud
);

makeDraggable(
cloud
);

};

</script>

</body>
</html>
