<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>100 Chart</title>

<style>

/* ====== WHITE CLEAN UI ====== */

:root{
  --bg:#ffffff;
  --panel:#f5f6fb;
  --panel-2:#eef0f8;
  --text:#1b1f2a;
  --muted:#5a647a;
  --accent:#2b6fff;
  --accent-2:#00b894;
  --danger:#e74c3c;
  --grid:#d7dbea;
  --shadow: 0 6px 18px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  background:#ffffff;
  color:var(--text);
  font: 20px system-ui;
}

.wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:16px;
}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr;}
}

.card{
  background:var(--panel);
  border-radius:14px;
  overflow:hidden;
  border:1px solid #e3e6f3;
  box-shadow:var(--shadow);
}

header{
  padding:12px 14px;
  border-bottom:1px solid #e3e6f3;
  font-weight:600;
}

.toolbar, .chart-toolbar{
  display:flex;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #e3e6f3;
  flex-wrap:wrap;
}

button{
  background:#ffffff;
  color:var(--text);
  border:1px solid #cfd6ea;
  padding:8px 10px;
  border-radius:10px;
  cursor:pointer;
}

button.secondary{background:#eef1f8}
button.destructive{background:#ffe5e5}

canvas{
  width:100%;
  height:420px;
  display:block;
  background:#ffffff;
  touch-action:none;
  border-radius:10px;
  border:1px solid #e3e6f3;
}

/* ====== 100 GRID FIX ====== */

.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px;              /* tighter spacing ✔ */
  padding:10px;
}

.cell{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;

  background:#eef1fb;
  border-radius:6px;
  cursor:pointer;

  color:#1b1f2a;

  font-size:25px;       /* ✅ FIXED number size */
  font-weight:600;
  line-height:1;

  border:1px solid #d9deef;
}

.cell.on{
  background:#4a63ff;
  color:white;
}

.cell.multiple{
  background:#1fb98b;
  color:white;
}

</style>
</head>

<body>

<div class="wrap">

<!-- ================= CANVAS ================= -->
<section class="card">
<header>ផ្ទាំងសរសេរ</header>

<div class="toolbar">
<button id="pencil">សរសេរ</button>
<button id="eraser">លុប</button>
<button id="clear" class="destructive">សម្អាត</button>
<a href="../index.html">🏡 Home</a>
</div>

<canvas id="c"></canvas>
</section>

<!-- ================= 100 CHART ================= -->
<section class="card">
<header>តារាងការេ 100</header>

<div class="chart-toolbar">
<button id="evens">គូ</button>
<button id="odds">សេស</button>
<button id="clearGrid">សម្អាត</button>
<input id="n" type="number" value="5" min="2" max="20">
<button id="multi">ពហុគុណ</button>
</div>

<div id="grid" class="grid"></div>
</section>

</div>

<script>

/* ================= CANVAS ================= */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function fitCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
}

fitCanvas();
window.addEventListener("resize", fitCanvas);

let drawing = false;
let tool = "pencil";
let last = null;

function pos(e){
  const r = canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}

function draw(a,b){
  ctx.globalCompositeOperation =
    tool === "eraser" ? "destination-out" : "source-over";

  ctx.strokeStyle = "#2b6fff";
  ctx.lineWidth = 4;

  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

canvas.addEventListener("pointerdown", e=>{
  drawing = true;
  canvas.setPointerCapture(e.pointerId);
  last = pos(e);
});

canvas.addEventListener("pointermove", e=>{
  if(!drawing) return;
  const p = pos(e);
  draw(last,p);
  last = p;
});

canvas.addEventListener("pointerup", e=>{
  drawing = false;
  last = null;
  canvas.releasePointerCapture(e.pointerId);
});

document.getElementById("pencil").onclick=()=>tool="pencil";
document.getElementById("eraser").onclick=()=>tool="eraser";
document.getElementById("clear").onclick=()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
};

/* ================= 100 GRID ================= */

const grid = document.getElementById("grid");
const cells = [];

for(let i=1;i<=100;i++){
  const d = document.createElement("div");
  d.className="cell";
  d.textContent=i;
  grid.appendChild(d);
  cells.push(d);
}

let lastIdx=null;

grid.addEventListener("click",e=>{
  const cell = e.target;
  const idx = cells.indexOf(cell);
  if(idx<0) return;

  if(e.shiftKey && lastIdx!=null){
    const a=Math.min(lastIdx,idx);
    const b=Math.max(lastIdx,idx);
    for(let i=a;i<=b;i++){
      cells[i].classList.add("on");
    }
  } else {
    cell.classList.toggle("on");
  }

  lastIdx=idx;
});

document.getElementById("clearGrid").onclick=()=>{
  cells.forEach(c=>{
    c.classList.remove("on","multiple");
  });
};

document.getElementById("evens").onclick=()=>{
  cells.forEach((c,i)=>{
    c.classList.toggle("on",(i+1)%2===0);
  });
};

document.getElementById("odds").onclick=()=>{
  cells.forEach((c,i)=>{
    c.classList.toggle("on",(i+1)%2===1);
  });
};

document.getElementById("multi").onclick=()=>{
  const n=parseInt(document.getElementById("n").value);
  cells.forEach((c,i)=>{
    c.classList.toggle("multiple",(i+1)%n===0);
  });
};

</script>

</body>
</html>
