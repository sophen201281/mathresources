<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal &amp; Match — Number Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-1:#0f3d3e;
    --felt-2:#0a2c2d;
    --card-face:#f5efe0;
    --card-face-shade:#e8dfc8;
    --card-back:#b23b34;
    --card-back-line:#8f2e28;
    --ink:#1c2a44;
    --gold:#d9a441;
    --slot-green:#4fa37b;
    --muted:#a9c2bd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    height:100dvh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(217,164,65,0.10), transparent 60%),
      radial-gradient(circle at 50% 50%, var(--felt-1), var(--felt-2) 120%);
    font-family:'Space Grotesk', sans-serif;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:clamp(8px,1.6dvh,20px);
    padding:clamp(8px,2dvh,24px) clamp(10px,3vw,24px);
    overflow:hidden;
  }

  /* ---------- Header (unused, kept for reference) ---------- */
  header{
    text-align:center;
    max-width:640px;
    flex:0 0 auto;
  }
  .eyebrow{
    font-size:clamp(10px,1.4vw,12px);
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(32px,5vw,48px);
    color:#f5efe0;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  header p{
    font-size:14.5px;
    line-height:1.6;
    color:var(--muted);
    margin:0;
  }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:clamp(8px,1.6vw,14px);
    align-items:flex-end;
    justify-content:center;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    padding:clamp(8px,1.4dvh,16px) clamp(10px,2vw,20px);
    border-radius:14px;
    flex:0 0 auto;
    max-width:100%;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--muted);
  }
  select{
    appearance:none;
    background:var(--felt-2);
    border:1px solid rgba(255,255,255,0.18);
    color:#f5efe0;
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(13px,1.6vw,15px);
    font-weight:600;
    padding:clamp(6px,1.2dvh,8px) clamp(10px,1.8vw,14px);
    border-radius:8px;
    min-width:52px;
    text-align:center;
    cursor:pointer;
  }
  select:focus-visible, button:focus-visible, .card:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  .btn{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(12px,1.5vw,14px);
    letter-spacing:0.02em;
    padding:clamp(7px,1.3dvh,10px) clamp(14px,2.4vw,22px);
    border-radius:8px;
    border:none;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--gold);
    color:#2a1c05;
    box-shadow:0 6px 16px rgba(217,164,65,0.28);
  }
  .btn-primary:hover{box-shadow:0 8px 20px rgba(217,164,65,0.4);}
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid rgba(255,255,255,0.2);
  }
  .btn-ghost:hover{color:#f5efe0;border-color:rgba(255,255,255,0.4);}
  .btn-ghost.active{
    color:#2a1c05;
    background:var(--gold);
    border-color:var(--gold);
  }
  .error-msg{
    font-size:clamp(11px,1.4vw,12.5px);
    color:#f0a08a;
    min-height:0;
    text-align:center;
    flex:0 0 auto;
  }
  .error-msg:empty{display:none;}

  /* ---------- Table ---------- */
  .table{
    width:100%;
    max-width:920px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:clamp(10px,2dvh,32px);
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
  }

  .slots{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:clamp(10px,2.5vw,20px);
    flex:0 0 auto;
  }
  .slot-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(4px,0.8dvh,8px);
    flex:1;
  }
  .slot-label{
    font-size:clamp(9px,1.2vw,11px);
    text-transform:uppercase;
    letter-spacing:0.2em;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  .label-icon{
    width:100px;
    height:100px;
    object-fit:contain;
    border-radius:5px;
    vertical-align:middle;
  }
  .slot{
    width:clamp(52px, min(9vw, 13dvh), 96px);
    aspect-ratio:96/132;
    border:2px dashed rgba(255,255,255,0.28);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:border-color .15s ease, background .15s ease;
  }
  .slot.drag-over{
    border-color:var(--gold);
    background:rgba(217,164,65,0.08);
  }
  .slot.filled{
    border-style:solid;
    border-color:var(--slot-green);
  }
  .slot-hint{
    font-size:11px;
    color:rgba(255,255,255,0.28);
    text-align:center;
    padding:0 8px;
  }

  .divider{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:rgba(255,255,255,0.35);
  }
  .divider .glyph{
    font-family:'Fraunces',serif;
    font-size:22px;
    color:var(--gold);
  }
  .divider small{
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
  }

  /* ---------- Card grid ---------- */
  .grid{
    display:flex;
    flex-wrap:wrap;
    gap:clamp(6px,1.2vw,14px);
    justify-content:center;
    align-content:center;
    max-width:760px;
    flex:0 1 auto;
    overflow:hidden;
  }

  .card{
    width:clamp(38px, min(7vw, 9.5dvh), 72px);
    aspect-ratio:72/100;
    perspective:600px;
    cursor:grab;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:0.35;}
  .card.selected .card-inner{
    box-shadow:0 0 0 3px var(--gold), 0 10px 18px rgba(0,0,0,0.35);
    transform:translateY(-4px) rotateY(0deg);
  }

  .card-inner{
    width:100%;
    height:100%;
    border-radius:9px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.3,1), box-shadow .15s ease;
    box-shadow:0 6px 12px rgba(0,0,0,0.35);
  }
  .card.face-up .card-inner{transform:rotateY(180deg);}

  .card-face{
    position:absolute;
    inset:0;
    border-radius:9px;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-back{
    background:
      repeating-linear-gradient(45deg, var(--card-back-line) 0 2px, var(--card-back) 2px 10px);
    border:2px solid rgba(0,0,0,0.25);
  }
  .card-back::after{
    content:"";
    width:60%;
    height:60%;
    max-width:34px;
    max-height:34px;
    border:2px solid rgba(245,239,224,0.55);
    border-radius:50%;
    display:block;
  }
  .card-front{
    background:linear-gradient(160deg, var(--card-face), var(--card-face-shade));
    color:var(--ink);
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(16px, min(3.4vw, 4.6dvh), 34px);
    transform:rotateY(180deg);
    border:2px solid rgba(28,42,68,0.15);
  }

  .card.placed{
    width:clamp(52px, min(9vw, 13dvh), 96px);
    aspect-ratio:96/132;
  }
  .card.placed .card-front{font-size:clamp(20px, min(4.4vw, 6dvh), 44px);}

  .empty-note{
    color:rgba(255,255,255,0.4);
    font-size:clamp(11px,1.5vw,13.5px);
    padding:clamp(6px,1.5dvh,20px) 0;
  }

  /* ---------- Ones square button + strip ---------- */
  .btn-square{
    background:var(--slot-green);
    color:#08211a;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn-square:hover{box-shadow:0 8px 18px rgba(79,163,123,0.35);}
  .btn-square .sq-icon{
    width:14px;
    height:14px;
    border-radius:3px;
    background:#08211a;
    display:inline-block;
  }

  .ones-zone{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(6px,1.2dvh,12px);
    flex:1 1 auto;
    min-height:0;
  }
  .ones-zone-head{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .ones-boxes{
    width:100%;
    max-width:800px;
    display:flex;
    gap:clamp(10px,2.5vw,20px);
    flex:0 0 auto;
  }
  .ones-box{
    flex:1;
    height:clamp(60px, 12dvh, 120px);
    border:1.5px dashed rgba(255,255,255,0.18);
    border-radius:12px;
    position:relative;
    padding:clamp(8px,1.4dvh,14px);
    overflow:hidden;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .ones-box:hover{
    border-color:rgba(217,164,65,0.5);
    background:rgba(217,164,65,0.06);
  }
  .ones-box-label{
    position:absolute;
    top:clamp(8px,1.4dvh,14px);
    right:clamp(8px,1.4dvh,14px);
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.25);
    pointer-events:none;
  }
  .ones-box-hint{
    font-size:clamp(10px,1.4vw,12.5px);
    color:rgba(255,255,255,0.32);
    position:absolute;
    top:clamp(8px,1.4dvh,14px);
    left:clamp(8px,1.4dvh,14px);
    max-width:70%;
    pointer-events:none;
  }

  .ones-canvas-wrap{
    width:100%;
    max-width:800px;
    flex:3 1 auto;
    min-height:260px;
    border:1.5px dashed rgba(255,255,255,0.18);
    border-radius:12px;
    position:relative;
    padding:clamp(8px,1.6dvh,16px);
    overflow:hidden;
  }
  .ones-hint{
    font-size:clamp(10px,1.4vw,12.5px);
    color:rgba(255,255,255,0.32);
    position:absolute;
    top:clamp(8px,1.6dvh,16px);
    left:clamp(8px,1.6dvh,16px);
    pointer-events:none;
  }
  .ones-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:12px;
    cursor:crosshair;
    touch-action:none;
  }
  .ones-square{
    width:22px;
    height:22px;
    border-radius:4px;
    background:linear-gradient(160deg, var(--slot-green), #3a8465);
    color:#08211a;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 8px rgba(0,0,0,0.3);
    opacity:0;
    animation:dropIn .38s cubic-bezier(.3,.9,.4,1.2) forwards;
    position:absolute;
    cursor:grab;
    touch-action:none;
    user-select:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .ones-square.dragging{
    cursor:grabbing;
    box-shadow:0 10px 18px rgba(0,0,0,0.45);
    z-index:5;
  }
  .ones-square.leaving{
    opacity:0.4;
    transform:scale(0.82);
    box-shadow:0 3px 8px rgba(0,0,0,0.3);
  }
  @keyframes dropIn{
    from{opacity:0; transform:scale(0.5) translateY(-16px);}
    to{opacity:1; transform:scale(1) translateY(0);}
  }

  /* ---------- Deal / shuffle animation ---------- */
  .card.dealing{
    animation: dealIn .55s cubic-bezier(.25,.85,.3,1.15) both;
    animation-delay:var(--deal-delay, 0ms);
  }
  @keyframes dealIn{
    0%{
      opacity:0;
      transform: translate(calc(-50vw - 40px), -14px) scale(0.82) rotate(calc(var(--r,0deg) * -1));
    }
    55%{
      opacity:1;
      transform: translate(6%, -6px) scale(1.04) rotate(calc(var(--r,0deg) * 0.6));
    }
    80%{
      transform: translate(-2%, 2px) scale(0.99) rotate(calc(var(--r,0deg) * -0.3));
    }
    100%{
      opacity:1;
      transform: translate(0,0) scale(1) rotate(0deg);
    }
  }

  footer{
    margin-top:44px;
    font-size:12px;
    color:rgba(255,255,255,0.28);
    text-align:center;
    max-width:480px;
    line-height:1.6;
  }

  @media (max-width:420px){
    .btn{padding:clamp(6px,1.2dvh,8px) clamp(10px,3vw,16px);}
    .controls{gap:8px;}
  }
</style>
</head>
<body>

<div class="table">
  <div class="slots">
    <div class="slot-wrap">
      <div class="slot-label"> <img src="images/boy.gif" alt="boy" class="label-icon"></div>
      <div class="slot" id="leftSlot" data-side="left">
        <span class="slot-hint">Drop a card here</span>
      </div>
    </div>
    <div class="divider">
      <span class="glyph">&amp;</span>
      <small></small>
    </div>
    <div class="slot-wrap">
      <div class="slot-label"><img src="images/girl.gif" alt="girl" class="label-icon"></div>
      <div class="slot" id="rightSlot" data-side="right">
        <span class="slot-hint">Drop a card here</span>
      </div>
    </div>
  </div>

  <div class="ones-zone">
    <div class="ones-zone-head">
      <div class="slot-label">Ones</div>
    </div>
    <div class="ones-boxes">
      <div class="ones-box" id="onesBoxLeft" data-side="left">
        <span class="ones-box-label">Left</span>
        <span class="ones-box-hint">Tap to add a one</span>
      </div>
      <div class="ones-box" id="onesBoxRight" data-side="right">
        <span class="ones-box-label">Right</span>
        <span class="ones-box-hint">Tap to add a one</span>
      </div>
    </div>
    <div class="ones-canvas-wrap" id="onesCanvasWrap">
      <canvas class="ones-canvas" id="onesCanvas"></canvas>
      <span class="ones-hint" id="onesHint">Draw here</span>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="controls">
  <div class="field">
    <label for="fromSelect">From</label>
    <select id="fromSelect"></select>
  </div>
  <div class="field">
    <label for="toSelect">To</label>
    <select id="toSelect"></select>
  </div>
  <button class="btn btn-primary" id="dealBtn">តម្រៀបបណ្ណលេខ</button>
  <button class="btn btn-ghost" id="clearBtn">សម្អាតបណ្ណ</button>
  <button class="btn btn-ghost" id="onesClearBtn">សម្អាតទាងអស់</button>
  <button class="btn btn-ghost" id="eraserBtn">លុប</button>
</div>
<div class="error-msg" id="errorMsg"></div>



<script>
(function(){
  const fromSelect = document.getElementById('fromSelect');
  const toSelect = document.getElementById('toSelect');
  const dealBtn = document.getElementById('dealBtn');
  const clearBtn = document.getElementById('clearBtn');
  const errorMsg = document.getElementById('errorMsg');
  const grid = document.getElementById('grid');
  const leftSlot = document.getElementById('leftSlot');
  const rightSlot = document.getElementById('rightSlot');

  const slots = { left: leftSlot, right: rightSlot };
  let selectedCardId = null; // for tap-to-place on touch
  let cardIdCounter = 0;

  // populate range dropdowns 0-9
  for(let i=0;i<=9;i++){
    const o1 = document.createElement('option'); o1.value=i; o1.textContent=i;
    const o2 = document.createElement('option'); o2.value=i; o2.textContent=i;
    fromSelect.appendChild(o1);
    toSelect.appendChild(o2);
  }
  fromSelect.value = 1;
  toSelect.value = 5;

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function buildCardEl(number){
    cardIdCounter += 1;
    const id = 'card-' + cardIdCounter;
    const card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.tabIndex = 0;
    card.id = id;
    card.dataset.number = number;

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    front.textContent = number;

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);

    attachCardEvents(card);
    return card;
  }

  function attachCardEvents(card){
    card.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', card.id);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(()=>card.classList.add('dragging'),0);
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
    });
    card.addEventListener('click', ()=>{
      // if the card is already placed in a slot, tapping sends it home
      if(card.parentElement && card.parentElement.classList.contains('slot')){
        returnCardToGrid(card);
        return;
      }
      // tap-to-select flow (touch friendly)
      if(selectedCardId === card.id){
        card.classList.remove('selected');
        selectedCardId = null;
      } else {
        document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        selectedCardId = card.id;
      }
    });
    card.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        card.click();
      }
    });
  }

  function returnCardToGrid(card){
    card.classList.remove('face-up','placed','selected');
    grid.appendChild(card);
    const slotEl = card.closest ? null : null;
    updateSlotState();
  }

  function updateSlotState(){
    Object.values(slots).forEach(slot=>{
      const hasCard = slot.querySelector('.card');
      slot.classList.toggle('filled', !!hasCard);
      const hint = slot.querySelector('.slot-hint');
      if(hint) hint.style.display = hasCard ? 'none' : 'block';
    });
    grid.querySelectorAll('.empty-note').forEach(n=>n.remove());
    if(!grid.querySelector('.card')){
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = 'All cards are on the table.';
      grid.appendChild(note);
    }
  }

  function placeCardInSlot(card, slot){
    // if slot already has a card, return it to the grid first
    const existing = slot.querySelector('.card');
    if(existing) returnCardToGrid(existing);

    card.classList.remove('selected');
    card.classList.add('placed');
    slot.querySelector('.slot-hint')?.style.setProperty('display','none');
    slot.appendChild(card);
    // ensure hint text node still exists for later reuse
    if(!slot.querySelector('.slot-hint')){
      const hint = document.createElement('span');
      hint.className = 'slot-hint';
      hint.style.display = 'none';
      hint.textContent = 'Drop a card here';
      slot.insertBefore(hint, slot.firstChild);
    }
    requestAnimationFrame(()=>card.classList.add('face-up'));
    selectedCardId = null;
    updateSlotState();
  }

  // Drag and drop wiring for both slots
  Object.values(slots).forEach(slot=>{
    slot.addEventListener('dragover', (e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      slot.classList.add('drag-over');
    });
    slot.addEventListener('dragleave', ()=>{
      slot.classList.remove('drag-over');
    });
    slot.addEventListener('drop', (e)=>{
      e.preventDefault();
      slot.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const card = document.getElementById(id);
      if(card) placeCardInSlot(card, slot);
    });
    // tap-to-place: clicking an empty slot while a card is selected
    slot.addEventListener('click', (e)=>{
      if(e.target.closest('.card')) return; // let card's own handler manage this
      if(selectedCardId){
        const card = document.getElementById(selectedCardId);
        if(card) placeCardInSlot(card, slot);
      }
    });
  });

  function dealCards(){
    const from = parseInt(fromSelect.value, 10);
    const to = parseInt(toSelect.value, 10);

    if(from > to){
      errorMsg.textContent = '"From" must be less than or equal to "To".';
      return;
    }
    errorMsg.textContent = '';

    // clear table
    grid.innerHTML = '';
    Object.values(slots).forEach(slot=>{
      slot.innerHTML = '<span class="slot-hint">Drop a card here</span>';
    });
    selectedCardId = null;

    const numbers = [];
    for(let n = from; n <= to; n++) numbers.push(n);
    shuffle(numbers);

    numbers.forEach((n, i)=>{
      const card = buildCardEl(n);
      card.classList.add('dealing');
      card.style.setProperty('--r', (Math.random() * 24 - 12).toFixed(1) + 'deg');
      card.style.setProperty('--deal-delay', (i * 90) + 'ms');
      card.addEventListener('animationend', ()=>card.classList.remove('dealing'), { once:true });
      grid.appendChild(card);
    });
    updateSlotState();
  }

  function clearSlotsOnly(){
    Object.values(slots).forEach(slot=>{
      const card = slot.querySelector('.card');
      if(card) returnCardToGrid(card);
    });
    // re-shuffle position of returned cards for a tidier feel
    const cards = Array.from(grid.querySelectorAll('.card'));
    shuffle(cards).forEach(c=>grid.appendChild(c));
    updateSlotState();
  }

  const onesClearBtn = document.getElementById('onesClearBtn');
  const onesBoxLeft = document.getElementById('onesBoxLeft');
  const onesBoxRight = document.getElementById('onesBoxRight');
  const onesCanvasWrap = document.getElementById('onesCanvasWrap');
  const onesHint = document.getElementById('onesHint');
  const onesCanvas = document.getElementById('onesCanvas');
  const ctx = onesCanvas.getContext('2d');
  const eraserBtn = document.getElementById('eraserBtn');
  let erasing = false;
  const SQUARE_SIZE = 22;
  const SQUARE_GAP = 6;
  const onesBoxes = {
    left: { el: onesBoxLeft, count: 0 },
    right: { el: onesBoxRight, count: 0 }
  };

  function resizeCanvas(){
    const rect = onesCanvasWrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    onesCanvas.width = Math.max(1, Math.round(rect.width * dpr));
    onesCanvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#d9a441';
    ctx.lineWidth = 3;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  let drawing = false;
  let lastX = 0, lastY = 0;

  function canvasPoint(e){
    const rect = onesCanvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  onesCanvas.addEventListener('pointerdown', (e)=>{
    drawing = true;
    if(onesHint) onesHint.style.display = 'none';
    const p = canvasPoint(e);
    lastX = p.x; lastY = p.y;
    onesCanvas.setPointerCapture(e.pointerId);
    ctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
    ctx.lineWidth = erasing ? 18 : 3;
    // draw a dot for a single tap/click
    ctx.beginPath();
    ctx.arc(p.x, p.y, ctx.lineWidth/2, 0, Math.PI*2);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
  });
  onesCanvas.addEventListener('pointermove', (e)=>{
    if(!drawing) return;
    const p = canvasPoint(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  });
  function stopDrawing(e){
    if(!drawing) return;
    drawing = false;
    try{ onesCanvas.releasePointerCapture(e.pointerId); }catch(err){}
  }
  onesCanvas.addEventListener('pointerup', stopDrawing);
  onesCanvas.addEventListener('pointercancel', stopDrawing);
  onesCanvas.addEventListener('pointerleave', stopDrawing);

  function clearCanvas(){
    ctx.clearRect(0, 0, onesCanvas.width, onesCanvas.height);
  }

  function nextCascadePosition(box){
    const boxW = box.el.clientWidth || 300;
    const cellSize = SQUARE_SIZE + SQUARE_GAP;
    const cols = Math.max(1, Math.floor((boxW - 24) / cellSize));
    const col = box.count % cols;
    const row = Math.floor(box.count / cols);
    return {
      left: 12 + col * cellSize,
      top: 12 + row * cellSize
    };
  }

  function isPointInRect(x, y, rect){
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  function makeDraggable(el, box){
    el.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const boxEl = box.el;
      const elRect = el.getBoundingClientRect();
      const startFixedLeft = elRect.left;
      const startFixedTop = elRect.top;
      const startX = e.clientX;
      const startY = e.clientY;

      // switch to fixed positioning + move to <body> so it can travel outside
      // the box's overflow:hidden bounds while dragging
      el.style.position = 'fixed';
      el.style.left = startFixedLeft + 'px';
      el.style.top = startFixedTop + 'px';
      document.body.appendChild(el);
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);

      function onMove(ev){
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;
        el.style.left = (startFixedLeft + dx) + 'px';
        el.style.top = (startFixedTop + dy) + 'px';

        const boxRect = boxEl.getBoundingClientRect();
        const inside = isPointInRect(ev.clientX, ev.clientY, boxRect);
        el.classList.toggle('leaving', !inside);
      }

      function onUp(ev){
        el.classList.remove('dragging');
        el.releasePointerCapture(ev.pointerId);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);

        const boxRect = boxEl.getBoundingClientRect();
        const inside = isPointInRect(ev.clientX, ev.clientY, boxRect);

        if(!inside){
          // dropped outside its box: delete the square
          el.remove();
          box.count = Math.max(0, box.count - 1);
          if(box.count === 0){
            const hint = boxEl.querySelector('.ones-box-hint');
            if(hint) hint.style.display = 'block';
          }
          return;
        }

        // dropped back inside: snap back to absolute positioning within the box
        el.classList.remove('leaving');
        const elFinalRect = el.getBoundingClientRect();
        let newLeft = elFinalRect.left - boxRect.left;
        let newTop = elFinalRect.top - boxRect.top;
        const maxLeft = boxRect.width - SQUARE_SIZE - 4;
        const maxTop = boxRect.height - SQUARE_SIZE - 4;
        newLeft = Math.max(4, Math.min(maxLeft, newLeft));
        newTop = Math.max(4, Math.min(maxTop, newTop));
        el.style.position = 'absolute';
        el.style.left = newLeft + 'px';
        el.style.top = newTop + 'px';
        boxEl.appendChild(el);
      }
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
    });
  }

  function addOnesSquare(box){
    const hint = box.el.querySelector('.ones-box-hint');
    if(hint) hint.style.display = 'none';
    const sq = document.createElement('div');
    sq.className = 'ones-square';
    sq.textContent = '1';
    const pos = nextCascadePosition(box);
    sq.style.left = pos.left + 'px';
    sq.style.top = pos.top + 'px';
    box.el.appendChild(sq);
    makeDraggable(sq, box);
    box.count += 1;
  }

  onesBoxLeft.addEventListener('click', (e)=>{
    if(e.target.closest('.ones-square')) return;
    addOnesSquare(onesBoxes.left);
  });
  onesBoxRight.addEventListener('click', (e)=>{
    if(e.target.closest('.ones-square')) return;
    addOnesSquare(onesBoxes.right);
  });

  function clearOnesSquares(){
    Object.values(onesBoxes).forEach(box=>{
      box.el.querySelectorAll('.ones-square').forEach(sq => sq.remove());
      const hint = box.el.querySelector('.ones-box-hint');
      if(hint) hint.style.display = 'block';
      box.count = 0;
    });
    clearCanvas();
    if(onesHint) onesHint.style.display = 'block';
  }

  onesClearBtn.addEventListener('click', clearOnesSquares);

  eraserBtn.addEventListener('click', ()=>{
    erasing = !erasing;
    eraserBtn.classList.toggle('active', erasing);
    onesCanvas.style.cursor = erasing ? 'cell' : 'crosshair';
  });

  dealBtn.addEventListener('click', dealCards);
  clearBtn.addEventListener('click', clearSlotsOnly);

  dealCards();
})();
</script>

</body>
</html>
