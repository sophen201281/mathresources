<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symmetry Wing — drag a spot, meet its mirror</title>
<style>
  :root{
    --ink: #f2ecdf;
    --dusk-1: #241733;
    --dusk-2: #150d21;
    --wing: #a68bc2;
    --wing-dark: #7a5f9c;
    --body: #2e2138;
    --gold: #e0a856;
    --gold-soft: #f0c98a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background:
      radial-gradient(ellipse at 50% 20%, #3a2650 0%, var(--dusk-1) 45%, var(--dusk-2) 100%);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    color: var(--ink);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .heading {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    letter-spacing: 0.04em;
  }

  .eyebrow {
    display: block;
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-soft);
    opacity: 0.75;
    margin-bottom: 0.4rem;
  }

  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(1.3rem, 3.4vw, 2rem);
    font-style: italic;
    color: var(--ink);
  }

  .sub {
    margin-top: 0.5rem;
    font-size: 0.82rem;
    color: #cbb9de;
    font-style: normal;
  }

  .field {
    position: relative;
    width: min(88vw, 620px);
    height: min(58vh, 440px);
  }

  svg { position: absolute; inset: 0; overflow: visible; }

  .axis {
    stroke: var(--gold-soft);
    stroke-width: 1;
    stroke-dasharray: 2 8;
    opacity: 0.28;
  }

  .wing {
    fill: var(--wing);
    stroke: var(--wing-dark);
    stroke-width: 1.5;
    transition: filter 0.25s ease;
  }

  .wing-inner {
    fill: var(--dusk-1);
    opacity: 0.35;
  }

  .field.holding .wing {
    filter: brightness(1.12);
  }

  .body-shape {
    fill: var(--body);
  }

  .antenna {
    stroke: var(--body);
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
  }

  .spot {
    position: absolute;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, var(--gold-soft), var(--gold) 65%, #b3782f 100%);
    box-shadow: 0 3px 10px rgba(0,0,0,0.45), 0 0 0 2px rgba(240,201,138,0.25);
    cursor: grab;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: none;
  }

  .spot.pop-in {
    animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mirror-spot.pop-in {
    animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.06s backwards;
  }

  @keyframes popIn {
    0%   { transform: scale(0) translateY(8px); opacity: 0; }
    65%  { transform: scale(1.18) translateY(-3px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .release-btn {
    margin-top: 1.1rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 1.3rem;
    border-radius: 999px;
    border: 1px solid rgba(240, 201, 138, 0.45);
    background: linear-gradient(180deg, rgba(224,168,86,0.18), rgba(224,168,86,0.05));
    color: var(--gold-soft);
    font-family: inherit;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    backdrop-filter: blur(2px);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .release-btn:hover {
    background: linear-gradient(180deg, rgba(224,168,86,0.28), rgba(224,168,86,0.08));
    border-color: rgba(240, 201, 138, 0.7);
  }

  .release-btn:active {
    transform: scale(0.96);
  }

  .release-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, var(--gold-soft), var(--gold) 70%);
    flex-shrink: 0;
  }

  .draw-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    touch-action: none;
    border-radius: 12px;
  }

  .draw-canvas.tool-active {
    pointer-events: auto;
    cursor: crosshair;
  }

  .tool-row {
    margin-top: 0.7rem;
    display: flex;
    gap: 0.5rem;
  }

  .tool-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: 1px solid rgba(203, 185, 222, 0.3);
    background: rgba(255, 255, 255, 0.03);
    color: #cbb9de;
    font-family: inherit;
    font-size: 0.76rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }

  .tool-btn:hover {
    border-color: rgba(203, 185, 222, 0.55);
    color: var(--ink);
  }

  .tool-btn:active {
    transform: scale(0.96);
  }

  .tool-btn.active {
    background: linear-gradient(180deg, rgba(224,168,86,0.28), rgba(224,168,86,0.1));
    border-color: rgba(240, 201, 138, 0.7);
    color: var(--gold-soft);
  }

  .spot.dragging {
    cursor: grabbing;
    box-shadow: 0 6px 18px rgba(0,0,0,0.55), 0 0 0 3px rgba(240,201,138,0.4);
  }

  .spot.dragging .spot-core::after {
    content: none;
  }

  .mirror-spot {
    position: absolute;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, var(--gold-soft), var(--gold) 65%, #b3782f 100%);
    box-shadow: 0 3px 10px rgba(0,0,0,0.45), 0 0 0 2px rgba(240,201,138,0.25);
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 4;
  }

  .mirror-spot.visible {
    opacity: 1;
    transform: scale(1);
  }

  .hint {
    margin-top: 0.7rem;
    font-size: 0.78rem;
    color: #cbb9de;
    opacity: 0.7;
    text-align: center;
    max-width: 320px;
  }

  .hint b { color: var(--gold-soft); font-weight: 600; }
</style>
</head>
<body>

<div class="stage">
  <div class="heading">
    <span class="eyebrow">Bilateral Symmetry</span>
    
  
  </div>

  <div class="field" id="field">
    <canvas class="draw-canvas" id="drawCanvas"></canvas>
    <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
      <line class="axis" x1="200" y1="20" x2="200" y2="380"></line>

      <!-- left wing pair -->
      <path class="wing" d="M197,140
               C150,70 60,55 30,110
               C5,155 20,210 70,235
               C110,255 165,235 197,190 Z" />
      <path class="wing wing-inner" d="M190,150
               C155,105 90,95 65,130
               C45,160 55,195 95,208
               C125,218 160,200 190,175 Z" />

      <path class="wing" d="M197,205
               C165,190 110,190 78,225
               C55,250 60,290 100,300
               C135,308 175,275 197,235 Z" />
      <path class="wing wing-inner" d="M190,215
               C165,205 125,206 100,230
               C82,248 86,272 112,278
               C135,282 165,258 190,235 Z" />

      <!-- right wing pair (mirrored) -->
      <path class="wing" d="M203,140
               C250,70 340,55 370,110
               C395,155 380,210 330,235
               C290,255 235,235 203,190 Z" />
      <path class="wing wing-inner" d="M210,150
               C245,105 310,95 335,130
               C355,160 345,195 305,208
               C275,218 240,200 210,175 Z" />

      <path class="wing" d="M203,205
               C235,190 290,190 322,225
               C345,250 340,290 300,300
               C265,308 225,275 203,235 Z" />
      <path class="wing wing-inner" d="M210,215
               C235,205 275,206 300,230
               C318,248 314,272 288,278
               C265,282 235,258 210,235 Z" />

      <!-- body -->
      <path class="antenna" d="M198,70 C190,55 178,48 168,44"></path>
      <path class="antenna" d="M202,70 C210,55 222,48 232,44"></path>
      <ellipse class="body-shape" cx="200" cy="70" rx="6" ry="6"></ellipse>
      <path class="body-shape" d="M192,75 C185,140 185,240 192,320
               C195,335 205,335 208,320
               C215,240 215,140 208,75
               C205,68 195,68 192,75 Z" />
    </svg>

  </div>

  <button class="release-btn" id="releaseBtn" type="button">
    <span class="release-dot"></span>
    Release a counter
  </button>

  <div class="tool-row">
    <button class="tool-btn" id="penBtn" type="button">✏️ Draw</button>
    <button class="tool-btn" id="eraserBtn" type="button">🧹 Erase</button>
    <button class="tool-btn" id="clearBtn" type="button">Clear</button>
  </div>

  <p class="hint">Each press <b>adds a new counter</b> to a wing, mirrored on the other side. Switch on <b>Draw</b> to sketch on the wings — drag counters again once you turn drawing off.</p>
</div>

<script>
(function () {
  const field = document.getElementById('field');
  const releaseBtn = document.getElementById('releaseBtn');

  let draggingSpot = null;
  let draggingMirror = null;
  let fieldRect = null;

  // rough safe zones for the two wing pairs, in field percentages
  const wingZones = {
    left:  { xMin: 12, xMax: 42, yMin: 18, yMax: 72 },
    right: { xMin: 58, xMax: 88, yMin: 18, yMax: 72 }
  };
  let lastSide = 'right'; // so the very first press lands on the left wing
  let counterCount = 0;

  function clamp(val, min, max) {
    return Math.max(min, Math.min(max, val));
  }

  function positionPair(spotEl, mirrorEl, xPct, yPct) {
    xPct = clamp(xPct, 2, 98);
    yPct = clamp(yPct, 6, 94);

    spotEl.style.left = xPct + '%';
    spotEl.style.top = yPct + '%';

    // axis sits at 50% horizontally — reflect around it
    const mirroredX = 100 - xPct;
    mirrorEl.style.left = mirroredX + '%';
    mirrorEl.style.top = yPct + '%';
  }

  function pointToPct(clientX, clientY) {
    fieldRect = field.getBoundingClientRect();
    return [
      ((clientX - fieldRect.left) / fieldRect.width) * 100,
      ((clientY - fieldRect.top) / fieldRect.height) * 100
    ];
  }

  function createCounter(xPct, yPct) {
    const idx = counterCount++;

    const mirrorEl = document.createElement('div');
    mirrorEl.className = 'mirror-spot visible pop-in';
    mirrorEl.dataset.index = idx;

    const spotEl = document.createElement('div');
    spotEl.className = 'spot pop-in';
    spotEl.dataset.index = idx;

    field.appendChild(mirrorEl);
    field.appendChild(spotEl);

    positionPair(spotEl, mirrorEl, xPct, yPct);

    // clean up the entrance-animation class once it's done, so future
    // class toggles (like dragging) don't accidentally replay it
    spotEl.addEventListener('animationend', function () {
      spotEl.classList.remove('pop-in');
    }, { once: true });
    mirrorEl.addEventListener('animationend', function () {
      mirrorEl.classList.remove('pop-in');
    }, { once: true });

    return spotEl;
  }

  function releaseCounter() {
    const side = lastSide === 'left' ? 'right' : 'left';
    lastSide = side;
    const zone = wingZones[side];

    const xPct = zone.xMin + Math.random() * (zone.xMax - zone.xMin);
    const yPct = zone.yMin + Math.random() * (zone.yMax - zone.yMin);

    createCounter(xPct, yPct);

    field.classList.add('holding');
    window.setTimeout(function () {
      field.classList.remove('holding');
    }, 550);
  }

  releaseBtn.addEventListener('click', releaseCounter);

  // --- dragging any existing counter, via event delegation ---

  function startDrag(e) {
    const target = e.target.closest('.spot');
    if (!target) return;

    draggingSpot = target;
    draggingMirror = field.querySelector('.mirror-spot[data-index="' + target.dataset.index + '"]');

    draggingSpot.classList.remove('pop-in');
    if (draggingMirror) draggingMirror.classList.remove('pop-in');

    draggingSpot.classList.add('dragging');
    field.classList.add('holding');
    e.preventDefault();
  }

  function moveDrag(e) {
    if (!draggingSpot) return;
    const point = e.touches ? e.touches[0] : e;
    const [xPct, yPct] = pointToPct(point.clientX, point.clientY);
    positionPair(draggingSpot, draggingMirror, xPct, yPct);
  }

  function endDrag() {
    if (!draggingSpot) return;
    draggingSpot.classList.remove('dragging');
    field.classList.remove('holding');
    draggingSpot = null;
    draggingMirror = null;
  }

  field.addEventListener('mousedown', startDrag);
  field.addEventListener('touchstart', startDrag, { passive: false });

  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('touchmove', moveDrag, { passive: false });

  window.addEventListener('mouseup', endDrag);
  window.addEventListener('touchend', endDrag);

  // --- drawing canvas: pen, eraser, clear ---

  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const penBtn = document.getElementById('penBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');

  let tool = 'off'; // 'off' | 'pen' | 'eraser'
  let isDrawing = false;
  let lastPoint = null;

  function resizeCanvas() {
    const rect = field.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    // preserve whatever's been drawn so far across a resize
    let snapshot = null;
    if (canvas.width && canvas.height) {
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (snapshot) {
      ctx.putImageData(snapshot, 0, 0);
    }
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function setTool(nextTool) {
    tool = (tool === nextTool) ? 'off' : nextTool;

    penBtn.classList.toggle('active', tool === 'pen');
    eraserBtn.classList.toggle('active', tool === 'eraser');
    canvas.classList.toggle('tool-active', tool !== 'off');
  }

  penBtn.addEventListener('click', function () { setTool('pen'); });
  eraserBtn.addEventListener('click', function () { setTool('eraser'); });

  clearBtn.addEventListener('click', function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  function canvasPoint(e) {
    const point = e.touches ? e.touches[0] : e;
    const rect = canvas.getBoundingClientRect();
    return [point.clientX - rect.left, point.clientY - rect.top];
  }

  function strokeTo(x, y) {
    ctx.beginPath();
    if (tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = 26;
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(240, 201, 138, 0.85)';
      ctx.lineWidth = 3.5;
    }
    ctx.moveTo(lastPoint[0], lastPoint[1]);
    ctx.lineTo(x, y);
    ctx.stroke();
    lastPoint = [x, y];
  }

  function startPaint(e) {
    if (tool === 'off') return;
    isDrawing = true;
    lastPoint = canvasPoint(e);
    e.preventDefault();
  }

  function paint(e) {
    if (!isDrawing) return;
    const [x, y] = canvasPoint(e);
    strokeTo(x, y);
    e.preventDefault();
  }

  function stopPaint() {
    isDrawing = false;
    lastPoint = null;
  }

  canvas.addEventListener('mousedown', startPaint);
  canvas.addEventListener('touchstart', startPaint, { passive: false });

  canvas.addEventListener('mousemove', paint);
  canvas.addEventListener('touchmove', paint, { passive: false });

  window.addEventListener('mouseup', stopPaint);
  window.addEventListener('touchend', stopPaint);
})();
</script>

</body>
</html>
