<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weekly Flashcards · 37 Weeks</title>
  <!-- Google Font: Battambang (Khmer) -->
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --card-font-size: 28px;
      --panel-bg: #1f2e3a;
      --panel-text: #f0ede5;
      --accent: #4a6cf7;
      --radius: 14px;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      font-family: 'Battambang', 'Segoe UI', Roboto, system-ui, sans-serif;
      background:#eef3ff;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:20px 12px 40px;
      min-height:100vh;
    }
    h2{
      margin-bottom:6px;
      font-weight:400;
      color:#1f2e3a;
      letter-spacing:1px;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .week-selector{
      display:flex;
      gap:8px;
      align-items:center;
      margin-bottom:14px;
      width:min(340px,90vw);
      justify-content:center;
      background:white;
      padding:6px 14px;
      border-radius:40px;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .week-selector label{
      font-size:14px;
      color:#445566;
      font-weight:500;
      white-space:nowrap;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .week-selector select{
      padding:8px 14px;
      border:1px solid #ccd7e6;
      border-radius:30px;
      background:white;
      font-size:15px;
      font-weight:500;
      color:#1f2e3a;
      cursor:pointer;
      outline:none;
      transition:border .2s;
      flex:1;
      max-width:220px;
      appearance:auto;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .week-selector select:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(74,108,247,0.12);
    }
    .stack{
      position:relative;
      width:min(340px,90vw);
      height:240px;
      perspective:1400px;
      margin-bottom:10px;
    }
    .card{
      position:absolute;
      width:100%;
      height:100%;
      transition:opacity .3s;
      cursor:pointer;
      user-select:none;
    }
    .card.hidden{ opacity:0; pointer-events:none; }
    .face{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:var(--radius);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:var(--card-font-size);
      box-shadow:0 10px 25px rgba(0,0,0,.12);
      background:white;
      padding:20px;
    }
    .text{
      position:relative;
      z-index:2;
      text-align:center;
      padding:4px;
      word-break:break-word;
      max-width:90%;
      line-height:1.3;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .card::before, .card::after{
      position:absolute;
      top:0;
      width:20%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      color:rgba(0,0,0,.10);
      pointer-events:none;
      z-index:3;
      font-weight:300;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .card::before{ content:"◀"; left:0; }
    .card::after{ content:"▶"; right:0; }

    .bottom-controls{
      width:min(340px,90vw);
      margin-top:4px;
    }
    .controls{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:12px;
    }
    .controls input{
      width:100%;
      padding:12px 14px;
      border:1px solid #ccd7e6;
      border-radius:10px;
      font-size:16px;
      background:white;
      transition:border .2s;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .controls input:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(74,108,247,0.15);
    }
    .add-btn{
      width:100%;
      padding:12px;
      border:none;
      background:var(--accent);
      color:white;
      border-radius:10px;
      font-weight:600;
      font-size:16px;
      cursor:pointer;
      transition:background .2s;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .add-btn:hover{ background:#3a57d6; }
    .add-btn:active{ transform:scale(0.98); }

    .font-control{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
      background:white;
      padding:8px 14px;
      border-radius:40px;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
      justify-content:center;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .font-control label{
      font-size:14px;
      color:#445566;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .font-control input[type="range"]{
      flex:1;
      accent-color:var(--accent);
    }
    .nav{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .nav button{
      padding:10px 16px;
      border:none;
      background:white;
      color:#1f2e3a;
      border-radius:40px;
      cursor:pointer;
      font-weight:500;
      font-size:14px;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
      transition:all .2s;
      border:1px solid transparent;
      flex:1 0 auto;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .nav button:hover{
      background:#f0f4ff;
      border-color:#ccd7e6;
      transform:translateY(-1px);
    }
    .nav button:active{ transform:scale(0.96); }
    .homeBtn{
      background:#eef3ff;
    }
    .empty{
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      color:#8899aa;
      font-size:18px;
      font-style:italic;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }

    /* ---- ADMIN PANEL (bottom sheet) ---- */
    .admin-toggle{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(30,45,55,0.92);
      backdrop-filter:blur(8px);
      color:white;
      padding:10px 24px;
      border-radius:50px;
      font-size:15px;
      font-weight:500;
      border:1px solid #8899aa;
      box-shadow:0 4px 20px rgba(0,0,0,0.2);
      z-index:400;
      cursor:pointer;
      transition:all .3s;
      white-space:nowrap;
      letter-spacing:0.3px;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .admin-toggle:hover{
      background:rgba(50,70,85,0.95);
      transform:translateX(-50%) scale(1.04);
    }
    .admin-overlay{
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.4);
      z-index:450;
      display:none;
      opacity:0;
      transition:opacity .3s;
    }
    .admin-overlay.active{ display:block; opacity:1; }
    .admin-panel{
      position:fixed;
      bottom:-100%;
      left:0;
      width:100%;
      max-height:80vh;
      background:linear-gradient(145deg, #1f2e3a, #2a3f4d);
      color:var(--panel-text);
      z-index:500;
      transition:bottom .4s cubic-bezier(0.4,0,0.2,1);
      overflow-y:auto;
      padding:18px 20px 24px;
      border-radius:24px 24px 0 0;
      box-shadow:0 -4px 30px rgba(0,0,0,0.3);
      border-top:2px solid #6a7f8f;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .admin-panel.open{ bottom:0; }
    .admin-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
      border-bottom:2px solid #6a7f8f;
      padding-bottom:10px;
      flex-wrap:wrap;
      gap:8px;
    }
    .admin-header h3{
      font-size:20px;
      font-weight:500;
      letter-spacing:0.5px;
      color:#f5e9da;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .close-panel{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      color:white;
      width:32px;
      height:32px;
      border-radius:50%;
      font-size:18px;
      cursor:pointer;
      transition:all .25s;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .close-panel:hover{
      background:rgba(255,255,255,0.18);
      transform:rotate(90deg);
    }
    .admin-section{
      background:rgba(255,255,255,0.04);
      border-radius:14px;
      padding:12px 14px;
      margin-bottom:14px;
      border:1px solid rgba(255,255,255,0.06);
    }
    .admin-section h4{
      font-size:15px;
      font-weight:400;
      color:#c8d6e0;
      margin-bottom:8px;
      letter-spacing:0.3px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:6px;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .admin-week-selector{
      display:flex;
      align-items:center;
      gap:6px;
    }
    .admin-week-selector label{
      font-size:13px;
      color:rgba(255,255,255,0.6);
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .admin-week-selector select{
      padding:4px 10px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.05);
      color:white;
      font-size:13px;
      cursor:pointer;
      outline:none;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .admin-week-selector select:focus{
      border-color:#8ba0b0;
    }
    .admin-week-selector select option{
      background:#1f2e3a;
      color:white;
    }
    .word-entry{
      display:flex;
      gap:10px;
      align-items:center;
      margin-bottom:6px;
    }
    .word-entry input{
      flex:1;
      padding:6px 12px;
      border-radius:8px;
      border:1.5px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      color:white;
      font-size:15px;
      outline:none;
      transition:border .2s;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .word-entry input:focus{
      border-color:#8ba0b0;
      background:rgba(255,255,255,0.10);
    }
    .word-entry input::placeholder{
      color:rgba(255,255,255,0.35);
    }
    .word-entry .del-word{
      background:rgba(255,80,80,0.15);
      border:1px solid rgba(255,80,80,0.2);
      color:#ff8a8a;
      width:28px;
      height:28px;
      border-radius:50%;
      cursor:pointer;
      font-size:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all .2s;
      flex-shrink:0;
    }
    .word-entry .del-word:hover{
      background:rgba(255,80,80,0.25);
      border-color:#ff6b6b;
    }
    .add-word-row{
      display:flex;
      gap:8px;
      margin-top:6px;
    }
    .add-word-row input{
      flex:1;
      padding:8px 12px;
      border-radius:8px;
      border:1.5px solid rgba(255,255,255,0.10);
      background:rgba(255,255,255,0.04);
      color:white;
      font-size:15px;
      outline:none;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .add-word-row input:focus{
      border-color:#8ba0b0;
      background:rgba(255,255,255,0.08);
    }
    .add-word-row button{
      padding:8px 16px;
      background:var(--accent);
      border:none;
      border-radius:8px;
      color:white;
      font-weight:600;
      cursor:pointer;
      transition:background .2s;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .add-word-row button:hover{ background:#3a57d6; }
    .save-all-btn{
      width:100%;
      padding:12px;
      background:#2b4a5c;
      border:2px solid #6a7f8f;
      border-radius:12px;
      color:white;
      font-size:18px;
      font-weight:600;
      cursor:pointer;
      transition:all .25s;
      margin-top:4px;
      letter-spacing:0.5px;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .save-all-btn:hover{
      background:#3a5f73;
      transform:translateY(-2px);
      box-shadow:0 6px 20px rgba(43,74,92,0.3);
    }
    .save-all-btn:active{ transform:translateY(0); }
    .word-counter{
      font-size:13px;
      color:rgba(255,255,255,0.5);
      text-align:right;
      margin-top:4px;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .admin-panel::-webkit-scrollbar{ width:4px; }
    .admin-panel::-webkit-scrollbar-track{ background:transparent; }
    .admin-panel::-webkit-scrollbar-thumb{ background:#6a7f8f; border-radius:10px; }

    .week-label{
      font-size:14px;
      color:rgba(255,255,255,0.6);
      margin-right:8px;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
  </style>
</head>
<body>

<h2>
  <span>📚 បណ្ណពាក្យ</span>
  <span style="font-size:16px;font-weight:300;color:#667;font-family:'Battambang','Segoe UI',system-ui,sans-serif;" id="weekDisplay">សប្តាហ៍ទី 1</span>
</h2>

<div class="week-selector">
  <label for="weekDropdown">📅 សប្តាហ៍:</label>
  <select id="weekDropdown"></select>
</div>

<div class="stack" id="stack"></div>

<div class="bottom-controls">
  <div class="controls">
    <input id="frontInput" placeholder="វាយជាអក្សរ/ពាក្យ (e.g. ផ្កា)" autofocus>
    <button class="add-btn" onclick="addCard()">➕ បញ្ចូលពាក្យ</button>
  </div>

  <div class="font-control">
    <label>🔤 ទំហំ</label>
    <input type="range" min="16" max="100" value="28" oninput="changeFontSize(this.value)">
    <span id="fontSizeLabel" style="min-width:32px;font-size:14px;font-family:'Battambang','Segoe UI',system-ui,sans-serif;">28</span>
  </div>

  <div class="nav">
    <button onclick="randomCard()">🎲 ក្រឡុក</button>
    <button onclick="deleteCard()">🗑 លុប</button>
    <button onclick="window.location.href='../index.html'" class="homeBtn">🏡 Home</button>
  </div>
</div>

<!-- Admin Toggle -->
<button class="admin-toggle" id="adminToggle">⚙️ កែសម្រួលបណ្ណ</button>

<!-- Admin Overlay -->
<div class="admin-overlay" id="adminOverlay"></div>

<!-- Admin Panel -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-header">
    <h3>📝 កែសម្រួលបណ្ណតាមសប្តាហ៍</h3>
    <button class="close-panel" id="closePanelBtn">✕</button>
  </div>

  <div class="admin-section">
    <h4>
      <span>📋 បញ្ជីពាក្យ</span>
      <div class="admin-week-selector">
        <label for="adminWeekDropdown">សប្តាហ៍:</label>
        <select id="adminWeekDropdown"></select>
      </div>
    </h4>
    <div id="wordListContainer"></div>
    <div class="add-word-row">
      <input id="adminNewWord" placeholder="បញ្ចូលពាក្យថ្មី..." >
      <button onclick="adminAddWord()">បញ្ចូល</button>
    </div>
    <div class="word-counter" id="wordCounter">សរុប: 0 ពាក្យ</div>
  </div>

  <button class="save-all-btn" id="saveAllBtn">💾 រក្សាទុក &amp; បិទ</button>
</div>

      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 21
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      // Week 22
      ['ផ្កា', 'ឆ្កែ', 'ឆ្មា', 'ឡាន', 'ដើមឈើ', 'ព្រះអាទិត្យ', 'ទឹក'],
      // Week 23
      ['ភ្នំ', 'សមុទ្រ', 'ផ្កាយ', 'ព្រះច័ន្ទ', 'មេឃ', 'ដី', 'ភ្លើង'],
      // Week 24
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      // Week 25
      ['ផ្ទះ', 'សាលា', 'វត្ត', 'ផ្សារ', 'មន្ទីរពេទ្យ', 'ធនាគារ', 'ភោជនីយដ្ឋាន'],
      // Week 26
      ['កូន', 'ឪពុក', 'ម្តាយ', 'បង', 'ប្អូន', 'ជីដូន', 'ជីតា'],
      // Week 27
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 28
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 29
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 30
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 31
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 32
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      ['កូន', 'ឪពុក', 'ម្តាយ', 'បង', 'ប្អូន', 'ជីដូន', 'ជីតា'],
      // Week 33
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 34
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 35
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 36
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
      
      // Week 37
      ['បក្សី', 'ត្រី', 'ដំរី', 'សេះ', 'ក្របី', 'គោ', 'ជ្រូក'],
    ];
    // Fill remaining weeks with patterned words
    for (let w = 6; w <= WEEK_COUNT; w++) {
      const weekWords = [];
      for (let i = 1; i <= WORDS_PER_WEEK; i++) {
        weekWords.push(`ពាក្យ${w}-${i}`);
      }
      sampleWords.push(weekWords);
    }
    return sampleWords;
  }

  let weeksData = generateSampleWords();
  let currentWeek = 0;
  let cards = [];
  let current = 0;

  // ============ LOAD WEEK ============
  function loadWeek(weekIndex) {
    currentWeek = weekIndex;
    const words = weeksData[weekIndex] || [];
    cards = words.map(text => ({ text }));
    current = 0;
    renderCards();
    updateWeekUI();
    syncAdminList();
    document.getElementById('weekDisplay').textContent = `សប្តាហ៍ទី ${weekIndex+1}`;
    // update dropdowns
    document.getElementById('weekDropdown').value = weekIndex;
    document.getElementById('adminWeekDropdown').value = weekIndex;
  }

  // ============ RENDER ============
  function renderCards(){
    const stack = document.getElementById("stack");
    stack.innerHTML = "";
    if(cards.length === 0){
      stack.innerHTML = `<div class="empty">មិនមានបណ្ណពាក្យ</div>`;
      updateWordCounter();
      return;
    }
    const c = cards[current];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="face">
        <div class="text">${c.text}</div>
      </div>
    `;
    let startX = 0;
    card.addEventListener("touchstart",(e)=>{
      startX = e.touches[0].clientX;
    },{passive:true});
    card.addEventListener("touchend",(e)=>{
      const endX = e.changedTouches[0].clientX;
      const diff = endX - startX;
      const rect = card.getBoundingClientRect();
      const x = endX - rect.left;
      const w = rect.width;
      if(Math.abs(diff) > 60){
        if(diff > 0) prev();
        else next();
        return;
      }
      if(x < w*0.2) prev();
      else if(x > w*0.8) next();
    },{passive:true});
    card.addEventListener("click",(e)=>{
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const w = rect.width;
      if(x < w*0.2) prev();
      else if(x > w*0.8) next();
    });
    stack.appendChild(card);
    updateWordCounter();
  }

  // ============ CARD OPERATIONS ============
  function addCard(text){
    const t = (text || document.getElementById("frontInput").value).trim();
    if(!t) return;
    cards.push({ text:t });
    current = cards.length - 1;
    document.getElementById("frontInput").value = "";
    weeksData[currentWeek] = cards.map(c => c.text);
    renderCards();
    syncAdminList();
  }

  function deleteCard(){
    if(!cards.length) return;
    cards.splice(current,1);
    if(current >= cards.length) current = cards.length-1;
    if(current < 0) current = 0;
    weeksData[currentWeek] = cards.map(c => c.text);
    renderCards();
    syncAdminList();
  }

  function randomCard(){
    if(cards.length < 2) return;
    let r;
    do{ r = Math.floor(Math.random()*cards.length); }while(r === current);
    current = r;
    renderCards();
  }

  function next(){
    if(current < cards.length-1){ current++; renderCards(); }
  }
  function prev(){
    if(current > 0){ current--; renderCards(); }
  }

  function changeFontSize(v){
    document.documentElement.style.setProperty("--card-font-size", v+"px");
    document.getElementById("fontSizeLabel").textContent = v;
  }

  // ============ WEEK UI ============
  function updateWeekUI() {
    const dropdown = document.getElementById('weekDropdown');
    dropdown.innerHTML = '';
    for (let i = 0; i < WEEK_COUNT; i++) {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = `សប្តាហ៍ ${i+1}`;
      dropdown.appendChild(option);
    }
    dropdown.value = currentWeek;
    dropdown.addEventListener('change', function() {
      loadWeek(parseInt(this.value));
    });

    // Admin dropdown
    const adminDropdown = document.getElementById('adminWeekDropdown');
    adminDropdown.innerHTML = '';
    for (let i = 0; i < WEEK_COUNT; i++) {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = `សប្តាហ៍ ${i+1}`;
      adminDropdown.appendChild(option);
    }
    adminDropdown.value = currentWeek;
    adminDropdown.addEventListener('change', function() {
      const w = parseInt(this.value);
      loadWeek(w);
      syncAdminList();
    });
  }

  // ============ ADMIN PANEL ============
  const adminToggle = document.getElementById('adminToggle');
  const adminPanel = document.getElementById('adminPanel');
  const adminOverlay = document.getElementById('adminOverlay');
  const closePanelBtn = document.getElementById('closePanelBtn');
  const saveAllBtn = document.getElementById('saveAllBtn');

  function openAdmin() {
    adminPanel.classList.add('open');
    adminOverlay.classList.add('active');
    adminToggle.textContent = '✕ បិទ';
    document.body.style.overflow = 'hidden';
    syncAdminList();
    document.getElementById('adminWeekDropdown').value = currentWeek;
  }
  function closeAdmin() {
    adminPanel.classList.remove('open');
    adminOverlay.classList.remove('active');
    adminToggle.textContent = '⚙️ កែសម្រួលបណ្ណ';
    document.body.style.overflow = '';
  }
  adminToggle.addEventListener('click', () => {
    adminPanel.classList.contains('open') ? closeAdmin() : openAdmin();
  });
  closePanelBtn.addEventListener('click', closeAdmin);
  adminOverlay.addEventListener('click', closeAdmin);

  function syncAdminList() {
    const container = document.getElementById('wordListContainer');
    container.innerHTML = '';
    cards.forEach((card, idx) => {
      const row = document.createElement('div');
      row.className = 'word-entry';
      row.innerHTML = `
        <input type="text" value="${card.text}" data-index="${idx}" class="admin-word-input">
        <button class="del-word" data-index="${idx}" title="លុប">✕</button>
      `;
      container.appendChild(row);
    });
    container.querySelectorAll('.del-word').forEach(btn => {
      btn.addEventListener('click', function(e) {
        const idx = parseInt(this.dataset.index, 10);
        if (idx >= 0 && idx < cards.length) {
          cards.splice(idx, 1);
          if (current >= cards.length) current = cards.length - 1;
          if (current < 0) current = 0;
          weeksData[currentWeek] = cards.map(c => c.text);
          renderCards();
          syncAdminList();
        }
        e.stopPropagation();
      });
    });
    container.querySelectorAll('.admin-word-input').forEach(inp => {
      inp.addEventListener('change', function(e) {
        const idx = parseInt(this.dataset.index, 10);
        const val = this.value.trim();
        if (idx >= 0 && idx < cards.length && val) {
          cards[idx].text = val;
          weeksData[currentWeek] = cards.map(c => c.text);
          renderCards();
        }
      });
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { this.blur(); }
      });
    });
    updateWordCounter();
  }

  function adminAddWord() {
    const input = document.getElementById('adminNewWord');
    const val = input.value.trim();
    if (!val) return;
    cards.push({ text: val });
    current = cards.length - 1;
    weeksData[currentWeek] = cards.map(c => c.text);
    input.value = '';
    renderCards();
    syncAdminList();
  }

  function updateWordCounter() {
    document.getElementById('wordCounter').textContent = `សរុប: ${cards.length} ពាក្យ`;
  }

  saveAllBtn.addEventListener('click', () => {
    document.querySelectorAll('.admin-word-input').forEach(inp => {
      const idx = parseInt(inp.dataset.index, 10);
      const val = inp.value.trim();
      if (idx >= 0 && idx < cards.length && val) {
        cards[idx].text = val;
      }
    });
    weeksData[currentWeek] = cards.map(c => c.text);
    renderCards();
    closeAdmin();
    saveAllBtn.textContent = '✅ បានរក្សាទុក!';
    saveAllBtn.style.background = '#4CAF50';
    setTimeout(() => {
      saveAllBtn.textContent = '💾 រក្សាទុក &amp; បិទ';
      saveAllBtn.style.background = '#2b4a5c';
    }, 1400);
  });

  document.getElementById('frontInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addCard();
  });
  document.getElementById('adminNewWord').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') adminAddWord();
  });

  // ============ INIT ============
  loadWeek(0);
  updateWeekUI();

  window.addCard = addCard;
  window.deleteCard = deleteCard;
  window.randomCard = randomCard;
  window.next = next;
  window.prev = prev;
  window.changeFontSize = changeFontSize;
  window.adminAddWord = adminAddWord;
  window.loadWeek = loadWeek;
</script>
