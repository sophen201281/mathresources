<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard Stack App</title>

<style>

:root{

  --card-font-size: 28px;

}

*{

  box-sizing:border-box;

}

body{

  font-family:Arial,sans-serif;

  background:#eef3ff;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding:20px;

  margin:0;

}

h2{

  margin-bottom:20px;

}

.stack{

  position:relative;

  width:min(340px,90vw);

  height:240px;

  perspective:1400px;

}

/* CARD */

.card{

  position:absolute;

  width:100%;

  height:100%;

  transition:opacity .3s;

  cursor:pointer;

  user-select:none;

}

.card.hidden{

  opacity:0;

  pointer-events:none;

}

/* FACE */

.face{

  position:absolute;

  width:100%;

  height:100%;

  border-radius:14px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:var(--card-font-size);

  box-shadow:0 10px 25px rgba(0,0,0,.15);

  overflow:hidden;

  background:white;

}

/* TEXT */

.text{

  position:relative;

  z-index:2;

  text-align:center;

  padding:10px;

}

/* CANVAS */

.drawCanvas{

  position:absolute;

  top:0;

  left:0;

  width:100%;

  height:100%;

  z-index:1;

  border-radius:14px;

  pointer-events:auto;

}

/* EDGE HINTS */

.card::before,

.card::after{

  position:absolute;

  top:0;

  width:20%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:28px;

  color:rgba(0,0,0,.15);

  pointer-events:none;

  z-index:3;

}

.card::before{ content:"◀"; left:0; }

.card::after{ content:"▶"; right:0; }

/* CONTROLS */

.bottom-controls{

  width:min(340px,90vw);

  margin-top:15px;

}

/* INPUT AREA STACKED */

.controls{

  display:flex;

  flex-direction:column;

  gap:8px;

  margin-bottom:10px;

}

.controls input{

  width:100%;

  padding:10px;

  border:1px solid #ccc;

  border-radius:8px;

}

/* ADD BUTTON UNDER INPUT */

.add-btn{

  width:100%;

  padding:10px 12px;

  border:none;

  background:#4a6cf7;

  color:white;

  border-radius:8px;

  cursor:pointer;

}

.add-btn:hover{

  background:#3a57d6;

}

button{

  padding:10px 12px;

  border:none;

  background:#4a6cf7;

  color:white;

  border-radius:8px;

  cursor:pointer;

}

button:hover{

  background:#3a57d6;

}

.font-control{

  text-align:center;

  margin-bottom:10px;

}

.nav{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  justify-content:center;

}

.empty{

  display:flex;

  align-items:center;

  justify-content:center;

  height:100%;

  color:#666;

}

</style>

</head>

<body>

<h2></h2>

<div class="stack" id="stack"></div>

<div class="bottom-controls">

  <!-- INPUT + ADD BUTTON MOVED HERE -->

  <div class="controls">

    <input id="frontInput" placeholder="Word / Text">

    <button class="add-btn" onclick="addCard()">បញ្ចូលពាក្យ</button>

  </div>

  <div class="font-control">

    ប្តូរទំហំពាក្យ

    <input type="range" min="16" max="100" value="28"

      oninput="changeFontSize(this.value)">

  </div>

  <div class="nav">

    <button onclick="randomCard()">🎲 Random</button>

    <button onclick="deleteCard()">🗑 Delete</button>

  </div>

</div>

<script>

let cards = [];

let current = 0;

function renderCards(){

  const stack = document.getElementById("stack");

  stack.innerHTML = "";

  if(cards.length === 0){

    stack.innerHTML = `<div class="empty">No cards yet</div>`;

    return;

  }

  const c = cards[current];

  const card = document.createElement("div");

  card.className = "card";

  card.innerHTML = `

    <div class="face">

      <canvas class="drawCanvas"></canvas>

      <div class="text">${c.text}</div>

    </div>

  `;

  let startX = 0;

  card.addEventListener("touchstart",(e)=>{

    startX = e.touches[0].clientX;

  },{passive:true});

  card.addEventListener("touchend",(e)=>{

    const endX = e.changedTouches[0].clientX;

    const diff = endX - startX;

    const rect = card.getBoundingClientRect();

    const x = endX - rect.left;

    const w = rect.width;

    if(Math.abs(diff) > 60){

      if(diff > 0) prev();

      else next();

      return;

    }

    if(x < w*0.2) prev();

    else if(x > w*0.8) next();

  },{passive:true});

  card.addEventListener("click",(e)=>{

    const rect = card.getBoundingClientRect();

    const x = e.clientX - rect.left;

    const w = rect.width;

    if(x < w*0.2) prev();

    else if(x > w*0.8) next();

  });

  stack.appendChild(card);

  card.querySelectorAll(".drawCanvas")

    .forEach(enableDrawing);

}

function addCard(){

  const t = document.getElementById("frontInput").value.trim();

  if(!t) return;

  cards.push({ text:t });

  current = cards.length - 1;

  document.getElementById("frontInput").value = "";

  renderCards();

}

function deleteCard(){

  if(!cards.length) return;

  cards.splice(current,1);

  if(current >= cards.length) current = cards.length-1;

  if(current < 0) current = 0;

  renderCards();

}

function randomCard(){

  if(cards.length < 2) return;

  let r;

  do{

    r = Math.floor(Math.random()*cards.length);

  }while(r === current);

  current = r;

  renderCards();

}

function next(){

  if(current < cards.length-1){

    current++;

    renderCards();

  }

}

function prev(){

  if(current > 0){

    current--;

    renderCards();

  }

}

function changeFontSize(v){

  document.documentElement.style.setProperty("--card-font-size", v+"px");

}

function enableDrawing(canvas){

  const ctx = canvas.getContext("2d");

  function resize(){

    const ratio = window.devicePixelRatio || 1;

    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width * ratio;

    canvas.height = rect.height * ratio;

    ctx.setTransform(ratio,0,0,ratio,0,0);

  }

  resize();

  let drawing = false;

  function pos(e){

    const r = canvas.getBoundingClientRect();

    const p = e.touches ? e.touches[0] : e;

    return {

      x: p.clientX - r.left,

      y: p.clientY - r.top

    };

  }

  function start(e){

    drawing = true;

    const p = pos(e);

    ctx.beginPath();

    ctx.moveTo(p.x,p.y);

  }

  function move(e){

    if(!drawing) return;

    e.preventDefault();

    const p = pos(e);

    ctx.lineWidth = 3;

    ctx.lineCap = "round";

    ctx.lineTo(p.x,p.y);

    ctx.stroke();

  }

  function end(){

    drawing = false;

  }

  canvas.addEventListener("mousedown",start);

  canvas.addEventListener("mousemove",move);

  canvas.addEventListener("mouseup",end);

  canvas.addEventListener("mouseleave",end);

  canvas.addEventListener("touchstart",start,{passive:true});

  canvas.addEventListener("touchmove",move,{passive:false});

  canvas.addEventListener("touchend",end);

}

renderCards();

</script>

</body>

</html>
