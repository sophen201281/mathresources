<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard Stack App</title>

<style>

:root{

  --card-font-size: 28px;

}

*{

  box-sizing:border-box;

}

body{

  font-family:Arial,sans-serif;

  background:#eef3ff;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding:20px;

  margin:0;

}

h2{

  text-align:center;

  margin-bottom:20px;

}

.stack{

  position:relative;

  width:min(340px,90vw);

  height:220px;

  perspective:1400px;

}

.card{

  position:absolute;

  width:100%;

  height:100%;

  transform-style:preserve-3d;

  transition:transform .6s, opacity .3s;

  cursor:pointer;

  touch-action:pan-y;

  user-select:none;

  -webkit-user-select:none;

}

.card.hidden{

  opacity:0;

  pointer-events:none;

}

.card.flipped{

  transform:rotateY(180deg);

}

.face{

  position:absolute;

  width:100%;

  height:100%;

  border-radius:14px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  text-align:center;

  font-size:var(--card-font-size);

  backface-visibility:hidden;

  box-shadow:0 10px 25px rgba(0,0,0,.15);

  word-break:break-word;

}

.front{

  background:white;

}

.back{

  background:#4a6cf7;

  color:white;

  transform:rotateY(180deg);

}

.card::before,

.card::after{

  position:absolute;

  top:0;

  width:20%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:30px;

  color:rgba(0,0,0,.15);

  z-index:5;

  pointer-events:none;

}

.card::before{

  content:"◀";

  left:0;

}

.card::after{

  content:"▶";

  right:0;

}

.bottom-controls{

  width:min(340px,90vw);

  margin-top:15px;

}

.controls{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  justify-content:center;

  margin-bottom:12px;

}

.controls input{

  flex:1;

  min-width:120px;

  padding:10px;

  border:1px solid #ccc;

  border-radius:8px;

}

button,

a{

  padding:10px 14px;

  border:none;

  background:#4a6cf7;

  color:white;

  border-radius:8px;

  cursor:pointer;

  text-decoration:none;

}

button:hover,

a:hover{

  background:#3a57d6;

}

.font-control{

  text-align:center;

  margin-bottom:12px;

}

.nav{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  justify-content:center;

}

.empty{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  height:100%;

  font-size:20px;

  color:#666;

}

</style>

</head>

<body>

<h2>📚 Flashcard Stack App</h2>

<div class="stack" id="stack"></div>

<div class="bottom-controls">

  <div class="controls">

    <input id="frontInput" type="text" placeholder="Front word">

    <input id="backInput" type="text" placeholder="Back meaning">

    <button onclick="addCard()">➕ Add</button>

  </div>

  <div class="font-control">

    🎚 Font Size:

    <input

      type="range"

      min="16"

      max="100"

      value="28"

      oninput="changeFontSize(this.value)">

  </div>

  <div class="nav">

    <button onclick="prevCard()">⏮ ខាងដើម</button>

    <button onclick="flipCard()">🔄 បង្វិល</button>

    <button onclick="nextCard()">⏭ បន្ទាប់</button>

    <button onclick="deleteCard()">🗑 លុប</button>

    <a href="../index.html">🏠 Home</a>

  </div>

</div>

<script>

let cards = [];

let current = 0;

function renderCards(){

  const stack = document.getElementById("stack");

  stack.innerHTML = "";

  if(cards.length === 0){

    stack.innerHTML =

      '<div class="empty">មិនទាន់មានបណ្ណ</div>';

    return;

  }

  cards.forEach((c,i)=>{

    const card = document.createElement("div");

    card.className = "card";

    if(i !== current){

      card.classList.add("hidden");

    }

    if(c.flipped){

      card.classList.add("flipped");

    }

    card.innerHTML = `

      <div class="face front">${c.front}</div>

      <div class="face back">${c.back}</div>

    `;

    let startX = 0;

    card.addEventListener("touchstart",(e)=>{

      startX = e.touches[0].clientX;

    });

    card.addEventListener("touchend",(e)=>{

      const endX = e.changedTouches[0].clientX;

      const diff = endX - startX;

      if(diff > 50){

        prevCard();

        return;

      }

      if(diff < -50){

        nextCard();

        return;

      }

      const rect = card.getBoundingClientRect();

      const x = endX - rect.left;

      const width = rect.width;

      if(x < width * 0.2){

        prevCard();

      }

      else if(x > width * 0.8){

        nextCard();

      }

      else{

        cards[current].flipped =

          !cards[current].flipped;

        renderCards();

      }

    });

    card.addEventListener("click",(e)=>{

      const rect = card.getBoundingClientRect();

      const x = e.clientX - rect.left;

      const width = rect.width;

      if(x < width * 0.2){

        prevCard();

      }

      else if(x > width * 0.8){

        nextCard();

      }

      else{

        cards[current].flipped =

          !cards[current].flipped;

        renderCards();

      }

    });

    stack.appendChild(card);

  });

}

function addCard(){

  const front =

    document.getElementById("frontInput")

    .value.trim();

  const back =

    document.getElementById("backInput")

    .value.trim();

  if(!front || !back){

    return;

  }

  cards.push({

    front,

    back,

    flipped:false

  });

  document.getElementById("frontInput").value = "";

  document.getElementById("backInput").value = "";

  current = cards.length - 1;

  renderCards();

}

function flipCard(){

  if(cards.length === 0) return;

  cards[current].flipped =

    !cards[current].flipped;

  renderCards();

}

function nextCard(){

  if(current < cards.length - 1){

    current++;

    renderCards();

  }

}

function prevCard(){

  if(current > 0){

    current--;

    renderCards();

  }

}

function deleteCard(){

  if(cards.length === 0) return;

  cards.splice(current,1);

  if(current >= cards.length){

    current = cards.length - 1;

  }

  if(current < 0){

    current = 0;

  }

  renderCards();

}

function changeFontSize(size){

  document.documentElement.style

    .setProperty('--card-font-size', size + 'px');

}

renderCards();

</script>

</body>

</html>
