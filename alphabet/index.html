<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consonant + Vowel Combiner</title>

<style>

    body {

        margin: 0;

        font-family: Arial;

        background: #f2f6ff;

        display: flex;

        flex-direction: column;

        align-items: center;

        padding: 12px;

    }

    h2 {

        font-size: 18px;

        margin: 10px 0;

    }

    input {

        width: 90%;

        max-width: 300px;

        padding: 14px;

        font-size: 18px;

        text-align: center;

        border: 2px solid #4a90e2;

        border-radius: 10px;

        outline: none;

        margin-bottom: 12px;

    }

    .grid {

        display: grid;

        grid-template-columns: repeat(5, 1fr);

        gap: 8px;

        width: 100%;

        max-width: 420px;

    }

    .cell {

        aspect-ratio: 1;

        background: white;

        border-radius: 10px;

        border: 2px solid #ddd;

        display: flex;

        justify-content: center;

        align-items: center;

        font-weight: bold;

        font-size: 18px;

        box-shadow: 0 2px 5px rgba(0,0,0,0.08);

    }

    .cell.active {

        background: #dff3ff;

        border-color: #4a90e2;

    }

</style>

</head>

<body>

<h2>Consonant + Vowel Grid 📱</h2>

<input id="letterInput" maxlength="1" placeholder="Type consonant..." />

<div class="grid" id="grid"></div>

<script>

const vowels = ["a","e","i","o","u"];

const grid = document.getElementById("grid");

const input = document.getElementById("letterInput");

let consonants = [];

// Create 6 rows × 5 vowels = 30 cells

for (let i = 0; i < 6; i++) {

    for (let j = 0; j < 5; j++) {

        const div = document.createElement("div");

        div.className = "cell";

        div.dataset.vowel = vowels[j];

        grid.appendChild(div);

    }

}

const cells = document.querySelectorAll(".cell");

function updateGrid() {

    let index = 0;

    for (let c of consonants) {

        for (let v of vowels) {

            if (index >= cells.length) return;

            let cell = cells[index];

            cell.textContent = c + v;

            cell.classList.add("active");

            index++;

        }

    }

}

input.addEventListener("input", () => {

    let letter = input.value.toLowerCase().trim();

    if (!letter.match(/[a-z]/)) return;

    consonants.push(letter); // store consonant

    input.value = "";

    updateGrid();

});

</script>

</body>

</html>
