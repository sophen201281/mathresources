<!DOCTYPE html>

<html lang="km">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Khmer 26 Grid</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap');

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family: "Battambang", Arial, sans-serif;

    background: #f2f6ff;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding: 12px;

    padding-bottom: 80px; /* 👈 space for home button */

}

h2 {

    font-size: clamp(16px, 4vw, 20px);

    margin: 10px 0;

    text-align: center;

}

input {

    width: 90%;

    max-width: 320px;

    padding: 14px;

    font-size: clamp(18px, 5vw, 30px);

    text-align: center;

    border: 2px solid #4a90e2;

    border-radius: 10px;

    outline: none;

}

.grid {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));

    gap: 8px;

    width: 100%;

    max-width: 500px;

    margin-top: 12px;

}

.cell {

    aspect-ratio: 1;

    background: white;

    border-radius: 10px;

    border: 2px solid #ddd;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: clamp(20px, 6vw, 38px);

    font-weight: bold;

    transition: 0.2s;

    text-align: center;

    user-select: none;

    cursor: pointer;

    line-height: 1.1;

}

.cell.active {

    background: #dff3ff;

    border-color: #4a90e2;

}

.cell.selected {

    transform: scale(1.08);

    box-shadow: 0 6px 15px rgba(0,0,0,0.15);

    border-color: #222;

}

/* 🔥 HOME BUTTON */

.home-btn {

    position: fixed;

    bottom: 15px;

    left: 50%;

    transform: translateX(-50%);

    background: #4a90e2;

    color: white;

    border: none;

    padding: 14px 30px;

    border-radius: 30px;

    font-size: 18px;

    font-weight: bold;

    box-shadow: 0 6px 15px rgba(0,0,0,0.2);

    cursor: pointer;

    transition: 0.2s;

    z-index: 999;

}

.home-btn:active {

    transform: translateX(-50%) scale(0.95);

}

</style>

</head>

<body>

<h2>ព្យញ្ជនៈផ្សំស្រៈ</h2>

<input id="khmerInput" maxlength="1" placeholder="បញ្ចូលព្យញ្ជនៈ..." />

<div class="grid" id="grid"></div>

<!-- 🔥 HOME BUTTON -->

<button class="home-btn" onclick="goHome()">Home</button>

<script>

const vowels = [

" ","ា","ិ","ី","ឹ","ឺ",

"ុ","ូ","ួ","ើ","ឿ",

"ៀ","េ","ែ","ៃ","ោ",

"ៅ","ុំ","ំ","ាំ","ះ",

"ុះ","េះ","ោះ"

];

const blueConsonants = new Set([

"ក","ខ","ច","ឆ","ដ","ឋ","ណ","ត","ថ","ប","ផ","ស","ហ","ឡ","អ"

]);

const redConsonants = new Set([

"គ","ឃ","ង","ជ","ឈ","ញ","ឌ","ឍ","ទ","ធ","ន","ព","ភ","ម","យ","រ","ល","វ"

]);

const grid = document.getElementById("grid");

const input = document.getElementById("khmerInput");

for (let i = 0; i < 24; i++) {

    const div = document.createElement("div");

    div.className = "cell";

    div.dataset.vowel = vowels[i];

    div.textContent = vowels[i];

    div.addEventListener("click", () => {

        document.querySelectorAll(".cell").forEach(c => c.classList.remove("selected"));

        div.classList.add("selected");

    });

    grid.appendChild(div);

}

const cells = document.querySelectorAll(".cell");

function getColor(consonant) {

    if (blueConsonants.has(consonant)) return "blue";

    if (redConsonants.has(consonant)) return "red";

    return "black";

}

function updateGrid(consonant) {

    const color = getColor(consonant);

    cells.forEach(cell => {

        cell.textContent = consonant + cell.dataset.vowel;

        cell.classList.add("active");

        cell.style.color = color;

    });

}

input.addEventListener("input", () => {

    let c = input.value.trim();

    if (!c) return;

    updateGrid(c);

    input.value = "";

});

/* 🔥 Home button action */

function goHome() {

    location.reload(); // simple reset back to original state

}

</script>

</body>

</html>
