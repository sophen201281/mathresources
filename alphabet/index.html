<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Grid Vowel Combiner</title>

<style>
    body {
        margin: 0;
        font-family: Arial;
        background: #f2f6ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
    }

    h2 {
        font-size: 18px;
        margin: 10px 0;
    }

    input {
        width: 90%;
        max-width: 300px;
        padding: 14px;
        font-size: 18px;
        text-align: center;
        border: 2px solid #4a90e2;
        border-radius: 10px;
        outline: none;
        margin-bottom: 12px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        width: 100%;
        max-width: 420px;
    }

    .cell {
        aspect-ratio: 1;
        background: white;
        border-radius: 10px;
        border: 2px solid #ddd;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 18px;
        transition: 0.2s;
    }

    .cell.active {
        background: #dff3ff;
        border-color: #4a90e2;
        transform: scale(1.03);
    }
</style>
</head>

<body>

<h2>Consonant + Vowel Grid 📱</h2>

<input id="letterInput" maxlength="1" placeholder="Type consonant..." />

<div class="grid" id="grid"></div>

<script>
const vowels = ["ា","e","i","o","u"];
const grid = document.getElementById("grid");
const input = document.getElementById("letterInput");

// create 30 cells (6x5)
for (let i = 0; i < 30; i++) {
    const div = document.createElement("div");
    div.className = "cell";

    let vowel = vowels[i % 5];
    div.dataset.vowel = vowel;
    div.textContent = vowel; // show vowel first

    grid.appendChild(div);
}

const cells = document.querySelectorAll(".cell");

// update ALL cells with same consonant
function updateGrid(consonant) {
    cells.forEach((cell, index) => {
        let vowel = cell.dataset.vowel;

        cell.textContent = consonant + vowel;
        cell.classList.add("active");
    });
}

input.addEventListener("input", () => {
    let letter = input.value.toLowerCase().trim();

    if (!letter.match(/[a-z]/)) return;

    updateGrid(letter);
});
</script>

</body>
</html>
