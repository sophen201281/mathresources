<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vowel Grid Mobile Fix</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f6ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        overflow-x: hidden;
    }

    h2 {
        font-size: 18px;
        margin: 10px 0;
        text-align: center;
    }

    /* Input */
    .input-box {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 12px;
    }

    input {
        width: 90%;
        max-width: 300px;
        padding: 14px;
        font-size: 18px;
        text-align: center;
        border: 2px solid #4a90e2;
        border-radius: 10px;
        outline: none;
    }

    /* Grid responsive */
    .grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
        width: 100%;
        max-width: 420px;
    }

    .cell {
        aspect-ratio: 1 / 1;
        background: white;
        border-radius: 10px;
        border: 2px solid #ddd;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        transition: 0.2s;
        user-select: none;
    }

    .cell.filled {
        background: #dff3ff;
        border-color: #4a90e2;
        transform: scale(1.03);
    }
</style>
</head>

<body>

<h2>Consonant + Vowel Grid 📱</h2>

<div class="input-box">
    <input id="letterInput" maxlength="1" placeholder="Type a consonant..." />
</div>

<div class="grid" id="grid"></div>

<script>
const vowels = ["A","E","I","O","U"];
const grid = document.getElementById("grid");
const input = document.getElementById("letterInput");

let cells = [];

// Create 30 cells
for (let i = 0; i < 30; i++) {
    const div = document.createElement("div");
    div.className = "cell";

    let vowel = vowels[i % vowels.length];
    div.dataset.vowel = vowel;
    div.textContent = vowel;

    grid.appendChild(div);
    cells.push(div);
}

// Auto-fill (mobile friendly)
input.addEventListener("input", () => {
    let consonant = input.value.toLowerCase().trim();

    if (!consonant.match(/[a-z]/)) return;

    for (let cell of cells) {
        if (!cell.classList.contains("filled")) {
            let vowel = cell.dataset.vowel;
            cell.textContent = consonant + vowel;
            cell.classList.add("filled");
            break;
        }
    }

    input.value = "";
});

// Optional: still support Enter key
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        input.dispatchEvent(new Event("input"));
    }
});
</script>

</body>
</html>
