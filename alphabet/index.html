<!DOCTYPE html>

<html lang="km">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Khmer 26 Grid</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap');

body {

    margin: 0;

    font-family: "Noto Sans Khmer", Arial, sans-serif;

    background: #f2f6ff;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding: 12px;

}

h2 {

    font-size: 18px;

    margin: 10px 0;

    text-align: center;

}

input {

    width: 90%;

    max-width: 320px;

    padding: 14px;

    font-size: 30px;

    text-align: center;

    border: 2px solid #4a90e2;

    border-radius: 10px;

    outline: none;

}

.grid {

    display: grid;

    grid-template-columns: repeat(6, 1fr);

    gap: 8px;

    width: 100%;

    max-width: 420px;

    margin-top: 12px;

}

.cell {

    aspect-ratio: 1;

    background: white;

    border-radius: 10px;

    border: 2px solid #ddd;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 30px;

    font-weight: bold;

    transition: 0.2s;

    text-align: center;

}

.cell.active {

    background: #dff3ff;

    border-color: #4a90e2;

    transform: scale(1.05);

}

</style>

</head>

<body>

<h2>ព្យញ្ជនៈផ្សំស្រៈ</h2>

<input id="khmerInput" maxlength="1" placeholder="បញ្ចូលព្យញ្ជនៈ..." />

<div class="grid" id="grid"></div>

<script>

// 23 extended vowel set

const vowels = [

" ","ា","ិ","ី","ឹ","ឺ",

"ុ","ូ","ួ","ើ","ឿ",

"ៀ","េ","ែ","ៃ","ោ",

"ៅ","ុំ","ំ","ាំ","ះ",

"ុះ","េះ","ោះ"

];

// 👉 Blue group

const blueConsonants = new Set([

"ក","ខ","ច","ឆ","ដ","ឋ","ណ","ត","ថ","ប","ផ","ស","ហ","ឡ","អ"

]);

// 👉 Red group

const redConsonants = new Set([

"គ","ឃ","ង","ជ","ឈ","ញ","ឌ","ឍ","ទ","ធ","ន","ព","ភ","ម","យ","រ","ល","វ"

]);

const grid = document.getElementById("grid");

const input = document.getElementById("khmerInput");

for (let i = 0; i < 24; i++) {

    const div = document.createElement("div");

    div.className = "cell";

    div.dataset.vowel = vowels[i];

    div.textContent = vowels[i];

    grid.appendChild(div);

}

const cells = document.querySelectorAll(".cell");

// 🎨 color rule function

function getColor(consonant) {

    if (blueConsonants.has(consonant)) return "blue";

    if (redConsonants.has(consonant)) return "red";

    return "black";

}

// fill all boxes with consonant + vowel

function updateGrid(consonant) {

    const color = getColor(consonant);

    cells.forEach(cell => {

        cell.textContent = consonant + cell.dataset.vowel;

        cell.classList.add("active");

        cell.style.color = color;

    });

}

input.addEventListener("input", () => {

    let c = input.value.trim();

    if (!c) return;

    updateGrid(c);

    input.value = "";

});

</script>

</body>

</html>
