<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fruit Tree</title>

<style>

*{box-sizing:border-box;}

body{

    margin:0;

    overflow:hidden;

    background:#dff5ff;

    font-family:Arial,sans-serif;

    touch-action:pan-y;

}

/* LEFT SIDEBAR */

#fruitbar{

    position:fixed;

    left:10px;

    top:50%;

    transform:translateY(-50%);

    display:flex;

    flex-direction:column;

    gap:10px;

    z-index:9999;

}

#fruitbar button{

    background:rgba(255,255,255,0.75);

    backdrop-filter:blur(8px);

    border-radius:50%;

    padding:10px;

}

/* BOTTOM BAR */

#bottombar{

    position:fixed;

    bottom:10px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:8px;

    align-items:center;

    z-index:9999;

    background:rgba(255,255,255,0.75);

    backdrop-filter:blur(8px);

    padding:8px 14px;

    border-radius:40px;

    box-shadow:0 4px 16px rgba(0,0,0,.15);

}

button{

    padding:8px;

    border:none;

    border-radius:10px;

    background:white;

    cursor:pointer;

    box-shadow:0 2px 6px rgba(0,0,0,.15);

    transition:transform 0.1s ease;

}

button:active{transform:scale(0.95);}

button img{

    width:40px;height:40px;object-fit:contain;

}

canvas{

    position:absolute;

    top:0;left:0;

    z-index:1;

    touch-action:none;

}

#workspace{

    position:relative;

    width:100%;

    height:100vh;

    overflow:hidden;

}

/* TREE */

.treeGroup{

    position:absolute;

    width:420px;

    height:420px;

    z-index:10;

    border-radius:20px;

    will-change:transform,left,top;

}

.treeSelected{

    outline:4px dashed #2196F3;

    background:rgba(33,150,243,.1);

}

.treeImage{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    width:400px;

    height:400px;

    object-fit:contain;

    pointer-events:none;

}

/* FRUIT */

.fruit{

    position:absolute;

    width:70px;

    height:70px;

    cursor:grab;

    will-change:transform,left,top;

}

.fruit img{

    width:100%;

    height:100%;

    pointer-events:none;

}

.selectedFruit{

    outline:3px solid #2196F3;

    border-radius:50%;

}

/* MOBILE */

@media (max-width:768px){

    .fruit{width:50px;height:50px;}

    .treeGroup{width:320px;height:320px;}

    .treeImage{width:300px;height:300px;}

}

</style>

</head>

<body>

<div id="fruitbar">

    <button onclick="addFruit('apple.png')"><img src="assets/apple.png"></button>

    <button onclick="addFruit('orange.png')"><img src="assets/orange.png"></button>

    <button onclick="addFruit('mango.png')"><img src="assets/mango.png"></button>

</div>

<div id="bottombar">

    <button onclick="addNewTree()">ដើមឈើ</button>

    <button onclick="toggleDraw()">សរសេរ</button>

    <button onclick="toggleEraser()">លុប</button>

    <button onclick="clearCanvas()">សម្អាត</button>

</div>

<canvas id="draw"></canvas>

<div id="workspace"></div>

<script>

const canvas=document.getElementById("draw");

const ctx=canvas.getContext("2d");

const workspace=document.getElementById("workspace");

let drawMode=false,eraseMode=false;

let selectedTree=null,selectedFruit=null;

const GRID=50;

const DEFAULT_X=200,DEFAULT_Y=140;

function resize(){

    canvas.width=innerWidth;

    canvas.height=innerHeight;

}

resize();

addEventListener("resize",resize);

/* ================= DRAW ================= */

canvas.addEventListener("pointerdown",e=>{

    if(!drawMode&&!eraseMode)return;

    ctx.beginPath();

    ctx.moveTo(e.clientX,e.clientY);

    ctx.lineWidth=eraseMode?25:4;

    ctx.globalCompositeOperation=eraseMode?"destination-out":"source-over";

    canvas.isDrawing=true;

});

canvas.addEventListener("pointermove",e=>{

    if(!canvas.isDrawing)return;

    ctx.lineTo(e.clientX,e.clientY);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(e.clientX,e.clientY);

});

canvas.addEventListener("pointerup",()=>{

    canvas.isDrawing=false;

    ctx.globalCompositeOperation="source-over";

});

/* ================= TREE ================= */

function createTree(x,y){

    const t=document.createElement("div");

    t.className="treeGroup";

    t.style.left=x+"px";

    t.style.top=y+"px";

    t.innerHTML=`<img class="treeImage" src="assets/tree.png">`;

    workspace.appendChild(t);

    enableTreeDrag(t);

    return t;

}

/* ===== SMOOTH DRAG ENGINE ===== */

function enableTreeDrag(el){

    let startX,startY,origX,origY,drag=false;

    el.addEventListener("pointerdown",e=>{

        drag=true;

        startX=e.clientX;

        startY=e.clientY;

        origX=el.offsetLeft;

        origY=el.offsetTop;

        el.setPointerCapture(e.pointerId);

    });

    el.addEventListener("pointermove",e=>{

        if(!drag)return;

        const dx=e.clientX-startX;

        const dy=e.clientY-startY;

        requestAnimationFrame(()=>{

            el.style.transform=`translate3d(${dx}px,${dy}px,0)`;

        });

    });

    el.addEventListener("pointerup",e=>{

        drag=false;

        const dx=e.clientX-startX;

        const dy=e.clientY-startY;

        el.style.transform="";

        el.style.left=(origX+dx)+"px";

        el.style.top=(origY+dy)+"px";

        el.releasePointerCapture(e.pointerId);

    });

}

/* ================= FRUIT ================= */

function addFruit(img){

    if(!selectedTree) selectedTree=document.querySelector(".treeGroup");

    const f=document.createElement("div");

    f.className="fruit";

    f.innerHTML=`<img src="assets/${img}">`;

    f.style.left=(40+Math.random()*300)+"px";

    f.style.top=(40+Math.random()*300)+"px";

    selectedTree.appendChild(f);

    enableFruitDrag(f);

}

/* SMOOTH FRUIT DRAG */

function enableFruitDrag(el){

    let startX,startY,origX,origY,drag=false;

    el.addEventListener("pointerdown",e=>{

        drag=true;

        startX=e.clientX;

        startY=e.clientY;

        origX=el.offsetLeft;

        origY=el.offsetTop;

        el.setPointerCapture(e.pointerId);

    });

    el.addEventListener("pointermove",e=>{

        if(!drag)return;

        const dx=e.clientX-startX;

        const dy=e.clientY-startY;

        requestAnimationFrame(()=>{

            el.style.transform=`translate3d(${dx}px,${dy}px,0)`;

        });

    });

    el.addEventListener("pointerup",e=>{

        drag=false;

        const dx=e.clientX-startX;

        const dy=e.clientY-startY;

        el.style.transform="";

        el.style.left=(origX+dx)+"px";

        el.style.top=(origY+dy)+"px";

        el.releasePointerCapture(e.pointerId);

    });

}

/* ================= TREE + INIT ================= */

function addNewTree(){

    const t=createTree(DEFAULT_X,DEFAULT_Y);

    selectedTree=t;

}

addNewTree();

/* TOGGLES */

function toggleDraw(){drawMode=!drawMode;eraseMode=false;}

function toggleEraser(){eraseMode=!eraseMode;drawMode=false;}

function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);}

</script>

</body>

</html>
