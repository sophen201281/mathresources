<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit Tree</title>

<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    overflow:hidden;
    background:#dff5ff;
    font-family:Arial,sans-serif;
    touch-action:pan-y;
}

/* LEFT SIDEBAR */
#fruitbar{
    position:fixed;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:9999;
}

#fruitbar button {
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(8px);
    border-radius:50%;
    padding:10px;
}

/* BOTTOM TOOLBAR */
#bottombar{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    align-items:center;
    z-index:9999;
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(8px);
    padding:8px 14px;
    border-radius:40px;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
}

button{
    padding:8px;
    border:none;
    border-radius:10px;
    background:white;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    transition:transform 0.1s ease;
}

button:active{ transform:scale(0.95); }

button img{
    width:40px;
    height:40px;
    object-fit:contain;
}

#bottombar a{
    padding:8px 14px;
    font-size:18px;
    border-radius:10px;
    background:white;
    text-decoration:none;
    color:#333;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

/* CANVAS */
canvas{
    position:absolute;
    top:0;
    left:0;
    z-index:1;
    touch-action:none;
}

#workspace {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* TREE */
.treeGroup{
    position:absolute;
    width:420px;
    height:420px;
    z-index:10;
    border-radius:20px;
    will-change: transform;
}

.treeSelected{
    outline:4px dashed #2196F3;
    background:rgba(33,150,243,.1);
}

.treeImage{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:400px;
    height:400px;
    object-fit:contain;
    pointer-events:none;
}

/* FRUIT */
.fruit{
    position:absolute;
    width:70px;
    height:70px;
    cursor:grab;
    will-change: transform;
}

.fruit img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

.selectedFruit{
    outline:3px solid #2196F3;
    border-radius:50%;
}
</style>
</head>

<body>

<div id="fruitbar">
    <button onclick="addFruit('apple.png')"><img src="assets/apple.png"></button>
    <button onclick="addFruit('orange.png')"><img src="assets/orange.png"></button>
    <button onclick="addFruit('mango.png')"><img src="assets/mango.png"></button>
</div>

<div id="bottombar">
    <button onclick="addNewTree()">ដើមឈើ</button>
    <button onclick="toggleDraw()">សរសេរ</button>
    <button onclick="toggleEraser()">លុប</button>
    <button onclick="clearCanvas()">សម្អាត</button>
    <a href="../index.html">Home</a>
</div>

<canvas id="draw"></canvas>
<div id="workspace"></div>

<script>
const canvas = document.getElementById("draw");
const ctx = canvas.getContext("2d");
const workspace = document.getElementById("workspace");

let drawMode = false;
let eraseMode = false;
let drawing = false;

let selectedTree = null;
let selectedFruit = null;

const GRID = 50;
const DEFAULT_TREE_X = 200;
const DEFAULT_TREE_Y = 140;

/* ================= CANVAS ================= */
function resizeCanvas(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resizeCanvas();
addEventListener("resize", resizeCanvas);

canvas.addEventListener("pointerdown", e=>{
    if(!drawMode && !eraseMode) return;
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.clientX,e.clientY);
    ctx.lineWidth = eraseMode ? 25 : 4;
    ctx.globalCompositeOperation = eraseMode ? "destination-out":"source-over";
});

canvas.addEventListener("pointermove", e=>{
    if(!drawing) return;
    ctx.lineTo(e.clientX,e.clientY);
    ctx.stroke();
});

canvas.addEventListener("pointerup", ()=>{
    drawing = false;
    ctx.globalCompositeOperation = "source-over";
});

/* ================= TREE DRAG (SMOOTH) ================= */
function setupTreeDrag(tree){
    let dragging=false;
    let startX=0,startY=0,baseX=0,baseY=0;
    let tx=0,ty=0;
    let raf;

    function apply(){
        tree.style.left = tx + "px";
        tree.style.top = ty + "px";
    }

    function loop(){
        apply();
        raf = requestAnimationFrame(loop);
    }

    tree.addEventListener("pointerdown", e=>{
        if(e.target.classList.contains("fruit")) return;

        selectedTree = tree;

        document.querySelectorAll(".treeGroup").forEach(t=>t.classList.remove("treeSelected"));
        tree.classList.add("treeSelected");

        dragging=true;
        startX=e.clientX;
        startY=e.clientY;

        baseX=tree.offsetLeft;
        baseY=tree.offsetTop;

        tx=baseX;
        ty=baseY;

        tree.setPointerCapture(e.pointerId);
        raf=requestAnimationFrame(loop);
    });

    tree.addEventListener("pointermove", e=>{
        if(!dragging) return;

        const dx=e.clientX-startX;
        const dy=e.clientY-startY;

        tx = Math.max(0, Math.min(innerWidth-420, baseX+dx));
        ty = Math.max(0, Math.min(innerHeight-420, baseY+dy));
    });

    tree.addEventListener("pointerup", e=>{
        dragging=false;
        cancelAnimationFrame(raf);
        tree.releasePointerCapture(e.pointerId);
    });
}

/* ================= FRUIT DRAG (SMOOTH) ================= */
function setupFruitDrag(fruit){
    let dragging=false;
    let startX=0,startY=0,baseX=0,baseY=0;
    let tx=0,ty=0;
    let raf;

    function apply(){
        fruit.style.left = tx + "px";
        fruit.style.top = ty + "px";
    }

    function loop(){
        apply();
        raf = requestAnimationFrame(loop);
    }

    fruit.addEventListener("pointerdown", e=>{
        e.stopPropagation();

        selectedFruit = fruit;

        document.querySelectorAll(".fruit").forEach(f=>f.classList.remove("selectedFruit"));
        fruit.classList.add("selectedFruit");

        dragging=true;
        startX=e.clientX;
        startY=e.clientY;

        baseX=fruit.offsetLeft;
        baseY=fruit.offsetTop;

        tx=baseX;
        ty=baseY;

        fruit.setPointerCapture(e.pointerId);
        raf=requestAnimationFrame(loop);
    });

    fruit.addEventListener("pointermove", e=>{
        if(!dragging) return;

        const dx=e.clientX-startX;
        const dy=e.clientY-startY;

        tx = Math.max(0, Math.min(350, Math.round((baseX+dx)/GRID)*GRID));
        ty = Math.max(0, Math.min(350, Math.round((baseY+dy)/GRID)*GRID));
    });

    fruit.addEventListener("pointerup", e=>{
        dragging=false;
        cancelAnimationFrame(raf);
        fruit.releasePointerCapture(e.pointerId);
    });
}

/* ================= TREE + FRUIT ================= */
function createTree(x,y){
    const tree=document.createElement("div");
    tree.className="treeGroup";
    tree.style.left=x+"px";
    tree.style.top=y+"px";
    tree.innerHTML=`<img src="assets/tree.png" class="treeImage">`;
    workspace.appendChild(tree);
    setupTreeDrag(tree);
    return tree;
}

function addFruit(img){
    if(!selectedTree) return;

    const fruit=document.createElement("div");
    fruit.className="fruit";
    fruit.innerHTML=`<img src="assets/${img}">`;

    fruit.style.left = (40+Math.random()*300) + "px";
    fruit.style.top = (40+Math.random()*300) + "px";

    selectedTree.appendChild(fruit);
    setupFruitDrag(fruit);
}

/* INIT */
const t=createTree(DEFAULT_TREE_X,DEFAULT_TREE_Y);
selectedTree=t;
</script>
</body>
</html>
