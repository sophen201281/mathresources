<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit Tree</title>
<style>
*{
    box-sizing:border-box;
    touch-action:none;
}
body{
    margin:0;
    overflow:hidden;
    background:#dff5ff;
    font-family:Arial,sans-serif;
}

/* LEFT SIDEBAR - Fruit buttons stacked vertically */
#fruitbar{
    position:fixed;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:9999;
}

/* BOTTOM TOOLBAR - Action buttons + Home */
#bottombar{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:row;
    gap:8px;
    align-items:center;
    z-index:9999;
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(8px);
    padding:8px 14px;
    border-radius:40px;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
}

button{
    padding:8px;
    border:none;
    border-radius:10px;
    background:white;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

button img{
    width:40px;
    height:40px;
    object-fit:contain;
}

#bottombar button{
    padding:8px 14px;
    font-size:18px;
    border-radius:10px;
}

#bottombar a{
    padding:8px 14px;
    font-size:18px;
    border-radius:10px;
    background:white;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    text-decoration:none;
    color:#333;
}

canvas{
    position:absolute;
    top:0;
    left:0;
    z-index:1;
}

.treeGroup{
    position:absolute;
    width:420px;
    height:420px;
    z-index:10;
    border-radius:20px;
}

.treeSelected{
    outline:4px dashed blue;
    background:rgba(255,255,255,.15);
}

.treeImage{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:400px;
    height:400px;
    object-fit:contain;
    user-select:none;
    pointer-events:none;
}

.fruit{
    position:absolute;
    width:70px;
    height:70px;
    cursor:grab;
}

.fruit img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
}

.selectedFruit{
    outline:3px solid blue;
    border-radius:50%;
}
</style>
</head>
<body>

<!-- LEFT SIDEBAR: Fruit buttons only, vertical -->
<div id="fruitbar">
    <button onclick="addFruit('apple.png')">
        <img src="assets/apple.png" alt="Apple">
    </button>
    <button onclick="addFruit('orange.png')">
        <img src="assets/orange.png" alt="Orange">
    </button>
    <button onclick="addFruit('mango.png')">
        <img src="assets/mango.png" alt="Mango">
    </button>
</div>

<!-- BOTTOM TOOLBAR: Action buttons + Home -->
<div id="bottombar">
    <button onclick="copySelected()">Copy</button>
    <button onclick="toggleDraw()">Draw</button>
    <button onclick="toggleEraser()">Erase</button>
    <button onclick="clearCanvas()">Clear</button>
    <a href="../index.html">Home</a>
</div>

<canvas id="draw"></canvas>
<div id="workspace"></div>

<script>
const canvas = document.getElementById("draw");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

let drawMode = false;
let eraseMode = false;
let drawing = false;

function toggleDraw(){
    drawMode = !drawMode;
    eraseMode = false;
    document.querySelectorAll("#bottombar button")[1].style.background = drawMode ? "#c8e6ff" : "white";
}

function toggleEraser(){
    eraseMode = !eraseMode;
    drawMode = false;
    document.querySelectorAll("#bottombar button")[2].style.background = eraseMode ? "#ffd6c8" : "white";
}

function clearCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

canvas.addEventListener("pointerdown",e=>{
    if(!drawMode && !eraseMode) return;
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.clientX,e.clientY);
});

canvas.addEventListener("pointermove",e=>{
    if(!drawing) return;
    ctx.lineWidth = eraseMode ? 25 : 4;
    ctx.lineCap = "round";
    ctx.globalCompositeOperation =
        eraseMode ? "destination-out" : "source-over";
    ctx.lineTo(e.clientX,e.clientY);
    ctx.stroke();
});

window.addEventListener("pointerup",()=>{
    drawing = false;
    ctx.globalCompositeOperation = "source-over";
});

const workspace = document.getElementById("workspace");
let selectedTree = null;
let selectedFruit = null;
const GRID = 50;

/* First Tree */
createTree(200, 140);

function createTree(x,y){
    const tree = document.createElement("div");
    tree.className = "treeGroup";
    tree.style.left = x + "px";
    tree.style.top = y + "px";
    tree.innerHTML = `
        <img src="assets/tree.png" class="treeImage" draggable="false">
    `;
    workspace.appendChild(tree);
    setupTree(tree);
}

function setupTree(tree){
    tree.addEventListener("pointerdown",e=>{
        if(e.target.classList.contains("fruit")) return;
        selectedTree = tree;
        document
            .querySelectorAll(".treeGroup")
            .forEach(t=>t.classList.remove("treeSelected"));
        tree.classList.add("treeSelected");

        const ox = e.clientX - tree.offsetLeft;
        const oy = e.clientY - tree.offsetTop;

        function move(ev){
            tree.style.left = (ev.clientX - ox) + "px";
            tree.style.top = (ev.clientY - oy) + "px";
        }

        function up(){
            removeEventListener("pointermove",move);
            removeEventListener("pointerup",up);
        }

        addEventListener("pointermove",move);
        addEventListener("pointerup",up);
    });
}

function addFruit(imageFile){
    if(!selectedTree){
        selectedTree = document.querySelector(".treeGroup");
    }
    const fruit = document.createElement("div");
    fruit.className = "fruit";
    fruit.innerHTML =
        `<img src="assets/${imageFile}" draggable="false">`;
    fruit.style.left = "40px";
    fruit.style.top = "90px";
    selectedTree.appendChild(fruit);
    dragFruit(fruit);
}

function dragFruit(el){
    let taps = 0;

    el.addEventListener("pointerdown",e=>{
        e.stopPropagation();
        selectedFruit = el;
        document
            .querySelectorAll(".fruit")
            .forEach(f=>f.classList.remove("selectedFruit"));
        el.classList.add("selectedFruit");

        const tree = el.parentElement;
        const ox =
            e.clientX -
            tree.offsetLeft -
            el.offsetLeft;
        const oy =
            e.clientY -
            tree.offsetTop -
            el.offsetTop;

        function move(ev){
            const x =
                ev.clientX -
                tree.offsetLeft -
                ox;
            const y =
                ev.clientY -
                tree.offsetTop -
                oy;
            el.style.left =
                Math.round(x / GRID) * GRID + "px";
            el.style.top =
                Math.round(y / GRID) * GRID + "px";
        }

        function up(){
            removeEventListener("pointermove",move);
            removeEventListener("pointerup",up);
        }

        addEventListener("pointermove",move);
        addEventListener("pointerup",up);
    });

    el.addEventListener("click",()=>{
        taps++;
        setTimeout(()=>{
            taps = 0;
        },300);
        if(taps >= 2){
            el.remove();
        }
    });
}

function copySelected(){
    if(selectedFruit){
        const copy = selectedFruit.cloneNode(true);
        copy.style.left =
            (parseFloat(selectedFruit.style.left)+60) + "px";
        copy.style.top =
            (parseFloat(selectedFruit.style.top)+20) + "px";
        selectedFruit.parentElement.appendChild(copy);
        dragFruit(copy);
        return;
    }

    if(selectedTree){
        createTree(
            selectedTree.offsetLeft + 80,
            selectedTree.offsetTop + 50
        );
    }
}
</script>
</body>
</html>
