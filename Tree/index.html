<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fruit Tree</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    overflow:hidden;

    background:#dff5ff;

    font-family:Arial,sans-serif;

    touch-action:pan-y;

}

/* LEFT BAR */

#fruitbar{

    position:fixed;

    left:10px;

    top:50%;

    transform:translateY(-50%);

    display:flex;

    flex-direction:column;

    gap:10px;

    z-index:9999;

}

#fruitbar button{

    background:rgba(255,255,255,0.75);

    border-radius:50%;

    padding:10px;

    border:none;

}

/* BOTTOM BAR */

#bottombar{

    position:fixed;

    bottom:10px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:8px;

    z-index:9999;

    background:rgba(255,255,255,0.75);

    padding:8px 14px;

    border-radius:40px;

    backdrop-filter:blur(8px);

}

/* BUTTONS */

button, a{

    border:none;

    background:white;

    padding:8px 12px;

    border-radius:10px;

    cursor:pointer;

    text-decoration:none;

    color:#333;

    box-shadow:0 2px 6px rgba(0,0,0,.15);

}

button:active{ transform:scale(0.95); }

button img{

    width:40px;

    height:40px;

    object-fit:contain;

}

/* CANVAS */

canvas{

    position:absolute;

    top:0;

    left:0;

    z-index:1;

    touch-action:none;

}

/* WORKSPACE */

#workspace{

    position:relative;

    width:100%;

    height:100vh;

    overflow:hidden;

}

/* TREE */

.treeGroup{

    position:absolute;

    width:420px;

    height:420px;

    z-index:10;

    will-change:transform;

}

.treeImage{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    width:400px;

    height:400px;

    user-select:none;

    pointer-events:none;

}

/* FRUIT */

.fruit{

    position:absolute;

    width:70px;

    height:70px;

    cursor:grab;

    will-change:transform;

}

.fruit img{

    width:100%;

    height:100%;

    pointer-events:none;

}

/* SELECT */

.selectedFruit{

    outline:3px solid #2196F3;

    border-radius:50%;

}

</style>

</head>

<body>

<!-- FRUIT BAR -->

<div id="fruitbar">

    <button onclick="addFruit('apple.png')"><img src="assets/apple.png"></button>

    <button onclick="addFruit('orange.png')"><img src="assets/orange.png"></button>

    <button onclick="addFruit('mango.png')"><img src="assets/mango.png"></button>

</div>

<!-- BOTTOM BAR -->

<div id="bottombar">

    <button onclick="addNewTree()">🌳 ដើមឈើ</button>

    <button onclick="toggleDraw()">✏️ សរសេរ</button>

    <button onclick="toggleEraser()">🧽 លុប</button>

    <button onclick="clearCanvas()">🧹 សម្អាត</button>

    <a href="../index.html">Home</a>

</div>

<canvas id="draw"></canvas>

<div id="workspace"></div>

<script>

const canvas = document.getElementById("draw");

const ctx = canvas.getContext("2d");

const workspace = document.getElementById("workspace");

let drawMode = false;

let eraseMode = false;

let drawing = false;

let selectedTree = null;

let selectedFruit = null;

let lastTap = 0;

const DOUBLE_TAP = 300;

/* CANVAS */

function resize(){

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize", resize);

/* DRAW */

canvas.addEventListener("pointerdown",(e)=>{

    if(!drawMode && !eraseMode) return;

    drawing = true;

    ctx.beginPath();

    ctx.moveTo(e.clientX,e.clientY);

    ctx.lineWidth = eraseMode ? 25 : 4;

    ctx.lineCap = "round";

    ctx.globalCompositeOperation = eraseMode ? "destination-out":"source-over";

});

canvas.addEventListener("pointermove",(e)=>{

    if(!drawing) return;

    ctx.lineTo(e.clientX,e.clientY);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(e.clientX,e.clientY);

});

canvas.addEventListener("pointerup",()=>{

    drawing=false;

    ctx.globalCompositeOperation="source-over";

});

/* TOOLS */

function toggleDraw(){ drawMode=!drawMode; eraseMode=false; }

function toggleEraser(){ eraseMode=!eraseMode; drawMode=false; }

function clearCanvas(){ ctx.clearRect(0,0,canvas.width,canvas.height); }

/* 🌳 ADD TREE */

function addNewTree(){

    const x = (window.innerWidth / 2) - 210;

    const y = (window.innerHeight / 2) - 210;

    const tree = createTree(x, y);

    selectTree(tree);

}

/* CREATE TREE */

function createTree(x,y){

    const tree=document.createElement("div");

    tree.className="treeGroup";

    tree.style.left=x+"px";

    tree.style.top=y+"px";

    tree.innerHTML=`<img src="assets/tree.png" class="treeImage">`;

    workspace.appendChild(tree);

    setupTreeDrag(tree);

    setupTreeTap(tree);

    return tree;

}

/* SELECT TREE */

function selectTree(tree){

    selectedTree = tree;

    selectedFruit = null;

}

/* 🌳 DOUBLE TAP DELETE TREE */

function setupTreeTap(tree){

    tree.addEventListener("pointerdown",(e)=>{

        if(e.target.classList.contains("fruit")) return;

        selectTree(tree);

        const now = Date.now();

        if(now - lastTap < DOUBLE_TAP){

            tree.remove();

            if(selectedTree === tree) selectedTree = null;

        }

        lastTap = now;

    });

}

/* 🌳 TREE DRAG */

function setupTreeDrag(tree){

    let sx=0,sy=0;

    let ox=0,oy=0;

    let dx=0,dy=0;

    let raf=null;

    let dragging=false;

    function apply(){

        tree.style.transform=`translate(${dx}px,${dy}px)`;

        raf=null;

    }

    tree.addEventListener("pointerdown",(e)=>{

        if(e.target.classList.contains("fruit")) return;

        sx=e.clientX;

        sy=e.clientY;

        ox=tree.offsetLeft;

        oy=tree.offsetTop;

        dragging=true;

        tree.setPointerCapture(e.pointerId);

    });

    tree.addEventListener("pointermove",(e)=>{

        if(!dragging) return;

        dx=e.clientX-sx;

        dy=e.clientY-sy;

        if(!raf) raf=requestAnimationFrame(apply);

    });

    tree.addEventListener("pointerup",(e)=>{

        dragging=false;

        tree.releasePointerCapture(e.pointerId);

        tree.style.left=(ox+dx)+"px";

        tree.style.top=(oy+dy)+"px";

        tree.style.transform="none";

    });

}

/* 🍎 ADD FRUIT (FIXED LOGIC) */

function addFruit(img){

    // ✅ FIX: always use existing tree first

    if(!selectedTree){

        const trees = document.querySelectorAll(".treeGroup");

        if(trees.length > 0){

            selectedTree = trees[0];

        } else {

            const x = (window.innerWidth / 2) - 210;

            const y = (window.innerHeight / 2) - 210;

            selectedTree = createTree(x,y);

        }

    }

    const fruit=document.createElement("div");

    fruit.className="fruit";

    fruit.innerHTML=`<img src="assets/${img}">`;

    fruit.style.left=(80+Math.random()*250)+"px";

    fruit.style.top=(80+Math.random()*250)+"px";

    selectedTree.appendChild(fruit);

    setupFruitDrag(fruit);

    setupFruitTapDelete(fruit);

}

/* 🍎 FRUIT DRAG */

function setupFruitDrag(fruit){

    let sx=0,sy=0;

    let dx=0,dy=0;

    let raf=null;

    let dragging=false;

    function apply(){

        fruit.style.transform=`translate(${dx}px,${dy}px)`;

        raf=null;

    }

    fruit.addEventListener("pointerdown",(e)=>{

        e.stopPropagation();

        selectedFruit = fruit;

        sx=e.clientX;

        sy=e.clientY;

        dx=0;

        dy=0;

        dragging=true;

        fruit.setPointerCapture(e.pointerId);

    });

    fruit.addEventListener("pointermove",(e)=>{

        if(!dragging) return;

        dx=e.clientX-sx;

        dy=e.clientY-sy;

        if(!raf) raf=requestAnimationFrame(apply);

    });

    fruit.addEventListener("pointerup",(e)=>{

        dragging=false;

        fruit.releasePointerCapture(e.pointerId);

        const rect = fruit.getBoundingClientRect();

        const parentRect = fruit.parentElement.getBoundingClientRect();

        fruit.style.left = (rect.left - parentRect.left) + "px";

        fruit.style.top  = (rect.top - parentRect.top) + "px";

        fruit.style.transform = "none";

    });

}

/* 🍎 DOUBLE TAP DELETE FRUIT */

function setupFruitTapDelete(fruit){

    fruit.addEventListener("pointerdown",(e)=>{

        const now = Date.now();

        if(now - lastTap < DOUBLE_TAP){

            fruit.remove();

            if(selectedFruit === fruit) selectedFruit = null;

        }

        lastTap = now;

    });

}

/* INIT */

(function init(){

    const x = (window.innerWidth / 2) - 210;

    const y = (window.innerHeight / 2) - 210;

    createTree(x,y);

})();

</script>

</body>

</html>
