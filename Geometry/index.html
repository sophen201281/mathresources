<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Geometry Board - Final Stable Version</title>

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family:Arial;

}

body{

    overflow:hidden;

}

/* ================= BOARD ================= */

#board{

    position:relative;

    width:100vw;

    height:100vh;

    background:white;

}

/* ================= CANVAS ================= */

canvas{

    position:absolute;

    inset:0;

    touch-action:none;

}

/* ================= TOOLBAR (BOTTOM) ================= */

#toolbar{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    height:70px;

    background:#2c3e50;

    display:flex;

    gap:8px;

    align-items:center;

    padding:10px;

    z-index:999;

    overflow-x:auto;

}

button,select{

    padding:8px 12px;

    border:none;

    border-radius:6px;

    cursor:pointer;

    white-space:nowrap;

}

#drawBtn{background:#3498db;color:#fff}

#eraseBtn{background:#e67e22;color:#fff}

#clearBtn{background:#e74c3c;color:#fff}

#addShapeBtn{background:#27ae60;color:#fff}

/* ================= SHAPES ================= */

.shape{

    position:absolute;

    cursor:move;

}

/* ================= LABELS ================= */

.label{

    position:absolute;

    background:white;

    border:1px solid #FFFFFF00;

    font-size:16px;

    padding:2px 6px;

    border-radius:4px;

    user-select:none;

    transform:translate(-50%,-50%);

    pointer-events:auto;

    cursor:text;

}

.label.editing{

    border:2px solid #3498db;

    background:#eef6ff;

}

</style>

</head>

<body>

<div id="board">

<canvas id="canvas"></canvas>

</div>

<!-- TOOLBAR -->

<div id="toolbar">

<button id="drawBtn">✏️សរសេរ</button>

<button id="eraseBtn">លុប</button>

<button id="clearBtn">សម្អាត</button>

<button onclick="window.location.href='../index.html'" class="homeBtn">🏡 Home</button>
<select id="shapeType">

<option value="triangle">ត្រីកោណ</option>

<option value="square">ការេ</option>

<option value="rectangle">ចតុកោណកែង</option>

<option value="circle">រង្វង់</option>

<option value="pentagon">បញ្ចកោណ</option>

<option value="hexagon">ឆកោណ</option>

</select>

<button id="addShapeBtn">➕ដាក់រូប</button>

</div>

<script>

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const board = document.getElementById("board");

/* ================= RESIZE ================= */

function resize(){

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight - 70;

}

resize();

window.addEventListener("resize", resize);

/* ================= TOOL STATE ================= */

let tool = "draw";

let drawing = false;

/* ================= POINTER POSITION ================= */

function getPos(e){

    const rect = board.getBoundingClientRect();

    return {

        x: e.clientX - rect.left,

        y: e.clientY - rect.top

    };

}

/* ================= DRAWING ================= */

canvas.addEventListener("pointerdown", e=>{

    if(tool !== "draw" && tool !== "erase") return;

    drawing = true;

    const p = getPos(e);

    ctx.beginPath();

    ctx.moveTo(p.x, p.y);

});

canvas.addEventListener("pointermove", e=>{

    if(!drawing) return;

    const p = getPos(e);

    ctx.lineWidth = (tool === "erase") ? 20 : 3;

    ctx.lineCap = "round";

    if(tool === "erase"){

        ctx.globalCompositeOperation = "destination-out";

    } else {

        ctx.globalCompositeOperation = "source-over";

        ctx.strokeStyle = "#000";

    }

    ctx.lineTo(p.x, p.y);

    ctx.stroke();

});

canvas.addEventListener("pointerup", ()=>{

    drawing = false;

});

/* ================= TOOLBAR ================= */

drawBtn.onclick = ()=> tool = "draw";

eraseBtn.onclick = ()=> tool = "erase";

clearBtn.onclick = ()=>{

    ctx.clearRect(0,0,canvas.width,canvas.height);

    document.querySelectorAll(".shape").forEach(s=>s.remove());

};

addShapeBtn.onclick = ()=>{

    createShape(shapeType.value);

};

/* ================= GEOMETRY ================= */

function center(pts){

    let x=0,y=0;

    pts.forEach(p=>{

        x+=p[0];

        y+=p[1];

    });

    return [x/pts.length, y/pts.length];

}

function offset(p,c,dist=35){

    let dx = p[0]-c[0];

    let dy = p[1]-c[1];

    let len = Math.sqrt(dx*dx+dy*dy)||1;

    return [

        p[0] + (dx/len)*dist,

        p[1] + (dy/len)*dist

    ];

}

/* ================= SHAPES ================= */

function createShape(type){

    const shape = document.createElement("div");

    shape.className = "shape";

    let w=160,h=160;

    let pts=[];

    if(type==="triangle"){

        pts=[[80,10],[150,150],[10,150]];

    }

    if(type==="square"){

        pts=[[10,10],[140,10],[140,140],[10,140]];

    }

    if(type==="rectangle"){

        w=180;h=120;

        pts=[[10,10],[170,10],[170,110],[10,110]];

    }

    if(type==="circle"){

        w=h=160;

    }

    if(type==="pentagon"){

        pts=[[80,10],[150,60],[120,150],[40,150],[10,60]];

    }

    if(type==="hexagon"){

        pts=[[80,10],[140,40],[140,110],[80,150],[20,110],[20,40]];

    }

    let svg = `<svg width="${w}" height="${h}">`;

    if(type==="circle"){

        svg += `<circle cx="80" cy="80" r="60"

                fill="none" stroke="black" stroke-width="3"/>`;

    } else {

        svg += `<polygon points="${pts.map(p=>p.join(",")).join(" ")}"

                fill="none" stroke="black" stroke-width="3"/>`;

    }

    svg += "</svg>";

    shape.innerHTML = svg;

    shape.style.left = "120px";

    shape.style.top = "120px";

    board.appendChild(shape);

    const letters = ["ក","ខ","គ","ឃ","ង","ច"];

    if(type === "circle"){

        addLabel(shape,"C",80,80);

        addLabel(shape,"R",140,80);

    } else {

        const c = center(pts);

        pts.forEach((p,i)=>{

            const pos = offset(p,c,40);

            addLabel(shape, letters[i], pos[0], pos[1]);

        });

    }

    enableDrag(shape);

}

/* ================= LABEL ================= */

function addLabel(parent,text,x,y){

    const label = document.createElement("div");

    label.className = "label";

    label.innerText = text;

    label.style.left = x + "px";

    label.style.top = y + "px";

    /* EDIT MODE */

    label.addEventListener("dblclick", (e)=>{

        e.stopPropagation();

        label.contentEditable = true;

        label.classList.add("editing");

        label.focus();

    });

    label.addEventListener("blur", ()=>{

        label.contentEditable = false;

        label.classList.remove("editing");

    });

    parent.appendChild(label);

}

/* ================= DRAG ================= */

function enableDrag(el){

    let active=false;

    let ox=0, oy=0;

    el.addEventListener("pointerdown", e=>{

        active = true;

        const rect = el.getBoundingClientRect();

        ox = e.clientX - rect.left;

        oy = e.clientY - rect.top;

        e.stopPropagation();

    });

    window.addEventListener("pointermove", e=>{

        if(!active) return;

        const rect = board.getBoundingClientRect();

        el.style.left = (e.clientX - rect.left - ox) + "px";

        el.style.top = (e.clientY - rect.top - oy) + "px";

    });

    window.addEventListener("pointerup", ()=>{

        active = false;

    });

}

</script>

</body>

</html>
