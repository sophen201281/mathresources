<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Drawing + Eraser + Clear</title>

<style>

/* ================= RESET ================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    width:100vw;

    height:100vh;

    overflow:hidden;

    background:#eef2f7;

    font-family:Arial;

}

/* ================= TOOLBAR ================= */

.toolbar{

    position:fixed;

    top:12px;

    left:50%;

    transform:translateX(-50%);

    z-index:100;

    display:flex;

    gap:10px;

}

.tool-btn{

    border:none;

    padding:10px 18px;

    border-radius:10px;

    background:white;

    box-shadow:0 4px 10px rgba(0,0,0,0.15);

    cursor:pointer;

    font-weight:bold;

}

.tool-btn.active{

    background:#2563eb;

    color:white;

}

/* ================= CENTER ================= */

.wrapper{

    width:100%;

    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

}

/* ================= BOARD ================= */

.board{

    position:relative;

    width:min(92vw, 520px);

    height:min(92vw, 520px);

    background:white;

    border-radius:16px;

    overflow:hidden;

    box-shadow:0 10px 30px rgba(0,0,0,0.2);

}

/* ================= MAIN CANVAS ================= */

#mainCanvas{

    position:absolute;

    inset:0;

    z-index:1;

    touch-action:none;

}

/* ================= GRID ================= */

.grid{

    position:absolute;

    inset:0;

    display:grid;

    grid-template-columns:repeat(10,1fr);

    grid-template-rows:repeat(10,1fr);

    z-index:2;

}

/* ================= DOTS ================= */

.dot{

    display:flex;

    justify-content:center;

    align-items:center;

}

.dot::before{

    content:"";

    width:55%;

    height:55%;

    border-radius:50%;

    background:white;

    border:1px solid #cbd5e1;

}

.dot.active::before{

    background:#2563eb;

    border-color:#2563eb;

}

/* ================= RIGHT PANEL ================= */

.right-panel{

    position:absolute;

    top:0;

    right:0;

    width:120px;

    height:100%;

    background:white;

    border-left:2px solid #d1d5db;

    z-index:10;

}

.mask-right{

    position:absolute;

    top:0;

    left:0;

    width:20px;

    height:100%;

    background:white;

    border-right:2px solid #cbd5e1;

    cursor:ew-resize;

    z-index:12;

}

#rightCanvas{

    position:absolute;

    inset:0 0 0 20px;

    width:calc(100% - 20px);

    height:100%;

    touch-action:none;

}

/* ================= BOTTOM PANEL ================= */

.bottom-panel{

    position:absolute;

    left:0;

    bottom:0;

    width:100%;

    height:120px;

    background:white;

    border-top:2px solid #d1d5db;

    z-index:10;

}

.mask-bottom{

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:20px;

    background:white;

    border-bottom:2px solid #cbd5e1;

    cursor:ns-resize;

    z-index:12;

}

#bottomCanvas{

    position:absolute;

    inset:20px 0 0 0;

    width:100%;

    height:calc(100% - 20px);

    touch-action:none;

}

</style>

</head>

<body>

<!-- TOOLBAR -->

<div class="toolbar">

    <button class="tool-btn active" id="drawBtn">

        Draw

    </button>

    <button class="tool-btn" id="eraseBtn">

        Eraser

    </button>

    <button class="tool-btn" id="clearBtn">

        Clear

    </button>

</div>

<div class="wrapper">

<div class="board" id="board">

    <!-- MAIN -->

    <canvas id="mainCanvas"></canvas>

    <!-- GRID -->

    <div class="grid" id="grid"></div>

    <!-- RIGHT -->

    <div class="right-panel" id="rightPanel">

        <div class="mask-right" id="maskRight"></div>

        <canvas id="rightCanvas"></canvas>

    </div>

    <!-- BOTTOM -->

    <div class="bottom-panel" id="bottomPanel">

        <div class="mask-bottom" id="maskBottom"></div>

        <canvas id="bottomCanvas"></canvas>

    </div>

</div>

</div>

<script>

/* ================= TOOL MODE ================= */

let tool = "draw";

const drawBtn = document.getElementById("drawBtn");

const eraseBtn = document.getElementById("eraseBtn");

const clearBtn = document.getElementById("clearBtn");

drawBtn.onclick = ()=>{

    tool = "draw";

    drawBtn.classList.add("active");

    eraseBtn.classList.remove("active");

};

eraseBtn.onclick = ()=>{

    tool = "erase";

    eraseBtn.classList.add("active");

    drawBtn.classList.remove("active");

};

/* ================= DOT GRID ================= */

const grid = document.getElementById("grid");

for(let i=0;i<100;i++){

    const dot = document.createElement("div");

    dot.className = "dot";

    dot.addEventListener("pointerdown",(e)=>{

        e.stopPropagation();

        dot.classList.toggle("active");

    });

    grid.appendChild(dot);

}

/* ================= CANVASES ================= */

const mainCanvas = document.getElementById("mainCanvas");

const rightCanvas = document.getElementById("rightCanvas");

const bottomCanvas = document.getElementById("bottomCanvas");

const mainCtx = mainCanvas.getContext("2d");

const rightCtx = rightCanvas.getContext("2d");

const bottomCtx = bottomCanvas.getContext("2d");

const board = document.getElementById("board");

const rightPanel = document.getElementById("rightPanel");

const bottomPanel = document.getElementById("bottomPanel");

/* ================= DRAW STORAGE ================= */

const drawings = {

    main: [],

    right: [],

    bottom: []

};

/* ================= RESIZE ================= */

function resizeCanvases(){

    mainCanvas.width = board.offsetWidth;

    mainCanvas.height = board.offsetHeight;

    rightCanvas.width = rightPanel.offsetWidth - 20;

    rightCanvas.height = rightPanel.offsetHeight;

    bottomCanvas.width = bottomPanel.offsetWidth;

    bottomCanvas.height = bottomPanel.offsetHeight - 20;

    redrawCanvas(mainCtx, drawings.main);

    redrawCanvas(rightCtx, drawings.right);

    redrawCanvas(bottomCtx, drawings.bottom);

}

window.addEventListener("resize", resizeCanvases);

/* ================= REDRAW ================= */

function redrawCanvas(ctx, paths){

    ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);

    paths.forEach(path=>{

        if(path.points.length < 2) return;

        ctx.beginPath();

        ctx.lineWidth = path.erase ? 20 : 3;

        ctx.lineCap = "round";

        if(path.erase){

            ctx.globalCompositeOperation = "destination-out";

        }

        else{

            ctx.globalCompositeOperation = "source-over";

            ctx.strokeStyle = "#ef4444";

        }

        ctx.moveTo(path.points[0].x, path.points[0].y);

        for(let i=1;i<path.points.length;i++){

            ctx.lineTo(path.points[i].x, path.points[i].y);

        }

        ctx.stroke();

    });

    ctx.globalCompositeOperation = "source-over";

}

/* ================= DRAWING ================= */

function enableDrawing(canvas, ctx, storage){

    let drawing = false;

    let currentPath = null;

    canvas.addEventListener("pointerdown",(e)=>{

        drawing = true;

        currentPath = {

            erase: tool === "erase",

            points:[]

        };

        currentPath.points.push({

            x:e.offsetX,

            y:e.offsetY

        });

        storage.push(currentPath);

    });

    canvas.addEventListener("pointermove",(e)=>{

        if(!drawing) return;

        currentPath.points.push({

            x:e.offsetX,

            y:e.offsetY

        });

        redrawCanvas(ctx, storage);

    });

    window.addEventListener("pointerup",()=>{

        drawing = false;

    });

}

/* ENABLE */

enableDrawing(mainCanvas, mainCtx, drawings.main);

enableDrawing(rightCanvas, rightCtx, drawings.right);

enableDrawing(bottomCanvas, bottomCtx, drawings.bottom);

/* ================= CLEAR ================= */

clearBtn.onclick = ()=>{

    drawings.main = [];

    drawings.right = [];

    drawings.bottom = [];

    mainCtx.clearRect(0,0,mainCanvas.width,mainCanvas.height);

    rightCtx.clearRect(0,0,rightCanvas.width,rightCanvas.height);

    bottomCtx.clearRect(0,0,bottomCanvas.width,bottomCanvas.height);

    document.querySelectorAll(".dot").forEach(dot=>{

        dot.classList.remove("active");

    });

};

/* ================= FIRST RESIZE ================= */

resizeCanvases();

/* ================= RIGHT RESIZE ================= */

const maskRight = document.getElementById("maskRight");

let dragRight = false;

let startX = 0;

let startWidth = 0;

maskRight.addEventListener("pointerdown",(e)=>{

    dragRight = true;

    startX = e.clientX;

    startWidth = rightPanel.offsetWidth;

    maskRight.setPointerCapture(e.pointerId);

});

/* ================= BOTTOM RESIZE ================= */

const maskBottom = document.getElementById("maskBottom");

let dragBottom = false;

let startY = 0;

let startHeight = 0;

maskBottom.addEventListener("pointerdown",(e)=>{

    dragBottom = true;

    startY = e.clientY;

    startHeight = bottomPanel.offsetHeight;

    maskBottom.setPointerCapture(e.pointerId);

});

/* ================= MOVE ================= */

window.addEventListener("pointermove",(e)=>{

    if(dragRight){

        let newWidth =

            startWidth - (e.clientX - startX);

        newWidth = Math.max(80,newWidth);

        rightPanel.style.width =

            newWidth + "px";

        resizeCanvases();

    }

    if(dragBottom){

        let newHeight =

            startHeight - (e.clientY - startY);

        newHeight = Math.max(80,newHeight);

        bottomPanel.style.height =

            newHeight + "px";

        resizeCanvases();

    }

});

/* ================= END DRAG ================= */

window.addEventListener("pointerup",()=>{

    dragRight = false;

    dragBottom = false;

});

</script>

</body>

</html>
