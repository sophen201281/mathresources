<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Drawing + Eraser + Clear</title>
    <style>
        /* ================= RESET ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #eef2f7;
            font-family: Arial;
        }

        /* ================= TOOLBAR — BOTTOM, SINGLE ROW ================= */
        .toolbar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;

            display: flex;
            flex-wrap: nowrap;
            /* force single row */
            align-items: center;
            gap: 6px;

            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            padding: 8px 14px;
            border-radius: 60px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.20);

            pointer-events: auto;
            max-width: 95vw;
            overflow-x: auto;
            /* safe fallback, but we try to avoid scroll */
        }

        .tool-btn {
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            background: transparent;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
            color: #1e293b;
            white-space: nowrap;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 1;
            /* allow shrinking if needed */
            min-width: 0;
        }

        .tool-btn:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        .tool-btn.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .tool-btn.home-link {
            background: #f1f5f9;
            padding: 6px 12px;
        }

        .tool-btn.home-link:hover {
            background: #e2e8f0;
        }

        /* ================= CENTER ================= */
        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ================= BOARD ================= */
        .board {
            position: relative;
            width: min(92vw, 520px);
            height: min(92vw, 520px);
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* ================= MAIN CANVAS ================= */
        #mainCanvas {
            position: absolute;
            inset: 0;
            z-index: 1;
            touch-action: none;
        }

        /* ================= GRID ================= */
        .grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(9, 1fr) 22px;
            grid-template-rows: repeat(9, 1fr) 22px;
            z-index: 2;
        }

        .dot {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dot::before {
            content: "";
            width: 55%;
            height: 55%;
            border-radius: 50%;
            background: white;
            border: 1px solid #cbd5e1;
        }

        .dot.active::before {
            background: #2563eb;
            border-color: #2563eb;
        }

        .dot.handle-gap {
            pointer-events: none;
        }

        .dot.handle-gap::before {
            opacity: 0;
        }

        /* ================= RIGHT PANEL ================= */
        .right-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 100%;
            background: white;
            border-left: 2px solid #d1d5db;
            z-index: 10;
        }

        .mask-right {
            position: absolute;
            top: 0;
            left: 0;
            width: 22px;
            height: 100%;
            background: #f8fafc;
            border-right: 2px solid #cbd5e1;
            cursor: ew-resize;
            z-index: 12;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mask-right::after {
            content: "";
            width: 6px;
            height: 60px;
            border-radius: 999px;
            background: #94a3b8;
        }

        #rightCanvas {
            position: absolute;
            inset: 0 0 0 22px;
            width: calc(100% - 22px);
            height: 100%;
            touch-action: none;
        }

        /* ================= BOTTOM PANEL ================= */
        .bottom-panel {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: white;
            border-top: 2px solid #d1d5db;
            z-index: 10;
        }

        .mask-bottom {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 22px;
            background: #f8fafc;
            border-bottom: 2px solid #cbd5e1;
            cursor: ns-resize;
            z-index: 12;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mask-bottom::after {
            content: "";
            width: 60px;
            height: 6px;
            border-radius: 999px;
            background: #94a3b8;
        }

        #bottomCanvas {
            position: absolute;
            inset: 22px 0 0 0;
            width: 100%;
            height: calc(100% - 22px);
            touch-action: none;
        }

        /* ================= RESPONSIVE — keep single row ================= */
        @media (max-width: 480px) {
            .toolbar {
                gap: 4px;
                padding: 6px 10px;
                bottom: 16px;
                border-radius: 40px;
            }

            .tool-btn {
                font-size: 11px;
                padding: 4px 8px;
            }

            .tool-btn.home-link {
                padding: 4px 8px;
            }
        }

        @media (max-width: 380px) {
            .tool-btn {
                font-size: 9px;
                padding: 3px 6px;
            }

            .toolbar {
                gap: 2px;
                padding: 4px 6px;
            }
        }

        /* prevent horizontal scroll on very tiny screens */
        .toolbar::-webkit-scrollbar {
            display: none;
        }
        .toolbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body>

    <!-- ===== TOOLBAR AT BOTTOM — SINGLE ROW ===== -->
    <div class="toolbar">
        <button class="tool-btn active" id="drawBtn">✏️ សរសេរ</button>
        <button class="tool-btn" id="eraseBtn">🧹 ជ័រលុប</button>
        <button class="tool-btn" id="clearBtn">🗑️ សម្អាត</button>
        <a href="../index.html" class="tool-btn home-link">🏡 Home</a>
    </div>

    <!-- ===== BOARD ===== -->
    <div class="wrapper">
        <div class="board" id="board">

            <canvas id="mainCanvas"></canvas>

            <div class="grid" id="grid"></div>

            <div class="right-panel" id="rightPanel">
                <div class="mask-right" id="maskRight"></div>
                <canvas id="rightCanvas"></canvas>
            </div>

            <div class="bottom-panel" id="bottomPanel">
                <div class="mask-bottom" id="maskBottom"></div>
                <canvas id="bottomCanvas"></canvas>
            </div>

        </div>
    </div>

    <script>
        /* ================= TOOL MODE ================= */
        let tool = "draw";

        const drawBtn = document.getElementById("drawBtn");
        const eraseBtn = document.getElementById("eraseBtn");
        const clearBtn = document.getElementById("clearBtn");

        drawBtn.onclick = () => {
            tool = "draw";
            drawBtn.classList.add("active");
            eraseBtn.classList.remove("active");
        };

        eraseBtn.onclick = () => {
            tool = "erase";
            eraseBtn.classList.add("active");
            drawBtn.classList.remove("active");
        };

        /* ================= DOT GRID ================= */
        const grid = document.getElementById("grid");

        for (let row = 0; row < 10; row++) {
            for (let col = 0; col < 10; col++) {
                const dot = document.createElement("div");
                dot.className = "dot";
                if (col === 9 || row === 9) {
                    dot.classList.add("handle-gap");
                }
                dot.addEventListener("pointerdown", (e) => {
                    if (dot.classList.contains("handle-gap")) return;
                    e.stopPropagation();
                    dot.classList.toggle("active");
                });
                grid.appendChild(dot);
            }
        }

        /* ================= CANVASES ================= */
        const mainCanvas = document.getElementById("mainCanvas");
        const rightCanvas = document.getElementById("rightCanvas");
        const bottomCanvas = document.getElementById("bottomCanvas");

        const mainCtx = mainCanvas.getContext("2d");
        const rightCtx = rightCanvas.getContext("2d");
        const bottomCtx = bottomCanvas.getContext("2d");

        const board = document.getElementById("board");
        const rightPanel = document.getElementById("rightPanel");
        const bottomPanel = document.getElementById("bottomPanel");

        /* ================= DRAW STORAGE ================= */
        let drawings = {
            main: [],
            right: [],
            bottom: []
        };

        /* ================= RESIZE ================= */
        function resizeCanvases() {
            mainCanvas.width = board.offsetWidth;
            mainCanvas.height = board.offsetHeight;

            rightCanvas.width = rightPanel.offsetWidth - 22;
            rightCanvas.height = rightPanel.offsetHeight;

            bottomCanvas.width = bottomPanel.offsetWidth;
            bottomCanvas.height = bottomPanel.offsetHeight - 22;

            redrawCanvas(mainCtx, drawings.main);
            redrawCanvas(rightCtx, drawings.right);
            redrawCanvas(bottomCtx, drawings.bottom);
        }

        window.addEventListener("resize", resizeCanvases);

        /* ================= REDRAW ================= */
        function redrawCanvas(ctx, paths) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            paths.forEach(path => {
                if (path.points.length < 2) return;
                ctx.beginPath();
                ctx.lineWidth = path.erase ? 20 : 3;
                ctx.lineCap = "round";

                if (path.erase) {
                    ctx.globalCompositeOperation = "destination-out";
                } else {
                    ctx.globalCompositeOperation = "source-over";
                    ctx.strokeStyle = "#ef4444";
                }

                ctx.moveTo(path.points[0].x, path.points[0].y);
                for (let i = 1; i < path.points.length; i++) {
                    ctx.lineTo(path.points[i].x, path.points[i].y);
                }
                ctx.stroke();
            });

            ctx.globalCompositeOperation = "source-over";
        }

        /* ================= ENABLE DRAWING ================= */
        function enableDrawing(canvas, ctx, storage) {
            let drawing = false;
            let currentPath = null;

            canvas.addEventListener("pointerdown", (e) => {
                drawing = true;
                currentPath = {
                    erase: tool === "erase",
                    points: []
                };
                currentPath.points.push({
                    x: e.offsetX,
                    y: e.offsetY
                });
                storage.push(currentPath);
            });

            canvas.addEventListener("pointermove", (e) => {
                if (!drawing) return;
                currentPath.points.push({
                    x: e.offsetX,
                    y: e.offsetY
                });
                redrawCanvas(ctx, storage);
            });

            window.addEventListener("pointerup", () => {
                drawing = false;
            });
        }

        enableDrawing(mainCanvas, mainCtx, drawings.main);
        enableDrawing(rightCanvas, rightCtx, drawings.right);
        enableDrawing(bottomCanvas, bottomCtx, drawings.bottom);

        /* ================= CLEAR — only drawings, keep dots ================= */
        clearBtn.onclick = () => {
            // Clear arrays in place (keep the same references)
            drawings.main.length = 0;
            drawings.right.length = 0;
            drawings.bottom.length = 0;

            // Clear all canvases
            mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            rightCtx.clearRect(0, 0, rightCanvas.width, rightCanvas.height);
            bottomCtx.clearRect(0, 0, bottomCanvas.width, bottomCanvas.height);

            // Dots are untouched
        };

        /* ================= FIRST RESIZE ================= */
        resizeCanvases();

        /* ================= RESIZE HANDLES ================= */
        const maskRight = document.getElementById("maskRight");
        let dragRight = false;
        let startX = 0;
        let startWidth = 0;

        maskRight.addEventListener("pointerdown", (e) => {
            dragRight = true;
            startX = e.clientX;
            startWidth = rightPanel.offsetWidth;
            maskRight.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        const maskBottom = document.getElementById("maskBottom");
        let dragBottom = false;
        let startY = 0;
        let startHeight = 0;

        maskBottom.addEventListener("pointerdown", (e) => {
            dragBottom = true;
            startY = e.clientY;
            startHeight = bottomPanel.offsetHeight;
            maskBottom.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        window.addEventListener("pointermove", (e) => {
            if (dragRight) {
                let dx = e.clientX - startX;
                let newWidth = startWidth - dx;
                const maxWidth = board.offsetWidth - 40;
                newWidth = clamp(newWidth, 70, maxWidth);
                rightPanel.style.width = newWidth + "px";
                resizeCanvases();
            }

            if (dragBottom) {
                let dy = e.clientY - startY;
                let newHeight = startHeight - dy;
                const maxHeight = board.offsetHeight - 40;
                newHeight = clamp(newHeight, 70, maxHeight);
                bottomPanel.style.height = newHeight + "px";
                resizeCanvases();
            }
        }, { passive: false });

        function stopDragging() {
            dragRight = false;
            dragBottom = false;
        }
        window.addEventListener("pointerup", stopDragging);
        window.addEventListener("pointercancel", stopDragging);
    </script>

</body>

</html>
