<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>360° Analog Weight Scale</title>

<style>

body{

    margin:0;

    background:#eef2f7;

    font-family:Arial,sans-serif;

    overflow:hidden;

    touch-action:none;

}

h2{

    text-align:center;

    margin:10px;

}

#workspace{

    width:100vw;

    height:100vh;

    position:relative;

}

/* DRAWING CANVAS */

#drawCanvas{

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:100%;

    z-index:1;

    touch-action:none;

}

/* DRAW BUTTONS */

.draw-tools{

    position:absolute;

    bottom:20px;

    left:20px;

    display:flex;

    gap:10px;

    z-index:200;

}

.draw-tools button{

    padding:10px 14px;

    border:none;

    border-radius:10px;

    background:white;

    font-weight:bold;

    box-shadow:0 2px 5px rgba(0,0,0,.2);

}

/* TOOLBOX */

.toolbox{

    position:absolute;

    top:10px;

    left:10px;

    display:flex;

    gap:12px;

    z-index:100;

}

.template{

    width:60px;

    height:60px;

    background:white;

    border:2px solid #bbb;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    overflow:hidden;

}

.template img{

    width:80%;

    height:80%;

    object-fit:contain;

    pointer-events:none;

}

/* HOME */

.home-btn{

    position:absolute;

    top:10px;

    right:10px;

    padding:10px 20px;

    background:white;

    border:2px solid #bbb;

    border-radius:14px;

    text-decoration:none;

    color:#333;

    font-size:18px;

    z-index:100;

}

/* ITEMS */

.item{

    position:absolute;

    width:150px;

    height:150px;

    display:flex;

    align-items:center;

    justify-content:center;

    touch-action:none;

    z-index:30;

}

.item img{

    width:100%;

    height:100%;

    object-fit:contain;

    pointer-events:none;

}

/* SCALE */

.scale{

    position:absolute;

    left:50%;

    bottom:70px;

    transform:translateX(-50%);

    width:420px;

    height:470px;

    z-index:20;

}

.tray{

    position:absolute;

    top:0;

    left:50%;

    transform:translateX(-50%);

    width:300px;

    height:50px;

    background:white;

    border:10px solid #444;

    border-radius:12px;

}

.stand{

    position:absolute;

    top:60px;

    left:50%;

    transform:translateX(-50%);

    width:18px;

    height:90px;

    background:#777;

}

.dial{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:320px;

    height:320px;

    border-radius:50%;

    background:white;

    border:10px solid #444;

}

.number{

    position:absolute;

    left:50%;

    top:50%;

    width:40px;

    height:40px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:32px;

    font-weight:bold;

}

.tick{

    position:absolute;

    left:50%;

    top:50%;

    width:4px;

    height:16px;

    background:#555;

}

.needle{

    position:absolute;

    left:50%;

    top:50%;

    width:6px;

    height:100px;

    background:red;

    transform-origin:bottom center;

    transform:translate(-50%,-100%) rotate(0deg);

    border-radius:10px;

}

.center{

    position:absolute;

    width:18px;

    height:18px;

    background:#222;

    border-radius:50%;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

}

.display{

    position:absolute;

    width:100%;

    bottom:80px;

    text-align:center;

    font-size:26px;

    font-weight:bold;

}

</style>

</head>

<body>

<div id="workspace">

<canvas id="drawCanvas"></canvas>

<div class="draw-tools">

<button id="penBtn">✏️</button>

<button id="eraserBtn">🧽</button>

<button id="clearBtn">🗑</button>

</div>

<div class="toolbox">

<div class="template" data-weight="1" data-img="./image/Apple.svg">

<img src="./image/Apple.svg">

</div>

<div class="template" data-weight="2" data-img="./image/chicken.svg">

<img src="./image/chicken.svg">

</div>

<div class="template" data-weight="1" data-img="./image/fish.svg">

<img src="./image/fish.svg">

</div>

<div class="template" data-weight="4" data-img="./image/pumpkin.svg">

<img src="./image/pumpkin.svg">

</div>

</div>

<a href="../index.html" class="home-btn">🏡 Home</a>

<div class="scale">

<div class="tray" id="tray"></div>

<div class="stand"></div>

<div class="dial" id="dial">

<div class="needle" id="needle"></div>

<div class="center"></div>

<div class="display" id="display">

0 kg

</div>

</div>

</div>

</div>

<script>

const dial=document.getElementById("dial");

const needle=document.getElementById("needle");

const display=document.getElementById("display");

const tray=document.getElementById("tray");

const workspace=document.getElementById("workspace");

let totalWeight=0;

/* SCALE */

for(let i=0;i<=10;i++){

const angle=(360/10)*i;

const tick=document.createElement("div");

tick.className="tick";

tick.style.transform=

`translate(-50%,-50%)

rotate(${angle}deg)

translateY(-142px)`;

dial.appendChild(tick);

const num=document.createElement("div");

num.className="number";

num.innerText=i;

let r=110;

if(i===10){

r-=28;

num.style.fontSize="22px";

}

const x=Math.cos((angle-90)*Math.PI/180)*r;

const y=Math.sin((angle-90)*Math.PI/180)*r;

num.style.transform=

`translate(-50%,-50%)

translate(${x}px,${y}px)`;

dial.appendChild(num);

}

function updateScale(){

let value=Math.min(

10,

Math.max(0,totalWeight)

);

display.innerText=value+" kg";

let angle=(value/10)*360;

needle.style.transform=

`translate(-50%,-100%)

rotate(${angle}deg)`;

}

/* CREATE OBJECTS */

document.querySelectorAll(".template")

.forEach(template=>{

template.addEventListener(

"pointerdown",

e=>{

const item=document.createElement("div");

item.className="item";

item.innerHTML=

`<img src="${template.dataset.img}">`;

item.dataset.weight=

template.dataset.weight;

item.style.left=

e.pageX-75+"px";

item.style.top=

e.pageY-75+"px";

workspace.appendChild(item);

dragItem(item,e,75,75);

});

});

/* DRAG */

function dragItem(

el,

startEvent,

offsetX,

offsetY

){

function move(e){

el.style.left=

e.pageX-offsetX+"px";

el.style.top=

e.pageY-offsetY+"px";

}

function up(){

document.removeEventListener(

"pointermove",

move

);

document.removeEventListener(

"pointerup",

up

);

const trayRect=

tray.getBoundingClientRect();

const rect=

el.getBoundingClientRect();

const inside=

rect.left+75>trayRect.left &&

rect.left+75<trayRect.right &&

rect.top+75<trayRect.bottom+80;

if(inside){

if(el.dataset.onTray!=="true"){

totalWeight+=

Number(el.dataset.weight);

el.dataset.onTray="true";

updateScale();

}

}else{

if(el.dataset.onTray==="true"){

totalWeight-=

Number(el.dataset.weight);

updateScale();

}

el.remove();

}

el.addEventListener(

"pointerdown",

ev=>{

if(el.dataset.onTray==="true"){

totalWeight-=

Number(el.dataset.weight);

updateScale();

}

dragItem(el,ev,75,75);

}

);

}

document.addEventListener(

"pointermove",

move

);

document.addEventListener(

"pointerup",

up

);

}

/* DRAWING */

const canvas=

document.getElementById("drawCanvas");

const ctx=

canvas.getContext("2d");

let drawing=false;

let erase=false;

function resizeCanvas(){

canvas.width=

window.innerWidth;

canvas.height=

window.innerHeight;

}

resizeCanvas();

window.addEventListener(

"resize",

resizeCanvas

);

function startDraw(e){

if(

e.target.closest(".template") ||

e.target.closest(".item") ||

e.target.closest(".scale") ||

e.target.closest(".draw-tools") ||

e.target.closest(".home-btn")

)return;

drawing=true;

ctx.beginPath();

ctx.moveTo(

e.pageX,

e.pageY

);

}

function draw(e){

if(!drawing)return;

ctx.globalCompositeOperation=

erase

? "destination-out"

: "source-over";

ctx.lineWidth=

erase ? 24 : 4;

ctx.lineCap="round";

ctx.lineTo(

e.pageX,

e.pageY

);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(

e.pageX,

e.pageY

);

}

function stop(){

drawing=false;

ctx.beginPath();

}

canvas.addEventListener(

"pointerdown",

startDraw

);

canvas.addEventListener(

"pointermove",

draw

);

canvas.addEventListener(

"pointerup",

stop

);

canvas.addEventListener(

"pointerleave",

stop

);

penBtn.onclick=()=>erase=false;

eraserBtn.onclick=()=>erase=true;

clearBtn.onclick=()=>{

ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);

};

updateScale();

</script>

</body>

</html>
