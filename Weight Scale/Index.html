<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kitchen Weight Scale</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
    user-select:none;
}

/* ───────── FIX: FULL SCREEN FIT ───────── */
html,body{
    height:100%;
    overflow:hidden; /* 🚫 NO SCROLL */
}

/* ───────── BODY LAYOUT ───────── */
body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;

    background:#f5f3f0;
    font-family:Arial,sans-serif;

    padding:clamp(6px,1.5vh,12px) 12px;
    gap:clamp(4px,1vh,10px);
}

/* ───────── TITLE ───────── */
h1{
    margin-bottom:0;
    font-weight:300;
    letter-spacing:2px;
    font-size:clamp(16px,2.2vw,24px);
}

/* ───────── SCALE GROUP ───────── */
.scale-group{
    position:relative;
    width:min(92vw,500px);

    /* FIX: prevent overflow height */
    height:clamp(280px,55vh,420px);

    background-image:url("image/background.png");
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
}

/* ───────── TRAY ───────── */
.tray{
    width:70%;
    height:clamp(44px,6vh,70px);

    margin-top:clamp(6px,1.2vh,12px);

    padding:4px 8px;
    border:3px dashed #aaa;
    border-radius:40px;

    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(4px);

    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:3px;

    flex-shrink:0;
}

/* ───────── STEM ───────── */
.stem{
    width:16px;
    height:clamp(18px,3vh,30px);
}

/* ───────── SCALE FACE ───────── */
.scale-face{
    position:relative;

    width:clamp(160px,55vw,280px);
    aspect-ratio:1;

    border-radius:50%;
    background:white;
    border:clamp(6px,1.5vw,12px) solid #d0d0d0;

    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);

    /* FIX: responsive spacing */
    margin-top:clamp(10px,3vh,40px);
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

/* ───────── ITEMS ───────── */
.items{
    display:flex;
    gap:clamp(8px,2vw,14px);

    margin-top:0;

    flex-wrap:wrap;
    justify-content:center;

    min-height:clamp(50px,10vh,68px);

    padding:clamp(6px,1.5vh,8px) 16px;

    background:rgba(255,255,255,0.5);
    border-radius:30px;
    border:2px dashed #ccc;

    max-width:95vw;
}

/* ───────── ITEM ───────── */
.item{
    width:clamp(44px,7vw,62px);
    height:clamp(44px,7vw,62px);

    cursor:grab;
    display:flex;
    align-items:center;
    justify-content:center;

    background:white;
    border-radius:14px;
    box-shadow:0 4px 8px rgba(0,0,0,0.08);

    transition:transform 0.2s, opacity 0.2s, box-shadow 0.2s;
    flex-shrink:0;
}

.item img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:5px;
}

/* dragging */
.item.dragging{
    opacity:0.6;
    transform:scale(1.1);
    z-index:9999;
}

/* in tray */
.item.in-tray{
    transform:scale(0.6);
    width:clamp(40px,6vw,52px);
    height:clamp(40px,6vw,52px);
}

/* ───────── RESET BUTTON ───────── */
.reset-btn{
    margin-top:0;

    padding:clamp(6px,1.5vh,8px) clamp(18px,4vw,24px);

    border:none;
    border-radius:40px;
    background:#e0d6c8;

    font-size:clamp(13px,2vw,15px);
}

/* ───────── WEIGHT DISPLAY ───────── */
.weight-display{
    margin-top:0;

    font-size:clamp(14px,2vw,18px);
    font-weight:600;

    color:#333;

    background:rgba(255,255,255,0.7);
    padding:4px 18px;
    border-radius:30px;
}

.weight-display span{
    color:#d32f2f;
    font-size:clamp(18px,3vw,24px);
}

/* ───────── MOBILE TWEAK ───────── */
@media (max-width:480px){

    .scale-group{
        height:clamp(260px,50vh,360px);
    }

    .tray{
        height:50px;
    }

    .items{
        gap:8px;
        padding:6px 10px;
    }
}
</style>
</head>

<body>

<h1>⚖️ Kitchen Scale</h1>

<div class="scale-group">
    <div class="tray" id="tray"></div>
    <div class="stem"></div>
    <div class="scale-face">
        <canvas id="scaleCanvas"></canvas>
    </div>
</div>

<div class="weight-display">
    Total: <span id="weightValue">0</span> g
</div>

<div class="items" id="itemsContainer">
    <div class="item" data-weight="1"><img src="image/apple.png"></div>
    <div class="item" data-weight="2"><img src="image/orange.png"></div>
    <div class="item" data-weight="3"><img src="image/pumpkin.png"></div>
    <div class="item" data-weight="4"><img src="image/coconut.png"></div>
    <div class="item" data-weight="5"><img src="image/watermelon.png"></div>
    <div class="item" data-weight="6"><img src="image/grapes.png"></div>
</div>

<button class="reset-btn" id="resetBtn">⟳ Reset Scale</button>

<script>
/* ───────── YOUR JS UNCHANGED ───────── */
(function() {
const tray = document.getElementById('tray');
const itemsContainer = document.getElementById('itemsContainer');
const canvas = document.getElementById('scaleCanvas');
const ctx = canvas.getContext('2d');
const resetBtn = document.getElementById('resetBtn');
const weightDisplay = document.getElementById('weightValue');

let totalWeight = 0;

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    drawScale();
}

function drawScale() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const cx = w / 2;
    const cy = h / 2;
    const radius = w * 0.42;

    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i <= 100; i++) {
        const value = i / 10;
        const angle = (-90 + value * 36) * Math.PI / 180;
        const isMainTick = i % 10 === 0;

        const outerRadius = radius - 2;
        let innerRadius = isMainTick ? radius - 16 : radius - 11;

        const x1 = cx + Math.cos(angle) * outerRadius;
        const y1 = cy + Math.sin(angle) * outerRadius;
        const x2 = cx + Math.cos(angle) * innerRadius;
        const y2 = cy + Math.sin(angle) * innerRadius;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = isMainTick ? 4 : 2;
        ctx.stroke();

        if (isMainTick) {
            const tx = cx + Math.cos(angle) * (radius - 26);
            const ty = cy + Math.sin(angle) * (radius - 26);
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(value, tx, ty);
        }
    }

    const pointerAngle = totalWeight * 36 * Math.PI / 180;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(pointerAngle);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -(radius - 36));
    ctx.strokeStyle = '#b71c1c';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.restore();

    weightDisplay.textContent = totalWeight;
}

/* unchanged drag logic */
let current = null;
let offsetX = 0;
let offsetY = 0;

document.addEventListener('pointerdown', (e) => {
    const item = e.target.closest('.item');
    if (!item || current) return;

    current = item;
    const rect = item.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    item.classList.add('dragging');
    item.style.position = 'fixed';
    item.style.left = (e.clientX - offsetX) + 'px';
    item.style.top = (e.clientY - offsetY) + 'px';

    document.body.appendChild(item);
});

document.addEventListener('pointermove', (e) => {
    if (!current) return;
    current.style.left = (e.clientX - offsetX) + 'px';
    current.style.top = (e.clientY - offsetY) + 'px';
});

document.addEventListener('pointerup', (e) => {
    if (!current) return;

    const rect = tray.getBoundingClientRect();
    const inside =
        e.clientX > rect.left && e.clientX < rect.right &&
        e.clientY > rect.top && e.clientY < rect.bottom;

    const weight = Number(current.dataset.weight);

    if (inside) {
        tray.appendChild(current);
        current.classList.add('in-tray');
        totalWeight += weight;
    } else {
        itemsContainer.appendChild(current);
    }

    current.classList.remove('dragging');
    current.style.position = '';
    current = null;

    drawScale();
});

resetBtn.onclick = () => {
    [...tray.children].forEach(i => {
        i.classList.remove('in-tray');
        itemsContainer.appendChild(i);
    });
    totalWeight = 0;
    drawScale();
};

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
drawScale();

})();
</script>

</body>
</html>
