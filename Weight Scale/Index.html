<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>360° Analog Weight Scale</title>
<style>
    body{
        margin:0;
        background:#eef2f7;
        font-family:Arial,sans-serif;
        overflow:hidden;
        touch-action:none;
    }
    h2{
        text-align:center;
        margin:10px;
    }
    #workspace{
        width:100vw;
        height:100vh;
        position:relative;
    }
    /* ================= TOOLBOX ================= */
    .toolbox{
        position:absolute;
        top:10px;
        left:10px;
        display:flex;
        gap:12px;
        z-index:100;
    }
    .template{
        width:70px;
        height:70px;
        background:white;
        border:2px solid #bbb;
        border-radius:14px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:40px;
        user-select:none;
        cursor:pointer;
    }
    .item{
        position:absolute;
        width:70px;
        height:70px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:40px;
        user-select:none;
        touch-action:none;
    }
    /* ================= SCALE ================= */
    .scale{
        position:absolute;
        left:50%;
        bottom:20px;
        transform:translateX(-50%);
        width:420px;
        height:470px;
    }
    .tray{
        position:absolute;
        top:0;
        left:50%;
        transform:translateX(-50%);
        width:300px;
        height:50px;
        background:#666;
        border:10px solid #444;
        border-radius:12px;
    }
    .stand{
        position:absolute;
        top:38px;
        left:50%;
        transform:translateX(-50%);
        width:18px;
        height:80px;
        background:#777;
    }
    .dial{
        position:absolute;
        bottom:0;
        left:50%;
        transform:translateX(-50%);
        width:320px;
        height:320px;
        border-radius:50%;
        background:white;
        border:10px solid #444;
        box-shadow:0 5px 12px rgba(0,0,0,0.2);
    }
    .number{
        position:absolute;
        left:50%;
        top:50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size:24px;
        font-weight:bold;
        color:#333;
    }
    .tick{
        position:absolute;
        left:50%;
        top:50%;
        width:4px;
        height:16px;
        background:#555;
    }
    .needle{
        position:absolute;
        left:50%;
        top:50%;
        width:6px;
        height:120px;
        background:red;
        transform-origin:bottom center;
        transform:translate(-50%, -100%) rotate(0deg);
        border-radius:10px;
        z-index:5;
    }
    .center{
        position:absolute;
        width:18px;
        height:18px;
        background:#222;
        border-radius:50%;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        z-index:10;
    }
    .display{
        position:absolute;
        width:100%;
        text-align:center;
        bottom:100px; /* Shifted up slightly so numbers don't overlay the readout text */
        font-size:26px;
        font-weight:bold;
    }
</style>
</head>
<body>
<h2>⚖️ 360° Analog Weight Scale</h2>
<div id="workspace">
    <!-- TOOLBOX -->
    <div class="toolbox">
        <div class="template" data-weight="1" data-emoji="🍎">🍎</div>
        <div class="template" data-weight="2" data-emoji="🍌">🍌</div>
        <div class="template" data-weight="3" data-emoji="🐟">🐟</div>
        <div class="template" data-weight="4" data-emoji="🍉">🍉</div>
    </div>
    <!-- SCALE -->
    <div class="scale">
        <div class="tray" id="tray"></div>
        <div class="stand"></div>
        <div class="dial" id="dial">
            <div class="needle" id="needle"></div>
            <div class="center"></div>
            <div class="display" id="display">0 kg</div>
        </div>
    </div>
</div>
<script>
const dial = document.getElementById("dial");
const needle = document.getElementById("needle");
const display = document.getElementById("display");
const tray = document.getElementById("tray");
const workspace = document.getElementById("workspace");
let totalWeight = 0;

/* ================= CREATE SCALE NUMBERS & TICKS ================= */
// Changed loop to 0-9 to avoid rendering a duplicate "0" directly over itself at the top marker
for(let i=0; i<10; i++){
    const angle = (360/10) * i;
    
    // Ticks: Anchored at center, translated upwards along Y-axis, then rotated around center
    const tick = document.createElement("div");
    const tickRadius = 125; // Adjusted to sit cleanly inside the dial border
    tick.className = "tick";
    tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-${tickRadius}px)`;
    dial.appendChild(tick);

    // Numbers: Placed strictly on exact geometry paths around the center point
    const num = document.createElement("div");
    num.className = "number";
    num.innerText = i;
    const numRadius = 95; // Placed comfortably inside the tick marks
    const x = Math.cos((angle - 90) * Math.PI / 180) * numRadius;
    const y = Math.sin((angle - 90) * Math.PI / 180) * numRadius;
    
    // First center the element block on layout, then translate outward by X/Y coordinates
    num.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
    dial.appendChild(num);
}

/* ================= UPDATE SCALE ================= */
function updateScale(){
    display.innerText = totalWeight + " kg";
    let angle = (totalWeight / 10) * 360;
    needle.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
}

/* ================= CREATE ITEMS ================= */
document.querySelectorAll(".template").forEach(template=>{
    template.addEventListener("pointerdown", e=>{
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = template.dataset.emoji;
        item.dataset.weight = template.dataset.weight;
        item.style.left = e.pageX - 35 + "px";
        item.style.top = e.pageY - 35 + "px";
        workspace.appendChild(item);
        dragItem(item, e);
    });
});

/* ================= DRAGGING ================= */
function dragItem(el, startEvent){
    let offsetX = 35;
    let offsetY = 35;
    function move(e){
        el.style.left = (e.pageX - offsetX) + "px";
        el.style.top = (e.pageY - offsetY) + "px";
    }
    function up(){
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        const trayRect = tray.getBoundingClientRect();
        const rect = el.getBoundingClientRect();
        const centerX = rect.left + rect.width/2;
        const centerY = rect.top + rect.height/2;
        const insideTray =
            centerX > trayRect.left &&
            centerX < trayRect.right &&
            centerY > trayRect.top &&
            centerY < trayRect.bottom + 80;
        if(insideTray){
            if(el.dataset.onTray !== "true"){
                totalWeight += Number(el.dataset.weight);
                if(totalWeight > 10){
                    totalWeight = 10;
                }
                el.dataset.onTray = "true";
                updateScale();
            }
        }else{
            if(el.dataset.onTray === "true"){
                totalWeight -= Number(el.dataset.weight);
                if(totalWeight < 0){
                    totalWeight = 0;
                }
                updateScale();
            }
            el.remove();
        }
        el.addEventListener("pointerdown", startAgain);
    }
    function startAgain(ev){
        if(el.dataset.onTray === "true"){
            totalWeight -= Number(el.dataset.weight);
            if(totalWeight < 0){
                totalWeight = 0;
            }
            updateScale();
            el.dataset.onTray = "false";
        }
        dragItem(el, ev);
    }
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
}
updateScale();
</script>
</body>
</html>
