<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kitchen Weight Scale</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
    user-select:none;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:⁠transparent;
    font-family:Arial, sans-serif;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

/* =========================
   SCALE GROUP
========================= */

.scale-group{
    position:relative;
    width:min(90vw,500px);
    aspect-ratio:1/1.25;

    background-image:url("image/background.png");
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* =========================
   TRAY
========================= */

.tray{
    width:70%;
    height:90px;

    margin-top:20px;

    border:4px solid #555;
    border-radius:50px;

    background:transparent;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* stem connecting tray to face */
.stem{
    width:20px;
    height:60px;
    background:#666;
}

/* =========================
   SCALE FACE
========================= */

.scale-face{
    position:relative;

    width:80%;
    aspect-ratio:1;

    border-radius:50%;
    background:white;

    border:10px solid #444;
    overflow:hidden;
}

canvas{
    width:100%;
    height:100%;
}

/* =========================
   ITEMS AREA
========================= */

.items{
    display:flex;
    gap:15px;
    margin-top:30px;
    flex-wrap:wrap;
    justify-content:center;
}

.item{
    width:70px;
    height:70px;
    cursor:grab;
    position:relative;
}

.item img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

.item.dragging{
    opacity:.7;
}
</style>
</head>
<body>

<h1>⚖️ Kitchen Scale</h1>

<div class="scale-group">

    <div class="tray" id="tray"></div>

    <div class="stem"></div>

    <div class="scale-face">
        <canvas id="scaleCanvas"></canvas>
    </div>

</div>

<div class="items">

    <div class="item" data-weight="1">
        <img src="image/apple.png">
    </div>

    <div class="item" data-weight="2">
        <img src="image/orange.png">
    </div>

    <div class="item" data-weight="3">
        <img src="image/pumkin.png">
    </div>

    <div class="item" data-weight="4">
        <img src="image/coconut.png">
    </div>

</div>

<script>
const tray = document.getElementById("tray");
const canvas = document.getElementById("scaleCanvas");
const ctx = canvas.getContext("2d");

let totalWeight = 0;

function resizeCanvas(){
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    drawScale();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* =========================
   DRAW SCALE
========================= */

function drawScale(){

    const w = canvas.width;
    const h = canvas.height;

    const cx = w/2;
    const cy = h/2;

    const radius = w*0.42;

    ctx.clearRect(0,0,w,h);

    /* face */
    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();

    /* ticks + numbers */

    for(let i=0;i<=10;i++){

        const angle =
            (-90 + i*36) * Math.PI/180;

        const x1 =
            cx + Math.cos(angle)*(radius-15);

        const y1 =
            cy + Math.sin(angle)*(radius-15);

        const x2 =
            cx + Math.cos(angle)*(radius-30);

        const y2 =
            cy + Math.sin(angle)*(radius-30);

        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.strokeStyle="#000";
        ctx.lineWidth=3;
        ctx.stroke();

        const tx =
            cx + Math.cos(angle)*(radius-48);

        const ty =
            cy + Math.sin(angle)*(radius-48);

        ctx.font="bold 20px Arial";
        ctx.fillStyle="#000";
        ctx.textAlign="center";
        ctx.textBaseline="middle";

        ctx.fillText(i,tx,ty);
    }

    /* pointer */

    const pointerAngle =
        (-90 + (totalWeight*36))
        * Math.PI/180;

    ctx.save();

    ctx.translate(cx,cy);
    ctx.rotate(pointerAngle);

    ctx.beginPath();
    ctx.moveTo(-8,0);
    ctx.lineTo(0,-radius+60);
    ctx.lineTo(8,0);

    ctx.fillStyle="red";
    ctx.fill();

    ctx.restore();

    /* center cap */

    ctx.beginPath();
    ctx.arc(cx,cy,10,0,Math.PI*2);
    ctx.fillStyle="#333";
    ctx.fill();
}

/* =========================
   DRAGGING
========================= */

const items = document.querySelectorAll(".item");

let current = null;
let offsetX = 0;
let offsetY = 0;

items.forEach(item=>{

    item.addEventListener("pointerdown",(e)=>{

        current = item;

        item.classList.add("dragging");

        const rect = item.getBoundingClientRect();

        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        item.style.position="fixed";
        item.style.zIndex="9999";
    });

});

document.addEventListener("pointermove",(e)=>{

    if(!current) return;

    current.style.left =
        (e.clientX-offsetX)+"px";

    current.style.top =
        (e.clientY-offsetY)+"px";
});

document.addEventListener("pointerup",(e)=>{

    if(!current) return;

    const trayRect =
        tray.getBoundingClientRect();

    const inside =
        e.clientX > trayRect.left &&
        e.clientX < trayRect.right &&
        e.clientY > trayRect.top &&
        e.clientY < trayRect.bottom;

    const weight =
        Number(current.dataset.weight);

    if(inside){

        if(!current.inTray){

            totalWeight += weight;

            current.inTray = true;

            drawScale();
        }

    }else{

        if(current.inTray){

            totalWeight -= weight;

            current.inTray = false;

            drawScale();
        }
    }

    current.classList.remove("dragging");
    current = null;
});

/* initial */
drawScale();
</script>

</body>
</html>
