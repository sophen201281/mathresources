<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kitchen Weight Scale</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
    user-select:none;
}

html,body{
    height:100%;
    overflow:hidden;
}

body{
    min-height:100vh;
    display:flex;
    background:#f5f3f0;
    font-family:Arial,sans-serif;
    padding:10px;
    gap:10px;
}

/* LEFT PANEL */
.left-panel{
    width:clamp(120px,22vw,220px);
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
}

.items{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:10px;
    background:rgba(255,255,255,0.5);
    border-radius:20px;
    border:2px dashed #ccc;
    width:100%;
    align-items:center;
    max-height:70vh;
    overflow:hidden;
}

.item{
    width:clamp(44px,6vw,62px);
    height:clamp(44px,6vw,62px);
    display:flex;
    align-items:center;
    justify-content:center;
    background:white;
    border-radius:14px;
    box-shadow:0 4px 8px rgba(0,0,0,0.08);
    cursor:grab;
}

.item img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:5px;
}

.item.dragging{opacity:0.6;transform:scale(1.1);}
.item.in-tray{transform:scale(0.6);}

/* BUTTON */
.reset-btn{
    padding:8px 16px;
    border:none;
    border-radius:40px;
    background:#e0d6c8;
    width:100%;
}

/* CENTER */
.center-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

h1{
    margin-bottom:8px;
    font-weight:300;
}

/* SCALE GROUP */
.scale-group{
    position:relative;
    width:min(90vw,500px);
    aspect-ratio:1 / 1.2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

/* TRAY */
.tray{
    width:100%;
    height:70px;
    border-radius:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.tray-box{
    position:absolute;
    inset:0;
    background:url("image/tray.png") center/100% 100% no-repeat;
    z-index:5;
    pointer-events:none;
}

/* SCALE FACE (SMALLER RING) */
.scale-face{
    position:relative;
    width:100%;
    aspect-ratio:1;
    border-radius:5%;   /* fixed */
    overflow:hidden;

    background:url("image/background.png") center/100% 100% no-repeat;

    /* 🔽 smaller ring */
    border:6px solid transparent;

    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.face-box{
    position:absolute;
    inset:0;
    background:url("image/face-box.png") center/100% 100% no-repeat;
    z-index:2;
    pointer-events:none;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:3;
}

.weight-display{
    margin-top:8px;
    font-size:18px;
    font-weight:600;
}
</style>
</head>

<body>

<div class="left-panel">
    <div class="items" id="itemsContainer">
        <div class="item" data-weight="1"><img src="image/Apple.svg"></div>
        <div class="item" data-weight="2"><img src="image/orange.png"></div>
        <div class="item" data-weight="3"><img src="image/pumpkin.png"></div>
        <div class="item" data-weight="4"><img src="image/coconut.png"></div>
        <div class="item" data-weight="5"><img src="image/watermelon.png"></div>
    </div>

    <button class="reset-btn" id="resetBtn">Reset</button>
</div>

<div class="center-panel">

<h1></h1>

<div class="scale-group">

    <div class="tray" id="tray">
        <div class="tray-box"></div>
    </div>

    <div class="scale-face">
        <div class="face-box"></div>
        <canvas id="scaleCanvas"></canvas>
    </div>

</div>

<div class="weight-display">
Total: <span id="weightValue">0</span> គក
</div>

</div>

<script>
(function(){

const tray=document.getElementById("tray");
const itemsContainer=document.getElementById("itemsContainer");
const canvas=document.getElementById("scaleCanvas");
const ctx=canvas.getContext("2d");
const weightDisplay=document.getElementById("weightValue");

let totalWeight=0;
let current=null;
let offsetX=0;
let offsetY=0;

function resize(){
    const r=canvas.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    canvas.width=r.width*dpr;
    canvas.height=r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
}

function draw(){
    const w=canvas.clientWidth;
    const h=canvas.clientHeight;
    const cx=w/2;
    const cy=h/2;

    /* 🔽 smaller dial */
    const radius=Math.min(w,h)*0.40;

    ctx.clearRect(0,0,w,h);

    for(let i=0;i<=100;i++){
        const val=i/10;
        const angle=(-90+val*36)*Math.PI/180;
        const main=i%10===0;

        const r1=radius-2;
        const r2=main?radius-14:radius-10;

        const x1=cx+Math.cos(angle)*r1;
        const y1=cy+Math.sin(angle)*r1;
        const x2=cx+Math.cos(angle)*r2;
        const y2=cy+Math.sin(angle)*r2;

        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.strokeStyle="#222";
        ctx.lineWidth=main?3:1.5;
        ctx.stroke();

        if(main){
            const tx=cx+Math.cos(angle)*(radius-22);
            const ty=cy+Math.sin(angle)*(radius-22);
            ctx.font="bold 18px Arial";
            ctx.textAlign="center";
            ctx.textBaseline="middle";
            ctx.fillText(val,tx,ty);
        }
    }

    const angle=totalWeight*36*Math.PI/180;

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.moveTo(0,0);

    /* 🔽 shorter needle */
    ctx.lineTo(0,-(radius-30));

    ctx.strokeStyle="#b71c1c";
    ctx.lineWidth=4;
    ctx.stroke();

    ctx.restore();

    weightDisplay.textContent=totalWeight;
}

/* DRAG LOGIC (UNCHANGED) */
document.addEventListener("pointerdown",(e)=>{
    const item=e.target.closest(".item");
    if(!item||current)return;

    current=item;

    const r=item.getBoundingClientRect();
    offsetX=e.clientX-r.left;
    offsetY=e.clientY-r.top;

    item.classList.add("dragging");
    item.style.position="fixed";
    item.style.left=(e.clientX-offsetX)+"px";
    item.style.top=(e.clientY-offsetY)+"px";

    document.body.appendChild(item);
});

document.addEventListener("pointermove",(e)=>{
    if(!current)return;
    current.style.left=(e.clientX-offsetX)+"px";
    current.style.top=(e.clientY-offsetY)+"px";
});

document.addEventListener("pointerup",(e)=>{
    if(!current)return;

    const weight=+current.dataset.weight;
    const r=tray.getBoundingClientRect();

    const inside=
        e.clientX>=r.left&&
        e.clientX<=r.right&&
        e.clientY>=r.top&&
        e.clientY<=r.bottom;

    const wasInTray=current.classList.contains("in-tray");

    if(inside){
        if(!wasInTray){
            tray.appendChild(current);
            current.classList.add("in-tray");
            totalWeight+=weight;
        }
    }else{
        if(wasInTray){
            current.classList.remove("in-tray");
            totalWeight-=weight;
            if(totalWeight<0) totalWeight=0;
        }
        itemsContainer.appendChild(current);
    }

    current.style.position="";
    current.classList.remove("dragging");
    current=null;

    draw();
});

document.getElementById("resetBtn").onclick=()=>{
    [...tray.children].forEach(i=>{
        i.classList.remove("in-tray");
        itemsContainer.appendChild(i);
    });
    totalWeight=0;
    draw();
};

window.addEventListener("resize",resize);
resize();
draw();

})();
</script>

</body>
</html>
