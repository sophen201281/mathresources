<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Kitchen Weight Scale</title>

<style>

* {

    box-sizing: border-box;

    user-select: none;

    -webkit-tap-highlight-color: transparent;

}

/* 🌄 BACKGROUND IMAGE LAYER */

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: system-ui, -apple-system, Segoe UI, Roboto;

    padding: 12px;

    position: relative;

    background: linear-gradient(145deg, #f7f3ee, #e8e0d8);

}

/* Transparent image overlay behind everything */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background: url("image/background.jpg") center/cover no-repeat;

    opacity: 0.15;

    z-index: -1;

    pointer-events: none;

}

.app {

    width: 100%;

    max-width: 820px;

    background: #fffcf8;

    border-radius: 48px;

    box-shadow: 0 20px 50px rgba(0,0,0,0.15);

    padding: 18px;

}

.app-title {

    text-align: center;

    font-size: 20px;

    margin-bottom: 10px;

    color: #5a4e44;

}

.tray {

    margin-bottom: 12px;

    padding: 12px;

    border-radius: 40px;

    background: #eae2d8;

    border: 2px dashed #c7b9ab;

    min-height: 80px;

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

}

.tray-item {

    background: #fff;

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 14px;

    cursor: grab;

}

.scale-wrapper {

    display: flex;

    justify-content: center;

}

canvas {

    width: 100%;

    max-width: 420px;

    aspect-ratio: 1/1;

    border-radius: 50%;

    background: #fcf9f5;

}

.weight-display {

    text-align: center;

    margin: 10px 0;

    font-size: 18px;

}

.weight-display span {

    font-size: 28px;

    font-weight: bold;

    padding: 6px 16px;

    border-radius: 30px;

    background: #f0e9e1;

}

.items-grid {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));

    gap: 10px;

    margin-top: 12px;

}

.item-card {

    background: #fff;

    border-radius: 18px;

    padding: 10px;

    text-align: center;

    border: 1px solid #eee;

    cursor: pointer;

}

</style>

</head>

<body>

<div class="app">

    <div class="app-title">⚖️ Kitchen Scale</div>

    <div class="tray" id="tray"></div>

    <div class="scale-wrapper">

        <canvas id="scaleCanvas"></canvas>

    </div>

    <div class="weight-display">

        <span id="weightValue">0.0</span> kg

    </div>

    <div class="items-grid" id="itemsGrid"></div>

</div>

<script>

/* ---------------- DATA ---------------- */

const ITEMS = [

    { id:"pumpkin", name:"Pumpkin", weight:5, emoji:"🎃", image:"image/pumpkin.png" },

    { id:"chicken", name:"Chicken", weight:3, emoji:"🍗", image:"image/chicken.png" },

    { id:"fish", name:"Fish", weight:1, emoji:"🐟", image:"image/fish.png" },

    { id:"apple", name:"Apple", weight:0.5, emoji:"🍎", image:"image/apple.png" },

    { id:"watermelon", name:"Watermelon", weight:2, emoji:"🍉", image:"image/watermelon.png" }

];

const MAX_WEIGHT = 10;

/* ---------------- STATE ---------------- */

let trayItems = [];

let totalWeight = 0;

let displayWeight = 0;

/* ---------------- CANVAS ---------------- */

const canvas = document.getElementById("scaleCanvas");

const ctx = canvas.getContext("2d");

const dpr = window.devicePixelRatio || 1;

canvas.width = 420 * dpr;

canvas.height = 420 * dpr;

ctx.scale(dpr, dpr);

/* ---------------- UI ---------------- */

const weightValue = document.getElementById("weightValue");

const tray = document.getElementById("tray");

const grid = document.getElementById("itemsGrid");

/* ---------------- SCALE DRAW ---------------- */

function drawScale(w) {

    const cx = 210;

    const cy = 210;

    const outerR = 165;

    const innerR = 140;

    const labelR = 125;

    const faceR = 160;

    ctx.clearRect(0,0,420,420);

    ctx.beginPath();

    ctx.arc(cx, cy, faceR, 0, Math.PI * 2);

    ctx.fillStyle = "#f3ede6";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(cx, cy, outerR + 6, 0, Math.PI * 2);

    ctx.strokeStyle = "#c7b9ab";

    ctx.lineWidth = 3;

    ctx.stroke();

    const steps = 40;

    for (let i = 0; i <= steps; i++) {

        const value = (i / steps) * 10;

        const angle = -Math.PI/2 + (i / steps) * Math.PI * 2;

        const isMajor = i % 4 === 0;

        const r1 = isMajor ? outerR : outerR - 6;

        const x1 = cx + Math.cos(angle) * r1;

        const y1 = cy + Math.sin(angle) * r1;

        const x2 = cx + Math.cos(angle) * innerR;

        const y2 = cy + Math.sin(angle) * innerR;

        ctx.beginPath();

        ctx.moveTo(x1, y1);

        ctx.lineTo(x2, y2);

        ctx.strokeStyle = isMajor ? "#5a4e44" : "#9a8b7c";

        ctx.lineWidth = isMajor ? 2 : 1;

        ctx.stroke();

        if (isMajor) {

            const num = Math.round(value);

            const lx = cx + Math.cos(angle) * labelR;

            const ly = cy + Math.sin(angle) * labelR;

            ctx.fillStyle = "#3d322a";

            ctx.font = "bold 12px sans-serif";

            ctx.textAlign = "center";

            ctx.textBaseline = "middle";

            ctx.fillText(num, lx, ly);

        }

    }

    const angle = -Math.PI/2 + (w / 10) * Math.PI * 2;

    const nx = cx + Math.cos(angle) * 125;

    const ny = cy + Math.sin(angle) * 125;

    ctx.beginPath();

    ctx.moveTo(cx, cy);

    ctx.lineTo(nx, ny);

    ctx.strokeStyle = "red";

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.beginPath();

    ctx.arc(cx, cy, 6, 0, Math.PI * 2);

    ctx.fillStyle = "red";

    ctx.fill();

}

/* ---------------- ANIMATION ---------------- */

function animate(){

    displayWeight += (totalWeight - displayWeight)*0.08;

    if(displayWeight > MAX_WEIGHT) displayWeight = MAX_WEIGHT;

    weightValue.textContent = displayWeight.toFixed(1);

    drawScale(displayWeight);

    requestAnimationFrame(animate);

}

animate();

/* ---------------- UPDATE ---------------- */

function updateWeight(){

    totalWeight = trayItems.reduce((a,b)=>a+b.weight,0);

    if(totalWeight > MAX_WEIGHT) totalWeight = MAX_WEIGHT;

}

/* ---------------- TRAY ---------------- */

function renderTray(){

    tray.innerHTML = "";

    trayItems.forEach((item, index)=>{

        const el = document.createElement("div");

        el.className = "tray-item";

        el.textContent = `${item.emoji} ${item.name} ${item.weight}kg`;

        enableDrag(el, index);

        tray.appendChild(el);

    });

}

/* ---------------- REALISTIC DRAG ---------------- */

function enableDrag(el, index){

    let dragging = false;

    let ghost = null;

    let offsetX = 0;

    let offsetY = 0;

    el.addEventListener("pointerdown", (e)=>{

        dragging = true;

        el.setPointerCapture(e.pointerId);

        const rect = el.getBoundingClientRect();

        offsetX = e.clientX - rect.left;

        offsetY = e.clientY - rect.top;

        ghost = el.cloneNode(true);

        ghost.style.position = "fixed";

        ghost.style.left = rect.left + "px";

        ghost.style.top = rect.top + "px";

        ghost.style.width = rect.width + "px";

        ghost.style.pointerEvents = "none";

        ghost.style.opacity = "0.85";

        ghost.style.transform = "scale(1.1)";

        ghost.style.zIndex = "9999";

        document.body.appendChild(ghost);

        el.style.opacity = "0.2";

    });

    el.addEventListener("pointermove", (e)=>{

        if(!dragging || !ghost) return;

        ghost.style.left = (e.clientX - offsetX) + "px";

        ghost.style.top = (e.clientY - offsetY) + "px";

    });

    el.addEventListener("pointerup", (e)=>{

        dragging = false;

        if(ghost){

            ghost.remove();

            ghost = null;

        }

        el.style.opacity = "1";

        const rect = canvas.getBoundingClientRect();

        const inside =

            e.clientX >= rect.left &&

            e.clientX <= rect.right &&

            e.clientY >= rect.top &&

            e.clientY <= rect.bottom;

        if(inside){

            trayItems.splice(index, 1);

            updateWeight();

            renderTray();

        }

    });

}

/* ---------------- ITEMS GRID ---------------- */

function buildItems(){

    grid.innerHTML = "";

    ITEMS.forEach(item=>{

        const div = document.createElement("div");

        div.className = "item-card";

        div.innerHTML = `

            <img src="${item.image}" onerror="this.style.display='none'">

            <div>${item.name}</div>

            <small>${item.weight} kg</small>

        `;

        div.onclick = ()=>{

            if(trayItems.find(i=>i.id===item.id)) return;

            trayItems.push(item);

            updateWeight();

            renderTray();

        };

        grid.appendChild(div);

    });

}

/* ---------------- INIT ---------------- */

buildItems();

renderTray();

</script>

</body>

</html>
