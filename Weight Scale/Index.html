<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kitchen Weight Scale</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none;
            user-select: none;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            display: flex;
            background: #f5f3f0;
            font-family: Arial, sans-serif;
            padding: 10px;
            gap: 10px;
        }

        /* LEFT PANEL */
        .left-panel {
            width: clamp(100px, 20vw, 200px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            border: 2px dashed #ccc;
            width: 100%;
            align-items: center;
            max-height: 70vh;
            overflow: hidden;
        }

        .item {
            width: clamp(40px, 5.5vw, 56px);
            height: clamp(40px, 5.5vw, 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 14px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            cursor: grab;
            flex-shrink: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
        }

        .item.dragging {
            opacity: 0.6;
            transform: scale(1.1);
            z-index: 999;
            transition: none;
        }

        /* ── BIGGER when on the tray ── */
        .item.in-tray {
            transform: scale(3);
        }

        .reset-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 40px;
            background: #e0d6c8;
            width: 100%;
            font-size: clamp(14px, 1.2vw, 18px);
            cursor: pointer;
            transition: background 0.2s;
        }
        .reset-btn:hover {
            background: #d0c4b4;
        }
        .reset-btn:active {
            transform: scale(0.96);
        }

        /* CENTER */
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        h1 {
            margin-bottom: 8px;
            font-weight: 300;
            font-size: clamp(18px, 2.5vw, 30px);
        }

        /* SCALE GROUP */
        .scale-group {
            position: relative;
            width: min(88vw, 460px);
            aspect-ratio: 1 / 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0; /* <-- removed gap to connect tray and scale */
        }

        /* TRAY */
        .tray {
            width: 100%;
            height: 140px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: visible;
            flex-shrink: 0;
            gap: 4px;
            padding: 0 8px;
            flex-wrap: wrap;
            background: rgba(128, 128, 128, 0.2);
        }

        .tray-box {
            position: absolute;
            inset: 0;
            background: url("image/tray.png") center/contain no-repeat;
            z-index: 5;
            pointer-events: none;
            border-radius: 40px;
        }

        /* SCALE FACE */
        .scale-face {
            position: relative;
            width: 70%;
            aspect-ratio: 1;
            border-radius: 5%;
            overflow: hidden;
            background: url("image/background.png") center/contain no-repeat;
            border: 6px solid transparent;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .face-box {
            position: absolute;
            inset: 0;
            background: url("image/face-box.png") center/contain no-repeat;
            z-index: 2;
            pointer-events: none;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: block;
        }

        .weight-display {
            margin-top: 8px;
            font-size: clamp(16px, 2vw, 24px);
            font-weight: 600;
            text-align: center;
        }

        /* ── small screens: stack vertically ── */
        @media (max-width: 560px) {
            body {
                flex-direction: column;
                padding: 8px;
                gap: 8px;
                overflow-y: auto;
            }

            .left-panel {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
                padding: 0 4px;
            }

            .items {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                max-height: none;
                padding: 8px;
                gap: 6px;
                width: auto;
                flex: 1;
            }

            .item {
                width: clamp(36px, 9vw, 50px);
                height: clamp(36px, 9vw, 50px);
            }

            .reset-btn {
                width: auto;
                padding: 6px 14px;
                flex-shrink: 0;
            }

            .scale-group {
                width: min(82vw, 400px);
            }

            .tray {
                height: 50px;
                padding: 0 6px;
                gap: 3px;
            }
            .tray-box {
                border-radius: 30px;
            }
        }

        @media (max-width: 400px) {
            .scale-group {
                width: 88vw;
            }
            .tray {
                height: 40px;
                border-radius: 30px;
                padding: 0 4px;
                gap: 2px;
            }
            .tray-box {
                border-radius: 24px;
            }
            .items {
                gap: 4px;
                padding: 6px;
            }
            .item {
                width: clamp(30px, 8vw, 42px);
                height: clamp(30px, 8vw, 42px);
                border-radius: 10px;
            }
            .item img {
                padding: 3px;
            }
            .item.in-tray {
                transform: scale(4);
            }
        }

        @media (max-width: 360px) {
            .scale-group {
                width: 92vw;
            }
            .tray {
                height: 34px;
                padding: 0 3px;
                gap: 2px;
            }
            .tray-box {
                border-radius: 20px;
            }
            .weight-display {
                font-size: 14px;
            }
            .item.in-tray {
                transform: scale(4);
            }
        }
    </style>
</head>

<body>

    <div class="left-panel">
        <div class="items" id="itemsContainer">
            <div class="item" data-weight="1"><img src="image/Apple.svg" alt="apple"></div>
            <div class="item" data-weight="2"><img src="image/orange.png" alt="orange"></div>
            <div class="item" data-weight="3"><img src="image/pumpkin.png" alt="pumpkin"></div>
            <div class="item" data-weight="4"><img src="image/chicken.svg" alt="coconut"></div>
            <div class="item" data-weight="1.5"><img src="image/fish.svg" alt="watermelon"></div>
        </div>
        <button class="reset-btn" id="resetBtn">Reset</button>
        <button class="homeBtn" onclick="window.location.href='../index.html'">🏡 Home</button>
    </div>

    <div class="center-panel">

        <h1></h1>

        <div class="scale-group">

            <div class="tray" id="tray">
                <div class="tray-box"></div>
            </div>

            <div class="scale-face">
                <div class="face-box"></div>
                <canvas id="scaleCanvas"></canvas>
            </div>

        </div>

        <div class="weight-display">
            ទម្ងន់: <span id="weightValue">0</span> គក
        </div>

    </div>

    <script>
        (function() {

            const tray = document.getElementById("tray");
            const itemsContainer = document.getElementById("itemsContainer");
            const canvas = document.getElementById("scaleCanvas");
            const ctx = canvas.getContext("2d");
            const weightDisplay = document.getElementById("weightValue");

            let totalWeight = 0;
            let current = null;
            let offsetX = 0;
            let offsetY = 0;

            function resize() {
                const r = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = r.width * dpr;
                canvas.height = r.height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                draw();
            }

            function draw() {
                const w = canvas.clientWidth;
                const h = canvas.clientHeight;
                const cx = w / 2;
                const cy = h / 2;

                const radius = Math.min(w, h) * 0.30;

                ctx.clearRect(0, 0, w, h);

                for (let i = 0; i <= 100; i++) {
                    const val = i / 10;
                    const angle = (-90 + val * 36) * Math.PI / 180;
                    const main = i % 10 === 0;

                    const r1 = radius - 2;
                    const r2 = main ? radius - 10 : radius - 7;

                    const x1 = cx + Math.cos(angle) * r1;
                    const y1 = cy + Math.sin(angle) * r1;
                    const x2 = cx + Math.cos(angle) * r2;
                    const y2 = cy + Math.sin(angle) * r2;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = "#222";
                    ctx.lineWidth = main ? 2.5 : 1.2;
                    ctx.stroke();

                    if (main) {
                        // Place '10' much further out to increase gap from '0'
                        let labelOffset = 20; // default for all numbers
                        if (val === 10) {
                            labelOffset = 6; // move 10 far out
                        }
                        const tx = cx + Math.cos(angle) * (radius - labelOffset);
                        const ty = cy + Math.sin(angle) * (radius - labelOffset);
                        ctx.font = "bold 24px Arial";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillStyle = "#222";
                        ctx.fillText(val, tx, ty);
                    }
                }

                const angle = totalWeight * 36 * Math.PI / 180;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -(radius - 24));

                ctx.strokeStyle = "#b71c1c";
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.restore();

                weightDisplay.textContent = totalWeight;
            }

            /* ─── DRAG LOGIC ─── */
            document.addEventListener("pointerdown", (e) => {
                const item = e.target.closest(".item");
                if (!item || current) return;

                current = item;

                const r = item.getBoundingClientRect();
                offsetX = e.clientX - r.left;
                offsetY = e.clientY - r.top;

                item.classList.add("dragging");
                item.style.position = "fixed";
                item.style.left = (e.clientX - offsetX) + "px";
                item.style.top = (e.clientY - offsetY) + "px";
                item.style.width = r.width + "px";
                item.style.height = r.height + "px";
                item.style.zIndex = "999";
                item.style.pointerEvents = "none";

                document.body.appendChild(item);
            });

            document.addEventListener("pointermove", (e) => {
                if (!current) return;
                current.style.left = (e.clientX - offsetX) + "px";
                current.style.top = (e.clientY - offsetY) + "px";
            });

            document.addEventListener("pointerup", (e) => {
                if (!current) return;

                const weight = +current.dataset.weight;
                const r = tray.getBoundingClientRect();

                const inside =
                    e.clientX >= r.left &&
                    e.clientX <= r.right &&
                    e.clientY >= r.top &&
                    e.clientY <= r.bottom;

                const wasInTray = current.classList.contains("in-tray");

                if (inside) {
                    if (!wasInTray) {
                        tray.appendChild(current);
                        current.classList.add("in-tray");
                        totalWeight += weight;
                    }
                } else {
                    if (wasInTray) {
                        current.classList.remove("in-tray");
                        totalWeight -= weight;
                        if (totalWeight < 0) totalWeight = 0;
                    }
                    itemsContainer.appendChild(current);
                }

                current.style.position = "";
                current.style.left = "";
                current.style.top = "";
                current.style.width = "";
                current.style.height = "";
                current.style.zIndex = "";
                current.style.pointerEvents = "";
                current.classList.remove("dragging");
                current = null;

                draw();
            });

            document.getElementById("resetBtn").onclick = () => {
                [...tray.children].forEach(i => {
                    if (i.classList) {
                        i.classList.remove("in-tray");
                        itemsContainer.appendChild(i);
                    }
                });
                totalWeight = 0;
                draw();
            };

            window.addEventListener("resize", resize);
            resize();
            draw();

        })();
    </script>

</body>
</html>
