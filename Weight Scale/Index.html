<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitchen Weight Scale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f5f3f0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .scale-group {
            position: relative;
            width: min(90vw, 500px);
            aspect-ratio: 1 / 1.25;
            background-image: url("image/background.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tray {
            width: 70%;
            height: 85px;
            margin-top: 18px;
            padding: 6px 10px;
            border: 3px dashed #aaa;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 4px;
            overflow: visible;
            transition: background 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }

        .tray.drag-over {
            background: rgba(200, 230, 200, 0.5);
            border-color: #4caf50;
        }

        .stem {
            width: 20px;
            height: 50px;
            background: transparent;
            flex-shrink: 0;
        }

        .scale-face {
            position: relative;
            width: 65%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: white;
            border: 12px solid #d0d0d0;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .items {
            display: flex;
            gap: 18px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 80px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            border: 2px dashed #ccc;
        }

        .item {
            width: 70px;
            height: 70px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s, opacity 0.2s, filter 0.2s, box-shadow 0.2s;
            will-change: transform;
            flex-shrink: 0;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            padding: 6px;
        }

        .item:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
        }

        .item.dragging {
            opacity: 0.6;
            cursor: grabbing;
            transform: scale(1.1);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            z-index: 9999;
        }

        .item.in-tray {
            transform: scale(0.65);
            opacity: 0.75;
            filter: grayscale(0.2);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            cursor: grab;
            width: 60px;
            height: 60px;
        }

        .reset-btn {
            margin-top: 18px;
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            background: #e0d6c8;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background: #d0c4b4;
        }

        .weight-display {
            margin-top: 12px;
            font-size: 20px;
            font-weight: 600;
            color: #333;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 24px;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .weight-display span {
            color: #d32f2f;
            font-size: 26px;
        }
    </style>
</head>
<body>

    <h1>⚖️ Kitchen Scale</h1>

    <div class="scale-group">
        <div class="tray" id="tray"></div>
        <div class="stem"></div>
        <div class="scale-face">
            <canvas id="scaleCanvas"></canvas>
        </div>
    </div>

    <div class="weight-display">
        Total: <span id="weightValue">0</span> g
    </div>

    <div class="items" id="itemsContainer">
        <div class="item" data-weight="1"><img src="image/apple.png" alt="apple" /></div>
        <div class="item" data-weight="2"><img src="image/orange.png" alt="orange" /></div>
        <div class="item" data-weight="3"><img src="image/pumpkin.png" alt="pumpkin" /></div>
        <div class="item" data-weight="4"><img src="image/coconut.png" alt="coconut" /></div>
        <div class="item" data-weight="5"><img src="image/watermelon.png" alt="watermelon" /></div>
        <div class="item" data-weight="6"><img src="image/grapes.png" alt="grapes" /></div>
    </div>

    <button class="reset-btn" id="resetBtn">⟳ Reset Scale</button>

    <script>
        (function() {
            const tray = document.getElementById('tray');
            const itemsContainer = document.getElementById('itemsContainer');
            const canvas = document.getElementById('scaleCanvas');
            const ctx = canvas.getContext('2d');
            const resetBtn = document.getElementById('resetBtn');
            const weightDisplay = document.getElementById('weightValue');

            let totalWeight = 0;

            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                drawScale();
            }

            function drawScale() {
                const w = canvas.width / (window.devicePixelRatio || 1);
                const h = canvas.height / (window.devicePixelRatio || 1);
                const cx = w / 2;
                const cy = h / 2;
                const radius = w * 0.42;

                ctx.clearRect(0, 0, w, h);

                // ----- transparent face (background image shows through) -----
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fillStyle = 'transparent';
                ctx.fill();

                // ----- Ticks and numbers – now bigger and longer -----
                for (let i = 0; i <= 100; i++) {
                    const value = i / 10;
                    const angle = (-90 + value * 36) * Math.PI / 180;
                    const isMainTick = i % 10 === 0;

                    // Outer tick stays at radius - 2 (touching the ring)
                    const outerRadius = radius - 2;
                    // Inner tick now extends much further inward
                    let innerRadius;
                    if (isMainTick) {
                        innerRadius = radius - 16; // Longer main ticks
                    } else {
                        innerRadius = radius - 11; // Longer sub‑ticks
                    }

                    const x1 = cx + Math.cos(angle) * outerRadius;
                    const y1 = cy + Math.sin(angle) * outerRadius;
                    const x2 = cx + Math.cos(angle) * innerRadius;
                    const y2 = cy + Math.sin(angle) * innerRadius;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = isMainTick ? 4 : 2; // Thicker ticks
                    ctx.stroke();

                    // Numbers – now even larger (28px) and moved inward to avoid overlap
                    if (isMainTick) {
                        const tx = cx + Math.cos(angle) * (radius - 26);
                        const ty = cy + Math.sin(angle) * (radius - 26);
                        ctx.font = 'bold 28px Arial';
                        ctx.fillStyle = '#222';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(value, tx, ty);
                    }
                }

                // ----- pointer (needle) -----
                const pointerAngle = totalWeight * 36 * Math.PI / 180;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(pointerAngle);

                // Needle shaft
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -(radius - 18));
                ctx.strokeStyle = '#b71c1c';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Needle tip (triangle) – now reaches to radius - 8
                const tipY = -(radius - 8);
                ctx.beginPath();
                ctx.moveTo(-14, tipY + 18);
                ctx.lineTo(0, tipY - 8);
                ctx.lineTo(14, tipY + 18);
                ctx.closePath();
                ctx.fillStyle = '#d32f2f';
                ctx.fill();
                ctx.strokeStyle = '#b71c1c';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Bright dot at tip
                ctx.beginPath();
                ctx.arc(0, tipY, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.strokeStyle = '#b71c1c';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();

                // Center cap
                ctx.shadowColor = 'rgba(0,0,0,0.10)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(cx, cy, 18, 0, Math.PI * 2);
                ctx.fillStyle = '#444';
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(cx, cy, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#aaa';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx - 4, cy - 5, 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();

                weightDisplay.textContent = totalWeight;
            }

            // ----- Drag state -----
            let current = null;
            let offsetX = 0;
            let offsetY = 0;

            function cleanupDrag() {
                if (!current) return;
                current.classList.remove('dragging');
                current.style.position = '';
                current.style.left = '';
                current.style.top = '';
                current.style.width = '';
                current.style.height = '';
                current.style.zIndex = '';
                current.style.pointerEvents = '';
                current = null;
            }

            document.addEventListener('pointerdown', (e) => {
                const item = e.target.closest('.item');
                if (!item || current) return;

                current = item;
                const rect = item.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;

                item.classList.add('dragging');
                item.style.position = 'fixed';
                item.style.width = rect.width + 'px';
                item.style.height = rect.height + 'px';
                item.style.zIndex = 9999;
                item.style.pointerEvents = 'none';
                item.style.left = (e.clientX - offsetX) + 'px';
                item.style.top = (e.clientY - offsetY) + 'px';

                document.body.appendChild(item);
                tray.classList.add('drag-over');
            });

            document.addEventListener('pointermove', (e) => {
                if (!current) return;
                current.style.left = (e.clientX - offsetX) + 'px';
                current.style.top = (e.clientY - offsetY) + 'px';

                const trayRect = tray.getBoundingClientRect();
                const inside = e.clientX >= trayRect.left && e.clientX <= trayRect.right &&
                    e.clientY >= trayRect.top && e.clientY <= trayRect.bottom;
                tray.classList.toggle('drag-over', inside);
            });

            document.addEventListener('pointerup', (e) => {
                if (!current) return;

                const weight = Number(current.dataset.weight);
                const trayRect = tray.getBoundingClientRect();
                const inside = e.clientX >= trayRect.left && e.clientX <= trayRect.right &&
                    e.clientY >= trayRect.top && e.clientY <= trayRect.bottom;

                const wasInTray = current.classList.contains('in-tray');

                if (inside) {
                    if (!wasInTray) {
                        tray.appendChild(current);
                        current.classList.add('in-tray');
                        totalWeight += weight;
                        drawScale();
                    }
                } else {
                    if (wasInTray) {
                        current.classList.remove('in-tray');
                        totalWeight -= weight;
                        drawScale();
                    }
                    itemsContainer.appendChild(current);
                }

                tray.classList.remove('drag-over');
                cleanupDrag();
            });

            document.addEventListener('pointercancel', () => {
                if (current) {
                    if (current.classList.contains('in-tray')) {
                        current.classList.remove('in-tray');
                        totalWeight -= Number(current.dataset.weight) || 0;
                        drawScale();
                    }
                    itemsContainer.appendChild(current);
                    tray.classList.remove('drag-over');
                    cleanupDrag();
                }
            });

            function resetScale() {
                const trayItems = tray.querySelectorAll('.item');
                trayItems.forEach(item => {
                    item.classList.remove('in-tray');
                    itemsContainer.appendChild(item);
                });
                totalWeight = 0;
                drawScale();
            }

            resetBtn.addEventListener('click', resetScale);

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            totalWeight = 0;
            drawScale();
        })();
    </script>

</body>
</html>
