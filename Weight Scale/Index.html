<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Analog Weighing Scale</title>

<style>
    *{
        box-sizing:border-box;
        user-select:none;
    }

    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#eef3f7;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:20px;
    }

    h1{
        margin-bottom:10px;
    }

    .instruction{
        margin-bottom:20px;
        color:#444;
        text-align:center;
    }

    .items{
        display:flex;
        gap:20px;
        margin-bottom:10px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .item{
        width:90px;
        height:90px;
        border-radius:12px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:100px;
        cursor:grab;
        background:white;
        box-shadow:0 4px 8px rgba(0,0,0,0.15);
        transition:0.2s;
    }

    .item:hover{
        transform:scale(1.05);
    }

    .scale-area{
        position:relative;
        width:420px;
        height:420px;
    }

    /* SCALE BODY */
    .scale{
        width:100%;
        height:100%;
        background:white;
        border-radius:50%;
        border:10px solid white;
        position:relative;
        box-shadow:inset 0 0 0px rgba(0,0,0,0.0);
    }

    /* DIAL */
    .dial{
        position:absolute;
        width:260px;
        height:260px;
        background:white;
        border-radius:50%;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        border:4px solid #555;
    }

    /* NEEDLE */
    .needle{
        position:absolute;
        width:8px;
        height:85px;
        background:green;
        left:50%;
        bottom:50%;
        transform-origin:bottom center;
        transform:translateX(-50%) rotate(-360deg);
        border-radius:4px;
        transition:transform 0.5s ease;
    }

    .center-dot{
        position:absolute;
        width:18px;
        height:18px;
        background:#222;
        border-radius:50%;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
    }

    /* MARKS */
    .mark{
        position:absolute;
        width:6px;
        height:10px;
        background:#333;
        left:50%;
        top:8px;
        transform-origin:center 122px;
    }

    /* TRAY */
    .tray{
        position:absolute;
        width:340px;
        height:70px;
        background:white;
        border-radius:10px;
        top:50px;
        left:50%;
        transform:translateX(-50%);
        border:5px solid #444;

        display:flex;
        flex-wrap:wrap;
        gap:5px;
        justify-content:center;
        align-items:center;
        padding:3px;
    }

    .tray.highlight{
        background:#7ecb7e;
    }

    .weight-display{
        margin-top:10px;
        font-size:20px;
        font-weight:bold;
        color:#222;
    }

    .delete-zone{
        margin-top:30px;
        width:240px;
        height:80px;
        background:#ffb3b3;
        border:4px dashed #cc0000;
        border-radius:16px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:22px;
        font-weight:bold;
        color:#aa0000;
    }

    .small-item{
        font-size:60px;
        cursor:grab;
    }
</style>
</head>

<body>

<h1>ជញ្ជីងថ្លឹងទម្ងន់</h1>

<div class="instruction">
    
</div>

<!-- ITEMS -->
<div class="items">

    <div class="item" draggable="true"
         data-weight="2"
         data-emoji="🍎">
         🍎
    </div>

    <div class="item" draggable="true"
         data-weight="3"
         data-emoji="🍌">
         🍌
    </div>

    <div class="item" draggable="true"
         data-weight="5"
         data-emoji="🐟">
         🐟
    </div>

    <div class="item" draggable="true"
         data-weight="4"
         data-emoji="🍉">
         🍉
    </div>

</div>

<!-- SCALE -->
<div class="scale-area">

    <div class="scale">

        <!-- TRAY -->
        <div class="tray" id="tray"></div>

        <!-- DIAL -->
        <div class="dial" id="dial">

            <div class="needle" id="needle"></div>
            <div class="center-dot"></div>

        </div>

    </div>

</div>

<div class="weight-display">
    ទម្ងន់: <span id="weight">0</span> kg
</div>

<div class="delete-zone" id="deleteZone">
    🗑 ទាញដើម្បីលុប
</div>

<script>
    const tray = document.getElementById("tray");
    const weightDisplay = document.getElementById("weight");
    const needle = document.getElementById("needle");
    const deleteZone = document.getElementById("deleteZone");

    let totalWeight = 0;

    // Create dial marks
    const dial = document.getElementById("dial");

    for(let i = 0; i <= 9; i++){
        const mark = document.createElement("div");
        mark.className = "mark";

        const angle = -360 + (i * 36);

        mark.style.transform =
            `translateX(-20%) rotate(${angle}deg)`;

        dial.appendChild(mark);

        // numbers
        const number = document.createElement("div");
        number.innerText = i;

        number.style.position = "absolute";
        number.style.left = "50%";
        number.style.top = "50%";
        number.style.transform =
            `rotate(${angle}deg)
             translateY(-105px)
             rotate(${-angle}deg)`;

        number.style.fontSize = "16px";

        dial.appendChild(number);
    }

    // DRAG START FROM MENU
    document.querySelectorAll(".item").forEach(item => {

        item.addEventListener("dragstart", e => {

            e.dataTransfer.setData(
                "text/plain",
                JSON.stringify({
                    weight:item.dataset.weight,
                    emoji:item.dataset.emoji
                })
            );
        });

    });

    // ALLOW DROP
    tray.addEventListener("dragover", e => {
        e.preventDefault();
        tray.classList.add("highlight");
    });

    tray.addEventListener("dragleave", () => {
        tray.classList.remove("highlight");
    });

    // DROP INTO SCALE
    tray.addEventListener("drop", e => {

        e.preventDefault();
        tray.classList.remove("highlight");

        const data =
            JSON.parse(
                e.dataTransfer.getData("text/plain")
            );

        addItemToScale(data.emoji, Number(data.weight));
    });

    function addItemToScale(emoji, weight){

        const newItem = document.createElement("div");

        newItem.className = "small-item";
        newItem.innerText = emoji;

        newItem.draggable = true;

        newItem.dataset.weight = weight;

        // Drag existing item
        newItem.addEventListener("dragstart", e => {

            e.dataTransfer.setData(
                "removeWeight",
                weight
            );

            e.dataTransfer.setData(
                "removeElementId",
                Date.now()
            );

            newItem.id =
                e.dataTransfer.getData("removeElementId");
        });

        tray.appendChild(newItem);

        totalWeight += weight;

        updateScale();
    }

    // DELETE ZONE
    deleteZone.addEventListener("dragover", e => {
        e.preventDefault();
    });

    deleteZone.addEventListener("drop", e => {

        e.preventDefault();

        const dragged =
            document.getElementById(
                e.dataTransfer.getData("removeElementId")
            );

        const weight =
            Number(
                e.dataTransfer.getData("removeWeight")
            );

        if(dragged){

            dragged.remove();

            totalWeight -= weight;

            if(totalWeight < 0){
                totalWeight = 0;
            }

            updateScale();
        }
    });

    function updateScale(){

        weightDisplay.innerText = totalWeight;

        // rotate needle
        // 0kg = -90deg
        // 10kg = +90deg

        let angle =
            -360 + (totalWeight * 36);

        // limit rotation
        if(angle > 360){
            angle = 360;
        }

        needle.style.transform =
            `translateX(-50%) rotate(${angle}deg)`;
    }

</script>

</body>
</html>
