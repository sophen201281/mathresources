<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Magnetic Circle Counters</title>

<style>

*{

box-sizing:border-box;

user-select:none;

touch-action:none;

}

body{

margin:0;

overflow:hidden;

background:#ececec;

font-family:Arial;

}

canvas{

position:absolute;

inset:0;

background:white;

}

/* 🔽 BOTTOM TOOLBAR */

.toolbar{

position:fixed;

bottom:10px;

left:10px;

right:10px;

display:flex;

gap:8px;

flex-wrap:wrap;

z-index:1000;

align-items:center;

justify-content:center;

background:rgba(255,255,255,0.7);

padding:10px;

border-radius:12px;

backdrop-filter: blur(6px);

}

.toolbar input{

width:90px;

padding:10px;

font-size:16px;

}

button{

padding:10px 14px;

font-size:16px;

}

.active{

background:orange;

}

.counter{

position:absolute;

width:60px;

height:60px;

border-radius:50%;

background:#4CAF50;

border:4px solid #1B5E20;

transform:translate(-30px,-30px);

z-index:100;

}

.selected{

outline:5px solid orange;

}

</style>

</head>

<body>

<div class="toolbar">

<input id="counterCount" type="number" min="1" value="1">

<button id="addCounter">Generate Counters</button>

<button id="deleteCounter">លុបវត្ថសម្រាប់រាប់</button>

<button id="clearDraw">សម្អាត</button>

<button id="eraserBtn">លុប</button>

<a href="../index.html">🏡 Home</a>

</div>

<canvas id="draw"></canvas>

<script>

const canvas = document.getElementById("draw");

const ctx = canvas.getContext("2d");

function resize(){

canvas.width = innerWidth;

canvas.height = innerHeight;

}

resize();

addEventListener("resize", resize);

/* DRAWING */

let drawing = false;

let eraser = false;

const eraserBtn = document.getElementById("eraserBtn");

eraserBtn.onclick = () => {

eraser = !eraser;

eraserBtn.textContent = eraser ? "លុប បើក" : "លុប​ បិទ";

eraserBtn.classList.toggle("active", eraser);

};

canvas.addEventListener("pointerdown", e => {

if(e.target !== canvas) return;

drawing = true;

ctx.beginPath();

ctx.moveTo(e.clientX, e.clientY);

});

canvas.addEventListener("pointermove", e => {

if(!drawing) return;

if(eraser){

ctx.globalCompositeOperation = "destination-out";

ctx.lineWidth = 28;

}else{

ctx.globalCompositeOperation = "source-over";

ctx.lineWidth = 4;

}

ctx.lineCap = "round";

ctx.lineTo(e.clientX, e.clientY);

ctx.stroke();

});

window.addEventListener("pointerup", () => {

drawing = false;

ctx.globalCompositeOperation = "source-over";

});

/* COUNTERS */

let selected = null;

const connections = new Map();

function createCounter(x,y){

const c = document.createElement("div");

c.className = "counter";

c.dataset.id = crypto.randomUUID();

c.style.left = x + "px";

c.style.top = y + "px";

document.body.appendChild(c);

connections.set(c.dataset.id, new Set());

setupCounter(c);

}

document.getElementById("addCounter").onclick = () => {

const count = parseInt(document.getElementById("counterCount").value || "1");

for(let i = 0; i < count; i++){

createCounter(

innerWidth/2 + (i * 10),

innerHeight/2 + (i * 10)

);

}

};

document.getElementById("deleteCounter").onclick = () => {

if(!selected) return;

removeConnections(selected.dataset.id);

selected.remove();

selected = null;

};

document.getElementById("clearDraw").onclick = () => {

ctx.clearRect(0,0,canvas.width,canvas.height);

};

function getCounters(){

return [...document.querySelectorAll(".counter")];

}

function getCounter(id){

return document.querySelector(`[data-id="${id}"]`);

}

function selectCounter(c){

getCounters().forEach(x => x.classList.remove("selected"));

selected = c;

c.classList.add("selected");

}

/* CONNECTIONS */

function connectedGroup(id){

const visited = new Set();

const queue = [id];

while(queue.length){

const current = queue.shift();

if(visited.has(current)) continue;

visited.add(current);

connections.get(current)?.forEach(n => {

if(!visited.has(n)) queue.push(n);

});

}

return [...visited];

}

function connect(a,b){

connections.get(a).add(b);

connections.get(b).add(a);

}

function detach(counter){

const id = counter.dataset.id;

connections.get(id).clear();

connections.forEach(set => set.delete(id));

counter.style.left = (counter.offsetLeft + 45) + "px";

counter.style.top = (counter.offsetTop + 45) + "px";

}

function removeConnections(id){

connections.delete(id);

connections.forEach(set => set.delete(id));

}

/* DRAG + DOUBLE TAP FEATURE */

function setupCounter(counter){

let dragging = false;

let members = [];

let starts = [];

let sx = 0;

let sy = 0;

let lastTap = 0;

counter.addEventListener("pointerdown", e => {

dragging = true;

selectCounter(counter);

sx = e.clientX;

sy = e.clientY;

members = connectedGroup(counter.dataset.id);

starts = members.map(id => {

const c = getCounter(id);

return {

el: c,

x: c.offsetLeft,

y: c.offsetTop

};

});

const now = Date.now();

/* ⭐ UPDATED DOUBLE TAP BEHAVIOR */

if(now - lastTap < 300){

if(selected === counter){

/* break connections for selected counter */

removeConnections(counter.dataset.id);

}

else{

/* original behavior preserved */

detach(counter);

members = [counter.dataset.id];

}

}

lastTap = now;

counter.setPointerCapture(e.pointerId);

});

counter.addEventListener("pointermove", e => {

if(!dragging) return;

const dx = e.clientX - sx;

const dy = e.clientY - sy;

starts.forEach(obj => {

obj.el.style.left = (obj.x + dx) + "px";

obj.el.style.top = (obj.y + dy) + "px";

});

});

counter.addEventListener("pointerup", () => {

dragging = false;

snap(counter);

});

}

/* SNAP */

function snap(active){

const SNAP = 80;

const DIST = 62;

const myGroup = connectedGroup(active.dataset.id);

const all = getCounters();

for(let id of myGroup){

const me = getCounter(id);

for(let other of all){

if(myGroup.includes(other.dataset.id)) continue;

const dx = me.offsetLeft - other.offsetLeft;

const dy = me.offsetTop - other.offsetTop;

const d = Math.hypot(dx,dy);

if(d < SNAP){

const angle = Math.atan2(dy, dx);

const targetX = other.offsetLeft + Math.cos(angle) * DIST;

const targetY = other.offsetTop + Math.sin(angle) * DIST;

const moveX = targetX - me.offsetLeft;

const moveY = targetY - me.offsetTop;

myGroup.forEach(g => {

const c = getCounter(g);

c.style.left = (c.offsetLeft + moveX) + "px";

c.style.top = (c.offsetTop + moveY) + "px";

});

connect(me.dataset.id, other.dataset.id);

return;

}

}

}

}

/* INITIAL COUNTERS */

createCounter(250,250);

createCounter(400,250);

</script>

</body>

</html>
