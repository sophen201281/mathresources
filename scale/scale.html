<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1,user-scalable=no">

<title>Magnetic Snap Groups</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

touch-action:none;

user-select:none;

-webkit-tap-highlight-color:transparent;

}

body{

background:#16222d;

font-family:Arial;

display:flex;

justify-content:center;

padding:20px;

overflow:hidden;

}

.canvas-panel{

width:min(980px,100%);

background:#243340;

padding:18px;

border-radius:28px;

}

.stats-bar{

display:flex;

flex-wrap:wrap;

gap:12px;

margin-bottom:16px;

align-items:center;

color:white;

}

.counter{

background:#10202b;

padding:10px 18px;

border-radius:30px;

}

button{

border:none;

padding:10px 18px;

border-radius:30px;

background:#3f6d84;

color:white;

font-weight:bold;

cursor:pointer;

}

.canvas-wrapper{

background:#faf3de;

border-radius:20px;

overflow:hidden;

}

canvas{

display:block;

width:100%;

height:auto;

touch-action:none;

}

</style>

</head>

<body>

<div class="canvas-panel">

<div class="stats-bar">

<div class="counter">

Dots:

<span id="dotCount">0</span>

</div>

<div class="counter">

Groups:

<span id="groupCount">0</span>

</div>

<button id="resetBtn">

Reset

</button>

</div>

<div class="canvas-wrapper">

<canvas

id="canvas"

width="900"

height="550">

</canvas>

</div>

</div>

<script>

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

const dots=[];

let nextId=1;

let groupCounter=1;

const DOT_RADIUS=30;

const SNAP_DISTANCE=65;

const GAP=74;

let dragTarget=null;

let dragging=false;

let dragOffsetX=0;

let dragOffsetY=0;

let lastTapTime=0;

let lastTappedDot=null;

/* CREATE */

function createDot(x,y,groupId=null){

if(groupId==null){

groupId=groupCounter++;

}

return{

id:nextId++,

x,

y,

groupId,

radius:DOT_RADIUS

};

}

/* LOAD */

function loadDots(){

dots.length=0;

nextId=1;

groupCounter=1;

dots.push(createDot(150,180));

dots.push(createDot(330,120));

dots.push(createDot(720,220));

const g=groupCounter++;

dots.push(createDot(260,340,g));

dots.push(createDot(320,380,g));

const g2=groupCounter++;

dots.push(createDot(560,250,g2));

dots.push(createDot(610,270,g2));

dots.push(createDot(590,320,g2));

updateStats();

draw();

}

/* STATS */

function updateStats(){

document.getElementById(

"dotCount"

).textContent=dots.length;

document.getElementById(

"groupCount"

).textContent=

new Set(

dots.map(

d=>d.groupId

)

).size;

}

/* GROUPS */

function mergeGroups(from,to){

if(from===to)

return;

dots.forEach(dot=>{

if(dot.groupId===from){

dot.groupId=to;

}

});

}

function disconnectGroup(dot){

const members=

dots.filter(

d=>d.groupId===dot.groupId

);

if(members.length<=1)

return;

members.forEach((d,index)=>{

d.groupId=groupCounter++;

const angle=

(index/members.length)

*

Math.PI*2;

d.x +=

Math.cos(angle)*70;

d.y +=

Math.sin(angle)*70;

});

updateStats();

draw();

}

/* SNAP */

function trySnap(dot){

let closest=null;

let best=Infinity;

for(const other of dots){

if(other.id===dot.id)

continue;

if(other.groupId===dot.groupId)

continue;

const dist=

Math.hypot(

other.x-dot.x,

other.y-dot.y

);

if(

dist<SNAP_DISTANCE &&

dist<best

){

best=dist;

closest=other;

}

}

if(!closest)

return;

const angle=

Math.atan2(

dot.y-closest.y,

dot.x-closest.x

);

dot.x=

closest.x+

Math.cos(angle)

*

GAP;

dot.y=

closest.y+

Math.sin(angle)

*

GAP;

mergeGroups(

dot.groupId,

closest.groupId

);

updateStats();

}

/* DRAW */

function draw(){

ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);

const groups={};

dots.forEach(dot=>{

if(!groups[dot.groupId]){

groups[dot.groupId]=[];

}

groups[dot.groupId].push(dot);

});

Object.values(groups)

.forEach(group=>{

if(group.length<2)

return;

for(

let i=0;

i<group.length;

i++

){

for(

let j=i+1;

j<group.length;

j++

){

ctx.beginPath();

ctx.moveTo(

group[i].x,

group[i].y

);

ctx.lineTo(

group[j].x,

group[j].y

);

ctx.lineWidth=4;

ctx.strokeStyle=

"rgba(0,0,0,.25)";

ctx.stroke();

}

}

});

dots.forEach(dot=>{

ctx.beginPath();

ctx.arc(

dot.x,

dot.y,

DOT_RADIUS,

0,

Math.PI*2

);

ctx.fillStyle="#ff8a4a";

ctx.fill();

ctx.strokeStyle="white";

ctx.lineWidth=3;

ctx.stroke();

});

}

/* POSITION */

function pos(e){

const rect=

canvas.getBoundingClientRect();

return{

x:

(e.clientX-rect.left)

*

(canvas.width/rect.width),

y:

(e.clientY-rect.top)

*

(canvas.height/rect.height)

};

}

/* POINTER */

canvas.addEventListener(

"pointerdown",

e=>{

const now=Date.now();

const p=pos(e);

for(

let i=dots.length-1;

i>=0;

i--

){

const d=dots[i];

if(

Math.hypot(

d.x-p.x,

d.y-p.y

)

<

DOT_RADIUS+10

){

if(

lastTappedDot===d &&

now-lastTapTime<300

){

disconnectGroup(d);

lastTappedDot=null;

lastTapTime=0;

return;

}

lastTappedDot=d;

lastTapTime=now;

dragTarget=d;

dragging=true;

dragOffsetX=

d.x-p.x;

dragOffsetY=

d.y-p.y;

break;

}

}

});

window.addEventListener(

"pointermove",

e=>{

if(

!dragging ||

!dragTarget

)

return;

const p=pos(e);

const nx=

p.x+dragOffsetX;

const ny=

p.y+dragOffsetY;

const dx=

nx-dragTarget.x;

const dy=

ny-dragTarget.y;

dots

.filter(

d=>

d.groupId===

dragTarget.groupId

)

.forEach(dot=>{

dot.x+=dx;

dot.y+=dy;

});

draw();

});

window.addEventListener(

"pointerup",

()=>{

if(dragTarget){

trySnap(

dragTarget

);

draw();

}

dragging=false;

dragTarget=null;

});

document

.getElementById(

"resetBtn"

)

.onclick=

loadDots;

loadDots();

</script>

</body>

</html>
