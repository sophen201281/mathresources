<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

user-select:none;

touch-action:none;

}

body{

overflow:hidden;

background:#f1f1f1;

font-family:Arial;

}

.toolbar{

position:fixed;

top:10px;

left:10px;

display:flex;

gap:8px;

z-index:1000;

}

button{

padding:10px 14px;

border:none;

border-radius:8px;

background:#1976d2;

color:white;

}

#app{

position:relative;

width:100vw;

height:100vh;

overflow:hidden;

}

canvas,#dotLayer{

position:absolute;

inset:0;

}

#lineCanvas{

z-index:1;

pointer-events:none;

}

#dotLayer{

z-index:5;

}

#drawCanvas{

z-index:20;

pointer-events:none;

}

.dot{

position:absolute;

width:56px;

height:56px;

border-radius:50%;

background:#ff4f4f;

display:flex;

justify-content:center;

align-items:center;

font-size:24px;

font-weight:bold;

color:white;

transform:translate(-50%,-50%);

box-shadow:0 2px 6px rgba(0,0,0,0.2);

}

</style>

</head>

<body>

<div class="toolbar">

<button id="addBtn">Add Dot</button>

<button id="drawBtn">Draw OFF</button>

<button id="clearBtn">Clear</button>

</div>

<div id="app">

<canvas id="lineCanvas"></canvas>

<div id="dotLayer"></div>

<canvas id="drawCanvas"></canvas>

</div>

<script>

const dots = [];

let nextGroup = 1;

const layer = document.getElementById("dotLayer");

const lineCanvas = document.getElementById("lineCanvas");

const drawCanvas = document.getElementById("drawCanvas");

const ctx = lineCanvas.getContext("2d");

const dctx = drawCanvas.getContext("2d");

function resize(){

lineCanvas.width = innerWidth;

lineCanvas.height = innerHeight;

drawCanvas.width = innerWidth;

drawCanvas.height = innerHeight;

drawLines();

}

window.addEventListener("resize", resize);

resize();

/* ================= CREATE DOT ================= */

function makeDot(x,y){

const el = document.createElement("div");

el.className = "dot";

el.textContent = "●";

layer.appendChild(el);

const dot = {

x,

y,

group:null,

el,

lastTap:0

};

dots.push(dot);

update(dot);

drag(dot);

enableDoubleTap(dot);

return dot;

}

function update(dot){

dot.el.style.left = dot.x + "px";

dot.el.style.top = dot.y + "px";

}

/* ================= GROUP ================= */

function members(dot){

if(dot.group == null) return [dot];

return dots.filter(d => d.group === dot.group);

}

function merge(a,b){

if(a.group == null && b.group == null){

a.group = b.group = nextGroup++;

return;

}

const g = a.group ?? b.group;

dots.forEach(d=>{

if(d.group === a.group || d.group === b.group || d.group == null){

d.group = g;

}

});

}

/* ================= SNAP ================= */

function snap(dot){

let closest = null;

let best = 90;

for(const other of dots){

if(other === dot) continue;

const dist = Math.hypot(

other.x - dot.x,

other.y - dot.y

);

if(dist < best){

best = dist;

closest = other;

}

}

if(!closest) return;

const angle = Math.atan2(

dot.y - closest.y,

dot.x - closest.x

);

const gap = 70;

dot.x = closest.x + Math.cos(angle) * gap;

dot.y = closest.y + Math.sin(angle) * gap;

update(dot);

merge(dot,closest);

}

/* ================= DRAG ================= */

function drag(dot){

let active = false;

let px = 0;

let py = 0;

dot.el.addEventListener("pointerdown", e=>{

if(drawMode) return;

active = true;

px = e.clientX;

py = e.clientY;

dot.el.setPointerCapture(e.pointerId);

});

dot.el.addEventListener("pointermove", e=>{

if(!active) return;

const dx = e.clientX - px;

const dy = e.clientY - py;

px = e.clientX;

py = e.clientY;

members(dot).forEach(d=>{

d.x += dx;

d.y += dy;

update(d);

});

drawLines();

});

function stop(){

if(!active) return;

active = false;

snap(dot);

drawLines();

}

dot.el.addEventListener("pointerup", stop);

dot.el.addEventListener("pointercancel", stop);

}

/* ================= DOUBLE TAP (FIXED) ================= */

function enableDoubleTap(dot){

dot.el.addEventListener("pointerdown", ()=>{

const now = Date.now();

if(now - dot.lastTap < 300 && dot.group != null){

const g = dot.group;

dots.forEach(d=>{

if(d.group === g){

d.group = null;

}

});

drawLines();

}

dot.lastTap = now;

});

}

/* ================= DRAW LINES ================= */

function drawLines(){

ctx.clearRect(0,0,lineCanvas.width,lineCanvas.height);

ctx.lineWidth = 4;

const groups = {};

dots.forEach(d=>{

if(d.group == null) return;

if(!groups[d.group]) groups[d.group] = [];

groups[d.group].push(d);

});

Object.values(groups).forEach(group=>{

for(let i=0;i<group.length-1;i++){

ctx.beginPath();

ctx.moveTo(group[i].x, group[i].y);

ctx.lineTo(group[i+1].x, group[i+1].y);

ctx.stroke();

}

});

}

/* ================= DRAW MODE ================= */

let drawMode = false;

document.getElementById("drawBtn").onclick = (e)=>{

drawMode = !drawMode;

drawCanvas.style.pointerEvents =

drawMode ? "auto" : "none";

e.target.textContent =

drawMode ? "Draw ON" : "Draw OFF";

};

let drawing = false;

drawCanvas.addEventListener("pointerdown", e=>{

drawing = true;

dctx.beginPath();

dctx.moveTo(e.clientX,e.clientY);

});

drawCanvas.addEventListener("pointermove", e=>{

if(!drawing) return;

dctx.lineTo(e.clientX,e.clientY);

dctx.stroke();

});

window.addEventListener("pointerup", ()=>{

drawing = false;

});

/* ================= BUTTONS ================= */

document.getElementById("addBtn").onclick = ()=>{

makeDot(

100 + Math.random()*350,

120 + Math.random()*350

);

};

document.getElementById("clearBtn").onclick = ()=>{

dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);

};

/* ================= START ================= */

for(let i=0;i<5;i++){

makeDot(150+i*80,250);

}

</script>

</body>

</html>
