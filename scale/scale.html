<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
touch-action:none;
user-select:none;
}

body{
overflow:hidden;
font-family:Arial;
background:#f1f1f1;
}

.toolbar{
position:fixed;
top:10px;
left:10px;
display:flex;
gap:8px;
z-index:1000;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
background:#1976d2;
color:white;
}

#app{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
}

canvas,
#dotLayer{
position:absolute;
inset:0;
}

#lineCanvas{
pointer-events:none;
z-index:1;
}

#dotLayer{
z-index:5;
}

#drawCanvas{
z-index:20;
pointer-events:none;
}

.dot{
position:absolute;

width:56px;
height:56px;

border-radius:50%;

background:#ff4f4f;

display:flex;
justify-content:center;
align-items:center;

font-size:24px;
font-weight:bold;
color:white;

transform:translate(-50%,-50%);
}

</style>
</head>

<body>

<div class="toolbar">

<button id="addBtn">
Add Dot
</button>

<button id="drawBtn">
Draw OFF
</button>

<button id="clearBtn">
Clear
</button>

</div>

<div id="app">

<canvas id="lineCanvas"></canvas>

<div id="dotLayer"></div>

<canvas id="drawCanvas"></canvas>

</div>

<script>

const dots=[];

let nextGroup=1;

const layer =
document.getElementById("dotLayer");

const lineCanvas =
document.getElementById("lineCanvas");

const drawCanvas =
document.getElementById("drawCanvas");

const lctx =
lineCanvas.getContext("2d");

const dctx =
drawCanvas.getContext("2d");

function resize(){

lineCanvas.width=
innerWidth;

lineCanvas.height=
innerHeight;

drawCanvas.width=
innerWidth;

drawCanvas.height=
innerHeight;

drawLines();

}

resize();

addEventListener(
"resize",
resize
);

/* ---------- DOT ---------- */

function makeDot(x,y){

const el =
document.createElement("div");

el.className="dot";

el.textContent="●";

layer.appendChild(el);

const dot={

x,
y,

group:null,

el

};

dots.push(dot);

update(dot);

drag(dot);

}

function update(dot){

dot.el.style.left=
dot.x+"px";

dot.el.style.top=
dot.y+"px";

}

function groupMembers(dot){

if(dot.group==null){

return [dot];

}

return dots.filter(
d=>d.group===dot.group
);

}

/* ---------- GROUP ---------- */

function merge(a,b){

if(
a.group===b.group &&
a.group!=null
){

return;

}

if(
a.group==null &&
b.group==null
){

const id=nextGroup++;

a.group=id;

b.group=id;

return;

}

if(a.group==null){

a.group=b.group;

return;

}

if(b.group==null){

b.group=a.group;

return;

}

const old=b.group;

dots.forEach(d=>{

if(d.group===old){

d.group=a.group;

}

});

}

/* ---------- SNAP ---------- */

function snap(dot){

let closest=null;

let best=99999;

for(const other of dots){

if(other===dot)
continue;

const dist=
Math.hypot(

other.x-dot.x,

other.y-dot.y

);

if(
dist<100 &&
dist<best
){

best=dist;

closest=other;

}

}

if(!closest) return;

const angle=
Math.atan2(

dot.y-closest.y,

dot.x-closest.x

);

const gap=70;

dot.x=
closest.x+
Math.cos(angle)*gap;

dot.y=
closest.y+
Math.sin(angle)*gap;

update(dot);

merge(
dot,
closest
);

}

/* ---------- DRAG ---------- */

function drag(dot){

let active=false;

let px=0;
let py=0;

dot.el.addEventListener(
"pointerdown",
e=>{

if(drawMode)
return;

active=true;

px=e.clientX;

py=e.clientY;

dot.el.setPointerCapture(
e.pointerId
);

}
);

dot.el.addEventListener(
"pointermove",
e=>{

if(!active)
return;

const dx=
e.clientX-px;

const dy=
e.clientY-py;

px=e.clientX;

py=e.clientY;

groupMembers(dot)
.forEach(d=>{

d.x+=dx;

d.y+=dy;

update(d);

});

drawLines();

}
);

function stop(){

if(!active)
return;

active=false;

snap(dot);

drawLines();

}

dot.el.addEventListener(
"pointerup",
stop
);

dot.el.addEventListener(
"pointercancel",
stop
);

}

/* ---------- LINES ---------- */

function drawLines(){

lctx.clearRect(
0,
0,
lineCanvas.width,
lineCanvas.height
);

lctx.lineWidth=4;

const grouped={};

dots.forEach(dot=>{

if(dot.group==null)
return;

if(!grouped[dot.group]){

grouped[dot.group]=[];

}

grouped[dot.group].push(dot);

});

Object.values(grouped)
.forEach(group=>{

for(
let i=0;
i<group.length-1;
i++
){

lctx.beginPath();

lctx.moveTo(
group[i].x,
group[i].y
);

lctx.lineTo(
group[i+1].x,
group[i+1].y
);

lctx.stroke();

}

});

}

/* ---------- DRAW ---------- */

let drawMode=false;

document
.getElementById("drawBtn")
.onclick=()=>{

drawMode=!drawMode;

drawCanvas.style.pointerEvents=

drawMode ?

"auto"

:

"none";

this.textContent=
drawMode ?

"Draw ON"

:

"Draw OFF";

};

let drawing=false;

drawCanvas.addEventListener(
"pointerdown",
e=>{

drawing=true;

dctx.beginPath();

dctx.moveTo(
e.clientX,
e.clientY
);

}
);

drawCanvas.addEventListener(
"pointermove",
e=>{

if(!drawing)
return;

dctx.lineWidth=4;

dctx.lineCap="round";

dctx.lineTo(
e.clientX,
e.clientY
);

dctx.stroke();

}
);

window.addEventListener(
"pointerup",
()=>drawing=false
);

/* ---------- BUTTONS ---------- */

document
.getElementById("addBtn")
.onclick=()=>{

makeDot(

100+
Math.random()*350,

120+
Math.random()*350

);

};

document
.getElementById("clearBtn")
.onclick=()=>{

dctx.clearRect(
0,
0,
drawCanvas.width,
drawCanvas.height
);

};

/* starter */

for(
let i=0;
i<5;
i++
){

makeDot(
150+i*80,
250
);

}

</script>

</body>
</html>
