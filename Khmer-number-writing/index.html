<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fruit Tree Preview</title>

<style>

*{

    box-sizing:border-box;

    touch-action:none;

}

body{

    margin:0;

    overflow:hidden;

    background:#dff5ff;

    font-family:Arial;

}

#toolbar{

    position:fixed;

    top:10px;

    left:10px;

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    z-index:9999;

}

button{

    padding:10px;

    border:none;

    border-radius:10px;

    font-size:18px;

    background:white;

    cursor:pointer;

}

canvas{

    position:absolute;

    top:0;

    left:0;

    z-index:1;

}

.treeGroup{

    position:absolute;

    width:420px;

    height:420px;

    z-index:10;

    border-radius:20px;

}

.treeSelected{

    outline:4px dashed blue;

    background:rgba(255,255,255,.15);

}

/* Tree GIF */

.treeImage{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    width:380px;

    height:380px;

    object-fit:contain;

    user-select:none;

    pointer-events:none;

}

.fruit{

    position:absolute;

    width:60px;

    height:60px;

    font-size:42px;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:grab;

}

.selectedFruit{

    outline:3px solid blue;

    border-radius:50%;

}

</style>

</head>

<body>

<div id="toolbar">

    <button onclick="addFruit('🍎')">🍎</button>

    <button onclick="addFruit('🍊')">🍊</button>

    <button onclick="addFruit('🥭')">🥭</button>

    <button onclick="copySelected()">📄</button>

    <button onclick="toggleDraw()">✏️</button>

    <button onclick="toggleEraser()">🩹</button>

    <button onclick="clearCanvas()">🧹</button>

</div>

<canvas id="draw"></canvas>

<div id="workspace"></div>

<script>

const canvas=document.getElementById("draw");

const ctx=canvas.getContext("2d");

function resize(){

    canvas.width=innerWidth;

    canvas.height=innerHeight;

}

resize();

addEventListener("resize",resize);

let drawMode=false;

let eraseMode=false;

let drawing=false;

function toggleDraw(){

    drawMode=!drawMode;

    eraseMode=false;

}

function toggleEraser(){

    eraseMode=!eraseMode;

    drawMode=false;

}

function clearCanvas(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

}

canvas.addEventListener("pointerdown",e=>{

    if(!drawMode && !eraseMode) return;

    drawing=true;

    ctx.beginPath();

    ctx.moveTo(e.clientX,e.clientY);

});

canvas.addEventListener("pointermove",e=>{

    if(!drawing) return;

    ctx.lineWidth=eraseMode ? 25 : 4;

    ctx.lineCap="round";

    ctx.globalCompositeOperation=

        eraseMode ? "destination-out" : "source-over";

    ctx.lineTo(e.clientX,e.clientY);

    ctx.stroke();

});

window.addEventListener("pointerup",()=>{

    drawing=false;

    ctx.globalCompositeOperation="source-over";

});

const workspace=document.getElementById("workspace");

let selectedTree=null;

let selectedFruit=null;

const GRID=50;

/* Create first tree */

createTree(120,140);

function createTree(x,y){

    const tree=document.createElement("div");

    tree.className="treeGroup";

    tree.style.left=x+"px";

    tree.style.top=y+"px";

    tree.innerHTML=`

        <img src="images/tree.gif" class="treeImage">

    `;

    workspace.appendChild(tree);

    setupTree(tree);

}

function setupTree(tree){

    tree.addEventListener("pointerdown",e=>{

        if(e.target.classList.contains("fruit"))

            return;

        selectedTree=tree;

        document

            .querySelectorAll(".treeGroup")

            .forEach(t=>t.classList.remove("treeSelected"));

        tree.classList.add("treeSelected");

        let ox=e.clientX-tree.offsetLeft;

        let oy=e.clientY-tree.offsetTop;

        function move(ev){

            tree.style.left=(ev.clientX-ox)+"px";

            tree.style.top=(ev.clientY-oy)+"px";

        }

        function up(){

            removeEventListener("pointermove",move);

            removeEventListener("pointerup",up);

        }

        addEventListener("pointermove",move);

        addEventListener("pointerup",up);

    });

}

function addFruit(type){

    if(!selectedTree){

        selectedTree=document.querySelector(".treeGroup");

    }

    const fruit=document.createElement("div");

    fruit.className="fruit";

    fruit.innerHTML=type;

    fruit.style.left="40px";

    fruit.style.top="90px";

    selectedTree.appendChild(fruit);

    dragFruit(fruit);

}

function dragFruit(el){

    let taps=0;

    el.addEventListener("pointerdown",e=>{

        e.stopPropagation();

        selectedFruit=el;

        document

            .querySelectorAll(".fruit")

            .forEach(f=>f.classList.remove("selectedFruit"));

        el.classList.add("selectedFruit");

        const tree=el.parentElement;

        let ox=

            e.clientX-

            tree.offsetLeft-

            el.offsetLeft;

        let oy=

            e.clientY-

            tree.offsetTop-

            el.offsetTop;

        function move(ev){

            let x=

                ev.clientX

                -tree.offsetLeft

                -ox;

            let y=

                ev.clientY

                -tree.offsetTop

                -oy;

            el.style.left=

                Math.round(x/GRID)*GRID+"px";

            el.style.top=

                Math.round(y/GRID)*GRID+"px";

        }

        function up(){

            removeEventListener("pointermove",move);

            removeEventListener("pointerup",up);

        }

        addEventListener("pointermove",move);

        addEventListener("pointerup",up);

    });

    el.addEventListener("click",()=>{

        taps++;

        setTimeout(()=>{

            taps=0;

        },300);

        if(taps>=2){

            el.remove();

        }

    });

}

function copySelected(){

    if(selectedFruit){

        const c=selectedFruit.cloneNode(true);

        c.style.left=

            (parseFloat(selectedFruit.style.left)+60)+"px";

        c.style.top=

            (parseFloat(selectedFruit.style.top)+20)+"px";

        selectedFruit.parentElement.appendChild(c);

        dragFruit(c);

        return;

    }

    if(selectedTree){

        createTree(

            selectedTree.offsetLeft+80,

            selectedTree.offsetTop+50

        );

    }

}

</script>

</body>

</html>
