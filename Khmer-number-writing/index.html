<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fruit Tree + Draw + Eraser</title>

<style>

*{

box-sizing:border-box;

touch-action:none;

}

body{

margin:0;

overflow:hidden;

background:#dff5ff;

font-family:Arial;

}

/* TOOLBAR */

#toolbar{

position:fixed;

top:10px;

left:10px;

display:flex;

gap:8px;

flex-wrap:wrap;

z-index:9999;

}

button{

padding:10px;

font-size:18px;

border:none;

border-radius:10px;

background:white;

box-shadow:0 2px 5px rgba(0,0,0,0.2);

}

/* CANVAS */

canvas{

position:absolute;

top:0;

left:0;

z-index:2;

}

/* TREE GROUP */

#treeGroup{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

width:460px;

height:520px;

z-index:10;

}

#tree{

width:100%;

height:100%;

pointer-events:none;

position:absolute;

}

/* FRUITS */

.fruit{

position:absolute;

width:60px;

height:60px;

display:flex;

justify-content:center;

align-items:center;

font-size:42px;

user-select:none;

z-index:20;

}

.selected{

outline:3px solid blue;

border-radius:50%;

}

</style>

</head>

<body>

<!-- TOOLBAR -->

<div id="toolbar">

<button onclick="addFruit('🍎')">🍎</button>

<button onclick="addFruit('🍊')">🍊</button>

<button onclick="addFruit('🥭')">🥭</button>

<button onclick="addFruit('🍌')">🍌</button>

<button onclick="addFruit('🍇')">🍇</button>

<button onclick="addFruit('🍐')">🍐</button>

<button onclick="copyFruit()">📄</button>

<button onclick="toggleDraw()">✏️</button>

<button onclick="toggleEraser()">🩹</button>

<button onclick="clearCanvas()">🧹</button>

</div>

<!-- DRAW CANVAS -->

<canvas id="draw"></canvas>

<!-- TREE -->

<div id="treeGroup">

<svg id="tree" viewBox="0 0 400 500">

<rect x="175" y="260" width="50" height="220" fill="#7b4d22"/>

<circle cx="200" cy="150" r="125" fill="#2f9f46"/>

<circle cx="110" cy="180" r="90" fill="#39b54a"/>

<circle cx="290" cy="180" r="90" fill="#39b54a"/>

<circle cx="200" cy="250" r="110" fill="#34a853"/>

</svg>

</div>

<script>

/* ===== CANVAS ===== */

const canvas=document.getElementById("draw");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=innerWidth;

canvas.height=innerHeight;

}

resize();

addEventListener("resize",resize);

/* ===== MODES ===== */

let drawMode=false;

let eraseMode=false;

let drawing=false;

/* ===== TOOL BUTTONS ===== */

function toggleDraw(){

drawMode=!drawMode;

eraseMode=false;

canvas.style.zIndex=drawMode?100:2;

}

function toggleEraser(){

eraseMode=!eraseMode;

drawMode=false;

canvas.style.zIndex=eraseMode?100:2;

}

function clearCanvas(){

ctx.clearRect(0,0,canvas.width,canvas.height);

}

/* ===== DRAW + ERASE ===== */

canvas.addEventListener("pointerdown",e=>{

if(!drawMode && !eraseMode) return;

drawing=true;

ctx.beginPath();

ctx.moveTo(e.clientX,e.clientY);

});

canvas.addEventListener("pointermove",e=>{

if(!drawing) return;

ctx.lineWidth=eraseMode?25:4;

ctx.lineCap="round";

ctx.globalCompositeOperation=

eraseMode?"destination-out":"source-over";

ctx.lineTo(e.clientX,e.clientY);

ctx.stroke();

});

window.addEventListener("pointerup",()=>{

drawing=false;

ctx.globalCompositeOperation="source-over";

});

/* ===== TREE + FRUITS ===== */

const treeGroup=document.getElementById("treeGroup");

const GRID=55;

let selected=null;

/* ADD FRUIT */

function addFruit(type="🍎"){

let f=document.createElement("div");

f.className="fruit";

f.innerHTML=type;

f.style.left="40px";

f.style.top="120px";

treeGroup.appendChild(f);

dragFruit(f);

}

/* DRAG FRUIT */

function dragFruit(el){

let ox,oy;

let taps=0;

el.addEventListener("pointerdown",e=>{

e.stopPropagation();

selected=el;

document.querySelectorAll(".fruit")

.forEach(x=>x.classList.remove("selected"));

el.classList.add("selected");

ox=e.clientX-el.offsetLeft;

oy=e.clientY-el.offsetTop;

function move(ev){

el.style.left=(ev.clientX-treeGroup.offsetLeft-ox)+"px";

el.style.top=(ev.clientY-treeGroup.offsetTop-oy)+"px";

}

function up(){

snap(el);

removeEventListener("pointermove",move);

removeEventListener("pointerup",up);

}

addEventListener("pointermove",move);

addEventListener("pointerup",up);

});

/* DOUBLE TAP DELETE */

el.addEventListener("click",()=>{

taps++;

setTimeout(()=>taps=0,300);

if(taps>=2) el.remove();

});

}

/* MAGNET GRID SNAP */

function snap(el){

let x=parseFloat(el.style.left);

let y=parseFloat(el.style.top);

el.style.left=Math.round(x/GRID)*GRID+"px";

el.style.top=Math.round(y/GRID)*GRID+"px";

}

/* COPY FRUIT */

function copyFruit(){

if(!selected) return;

let c=selected.cloneNode(true);

c.style.left=(parseFloat(selected.style.left)+60)+"px";

c.style.top=(parseFloat(selected.style.top)+20)+"px";

treeGroup.appendChild(c);

dragFruit(c);

}

/* ===== MOVE TREE ===== */

let tx,ty;

treeGroup.addEventListener("pointerdown",e=>{

if(e.target.classList.contains("fruit")) return;

tx=e.clientX-treeGroup.offsetLeft;

ty=e.clientY-treeGroup.offsetTop;

function move(ev){

treeGroup.style.left=(ev.clientX-tx)+"px";

treeGroup.style.top=(ev.clientY-ty)+"px";

treeGroup.style.transform="none";

}

function up(){

removeEventListener("pointermove",move);

removeEventListener("pointerup",up);

}

addEventListener("pointermove",move);

addEventListener("pointerup",up);

});

</script>

</body>

</html>
