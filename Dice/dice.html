<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>តម្លៃលេខតាមខ្ទង់</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#eef3f8;
}

#toolbar{
  position:fixed;
  top:0;
  left:0;
  right:0;

  min-height:80px;

  background:white;

  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;

  padding:10px;

  z-index:10;

  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

button,
.home-btn{

  padding:10px 14px;

  border:none;

  border-radius:10px;

  background:#2f80ed;

  color:white;

  font-size:16px;

  cursor:pointer;

  text-decoration:none;
}

#eraserBtn{
  background:#e76f51;
}

.home-btn{
  background:#27ae60;
}

#status{
  font-weight:bold;
}

#canvas{
  position:absolute;

  top:80px;
  left:0;

  width:100%;
  height:calc(100vh - 80px);

  background:white;

  touch-action:none;
}

</style>
</head>

<body>

<div id="toolbar">

<button onclick="addOne()">➕រាយ</button>

<button onclick="duplicateSelected()">
📄 Copy
</button>

<button onclick="deleteSelected()">
🗑 លុប
</button>

<button id="eraserBtn"
onclick="toggleEraserMode()">

🩹ជ័រលុប

</button>

<button onclick="clearDrawing()">

🧹សម្អាត

</button>

<a href="../index.html"
class="home-btn">

🏡 Home

</a>

<div id="status">

Ones: 0 | Tens: 0 | Hundreds: 0

</div>

</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const eraserBtn =
document.getElementById("eraserBtn");

const TOOLBAR_HEIGHT = 80;

const SIZE = 20;

let blocks = [];

let drawings = [];

let selected = null;

let drawing = false;

let eraseMode = false;

let isDragging = false;

let dragOffsetX = 0;

let dragOffsetY = 0;

let lastTap = 0;

let needsRedraw = true;

function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight
    - TOOLBAR_HEIGHT;

  requestDraw();
}

window.addEventListener(
"resize",
resizeCanvas
);

resizeCanvas();

function requestDraw(){

  needsRedraw = true;
}

function pointerPos(e){

  const r =
  canvas.getBoundingClientRect();

  return{

    x:e.clientX-r.left,

    y:e.clientY-r.top

  };
}

function updateStatus(){

  const ones =
  blocks.filter(
  b=>b.type==="one"
  ).length;

  const tens =
  blocks.filter(
  b=>b.type==="ten"
  ).length;

  const hundreds =
  blocks.filter(
  b=>b.type==="hundred"
  ).length;

  status.innerHTML =

`Ones: ${ones}
 | Tens: ${tens}
 | Hundreds: ${hundreds}`;
}

function toggleEraserMode(){

 eraseMode=!eraseMode;

 eraserBtn.innerHTML =

 eraseMode
 ? "✏️ Draw"
 : "🩹 Eraser";
}

function clearDrawing(){

 drawings=[];

 requestDraw();
}

function addOne(
x=100,
y=120
){

 blocks.push({

   type:"one",

   x,y,

   w:SIZE,

   h:SIZE,

   color:"#ffd166"

 });

 combineBlocks();
}

function combineBlocks(){

 while(
 blocks.filter(
 b=>b.type==="one"
 ).length>=10
 ){

   const first =
   blocks.find(
   b=>b.type==="one"
   );

   let removed=0;

   blocks =
   blocks.filter(b=>{

     if(
     b.type==="one"
     &&
     removed<10
     ){

       removed++;

       return false;
     }

     return true;

   });

   blocks.push({

     type:"ten",

     x:first.x,

     y:first.y,

     w:SIZE*10,

     h:SIZE,

     color:"#06d6a0"

   });

 }

 while(
 blocks.filter(
 b=>b.type==="ten"
 ).length>=10
 ){

   const first =
   blocks.find(
   b=>b.type==="ten"
   );

   let removed=0;

   blocks=
   blocks.filter(b=>{

     if(
     b.type==="ten"
     &&
     removed<10
     ){

       removed++;

       return false;
     }

     return true;

   });

   blocks.push({

     type:"hundred",

     x:first.x,

     y:first.y,

     w:SIZE*10,

     h:SIZE*10,

     color:"#ef476f"

   });

 }

 updateStatus();

 requestDraw();
}

function splitBlock(block){

 if(block.type==="ten"){

   blocks =
   blocks.filter(
   b=>b!==block
   );

   for(
   let i=0;
   i<10;
   i++
   ){

     blocks.push({

       type:"one",

       x:block.x+i*24,

       y:block.y,

       w:SIZE,

       h:SIZE,

       color:"#ffd166"

     });

   }

 }

 else if(
 block.type==="hundred"
 ){

   blocks =
   blocks.filter(
   b=>b!==block
   );

   for(
   let i=0;
   i<10;
   i++
   ){

     blocks.push({

       type:"ten",

       x:block.x,

       y:block.y+i*25,

       w:SIZE*10,

       h:SIZE,

       color:"#06d6a0"

     });

   }

 }

 selected = null;

 updateStatus();

 requestDraw();
}

function getBlock(x,y){

 for(
 let i=blocks.length-1;
 i>=0;
 i--
 ){

   const b=blocks[i];

   if(

   x>=b.x &&
   x<=b.x+b.w &&

   y>=b.y &&
   y<=b.y+b.h

   ){

     return b;
   }

 }

 return null;
}

function eraseAt(x,y){

 const radius2 =
 35*35;

 drawings =
 drawings.filter(line=>{

   return !line.points.some(p=>{

     const dx =
     p.x-x;

     const dy =
     p.y-y;

     return (

     dx*dx +

     dy*dy

     ) < radius2;

   });

 });

 requestDraw();
}

function startAction(e){

 e.preventDefault();

 try{

 canvas.setPointerCapture(
 e.pointerId
 );

 }catch(err){}

 const pos =
 pointerPos(e);

 if(eraseMode){

   eraseAt(
   pos.x,
   pos.y
   );

   return;
 }

 const block =
 getBlock(
 pos.x,
 pos.y
 );

 if(block){

   selected = block;

   dragOffsetX =
   pos.x-block.x;

   dragOffsetY =
   pos.y-block.y;

   isDragging = false;

   return;
 }

 selected = null;

 drawing = true;

 drawings.push({

   points:[pos]

 });

 requestDraw();
}

function moveAction(e){

 const pos =
 pointerPos(e);

 if(eraseMode){

   eraseAt(
   pos.x,
   pos.y
   );

   return;
 }

 if(selected){

   isDragging = true;

   selected.x =
   pos.x-dragOffsetX;

   selected.y =
   pos.y-dragOffsetY;

   requestDraw();

   return;
 }

 if(drawing){

   drawings[
   drawings.length-1
   ].points.push(pos);

   requestDraw();
 }
}

function endAction(e){

 drawing = false;

 try{

 canvas.releasePointerCapture(
 e.pointerId
 );

 }catch(err){}

 const tappedBlock =
 selected;

 if(
 tappedBlock &&
 !isDragging
 ){

   const now =
   Date.now();

   if(
   now-lastTap < 300
   ){

     splitBlock(
     tappedBlock
     );
   }

   lastTap = now;
 }

 selected = null;

 isDragging = false;

 requestDraw();
}

function duplicateSelected(){

 if(!selected) return;

 const copy = {

 type:selected.type,

 x:selected.x+25,

 y:selected.y+25,

 w:selected.w,

 h:selected.h,

 color:selected.color

 };

 blocks.push(copy);

 selected = copy;

 updateStatus();

 requestDraw();
}

function deleteSelected(){

 if(!selected) return;

 blocks =
 blocks.filter(
 b=>b!==selected
 );

 selected = null;

 updateStatus();

 requestDraw();
}

function render(){

 if(needsRedraw){

 ctx.clearRect(
 0,0,
 canvas.width,
 canvas.height
 );

 drawings.forEach(line=>{

 if(line.points.length<2)
 return;

 ctx.beginPath();

 line.points.forEach((p,i)=>{

 if(i===0)

 ctx.moveTo(
 p.x,p.y
 );

 else

 ctx.lineTo(
 p.x,p.y
 );

 });

 ctx.strokeStyle="black";

 ctx.lineWidth=3;

 ctx.lineCap="round";

 ctx.lineJoin="round";

 ctx.stroke();

 });

 for(const b of blocks){

 ctx.fillStyle =
 b.color;

 if(b.type==="one"){

 ctx.fillRect(
 b.x,b.y,
 b.w,b.h
 );

 ctx.strokeRect(
 b.x,b.y,
 b.w,b.h
 );

 }

 else if(
 b.type==="ten"
 ){

 for(
 let i=0;
 i<10;
 i++
 ){

 ctx.fillRect(

 b.x+i*SIZE,

 b.y,

 SIZE,

 SIZE

 );

 ctx.strokeRect(

 b.x+i*SIZE,

 b.y,

 SIZE,

 SIZE

 );

 }

 }

 else{

 for(
 let r=0;
 r<10;
 r++
 ){

 for(
 let c=0;
 c<10;
 c++
 ){

 ctx.fillRect(

 b.x+c*SIZE,

 b.y+r*SIZE,

 SIZE,

 SIZE

 );

 ctx.strokeRect(

 b.x+c*SIZE,

 b.y+r*SIZE,

 SIZE,

 SIZE

 );

 }

 }

 }

 }

 needsRedraw=false;

 }

 requestAnimationFrame(
 render
 );
}

canvas.addEventListener(
"pointerdown",
startAction
);

canvas.addEventListener(
"pointermove",
moveAction
);

canvas.addEventListener(
"pointerup",
endAction
);

canvas.addEventListener(
"pointercancel",
endAction
);

render();

updateStatus();

</script>

</body>
</html>
