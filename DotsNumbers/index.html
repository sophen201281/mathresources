<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match the dots</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+Khmer:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b2a49; --ink:#f4f7fb; --coin:#f2b134; --coin-ink:#1b2a49;
  --center:#f4f7fb; --dot:#1b2a49; --good:#5fd1a8; --bad:#ff7a8a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121c33; }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Fredoka","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(14px,3vh,32px); padding:16px; box-sizing:border-box;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
.topbar{
  position:fixed; z-index:30;
  top:calc(env(safe-area-inset-top,0px) + 10px);
  left:calc(env(safe-area-inset-left,0px) + 12px);
}
.homeBtn{
  display:inline-flex; align-items:center; gap:6px;
  min-height:44px; box-sizing:border-box; padding:8px 18px;
  font:inherit; font-size:16px; font-weight:600; line-height:1.2;
  color:var(--ink); text-decoration:none;
  background:rgba(244,247,251,.12);
  border:2px solid rgba(244,247,251,.3); border-radius:999px;
  touch-action:manipulation;
}
.homeBtn:active{background:rgba(244,247,251,.22)}
.homeBtn:focus-visible{outline:3px solid var(--good); outline-offset:3px}
@media (hover:hover){.homeBtn:hover{background:rgba(244,247,251,.2)}}
.board{position:relative; container-type:inline-size; flex:none; aspect-ratio:1; width:min(92vw,62vh,680px); width:min(92vw,62dvh,680px)}
.center,.coin{position:absolute; border-radius:50%; transform:translate(-50%,-50%)}
.center{
  left:50%; top:50%; width:34%; aspect-ratio:1; background:var(--center);
  box-shadow:0 0 0 6px rgba(244,247,251,.15);
}
.coin{
  width:22%; aspect-ratio:1; padding:0; border:0; background:none; cursor:pointer; perspective:600px; touch-action:manipulation;
  transition:left .8s cubic-bezier(.5,0,.2,1), top .8s cubic-bezier(.5,0,.2,1), width .8s cubic-bezier(.5,0,.2,1), opacity .4s;
}
.flip{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.5,0,.2,1) .15s}
.face{
  position:absolute; inset:0; border-radius:50%; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center;
}
.front{background:var(--coin); color:var(--coin-ink); font-size:min(9vw,5.4vh,38px); font-size:8cqw; font-weight:600}
.back{background:var(--center); transform:rotateY(180deg); box-shadow:0 0 0 6px rgba(95,209,168,.55)}
.coin.go{left:50%!important; top:50%!important; width:34%; z-index:5}
.coin.go .flip{transform:rotateY(180deg)}
.coin.fade{opacity:.25; pointer-events:none}
.coin:focus-visible{outline:3px solid var(--good); outline-offset:3px}
.coin.shake{animation:shake .4s}
.coin.shake .front{background:var(--bad)}
@keyframes shake{25%{translate:-6px 0}50%{translate:6px 0}75%{translate:-4px 0}}
.dots{width:62%; aspect-ratio:1; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); place-items:center}
.dots i{width:62%; aspect-ratio:1; border-radius:50%; background:var(--dot)}
.dots i.off{visibility:hidden}
.msg{min-height:2.6em; text-align:center; font-size:clamp(16px,1.1rem + .5vw,26px); max-width:min(80vw,520px); line-height:1.3}
button.again{
  font:inherit; font-size:17px; font-weight:600; color:var(--coin-ink); background:var(--good);
  border:0; border-radius:999px; padding:12px 30px; min-height:44px; cursor:pointer; visibility:hidden
}
button.again.show{visibility:visible}
.slot{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;border:2px dashed rgba(244,247,251,.28);box-sizing:border-box;transform:translate(-50%,-50%)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.panel{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px)}
.range{display:flex;align-items:center;gap:10px;font-size:clamp(16px,1.1rem + .4vw,22px)}
.range input{width:4em;height:44px;box-sizing:border-box;font:inherit;text-align:center;color:var(--ink);background:rgba(244,247,251,.1);border:2px solid rgba(244,247,251,.3);border-radius:12px;user-select:text;-webkit-user-select:text}
.range input:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.dots.multi{display:flex;flex-wrap:wrap;justify-content:center;align-content:center}
@media (hover:hover){.coin:not(.go):hover .front{filter:brightness(1.1)}}
/* short landscape screens: board on the left, text on the right */
@media (orientation:landscape) and (max-height:520px){
  body{flex-direction:row; gap:28px; padding:10px 20px}
  .board{width:min(86vh,52vw); width:min(86dvh,52vw)}
  .panel{align-items:flex-start;max-width:36vw}
  .msg{max-width:34vw; text-align:left; min-height:0}
  .homeBtn{min-height:40px; padding:6px 14px; font-size:15px}
}
/* very small phones */
@media (max-width:340px){ .board{width:94vw} .msg{font-size:15px} }
@media (prefers-reduced-motion: reduce){
  .coin,.flip{transition-duration:.01s!important; transition-delay:0s!important}
  .coin.shake{animation:none}
}
</style>
</head>
<body>
<div class="topbar">
  <a class="homeBtn" href="../index.html">🏠 ទំព័រដើម</a>
</div>
<div class="board" id="board"><div class="center" id="center"></div></div>
<div class="panel">
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="range">Numbers from
    <input id="min" type="number" inputmode="numeric" min="1" max="19" value="1" aria-label="Lowest number">
    to
    <input id="max" type="number" inputmode="numeric" min="2" max="20" value="6" aria-label="Highest number">
  </div>
  <button class="again" id="again">Play again</button>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
  var PATTERNS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  var board=document.getElementById('board'), center=document.getElementById('center'),
      msg=document.getElementById('msg'), again=document.getElementById('again');
  var target, locked, score=0, lo=1, hi=6;

  /* ---- sound + fireworks ---- */
  var fx=document.getElementById('fx'), g=fx.getContext('2d'), parts=[], raf=0, W=0, H=0;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var AC=window.AudioContext||window.webkitAudioContext, ac=null;
  function size(){var r=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;fx.width=W*r;fx.height=H*r;g.setTransform(r,0,0,r,0,0);}
  size(); window.addEventListener('resize',size);
  function unlock(){try{if(!ac&&AC)ac=new AC();if(ac&&ac.state==='suspended')ac.resume();}catch(e){}}
  function tone(f,t,d,type,vol){
    if(!ac)return;
    var o=ac.createOscillator(),a=ac.createGain();
    o.type=type;o.frequency.value=f;
    a.gain.setValueAtTime(0.0001,t);
    a.gain.exponentialRampToValueAtTime(vol,t+.02);
    a.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(a);a.connect(ac.destination);o.start(t);o.stop(t+d+.05);
  }
  function chime(){
    try{
      unlock(); if(!ac)return;
      var t=ac.currentTime+.02;
      [523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){tone(f,t+i*.11,.5,'triangle',.18);});
      tone(1046.5,t+.6,.9,'sine',.12); tone(1318.5,t+.6,.9,'sine',.1);
    }catch(e){}
  }
  function pop(){try{if(ac){var t=ac.currentTime;tone(500+Math.random()*300,t,.12,'square',.03);tone(120,t,.18,'sine',.1);}}catch(e){}}
  function burst(x,y){
    var h=Math.random()*360,n=48;
    for(var i=0;i<n;i++){
      var a=i/n*Math.PI*2+Math.random()*.2,s=2+Math.random()*3.6;
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,h:h+Math.random()*40});
    }
    pop();
  }
  function frame(){
    g.clearRect(0,0,W,H);
    g.globalCompositeOperation='lighter';
    parts=parts.filter(function(p){return p.life>0;});
    parts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.life-=.014;
      g.fillStyle='hsla('+p.h+',90%,62%,'+Math.max(p.life,0)+')';
      g.beginPath();g.arc(p.x,p.y,2.3,0,6.283);g.fill();
    });
    if(parts.length){raf=requestAnimationFrame(frame);}else{raf=0;g.clearRect(0,0,W,H);}
  }
  function celebrate(){
    chime();
    if(reduce)return;
    [0,300,600,900].forEach(function(d){
      setTimeout(function(){
        burst(W*(.15+Math.random()*.7),H*(.12+Math.random()*.38));
        if(!raf)raf=requestAnimationFrame(frame);
      },d);
    });
  }

  /* ---- game ---- */
  function dots(n){
    var d=document.createElement('div'); d.className='dots';
    if(n>6){
      d.className='dots multi'; var cols=Math.ceil(Math.sqrt(n));
      for(var k=0;k<n;k++){var e=document.createElement('i'); e.style.width=(78/cols)+'%'; e.style.margin=(11/cols)+'%'; d.appendChild(e);}
      return d;
    }
    for(var i=0;i<9;i++){var c=document.createElement('i'); if(PATTERNS[n].indexOf(i)<0)c.className='off'; d.appendChild(c);}
    return d;
  }
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  function newRound(keepTarget){
    locked=false;
    Array.prototype.slice.call(board.querySelectorAll('.coin,.slot')).forEach(function(c){c.remove();});
    var all=[]; for(var v=lo;v<=hi;v++)all.push(v);
    var ring=shuffle(all).slice(0,6);
    target=ring[Math.floor(Math.random()*ring.length)];
    center.style.visibility='visible';
    center.innerHTML=''; center.appendChild(dots(target)); center.firstChild.style.cssText='width:62%;margin:auto;height:100%;aspect-ratio:auto';
    center.style.display='flex'; center.style.alignItems='center'; center.style.justifyContent='center';
    ring.forEach(function(n,i){
      var a=(-90+i*360/ring.length)*Math.PI/180;
      var b=document.createElement('button'); b.className='coin'; b.type='button';
      b.setAttribute('aria-label','Number '+n); b.dataset.n=n;
      b.style.left=(50+38*Math.cos(a))+'%'; b.style.top=(50+38*Math.sin(a))+'%';
      b.innerHTML='<div class="flip"><div class="face front">'+n+'</div><div class="face back"></div></div>';
      b.querySelector('.back').appendChild(dots(n));
      b.addEventListener('click',function(){pick(b,n);});
      board.appendChild(b);
    });
    msg.textContent='Count the dots, then tap the matching number.';
    again.classList.remove('show');
  }

  function pick(b,n){
    if(locked) return;
    if(n!==target){
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      msg.textContent='Not '+n+'. Count the dots again.';
      return;
    }
    locked=true; score++;
    var left=Array.prototype.slice.call(board.querySelectorAll('.coin')).filter(function(c){return c!==b;});
    var next=left.length?+left[Math.floor(Math.random()*left.length)].dataset.n:n;
    var back=b.querySelector('.back'); back.innerHTML=''; back.appendChild(dots(next));
    Array.prototype.slice.call(board.querySelectorAll('.coin')).forEach(function(c){ if(c!==b) c.style.opacity='.55'; });
    b.classList.add('go');
    unlock(); setTimeout(celebrate,950);
    msg.textContent='យ៉េ! '+n+' ត្រូវបាន. Folding to the middle…';
    setTimeout(function(){
      var s=document.createElement('div'); s.className='slot'; s.style.left=b.style.left; s.style.top=b.style.top; board.insertBefore(s,board.firstChild);
      b.remove();
      center.innerHTML=''; center.appendChild(dots(next)); center.firstChild.style.cssText='width:62%;margin:auto;height:100%;aspect-ratio:auto';
      left.forEach(function(c){c.style.opacity='';});
      if(left.length){
        target=next; locked=false;
        msg.textContent='Matched: '+score+'. ចូរស្វែងរកលេខ ដែលត្រូវនឹងចំនួនចំណុចនេះ។';
      }else{
        msg.textContent='All '+score+' ត្រឹមត្រូវ​​ ពូកែរាប់មែន!';
        again.classList.add('show'); celebrate();
      }
    },1500);
  }

  again.addEventListener('click',function(){score=0;newRound();});

  var minI=document.getElementById('min'), maxI=document.getElementById('max');
  function applyRange(){
    var x=parseInt(minI.value,10), y=parseInt(maxI.value,10);
    if(isNaN(x))x=lo; if(isNaN(y))y=hi;
    x=Math.max(1,Math.min(19,x)); y=Math.max(x+1,Math.min(20,y));
    lo=x; hi=y; minI.value=x; maxI.value=y;
    score=0; newRound();
  }
  minI.addEventListener('change',applyRange);
  maxI.addEventListener('change',applyRange);
  newRound();
})();
</script>
</body>
</html>
