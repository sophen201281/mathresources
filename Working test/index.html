<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D flip book · Reveal Words</title>
  <!-- Google Font: Khmer Battambang -->
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #d9c8b2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Battambang', 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
      margin: 0;
      touch-action: pan-y;
    }

    .flipbook-wrapper {
      perspective: 2500px;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .flipbook {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .page {
      position: absolute;
      width: 50%;
      height: 100%;
      top: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: #fcf8f0;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.2rem 1rem;
      text-align: center;
      box-sizing: border-box;
      border: 1px solid #e3d7c8;
      pointer-events: none;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1), filter 0.3s ease;
      will-change: transform;
      background-image: radial-gradient(circle at 20% 30%, rgba(255,245,235,0.3) 0%, transparent 60%);
    }

    .page-left {
      left: 0;
      border-radius: 8px 0 0 8px;
      border-right: 1px solid #d0c0ac;
      transform-origin: right center;
      background: #faf5eb;
    }

    .page-right {
      left: 50%;
      border-radius: 0 8px 8px 0;
      border-left: 1px solid #d0c0ac;
      transform-origin: left center;
      background: #fcf8f0;
    }

    .cover {
      background: #2b4a5c;
      color: #f5e9da;
      border: 2px solid #1d3442;
    }
    .cover h1 {
      font-size: clamp(2rem, 8vw, 3.8rem);
      font-weight: 700;
      letter-spacing: 4px;
      text-shadow: 2px 2px 0 #14222b;
      margin-bottom: 0.3rem;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .cover .sub {
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      opacity: 0.7;
      border-top: 1px solid #8ba0b0;
      padding-top: 0.6rem;
      width: 70%;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }

    .back-cover {
      background: #2b4a5c;
      color: #f5e9da;
      border: 2px solid #1d3442;
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: 2px;
    }
    .back-cover .sub {
      opacity: 0.5;
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      margin-top: 0.5rem;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }

    .page-title {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 700;
      color: #1f3a47;
      margin-bottom: 0.5rem;
      line-height: 1.2;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }

    .sentence-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px;
      position: relative;
    }
    
    .word-box {
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      color: #1f2e3a;
      font-weight: 400;
      padding: 6px 12px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }

    /* INTERACTIVE WORD BOX */
    .interactive-box {
      display: inline-flex;
      position: relative;
      pointer-events: auto;
      z-index: 20;
      padding: 8px 20px;
      background: #f0e6da;
      border-radius: 12px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.06);
      min-width: 100px;
      min-height: 50px;
      align-items: center;
      border: 2px solid #cfc2b2;
      overflow: visible;
    }

    .interactive-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
    }

    .hidden-word {
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      font-weight: 400;
      color: #1f3a47;
      white-space: nowrap;
      position: relative;
      z-index: 1;
      letter-spacing: 0.5px;
      opacity: 0.3;
      transition: opacity 0.4s ease;
      padding: 4px 8px;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .hidden-word.revealed {
      opacity: 1;
    }

    .word-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #faf5eb;
      border: 2px solid #d4c4b0;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      font-weight: 700;
      color: #c05c5c;
      cursor: grab;
      touch-action: none;
      z-index: 5;
      transition: box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      padding: 8px 16px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .word-cover:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      border-color: #bfae99;
    }
    .word-cover:active {
      cursor: grabbing;
    }
    .word-cover.dragging {
      box-shadow: 0 8px 28px rgba(0,0,0,0.3);
      background: #fcfbf7;
      border-color: #a8907a;
      z-index: 10;
      cursor: grabbing;
    }

    .drag-hint {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      color: #b0a496;
      opacity: 0.8;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.2s ease;
      letter-spacing: 0.5px;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .word-cover.dragging ~ .drag-hint {
      opacity: 0;
    }

    .page-emoji {
      font-size: clamp(4rem, 15vw, 8rem);
      line-height: 1.2;
      filter: drop-shadow(2px 6px 12px rgba(0,0,0,0.15));
      margin: 0.2rem 0;
    }

    .word-label {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      opacity: 0.5;
      margin-top: 0.3rem;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
      font-weight: 400;
    }

    .empty-page {
      background: #f4ede3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b8aa98;
      font-style: italic;
      letter-spacing: 2px;
      font-size: 1.2rem;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }

    .touch-zones-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }
    .touch-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      pointer-events: auto;
      cursor: pointer;
    }
    .touch-left { left: 0; }
    .touch-right { right: 0; }

    .page-indicator {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(30, 45, 55, 0.8);
      backdrop-filter: blur(4px);
      color: #f0ede5;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      border: 1px solid #b6a692;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 300;
      pointer-events: none;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }

    @media (max-width: 540px) {
      .page { padding: 0.6rem 0.4rem; }
      .interactive-box {
        padding: 6px 14px;
        min-width: 80px;
        min-height: 40px;
      }
      .hidden-word {
        font-size: 1rem;
        padding: 2px 4px;
      }
      .word-cover {
        font-size: 1rem;
        padding: 4px 10px;
        border-radius: 8px;
      }
      .drag-hint {
        font-size: 0.5rem;
        bottom: -18px;
      }
    }

    .page.flipping-left {
      transform: rotateY(-18deg) skewY(1.5deg) scaleX(0.96);
      filter: brightness(0.96) drop-shadow(4px 0 12px rgba(0,0,0,0.08));
    }
    .page.flipping-right {
      transform: rotateY(18deg) skewY(-1.5deg) scaleX(0.96);
      filter: brightness(0.96) drop-shadow(-4px 0 12px rgba(0,0,0,0.08));
    }

    .page.turning {
      transition: transform 0.7s cubic-bezier(0.15, 0.85, 0.35, 1), filter 0.4s ease;
    }

    .flipbook-wrapper::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 5%;
      width: 90%;
      height: 20px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(8px);
      z-index: -1;
    }
  </style>
</head>
<body>

  <div class="page-indicator" id="pageIndicator">គម្របខាងមុខ</div>

  <div class="flipbook-wrapper" id="wrapper">
    <div class="flipbook" id="flipbook">

      <!-- SPREAD 0: FRONT COVER -->
      <div class="page page-left cover" data-page="0">

      <!-- SPREAD 1: empty + title page -->

      <div class="page page-right" data-page="3">
        <div class="page-title">ខ្ញុំអាចមើលឃើញ</div>

          </div>

      <!-- SPREAD 3: DOG -->
      <div class="page page-left" data-page="6">
        <div class="sentence-container">
          <div class="word-box">ខ្ញុំ</div>
          <div class="word-box">អាច</div>
          <div class="word-box">មើល</div>
          <div class="word-box">ឃើញ</div>
          <div class="interactive-box" id="dogBox">
            <div class="interactive-content">
              <span class="hidden-word" id="dogText">ឆ្កែ</span>

  <script>
    (function(){
      const pageIndicator = document.getElementById('pageIndicator');
      const wrapper = document.getElementById('wrapper');
      const pages = document.querySelectorAll('.page');
      const touchLeft = document.getElementById('touchLeft');
      const touchRight = document.getElementById('touchRight');

      const TOTAL_PAGES = pages.length;
      const SPREADS = TOTAL_PAGES / 2; 
      let currentSpread = 0;
      let isFlipping = false;

      const spreadLabels = [
        'គម្របខាងមុខ',
        'ទំព័រចំណងជើង',
        'ផ្កា',
        'ឆ្កែ',
        'ឆ្មា',
        'ឡាន',
        'ដើមឈើ',
        'ព្រះអាទិត្យ',
        'គម្របខាងក្រោយ'
      ];

      // ----- DRAG SYSTEM FOR ALL INTERACTIVE WORDS -----
      const dragInstances = [];

      function createDragInstance(coverId, textId, boxId) {
        const cover = document.getElementById(coverId);
        const text = document.getElementById(textId);
        const box = document.getElementById(boxId);
        
        if (!cover || !text || !box) return null;

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let currentX = 0;
        let currentY = 0;
        let elementStartX = 0;
        let elementStartY = 0;
        let isRevealed = false;

        const SNAP_THRESHOLD = 30;
        const REVEAL_THRESHOLD = 50;

        function setPosition(x, y, animate = false) {
          currentX = x;
          currentY = y;
          
          if (animate) {
            cover.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
          } else {
            cover.style.transition = 'none';
          }
          
          cover.style.transform = `translate(${x}px, ${y}px)`;
          
          const distance = Math.sqrt(x * x + y * y);
          
          if (distance > REVEAL_THRESHOLD && !isRevealed) {
            isRevealed = true;
            text.classList.add('revealed');
          } else if (distance <= REVEAL_THRESHOLD && isRevealed) {
            isRevealed = false;
            text.classList.remove('revealed');
          }
        }

        function snapToOrigin() {
          setPosition(0, 0, true);
          setTimeout(() => {
            cover.style.transition = '';
          }, 500);
        }

        function onDragStart(e) {
          if (isFlipping) return;
          
          const touch = e.touches ? e.touches[0] : e;
          isDragging = true;
          
          dragStartX = touch.clientX;
          dragStartY = touch.clientY;
          elementStartX = currentX;
          elementStartY = currentY;
          
          cover.classList.add('dragging');
          cover.style.transition = 'none';
          
          e.preventDefault();
          e.stopPropagation();
        }

        function onDragMove(e) {
          if (!isDragging) return;
          
          const touch = e.touches ? e.touches[0] : e;
          const deltaX = touch.clientX - dragStartX;
          const deltaY = touch.clientY - dragStartY;
          
          let newX = elementStartX + deltaX;
          let newY = elementStartY + deltaY;
          
          newX = Math.max(-200, Math.min(200, newX));
          newY = Math.max(-200, Math.min(200, newY));
          
          setPosition(newX, newY, false);
          
          e.preventDefault();
          e.stopPropagation();
        }

        function onDragEnd(e) {
          if (!isDragging) return;
          isDragging = false;
          
          cover.classList.remove('dragging');
          
          const distance = Math.sqrt(currentX * currentX + currentY * currentY);
          if (distance < SNAP_THRESHOLD) {
            snapToOrigin();
          } else {
            cover.style.transition = '';
          }
          
          e.preventDefault();
          e.stopPropagation();
        }

        // Mouse events
        cover.addEventListener('mousedown', onDragStart);
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);

        // Touch events
        cover.addEventListener('touchstart', onDragStart, { passive: false });
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', onDragEnd, { passive: false });

        // Prevent click from triggering page flip
        cover.addEventListener('click', function(e) {
          e.stopPropagation();
        });

        return {
          setPosition,
          snapToOrigin,
          reset: () => setPosition(0, 0, false)
        };
      }

      // Initialize all interactive words
      const wordConfigs = [
        { cover: 'flowerCover', text: 'flowerText', box: 'flowerBox' },
        { cover: 'dogCover', text: 'dogText', box: 'dogBox' },
        { cover: 'catCover', text: 'catText', box: 'catBox' },
        { cover: 'carCover', text: 'carText', box: 'carBox' },
        { cover: 'treeCover', text: 'treeText', box: 'treeBox' },
        { cover: 'sunCover', text: 'sunText', box: 'sunBox' }
      ];

      wordConfigs.forEach(config => {
        const instance = createDragInstance(config.cover, config.text, config.box);
        if (instance) {
          dragInstances.push(instance);
          instance.reset();
        }
      });

      // ----- PAGE FLIP LOGIC -----
      function applyCurve(page, direction) {
        page.classList.add('turning');
        if (direction === 'left') {
          page.classList.add('flipping-left');
          page.classList.remove('flipping-right');
        } else if (direction === 'right') {
          page.classList.add('flipping-right');
          page.classList.remove('flipping-left');
        }
        setTimeout(() => {
          page.classList.remove('flipping-left', 'flipping-right', 'turning');
        }, 750);
      }

      function updateFlip() {
        pages.forEach(page => {
          const pageNum = parseInt(page.getAttribute('data-page'), 10);
          const pageSpread = Math.floor(pageNum / 2);
          const isLeft = page.classList.contains('page-left');
          const isRight = page.classList.contains('page-right');

          page.classList.remove('flipping-left', 'flipping-right', 'turning');

          if (pageSpread < currentSpread) {
            if (isRight) {
              page.style.transform = 'rotateY(-180deg)';
            } else {
              page.style.transform = 'rotateY(0deg)';
            }
            page.style.zIndex = 10 + pageSpread;
            page.style.filter = 'brightness(0.92) drop-shadow(-2px 0 6px rgba(0,0,0,0.06))';
          } 
          else if (pageSpread === currentSpread) {
            page.style.transform = 'rotateY(0deg)';
            page.style.zIndex = 150;
            page.style.filter = 'brightness(1) drop-shadow(0 0 6px rgba(0,0,0,0.02))';
          } 
          else {
            if (isLeft) {
              page.style.transform = 'rotateY(180deg)';
            } else {
              page.style.transform = 'rotateY(0deg)';
            }
            page.style.zIndex = 10 + (TOTAL_PAGES - pageNum);
            page.style.filter = 'brightness(0.96) drop-shadow(2px 0 8px rgba(0,0,0,0.04))';
          }
        });

        if (currentSpread < spreadLabels.length) {
          pageIndicator.textContent = spreadLabels[currentSpread];
        }
      }

      function animateCurve(direction) {
        const leftPage = document.querySelector(`.page-left[data-page="${currentSpread * 2}"]`);
        const rightPage = document.querySelector(`.page-right[data-page="${currentSpread * 2 + 1}"]`);
        
        if (direction === 1) {
          if (leftPage) applyCurve(leftPage, 'left');
          const prevRight = document.querySelector(`.page-right[data-page="${(currentSpread - 1) * 2 + 1}"]`);
          if (prevRight) applyCurve(prevRight, 'right');
        } else if (direction === -1) {
          if (rightPage) applyCurve(rightPage, 'right');
          const prevLeft = document.querySelector(`.page-left[data-page="${(currentSpread + 1) * 2}"]`);
          if (prevLeft) applyCurve(prevLeft, 'left');
        }
      }

      function goToSpread(spreadIndex) {
        if (isFlipping) return;
        if (spreadIndex < 0 || spreadIndex >= SPREADS || spreadIndex === currentSpread) return;
        
        isFlipping = true;
        const dir = spreadIndex > currentSpread ? 1 : -1;
        animateCurve(dir);
        currentSpread = spreadIndex;
        updateFlip();
        
        setTimeout(() => {
          isFlipping = false;
        }, 750);
      }

      touchLeft.addEventListener('click', function(e) {
        if (isFlipping) return;
        if (currentSpread > 0) goToSpread(currentSpread - 1);
        e.stopPropagation();
      });

      touchRight.addEventListener('click', function(e) {
        if (isFlipping) return;
        if (currentSpread < SPREADS - 1) goToSpread(currentSpread + 1);
        e.stopPropagation();
      });

      document.addEventListener('keydown', function(e) {
        if (isFlipping) return;
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          if (currentSpread > 0) goToSpread(currentSpread - 1);
        } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          if (currentSpread < SPREADS - 1) goToSpread(currentSpread + 1);
        }
      });

      wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

      // Initialize
      updateFlip();

    })();
  </script>

</body>
</html>
