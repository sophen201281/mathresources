<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Place Value Blocks</title>
<style>
  :root{
    --paper:#faf7f0;
    --ink:#2e2a24;
    --line:#d8d0c0;
    --yellow:#f4c430;
    --yellow-dark:#c99a00;
    --accent:#3d5a52;
    --accent-soft:#e8efec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:16px;
    touch-action:manipulation;
  }
  h1{
    font-size:1.4rem;
    margin:0 0 4px 0;
    letter-spacing:.02em;
  }
  p.sub{
    margin:0 0 20px 0;
    color:#6b6455;
    font-size:.92rem;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  select{
    font-size:1rem;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:white;
    color:var(--ink);
  }
  button.reset{
    font-size:.9rem;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--accent);
    background:white;
    color:var(--accent);
    cursor:pointer;
  }
  button.reset:hover{ background:var(--accent-soft); }
  button.reset:active{ background:var(--accent-soft); }

  .layout{
    display:flex;
    gap:24px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  /* --- Palette (the "drawing" area with source blocks) --- */
  .palette{
    background:white;
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    width:220px;
    flex-shrink:0;
    position:sticky;
    top:16px;
    z-index:5;
  }
  .palette h2{
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:#8a8271;
    margin:0 0 14px 0;
  }
  .palette-item{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  .palette-item:last-child{ margin-bottom:0; }
  .palette-item:active{ cursor:grabbing; }
  .palette-label{
    font-size:.85rem;
    color:#544e40;
    pointer-events:none;
  }
  .palette-label b{ display:block; color:var(--ink); font-size:.9rem; }

  /* block shapes */
  .block-ones{
    width:26px; height:26px;
    background:var(--yellow);
    border:1.5px solid var(--yellow-dark);
    border-radius:3px;
    pointer-events:none;
  }
  .block-tens{
    width:26px; height:130px;
    background:var(--yellow);
    border:1.5px solid var(--yellow-dark);
    border-radius:3px;
    display:flex;
    flex-direction:column;
    pointer-events:none;
  }
  .block-tens .seg{
    flex:1;
    border-bottom:1px solid var(--yellow-dark);
  }
  .block-tens .seg:last-child{ border-bottom:none; }
  .block-hundreds{
    width:130px; height:130px;
    background:var(--yellow);
    border:1.5px solid var(--yellow-dark);
    border-radius:3px;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(10,1fr);
    pointer-events:none;
  }
  .block-hundreds .cell{
    border:.5px solid var(--yellow-dark);
  }

  /* small preview scale used inside table columns */
  .mini-ones{ width:20px; height:20px; }
  .mini-tens{ width:20px; height:100px; }
  .mini-hundreds{ width:100px; height:100px; }

  /* --- Table --- */
  #tableWrap{
    max-width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  table{
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  th{
    background:var(--accent);
    color:white;
    font-size:.8rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:10px 6px;
    text-align:center;
  }
  td{
    vertical-align:top;
    border:1px solid var(--line);
    padding:10px;
    min-width:150px;
  }
  .col-section{
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:8px;
    padding:8px;
    background:#fffdf8;
  }
  .section-label{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:#9a9280;
    margin-bottom:6px;
  }
  .col-body{
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:6px;
    height:150px;
    overflow-y:auto;
    border-radius:6px;
    transition:background .15s;
  }
  .col-body.dragover{ background:var(--accent-soft); }
  .col-footer{
    margin-top:8px;
    font-size:.8rem;
    color:#6b6455;
    display:flex;
    justify-content:space-between;
  }
  .col-footer button{
    border:none;
    background:none;
    color:var(--accent);
    cursor:pointer;
    font-size:.85rem;
    text-decoration:underline;
    padding:6px 0;
  }
  .placed{ animation:pop .15s ease-out; }
  @keyframes pop{ from{ transform:scale(.6); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .rejected{ animation:shake .3s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }
  .no-table-msg{
    color:#8a8271;
    font-style:italic;
    font-size:.9rem;
  }

  /* --- Drag ghost used for touch (and as a visual double for mouse) --- */
  .drag-ghost{
    position:fixed;
    top:0; left:0;
    pointer-events:none;
    z-index:1000;
    opacity:.85;
    transform:translate(-1000px,-1000px);
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));
  }

  /* --- Responsive breakpoints --- */
  @media (max-width: 720px){
    body{ padding:12px; }
    h1{ font-size:1.2rem; }
    p.sub{ font-size:.85rem; margin-bottom:16px; }
    .layout{ flex-direction:column; gap:16px; }
    .palette{
      width:100%;
      position:static;
      display:flex;
      align-items:center;
      justify-content:space-around;
      gap:8px;
      padding:12px;
    }
    .palette h2{ display:none; }
    .palette-item{
      flex-direction:column;
      margin-bottom:0;
      gap:6px;
      text-align:center;
    }
    .palette-label b{ font-size:.8rem; }
    .palette-label{ font-size:.7rem; }
    .block-tens{ width:20px; height:100px; }
    .block-hundreds{ width:100px; height:100px; }
    td{ min-width:130px; padding:8px; }
    .col-body{ height:130px; }
    .mini-hundreds{ width:88px; height:88px; }
    .mini-tens{ width:18px; height:88px; }
    .controls{ gap:8px; }
    select, button.reset{ font-size:.9rem; padding:9px 12px; }
  }

  @media (max-width: 420px){
    .block-hundreds{ width:80px; height:80px; }
    .mini-hundreds{ width:70px; height:70px; }
    .palette-item{ gap:4px; }
  }
</style>
</head>
<body>

<h1>Place Value Blocks</h1>
<p class="sub">Drag (or tap and drag) a yellow block from the shelf into the matching column. Each drag makes a copy — the shelf never runs out.</p>

<div class="controls">
  <label for="layoutSelect"><b>Table layout:</b></label>
  <select id="layoutSelect">
    <option value="none">No table</option>
    <option value="two" selected>2 columns — Ones &amp; Tens</option>
    <option value="three">3 columns — Ones, Tens &amp; Hundreds</option>
  </select>
  <button class="reset" id="resetAll">Clear all blocks</button>
</div>

<div class="layout">

  <div class="palette" id="palette">
    <h2>Shelf</h2>

    <div class="palette-item" draggable="true" data-type="ones">
      <div class="block-ones"></div>
      <div class="palette-label"><b>រាយ</b></div>
    </div>

    <div class="palette-item" draggable="true" data-type="tens">
      <div class="block-tens">
        <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
        <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
      </div>
      <div class="palette-label"><b>ដប់</b></div>
    </div>

    <div class="palette-item" draggable="true" data-type="hundreds">
      <div class="block-hundreds" id="hundredsGrid"></div>
      <div class="palette-label"><b>រយ</b></div>
    </div>
  </div>

  <div id="tableWrap"></div>

</div>

<script>
// build the 10x10 grid cells for the hundreds palette block
const hGrid = document.getElementById('hundredsGrid');
for(let i=0;i<100;i++){
  const c = document.createElement('div');
  c.className='cell';
  hGrid.appendChild(c);
}

const tableWrap = document.getElementById('tableWrap');
const layoutSelect = document.getElementById('layoutSelect');

const columnDefs = {
  ones:      { label:'ខ្ទង់រាយ',      class:'mini-ones' },
  tens:      { label:'ខ្ទង់ដប់',      class:'mini-tens' },
  hundreds:  { label:'ខ្ទង់រយ',  class:'mini-hundreds' }
};

function makeMiniBlock(type){
  const el = document.createElement('div');
  el.classList.add('placed');
  if(type==='ones'){
    el.className += ' block-ones mini-ones';
  } else if(type==='tens'){
    el.className += ' block-tens mini-tens';
    for(let i=0;i<10;i++){
      const seg=document.createElement('div');
      seg.className='seg';
      el.appendChild(seg);
    }
  } else if(type==='hundreds'){
    el.className += ' block-hundreds mini-hundreds';
    for(let i=0;i<100;i++){
      const cell=document.createElement('div');
      cell.className='cell';
      el.appendChild(cell);
    }
  }
  return el;
}

function updateCount(type){
  const upper = document.getElementById('body-'+type+'-upper');
  const lower = document.getElementById('body-'+type+'-lower');
  const countEl = document.getElementById('count-'+type);
  if(upper && lower && countEl){
    countEl.textContent = upper.children.length + lower.children.length;
  }
}

function placeInBody(body, type){
  const mini = makeMiniBlock(type);
  body.appendChild(mini);
  updateCount(type);
}

function rejectBody(body){
  body.classList.add('rejected');
  setTimeout(()=>body.classList.remove('rejected'), 300);
}

function makeDropSection(type, part, label){
  const section = document.createElement('div');
  section.className = 'col-section';

  const labelEl = document.createElement('div');
  labelEl.className = 'section-label';
  labelEl.textContent = label;
  section.appendChild(labelEl);

  const body = document.createElement('div');
  body.className = 'col-body';
  body.id = 'body-'+type+'-'+part;
  body.dataset.type = type;

  // --- Mouse / desktop HTML5 drag-and-drop ---
  body.addEventListener('dragover', e=>{
    e.preventDefault();
    body.classList.add('dragover');
  });
  body.addEventListener('dragleave', ()=> body.classList.remove('dragover'));
  body.addEventListener('drop', e=>{
    e.preventDefault();
    body.classList.remove('dragover');
    const droppedType = e.dataTransfer.getData('text/plain');
    if(droppedType === type){
      placeInBody(body, type);
    } else {
      rejectBody(body);
    }
  });

  section.appendChild(body);
  return section;
}

function buildTable(mode){
  tableWrap.innerHTML = '';
  if(mode === 'none'){
    const msg = document.createElement('p');
    msg.className = 'no-table-msg';
    msg.textContent = 'No table selected — choose a layout above to start placing blocks.';
    tableWrap.appendChild(msg);
    return;
  }

  const types = mode === 'two' ? ['tens','ones'] : ['hundreds','tens','ones'];
  const table = document.createElement('table');

  const thead = document.createElement('tr');
  types.forEach(t=>{
    const th = document.createElement('th');
    th.textContent = columnDefs[t].label;
    thead.appendChild(th);
  });
  table.appendChild(thead);

  const trow = document.createElement('tr');
  types.forEach(t=>{
    const td = document.createElement('td');

    td.appendChild(makeDropSection(t, 'upper', 'Upper section'));
    td.appendChild(makeDropSection(t, 'lower', 'Lower section'));

    const footer = document.createElement('div');
    footer.className = 'col-footer';
    const totalLabel = document.createElement('span');
    totalLabel.textContent = 'Total: ';
    const countSpan = document.createElement('span');
    countSpan.id = 'count-'+t;
    countSpan.textContent = '0';
    countSpan.style.fontWeight = 'bold';
    totalLabel.appendChild(countSpan);

    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'clear column';
    clearBtn.addEventListener('click', ()=>{
      document.getElementById('body-'+t+'-upper').innerHTML = '';
      document.getElementById('body-'+t+'-lower').innerHTML = '';
      updateCount(t);
    });
    footer.appendChild(totalLabel);
    footer.appendChild(clearBtn);

    td.appendChild(footer);
    trow.appendChild(td);
  });
  table.appendChild(trow);
  tableWrap.appendChild(table);
}

// ===== Desktop drag (HTML5 DnD) =====
document.querySelectorAll('.palette-item').forEach(item=>{
  item.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', item.dataset.type);
    e.dataTransfer.effectAllowed = 'copy';
  });
});

// ===== Touch / pointer drag (works on phones, tablets, and as a mouse fallback) =====
// This custom implementation exists because the native HTML5 Drag and Drop
// API does not fire on touch devices, so palette drags would otherwise be
// completely broken on phones and tablets.
let ghost = null;
let dragType = null;
let currentTargetBody = null;

function clearHoverStates(){
  document.querySelectorAll('.col-body.dragover').forEach(b=>b.classList.remove('dragover'));
}

function bodyFromPoint(x, y){
  const el = document.elementFromPoint(x, y);
  if(!el) return null;
  return el.closest('.col-body');
}

function startTouchDrag(item, x, y){
  dragType = item.dataset.type;

  // build a floating visual copy of the block to follow the finger/pointer
  const inner = item.querySelector('.block-ones, .block-tens, .block-hundreds');
  ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.appendChild(inner.cloneNode(true));
  document.body.appendChild(ghost);
  moveGhost(x, y);
}

function moveGhost(x, y){
  if(!ghost) return;
  const rect = ghost.getBoundingClientRect();
  const w = rect.width || 26;
  const h = rect.height || 26;
  ghost.style.transform = `translate(${x - w/2}px, ${y - h/2}px)`;

  clearHoverStates();
  const body = bodyFromPoint(x, y);
  currentTargetBody = body;
  if(body) body.classList.add('dragover');
}

function endTouchDrag(){
  clearHoverStates();
  if(ghost){ ghost.remove(); ghost = null; }
  if(currentTargetBody && dragType){
    if(currentTargetBody.dataset.type === dragType){
      placeInBody(currentTargetBody, dragType);
    } else {
      rejectBody(currentTargetBody);
    }
  }
  currentTargetBody = null;
  dragType = null;
}

document.querySelectorAll('.palette-item').forEach(item=>{
  item.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t = e.touches[0];
    startTouchDrag(item, t.clientX, t.clientY);
  }, {passive:false});

  item.addEventListener('touchmove', e=>{
    e.preventDefault();
    const t = e.touches[0];
    moveGhost(t.clientX, t.clientY);
  }, {passive:false});

  item.addEventListener('touchend', e=>{
    e.preventDefault();
    endTouchDrag();
  }, {passive:false});

  item.addEventListener('touchcancel', e=>{
    endTouchDrag();
  });

  // Pointer-based fallback covers stylus / non-standard touch browsers
  // without double-firing on devices that already support touch events.
  let usingPointer = false;
  item.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'touch') return; // handled by touch events above
    usingPointer = true;
    item.setPointerCapture(e.pointerId);
    startTouchDrag(item, e.clientX, e.clientY);
  });
  item.addEventListener('pointermove', e=>{
    if(!usingPointer) return;
    moveGhost(e.clientX, e.clientY);
  });
  item.addEventListener('pointerup', e=>{
    if(!usingPointer) return;
    usingPointer = false;
    endTouchDrag();
  });
});

layoutSelect.addEventListener('change', ()=> buildTable(layoutSelect.value));
document.getElementById('resetAll').addEventListener('click', ()=> buildTable(layoutSelect.value));

buildTable(layoutSelect.value);
</script>

</body>
</html>
