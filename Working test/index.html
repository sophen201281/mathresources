<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>flip book · touch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #d9c8b2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
      margin: 0;
      touch-action: pan-y;
    }

    .flipbook-wrapper {
      perspective: 1800px;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .flipbook {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border-radius: 4px 12px 12px 4px;
      pointer-events: none; /* let wrapper handle clicks */
    }

    .page {
      position: absolute;
      width: 50%;
      height: 100%;
      top: 0;
      backface-visibility: hidden;
      background: #fcf8f0;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.2rem 1rem;
      text-align: center;
      box-sizing: border-box;
      border: 1px solid #e3d7c8;
      pointer-events: none;
    }

    .page-left {
      left: 0;
      border-radius: 12px 0 0 12px;
      border-right: 1px solid #d0c0ac;
      transform-origin: right center;
      background: #faf5eb;
    }

    .page-right {
      left: 50%;
      border-radius: 0 12px 12px 0;
      border-left: 1px solid #d0c0ac;
      transform-origin: left center;
      background: #fcf8f0;
    }

    .cover {
      background: #2b4a5c;
      color: #f5e9da;
      border: 2px solid #1d3442;
    }
    .cover h1 {
      font-size: clamp(2rem, 8vw, 3.8rem);
      font-weight: 600;
      letter-spacing: 4px;
      text-shadow: 2px 2px 0 #14222b;
      margin-bottom: 0.3rem;
    }
    .cover .sub {
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      opacity: 0.7;
      border-top: 1px solid #8ba0b0;
      padding-top: 0.6rem;
      width: 70%;
    }

    .page-title {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 600;
      color: #1f3a47;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }
    .page-sentence {
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      color: #1f2e3a;
      font-weight: 400;
      padding: 0 0.2rem;
      max-width: 90%;
    }
    .page-emoji {
      font-size: clamp(4rem, 15vw, 8rem);
      line-height: 1.2;
      filter: drop-shadow(2px 6px 12px rgba(0,0,0,0.15));
      margin: 0.2rem 0;
    }

    .empty-page {
      background: #f4ede3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b8aa98;
      font-style: italic;
      letter-spacing: 2px;
      font-size: 1.2rem;
    }

    /* touch hit areas – invisible overlays on left/right half */
    .touch-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      z-index: 10;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }
    .touch-left {
      left: 0;
    }
    .touch-right {
      right: 0;
    }

    /* page indicator */
    .page-indicator {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(30, 45, 55, 0.8);
      backdrop-filter: blur(4px);
      color: #f0ede5;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      border: 1px solid #b6a692;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 30;
      pointer-events: none;
    }

    /* subtle feedback on tap */
    .touch-zone:active {
      background: rgba(255,255,240,0.08);
    }

    @media (max-width: 540px) {
      .page {
        padding: 0.6rem 0.4rem;
      }
    }
  </style>
</head>
<body>

  <div class="page-indicator" id="pageIndicator">cover · empty</div>

  <div class="flipbook-wrapper" id="wrapper">
    <div class="flipbook" id="flipbook">

      <!-- PAGE 0 (left cover) -->
      <div class="page page-left cover" data-page="0">
        <h1>📖 I can see.</h1>
        <div class="sub">✦ tap the page ✦</div>
      </div>

      <!-- PAGE 1 (right cover – empty) -->
      <div class="page page-right empty-page" data-page="1">
        <span style="opacity:0.4;">· · ·</span>
      </div>

      <!-- PAGE 2 (left) : empty -->
      <div class="page page-left empty-page" data-page="2">
        <span style="opacity:0.3;">⋆</span>
      </div>

      <!-- PAGE 3 (right) : "I can see." -->
      <div class="page page-right" data-page="3">
        <div class="page-title">I can see.</div>
        <div style="font-size:2rem; margin-top:0.2rem;">👁️</div>
      </div>

      <!-- PAGE 4 (left) : "I can see the flower." -->
      <div class="page page-left" data-page="4">
        <div class="page-sentence">I can see the flower.</div>
      </div>

      <!-- PAGE 5 (right) : flower emoji -->
      <div class="page page-right" data-page="5">
        <div class="page-emoji">🌸</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">flower</div>
      </div>

      <!-- PAGE 6 (left) : "I can see the dog." -->
      <div class="page page-left" data-page="6">
        <div class="page-sentence">I can see the dog.</div>
      </div>

      <!-- PAGE 7 (right) : dog emoji -->
      <div class="page page-right" data-page="7">
        <div class="page-emoji">🐕</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">dog</div>
      </div>

      <!-- Touch overlays (invisible, but capture taps) -->
      <div class="touch-zone touch-left" id="touchLeft"></div>
      <div class="touch-zone touch-right" id="touchRight"></div>

    </div>
  </div>

  <script>
    (function(){
      const flipbook = document.getElementById('flipbook');
      const wrapper = document.getElementById('wrapper');
      const pageIndicator = document.getElementById('pageIndicator');
      const touchLeft = document.getElementById('touchLeft');
      const touchRight = document.getElementById('touchRight');

      const TOTAL_PAGES = 8;
      const SPREADS = TOTAL_PAGES / 2; // 4
      let currentSpread = 0;

      const spreadLabels = [
        'cover · empty',
        'empty · I can see.',
        'flower sentence · 🌸',
        'dog sentence · 🐕'
      ];

      function updateFlip(animate = true) {
        const angle = -180 * currentSpread;
        flipbook.style.transform = `rotateY(${angle}deg)`;
        if (!animate) {
          flipbook.style.transition = 'none';
          void flipbook.offsetHeight;
          flipbook.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1)';
        }

        // update indicator
        if (currentSpread < spreadLabels.length) {
          pageIndicator.textContent = spreadLabels[currentSpread];
        } else {
          pageIndicator.textContent = `spread ${currentSpread+1}`;
        }
      }

      function goToSpread(spreadIndex) {
        if (spreadIndex < 0) spreadIndex = 0;
        if (spreadIndex >= SPREADS) spreadIndex = SPREADS - 1;
        if (spreadIndex === currentSpread) return;
        currentSpread = spreadIndex;
        updateFlip(true);
      }

      // ----- touch / click handling -----
      function handleTap(e) {
        // get click/touch position relative to wrapper
        const rect = wrapper.getBoundingClientRect();
        let clientX;
        if (e.touches) {
          // touch event
          clientX = e.touches[0].clientX;
          e.preventDefault(); // prevent scroll
        } else {
          clientX = e.clientX;
        }
        const x = clientX - rect.left;
        const mid = rect.width / 2;

        if (x < mid) {
          // tap left half → previous spread
          if (currentSpread > 0) goToSpread(currentSpread - 1);
        } else {
          // tap right half → next spread
          if (currentSpread < SPREADS - 1) goToSpread(currentSpread + 1);
        }
      }

      // Use both touch and mouse events
      wrapper.addEventListener('touchstart', handleTap, { passive: false });
      wrapper.addEventListener('click', handleTap);

      // Also allow direct click on the touch zones (for safety)
      // but we already handle on wrapper, so we just prevent double trigger
      // we keep zones for visual feedback but let wrapper handle logic
      // (zones are transparent but we want the wrapper to handle all)

      // Keyboard support (nice extra)
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          if (currentSpread > 0) goToSpread(currentSpread - 1);
        } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          e.preventDefault();
          if (currentSpread < SPREADS - 1) goToSpread(currentSpread + 1);
        }
      });

      // initial render
      updateFlip(false);

      // ensure transition after load
      window.addEventListener('load', function() {
        flipbook.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1)';
      });

      // prevent context menu on long press (optional)
      wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

    })();
  </script>

</body>
</html>
