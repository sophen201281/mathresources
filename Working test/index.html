<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>តារាងតម្លៃលេខតាមខ្ទង់</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif; background: #faf7f0; color: #2e2a24; padding: 16px; touch-action: manipulation; }
    h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
    p.sub { margin: 0 0 20px 0; color: #6b6455; font-size: .92rem; }
    .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    select { font-family: inherit; font-size: 1rem; padding: 8px 12px; border-radius: 8px; border: 1px solid #d8d0c0; background: white; }
    button { font-family: inherit; font-size: .9rem; padding: 10px 14px; border-radius: 8px; border: 1px solid #3d5a52; background: white; color: #3d5a52; cursor: pointer; transition: 0.15s; }
    button:hover { background: #e8efec; }
    button.primary { background: #3d5a52; color: white; border-color: #3d5a52; }
    button.primary:hover { background: #2d4640; }
    .layout { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }

    /* palette */
    .palette { background: white; border: 1px solid #d8d0c0; border-radius: 12px; padding: 16px; width: 220px; flex-shrink: 0; position: sticky; top: 16px; z-index: 5; }
    .palette.remove-hover { background: #fdecec; border-color: #c0392b; }
    .palette h2 { font-size: .8rem; text-transform: uppercase; color: #8a8271; margin: 0 0 14px 0; }
    .palette-item { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; cursor: grab; user-select: none; touch-action: none; }
    .palette-item:last-child { margin-bottom: 0; }
    .palette-item:active { cursor: grabbing; }
    .palette-label { font-size: .85rem; color: #544e40; pointer-events: none; }
    .palette-label b { display: block; color: #2e2a24; }

    .block-ones { width: 26px; height: 26px; background: #f4c430; border: 1.5px solid #c99a00; border-radius: 3px; }
    .block-tens { width: 26px; height: 130px; background: #f4c430; border: 1.5px solid #c99a00; border-radius: 3px; display: flex; flex-direction: column; }
    .block-tens .seg { flex: 1; border-bottom: 1px solid #c99a00; }
    .block-tens .seg:last-child { border-bottom: none; }
    .block-hundreds { width: 130px; height: 130px; background: #f4c430; border: 1.5px solid #c99a00; border-radius: 3px; display: grid; grid-template-columns: repeat(10,1fr); grid-template-rows: repeat(10,1fr); }
    .block-hundreds .cell { border: .5px solid #c99a00; }

    .mini-ones { width: 20px; height: 20px; }
    .mini-tens { width: 20px; height: 100px; }
    .mini-hundreds { width: 100px; height: 100px; }

    .card-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #d8d0c0; }
    .card-items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .card { width: 34px; height: 34px; border-radius: 7px; background: white; border: 1.5px solid #3d5a52; color: #3d5a52; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; user-select: none; cursor: grab; touch-action: none; flex-shrink: 0; }
    .card:active { cursor: grabbing; }
    .card.op { background: #3d5a52; color: white; }

    /* placed items: draggable and clickable */
    .col-body .mini-ones, .col-body .mini-tens, .col-body .mini-hundreds, .col-body .card {
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
    }
    .col-body .mini-ones:active, .col-body .mini-tens:active, .col-body .mini-hundreds:active, .col-body .card:active { cursor: grabbing; }
    .dragging-source { opacity: .3; }

    /* table */
    #tableWrap { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    th { background: #3d5a52; color: white; font-size: .8rem; padding: 10px 6px; text-align: center; }
    td { vertical-align: top; border: 1px solid #d8d0c0; padding: 10px; min-width: 150px; }
    .col-section { border: 1px solid #d8d0c0; border-radius: 8px; margin-bottom: 8px; padding: 8px; background: #fffdf8; }
    .col-section:last-of-type { margin-bottom: 0; }
    .section-label { font-size: .68rem; text-transform: uppercase; color: #9a9280; margin-bottom: 6px; }
    .col-body { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; height: 110px; overflow-y: auto; border-radius: 6px; transition: background .15s; position: relative; }
    .col-body.dragover { background: #e8efec; }
    .col-footer { margin-top: 8px; font-size: .8rem; color: #6b6455; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .col-footer button { font-family: inherit; border: none; background: none; color: #3d5a52; cursor: pointer; font-size: .85rem; text-decoration: underline; padding: 6px 0; }
    .placed { animation: pop .15s ease-out; }
    @keyframes pop { from { transform: scale(.6); opacity:0; } to { transform: scale(1); opacity:1; } }
    .rejected { animation: shake .3s; }
    @keyframes shake { 0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-4px); } 75%{ transform: translateX(4px); } }

    /* free space */
    .free-wrap { background: white; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 14px; min-width: 280px; }
    .free-body { position: relative; overflow: hidden; height: 340px; min-width: 260px; border: 2px dashed #d8d0c0; padding: 10px; }
    .free-body .placed { position: absolute; left: 0; top: 0; }
    .free-body.dragover { background: #e8efec; border-color: #3d5a52; }

    /* drag ghost */
    .drag-ghost { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1000; opacity: .85; transform: translate(-1000px,-1000px); filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); }

    /* dice modal */
    .dice-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .dice-overlay.active { display: flex; }
    .dice-box {
      background: white;
      border-radius: 24px;
      padding: 30px 40px 40px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .dice-box h2 { margin-top: 0; color: #2e2a24; }
    .dice-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin: 24px 0;
    }
    .dice-group {
      background: #f8f5ee;
      border-radius: 16px;
      padding: 16px 20px;
      min-width: 100px;
      flex: 1 0 auto;
    }
    .dice-group label {
      display: block;
      font-size: .75rem;
      text-transform: uppercase;
      color: #8a8271;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }
    .dice-value {
      font-size: 2.8rem;
      font-weight: 700;
      color: #2e2a24;
      line-height: 1.2;
    }
    .dice-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .dice-controls button {
      border: 1px solid #d8d0c0;
      background: white;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: .9rem;
    }
    .dice-controls button.primary { background: #3d5a52; color: white; border-color: #3d5a52; }
    .dice-controls button.primary:hover { background: #2d4640; }
    .dice-result {
      margin-top: 12px;
      font-size: 1rem;
      color: #3d5a52;
      font-weight: 700;
    }
    .dice-close {
      margin-top: 16px;
      background: none;
      border: none;
      color: #8a8271;
      font-size: .9rem;
      text-decoration: underline;
      cursor: pointer;
    }

    /* responsive */
    @media (max-width: 720px) {
      body { padding: 12px; }
      .layout { flex-direction: column; gap: 16px; }
      .palette { width: 100%; position: static; padding: 12px; }
      .palette h2 { display: none; }
      .block-items { display: flex; align-items: center; justify-content: space-around; gap: 8px; }
      .palette-item { flex-direction: column; margin-bottom: 0; gap: 6px; text-align: center; }
      .block-tens { width: 20px; height: 100px; }
      .block-hundreds { width: 100px; height: 100px; }
      td { min-width: 130px; padding: 8px; }
      .col-body { height: 92px; }
      .mini-hundreds { width: 88px; height: 88px; }
      .mini-tens { width: 18px; height: 88px; }
      .free-body { height: 260px; min-width: 0; }
      .dice-box { padding: 24px 20px 30px; }
      .dice-value { font-size: 2.2rem; }
    }
    @media (max-width: 420px) {
      .block-hundreds { width: 80px; height: 80px; }
      .mini-hundreds { width: 70px; height: 70px; }
    }
  </style>
</head>
<body>
<h1>តារាតម្លៃលេខតាមខ្ទង់</h1>
<p class="sub"></p>

<div class="controls">
  <label for="layoutSelect"><b>ចំនួនខ្ទង់:</b></label>
  <select id="layoutSelect">
    <option value="none" selected>ទំហំសេរី (ដាក់ដោយសេរី)</option>
    <option value="two">២ខ្ទង់ ដប់ និងរាយ</option>
    <option value="three">៣ខ្ទង់ រយ ដប់ រាយ</option>
  </select>
  <button class="primary" id="rollDiceBtn">🎲 បោះឡុកឡាក់</button>
  <button class="reset" id="resetAll">សម្អាតខ្ទង់</button>
</div>

<div class="layout">
  <div class="palette" id="palette">
    <h2>សម្ភារ</h2>
    <div class="block-items">
      <div class="palette-item" draggable="true" data-type="ones">
        <div class="block-ones"></div>
        <div class="palette-label"><b>រាយ</b></div>
      </div>
      <div class="palette-item" draggable="true" data-type="tens">
        <div class="block-tens"><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div></div>
        <div class="palette-label"><b>ដប់</b></div>
      </div>
      <div class="palette-item" draggable="true" data-type="hundreds">
        <div class="block-hundreds" id="hundredsGrid"></div>
        <div class="palette-label"><b>រយ</b></div>
      </div>
    </div>
    <div class="card-section">
      <div class="section-label" style="text-align:center;">លេខ និងសញ្ញា</div>
      <div class="card-items" id="cardItems"></div>
    </div>
  </div>
  <div id="tableWrap"></div>
</div>

<!-- Dice Modal -->
<div class="dice-overlay" id="diceOverlay">
  <div class="dice-box">
    <h2>🎲 បោះឡុកឡាក់</h2>
    <div class="dice-grid" id="diceGrid">
      <div class="dice-group">
        <label>រយ (Hundreds)</label>
        <div class="dice-value" id="diceHundreds">0</div>
      </div>
      <div class="dice-group">
        <label>ដប់ (Tens)</label>
        <div class="dice-value" id="diceTens">0</div>
      </div>
      <div class="dice-group">
        <label>រាយ (Ones)</label>
        <div class="dice-value" id="diceOnes">0</div>
      </div>
    </div>
    <div class="dice-controls">
      <button class="primary" id="diceRollBtn">បោះឡុកឡាក់</button>
      <button id="diceAddBtn">បន្ថែមទៅតារាង</button>
    </div>
    <div class="dice-result" id="diceResult"></div>
    <button class="dice-close" id="diceCloseBtn">បិទ</button>
  </div>
</div>

<script>
  (function() {
    // Build 10x10 grid for hundreds palette
    const hGrid = document.getElementById('hundredsGrid');
    for (let i = 0; i < 100; i++) {
      const c = document.createElement('div');
      c.className = 'cell';
      hGrid.appendChild(c);
    }

    const tableWrap = document.getElementById('tableWrap');
    const layoutSelect = document.getElementById('layoutSelect');
    const paletteEl = document.getElementById('palette');
    const cardItemsEl = document.getElementById('cardItems');

    const columnDefs = {
      ones: { label: 'ខ្ទង់រាយ', class: 'mini-ones' },
      tens: { label: 'ខ្ទង់ដប់', class: 'mini-tens' },
      hundreds: { label: 'ខ្ទង់រយ', class: 'mini-hundreds' }
    };
    const SECTIONS = ['upper', 'middle', 'lower'];
    const SECTION_LABELS = { upper: '', middle: '', lower: '' };

    const CARD_DEFS = [
      { type: 'num0', label: '0' }, { type: 'num1', label: '1' }, { type: 'num2', label: '2' },
      { type: 'num3', label: '3' }, { type: 'num4', label: '4' }, { type: 'num5', label: '5' },
      { type: 'num6', label: '6' }, { type: 'num7', label: '7' }, { type: 'num8', label: '8' },
      { type: 'num9', label: '9' }, { type: 'plus', label: '+', op: true }, { type: 'minus', label: '−', op: true }, { type: 'equals', label: '=', op: true }
    ];
    const CARD_LABELS = {};
    const CARD_OPS = [];
    CARD_DEFS.forEach(d => { CARD_LABELS[d.type] = d.label; if (d.op) CARD_OPS.push(d.type); });

    // ---- drag state ----
    let dragMode = null;      // 'copy' or 'move'
    let dragType = null;
    let dragSourceEl = null;
    let ghost = null;
    let currentTargetBody = null;
    let lastClientX = 0, lastClientY = 0;

    function makeVisualPreview(type) {
      const el = document.createElement('div');
      if (type === 'ones') {
        el.className = 'block-ones mini-ones';
      } else if (type === 'tens') {
        el.className = 'block-tens mini-tens';
        for (let i = 0; i < 10; i++) { const seg = document.createElement('div'); seg.className = 'seg'; el.appendChild(seg); }
      } else if (type === 'hundreds') {
        el.className = 'block-hundreds mini-hundreds';
        for (let i = 0; i < 100; i++) { const cell = document.createElement('div'); cell.className = 'cell'; el.appendChild(cell); }
      } else if (CARD_LABELS.hasOwnProperty(type)) {
        el.className = 'card' + (CARD_OPS.includes(type) ? ' op' : '');
        el.textContent = CARD_LABELS[type];
      }
      return el;
    }

    function makeMiniBlock(type) {
      const el = document.createElement('div');
      el.classList.add('placed');
      el.draggable = true;
      el.dataset.blockType = type;
      const cls = columnDefs[type] ? columnDefs[type].class : '';
      if (type === 'ones') {
        el.className += ' block-ones mini-ones';
      } else if (type === 'tens') {
        el.className += ' block-tens mini-tens';
        for (let i = 0; i < 10; i++) { const seg = document.createElement('div'); seg.className = 'seg'; el.appendChild(seg); }
      } else if (type === 'hundreds') {
        el.className += ' block-hundreds mini-hundreds';
        for (let i = 0; i < 100; i++) { const cell = document.createElement('div'); cell.className = 'cell'; el.appendChild(cell); }
      } else if (CARD_LABELS.hasOwnProperty(type)) {
        el.className += ' card' + (CARD_OPS.includes(type) ? ' op' : '');
        el.textContent = CARD_LABELS[type];
      }
      // Attach drag events (HTML5 + manual touch)
      el.addEventListener('dragstart', e => {
        dragMode = 'move';
        dragType = type;
        dragSourceEl = el;
        e.dataTransfer.setData('text/plain', 'move');
        e.dataTransfer.effectAllowed = 'move';
        el.classList.add('dragging-source');
      });
      el.addEventListener('dragend', e => {
        el.classList.remove('dragging-source');
        if (dragMode === 'move' && e.dataTransfer.dropEffect === 'none') {
          const removedType = dragType;
          el.remove();
          updateCount(removedType);
        }
        dragMode = null; dragType = null; dragSourceEl = null;
      });
      attachManualDrag(el, 'move', type);
      return el;
    }

    function updateCount(type) {
      const countEl = document.getElementById('count-' + type);
      if (!countEl) return;
      let total = 0;
      SECTIONS.forEach(part => {
        const body = document.getElementById('body-' + type + '-' + part);
        if (body) total += body.children.length;
      });
      countEl.textContent = total;
    }

    function positionAt(el, body, clientX, clientY) {
      const rect = body.getBoundingClientRect();
      const w = el.offsetWidth || 26;
      const h = el.offsetHeight || 26;
      let x = clientX - rect.left - w / 2;
      let y = clientY - rect.top - h / 2;
      x = Math.max(0, Math.min(x, Math.max(0, rect.width - w)));
      y = Math.max(0, Math.min(y, Math.max(0, rect.height - h)));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }

    function placeInBody(body, type, clientX, clientY) {
      const mini = makeMiniBlock(type);
      body.appendChild(mini);
      updateCount(type);
      if (clientX !== undefined && clientY !== undefined) {
        positionAt(mini, body, clientX, clientY);
      }
    }

    // public helper to add dice results to the table
    window.addDiceToTable = function(type, count) {
      const mode = layoutSelect.value;
      if (mode === 'none') {
        const body = document.getElementById('body-free');
        if (!body) return;
        for (let i = 0; i < count; i++) {
          // place them stacked with a small offset for visibility
          const mini = makeMiniBlock(type);
          body.appendChild(mini);
          // random position within free area
          const rect = body.getBoundingClientRect();
          const w = mini.offsetWidth || 26;
          const h = mini.offsetHeight || 26;
          const x = Math.random() * (rect.width - w);
          const y = Math.random() * (rect.height - h);
          mini.style.left = x + 'px';
          mini.style.top = y + 'px';
        }
        return;
      }
      const types = mode === 'two' ? ['tens', 'ones'] : ['hundreds', 'tens', 'ones'];
      if (!types.includes(type)) return;
      // distribute across sections (upper, middle, lower) evenly
      const parts = ['upper', 'middle', 'lower'];
      let idx = 0;
      for (let i = 0; i < count; i++) {
        const part = parts[idx % parts.length];
        const body = document.getElementById('body-' + type + '-' + part);
        if (body) {
          const mini = makeMiniBlock(type);
          body.appendChild(mini);
          updateCount(type);
        }
        idx++;
      }
    };

    function rejectBody(body) {
      body.classList.add('rejected');
      setTimeout(() => body.classList.remove('rejected'), 300);
    }

    function makeDropSection(type, part, label) {
      const section = document.createElement('div');
      section.className = 'col-section';
      const labelEl = document.createElement('div');
      labelEl.className = 'section-label';
      labelEl.textContent = label;
      section.appendChild(labelEl);
      const body = document.createElement('div');
      body.className = 'col-body';
      body.id = 'body-' + type + '-' + part;
      body.dataset.type = type;

      // HTML5 DnD
      body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('dragover'); });
      body.addEventListener('dragleave', () => body.classList.remove('dragover'));
      body.addEventListener('drop', e => {
        e.preventDefault();
        body.classList.remove('dragover');
        const isCard = CARD_LABELS.hasOwnProperty(dragType);
        if (dragMode === 'copy') {
          if (dragType === type || isCard) {
            placeInBody(body, dragType, e.clientX, e.clientY);
          } else {
            rejectBody(body);
          }
        } else if (dragMode === 'move' && dragSourceEl) {
          if (dragType === type || isCard) {
            body.appendChild(dragSourceEl);
            dragSourceEl.classList.remove('dragging-source');
            dragSourceEl.classList.remove('placed');
            void dragSourceEl.offsetWidth;
            dragSourceEl.classList.add('placed');
            positionAt(dragSourceEl, body, e.clientX, e.clientY);
            updateCount(dragType);
          } else {
            rejectBody(body);
          }
        }
      });
      section.appendChild(body);
      return section;
    }

    function buildTable(mode) {
      tableWrap.innerHTML = '';
      if (mode === 'none') {
        tableWrap.appendChild(makeFreeSpace());
        return;
      }
      const types = mode === 'two' ? ['tens', 'ones'] : ['hundreds', 'tens', 'ones'];
      const table = document.createElement('table');
      const thead = document.createElement('tr');
      types.forEach(t => {
        const th = document.createElement('th');
        th.textContent = columnDefs[t].label;
        thead.appendChild(th);
      });
      table.appendChild(thead);
      const trow = document.createElement('tr');
      types.forEach(t => {
        const td = document.createElement('td');
        SECTIONS.forEach(part => {
          td.appendChild(makeDropSection(t, part, SECTION_LABELS[part]));
        });
        const footer = document.createElement('div');
        footer.className = 'col-footer';
        const totalLabel = document.createElement('span');
        totalLabel.textContent = 'Total: ';
        const countSpan = document.createElement('span');
        countSpan.id = 'count-' + t;
        countSpan.textContent = '0';
        countSpan.style.fontWeight = 'bold';
        totalLabel.appendChild(countSpan);
        const clearBtn = document.createElement('button');
        clearBtn.textContent = 'clear column';
        clearBtn.addEventListener('click', () => {
          SECTIONS.forEach(part => {
            document.getElementById('body-' + t + '-' + part).innerHTML = '';
          });
          updateCount(t);
        });
        footer.appendChild(totalLabel);
        footer.appendChild(clearBtn);
        td.appendChild(footer);
        trow.appendChild(td);
      });
      table.appendChild(trow);
      tableWrap.appendChild(table);
    }

    function makeFreeSpace() {
      const wrap = document.createElement('div');
      wrap.className = 'free-wrap';
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = 'ដាក់រាយ ដប់ រយ លេខ ឬសញ្ញា នៅត្រង់នេះដោយសេរី';
      wrap.appendChild(label);
      const body = document.createElement('div');
      body.className = 'col-body free-body';
      body.id = 'body-free';
      body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('dragover'); });
      body.addEventListener('dragleave', () => body.classList.remove('dragover'));
      body.addEventListener('drop', e => {
        e.preventDefault();
        body.classList.remove('dragover');
        if (dragMode === 'copy') {
          placeInBody(body, dragType, e.clientX, e.clientY);
        } else if (dragMode === 'move' && dragSourceEl) {
          body.appendChild(dragSourceEl);
          dragSourceEl.classList.remove('dragging-source');
          dragSourceEl.classList.remove('placed');
          void dragSourceEl.offsetWidth;
          dragSourceEl.classList.add('placed');
          positionAt(dragSourceEl, body, e.clientX, e.clientY);
        }
      });
      wrap.appendChild(body);
      const footer = document.createElement('div');
      footer.className = 'col-footer';
      footer.appendChild(document.createElement('span'));
      const clearBtn = document.createElement('button');
      clearBtn.textContent = 'clear';
      clearBtn.addEventListener('click', () => { body.innerHTML = ''; });
      footer.appendChild(clearBtn);
      wrap.appendChild(footer);
      return wrap;
    }

    document.querySelectorAll('.block-items .palette-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        dragMode = 'copy';
        dragType = item.dataset.type;
        dragSourceEl = null;
        e.dataTransfer.setData('text/plain', item.dataset.type);
        e.dataTransfer.effectAllowed = 'copy';
      });
      item.addEventListener('dragend', () => { dragMode = null; dragType = null; dragSourceEl = null; });
    });

    CARD_DEFS.forEach(def => {
      const el = document.createElement('div');
      el.className = 'card' + (def.op ? ' op' : '');
      el.textContent = def.label;
      el.draggable = true;
      el.dataset.type = def.type;
      el.addEventListener('dragstart', e => {

        e.dataTransfer.setData('text/plain', def.type);

      });
      el.addEventListener('dragend', () => { dragMode = null; dragType = null; dragSourceEl = null; });
      attachManualDrag(el, 'copy', def.type);

    });

    // ---- manual drag (touch + pointer) ----
    function clearHoverStates() {
      document.querySelectorAll('.col-body.dragover').forEach(b => b.classList.remove('dragover'));
      paletteEl.classList.remove('remove-hover');
    }

    function bodyFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      return el.closest('.col-body');
    }

    function startDrag(item, x, y, mode, type) {
      dragMode = mode;
      dragType = type;
      dragSourceEl = mode === 'move' ? item : null;
      const visual = mode === 'copy' ? makeVisualPreview(type) : item;
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.appendChild(visual.cloneNode(true));
      document.body.appendChild(ghost);
      if (mode === 'move') item.classList.add('dragging-source');
      moveGhost(x, y);
    }

    function moveGhost(x, y) {
      lastClientX = x;
      lastClientY = y;
      if (!ghost) return;
      const rect = ghost.getBoundingClientRect();
      const w = rect.width || 26;
      const h = rect.height || 26;
      ghost.style.transform = 'translate(' + (x - w / 2) + 'px, ' + (y - h / 2) + 'px)';
      clearHoverStates();
      const body = bodyFromPoint(x, y);
      currentTargetBody = body;
      if (body) {
        body.classList.add('dragover');
      } else if (dragMode === 'move') {
        const overPalette = paletteEl.contains(document.elementFromPoint(x, y));
        if (overPalette) paletteEl.classList.add('remove-hover');
      }
    }

    function endDrag() {
      clearHoverStates();
      if (ghost) { ghost.remove(); ghost = null; }
      const isFree = currentTargetBody && currentTargetBody.classList.contains('free-body');
      const isCard = CARD_LABELS.hasOwnProperty(dragType);
      const typeMatches = currentTargetBody && (isFree || isCard || currentTargetBody.dataset.type === dragType);

      if (dragMode === 'copy') {
        if (typeMatches) {
          placeInBody(currentTargetBody, dragType, lastClientX, lastClientY);
        } else if (currentTargetBody) {
          rejectBody(currentTargetBody);
        }
      } else if (dragMode === 'move' && dragSourceEl) {
        dragSourceEl.classList.remove('dragging-source');
        if (typeMatches) {
          currentTargetBody.appendChild(dragSourceEl);
          dragSourceEl.classList.remove('placed');
          void dragSourceEl.offsetWidth;
          dragSourceEl.classList.add('placed');
          positionAt(dragSourceEl, currentTargetBody, lastClientX, lastClientY);
          updateCount(dragType);
        } else if (currentTargetBody) {
          rejectBody(currentTargetBody);
        } else {
          // dropped outside any column – remove
          const removedType = dragType;
          dragSourceEl.remove();
          updateCount(removedType);
        }
      }
      dragMode = null; dragType = null; dragSourceEl = null; currentTargetBody = null;
    }
