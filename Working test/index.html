<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>flip book · I can see</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #d9c8b2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
      margin: 0;
    }

    /* main container – spine exactly in the middle */
    .flipbook-wrapper {
      perspective: 1800px;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .flipbook {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border-radius: 4px 12px 12px 4px;
    }

    /* Each page is half the book – spine at center */
    .page {
      position: absolute;
      width: 50%;
      height: 100%;
      top: 0;
      backface-visibility: hidden;
      background: #fcf8f0;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.2rem 1rem;
      text-align: center;
      box-sizing: border-box;
      transition: box-shadow 0.2s;
      border: 1px solid #e3d7c8;
    }

    /* left pages (even indices) – left half */
    .page-left {
      left: 0;
      border-radius: 12px 0 0 12px;
      border-right: 1px solid #d0c0ac;
      transform-origin: right center;
      background: #faf5eb;
    }

    /* right pages (odd indices) – right half */
    .page-right {
      left: 50%;
      border-radius: 0 12px 12px 0;
      border-left: 1px solid #d0c0ac;
      transform-origin: left center;
      background: #fcf8f0;
    }

    /* cover styling */
    .cover {
      background: #2b4a5c;
      color: #f5e9da;
      border: 2px solid #1d3442;
    }
    .cover h1 {
      font-size: clamp(2rem, 8vw, 3.8rem);
      font-weight: 600;
      letter-spacing: 4px;
      text-shadow: 2px 2px 0 #14222b;
      margin-bottom: 0.3rem;
    }
    .cover .sub {
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      opacity: 0.7;
      border-top: 1px solid #8ba0b0;
      padding-top: 0.6rem;
      width: 70%;
    }

    .page-title {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 600;
      color: #1f3a47;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }
    .page-sentence {
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      color: #1f2e3a;
      font-weight: 400;
      padding: 0 0.2rem;
      max-width: 90%;
    }
    .page-emoji {
      font-size: clamp(4rem, 15vw, 8rem);
      line-height: 1.2;
      filter: drop-shadow(2px 6px 12px rgba(0,0,0,0.15));
      margin: 0.2rem 0;
    }
    .page-emoji img {
      width: clamp(4rem, 15vw, 8rem);
      height: auto;
      display: block;
      object-fit: contain;
    }

    .empty-page {
      background: #f4ede3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b8aa98;
      font-style: italic;
      letter-spacing: 2px;
      font-size: 1.2rem;
    }

    /* navigation */
    .nav-controls {
      position: fixed;
      bottom: 30px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 20;
      pointer-events: none;
    }
    .nav-controls button {
      pointer-events: auto;
      background: #2b4a5c;
      border: none;
      color: white;
      font-size: 1.6rem;
      font-weight: 600;
      padding: 0.5rem 1.8rem;
      border-radius: 60px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 2px;
      border: 1px solid #4d6f83;
      min-width: 100px;
      background: #1f3a47;
    }
    .nav-controls button:active {
      transform: scale(0.94);
      background: #12303d;
    }
    .nav-controls button:disabled {
      opacity: 0.35;
      transform: scale(0.96);
      pointer-events: none;
      background: #4d5f6b;
    }

    /* simple page counter */
    .page-indicator {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(30, 45, 55, 0.8);
      backdrop-filter: blur(4px);
      color: #f0ede5;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      border: 1px solid #b6a692;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 30;
      pointer-events: none;
    }

    /* responsiveness */
    @media (max-width: 540px) {
      .page {
        padding: 0.6rem 0.4rem;
      }
      .nav-controls button {
        min-width: 70px;
        padding: 0.4rem 0.8rem;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="page-indicator" id="pageIndicator">cover</div>

  <div class="flipbook-wrapper">
    <div class="flipbook" id="flipbook">

      <!-- PAGE 0 (left cover) -->
      <div class="page page-left cover" data-page="0">
        <h1>📖 I can see.</h1>
        <div class="sub">✦ open the book ✦</div>
      </div>

      <!-- PAGE 1 (right cover – actually empty, but we treat as front cover right side) 
           but we want the cover to be the first spread: left cover + right empty? 
           We'll make page1 empty to match spec: "first time, shows front cover with title, page2 empty" 
           But as a flip book: spread is page0 (left cover) + page1 (right empty) 
      -->
      <div class="page page-right empty-page" data-page="1">
        <span style="opacity:0.4;">· · ·</span>
      </div>

      <!-- PAGE 2 (left) : empty (page 2 according to spec: page2 is empty) 
           but our spread: page2 (left) + page3 (right) = page2 empty, page3 "I can see." 
      -->
      <div class="page page-left empty-page" data-page="2">
        <span style="opacity:0.3;">⋆</span>
      </div>

      <!-- PAGE 3 (right) : "I can see." (page 1 of book) -->
      <div class="page page-right" data-page="3">
        <div class="page-title">I can see.</div>
        <div style="font-size:2rem; margin-top:0.2rem;">👁️</div>
      </div>

      <!-- PAGE 4 (left) : "I can see the flower." -->
      <div class="page page-left" data-page="4">
        <div class="page-sentence">I can see the flower.</div>
      </div>

      <!-- PAGE 5 (right) : flower emoji image -->
      <div class="page page-right" data-page="5">
        <div class="page-emoji">🌸</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">flower</div>
      </div>

      <!-- PAGE 6 (left) : "I can see the dog." -->
      <div class="page page-left" data-page="6">
        <div class="page-sentence">I can see the dog.</div>
      </div>

      <!-- PAGE 7 (right) : dog emoji image -->
      <div class="page page-right" data-page="7">
        <div class="page-emoji">🐕</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">dog</div>
      </div>

    </div>
  </div>

  <div class="nav-controls">
    <button id="prevBtn" disabled>◀ prev</button>
    <button id="nextBtn">next ▶</button>
  </div>

  <script>
    (function(){
      const flipbook = document.getElementById('flipbook');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageIndicator = document.getElementById('pageIndicator');

      // Total pages = 8 (0..7)
      const TOTAL_PAGES = 8;
      // We show spreads: currentSpread = index of left page (even)
      // spread 0: pages 0-1 (cover + empty)
      // spread 1: pages 2-3 (empty + "I can see.")
      // spread 2: pages 4-5 ("I can see the flower." + flower emoji)
      // spread 3: pages 6-7 ("I can see the dog." + dog emoji)
      let currentSpread = 0; // 0-based spread index, left page = spread*2

      // page labels for indicator
      const spreadLabels = [
        'cover · empty',
        'empty · I can see.',
        'flower sentence · 🌸',
        'dog sentence · 🐕'
      ];

      // Helper: update flipbook transform and button states
      function updateFlip(animate = true) {
        // rotateY: each spread rotates 180deg? 
        // but we want spine in middle: we rotate the entire book container 
        // currentSpread 0 → 0deg, spread1 → -180deg? 
        // Actually to show spread n, we rotate flipbook by -180 * n degrees
        const angle = -180 * currentSpread;
        flipbook.style.transform = `rotateY(${angle}deg)`;
        if (!animate) {
          flipbook.style.transition = 'none';
          // force reflow
          void flipbook.offsetHeight;
          flipbook.style.transition = 'transform 0.3s ease';
        }

        // update buttons
        prevBtn.disabled = (currentSpread === 0);
        nextBtn.disabled = (currentSpread >= TOTAL_PAGES/2 - 1);

        // update indicator
        if (currentSpread < spreadLabels.length) {
          pageIndicator.textContent = spreadLabels[currentSpread];
        } else {
          pageIndicator.textContent = `spread ${currentSpread+1}`;
        }
      }

      // go to specific spread
      function goToSpread(spreadIndex) {
        if (spreadIndex < 0) spreadIndex = 0;
        if (spreadIndex >= TOTAL_PAGES/2) spreadIndex = TOTAL_PAGES/2 - 1;
        if (spreadIndex === currentSpread) return;
        currentSpread = spreadIndex;
        updateFlip(true);
      }

      // event listeners
      prevBtn.addEventListener('click', function() {
        if (currentSpread > 0) {
          goToSpread(currentSpread - 1);
        }
      });

      nextBtn.addEventListener('click', function() {
        if (currentSpread < TOTAL_PAGES/2 - 1) {
          goToSpread(currentSpread + 1);
        }
      });

      // keyboard support (optional)
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          if (currentSpread > 0) goToSpread(currentSpread - 1);
        } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          e.preventDefault();
          if (currentSpread < TOTAL_PAGES/2 - 1) goToSpread(currentSpread + 1);
        }
      });

      // initial render (cover spread)
      updateFlip(false);

      // small touch / mobile hint: disable transition on load to avoid glitch
      window.addEventListener('load', function() {
        flipbook.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1)';
      });

      // handle resize: just keep aspect
      // (nothing else needed)

      // expose to window for debug
      window.__flip = { goToSpread, currentSpread: () => currentSpread };

    })();
  </script>

</body>
</html>
