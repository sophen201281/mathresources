<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D flip book · I can see</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #d9c8b2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
      margin: 0;
      touch-action: pan-y;
    }

    .flipbook-wrapper {
      perspective: 2000px;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .flipbook {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    /* Each page is a 3D plane pivoting around the center axis */
    .page {
      position: absolute;
      width: 50%;
      height: 100%;
      top: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: #fcf8f0;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.2rem 1rem;
      text-align: center;
      box-sizing: border-box;
      border: 1px solid #e3d7c8;
      pointer-events: none;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .page-left {
      left: 0;
      border-radius: 12px 0 0 12px;
      border-right: 1px solid #d0c0ac;
      transform-origin: right center;
      background: #faf5eb;
    }

    .page-right {
      left: 50%;
      border-radius: 0 12px 12px 0;
      border-left: 1px solid #d0c0ac;
      transform-origin: left center;
      background: #fcf8f0;
    }

    /* Cover styling */
    .cover {
      background: #2b4a5c;
      color: #f5e9da;
      border: 2px solid #1d3442;
    }
    .cover h1 {
      font-size: clamp(2rem, 8vw, 3.8rem);
      font-weight: 600;
      letter-spacing: 4px;
      text-shadow: 2px 2px 0 #14222b;
      margin-bottom: 0.3rem;
    }
    .cover .sub {
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      opacity: 0.7;
      border-top: 1px solid #8ba0b0;
      padding-top: 0.6rem;
      width: 70%;
    }

    .page-title {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 600;
      color: #1f3a47;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }
    .page-sentence {
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      color: #1f2e3a;
      font-weight: 400;
      padding: 0 0.2rem;
      max-width: 90%;
    }
    .page-emoji {
      font-size: clamp(4rem, 15vw, 8rem);
      line-height: 1.2;
      filter: drop-shadow(2px 6px 12px rgba(0,0,0,0.15));
      margin: 0.2rem 0;
    }

    .empty-page {
      background: #f4ede3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b8aa98;
      font-style: italic;
      letter-spacing: 2px;
      font-size: 1.2rem;
    }

    /* 3D touch zones */
    .touch-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      z-index: 200; 
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }
    .touch-left {
      left: 0;
    }
    .touch-right {
      right: 0;
    }

    /* page indicator */
    .page-indicator {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(30, 45, 55, 0.8);
      backdrop-filter: blur(4px);
      color: #f0ede5;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      border: 1px solid #b6a692;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 300;
      pointer-events: none;
    }

    .touch-zone:active {
      background: rgba(255,255,240,0.04);
    }

    @media (max-width: 540px) {
      .page {
        padding: 0.6rem 0.4rem;
      }
    }
  </style>
</head>
<body>

  <div class="page-indicator" id="pageIndicator">cover · empty</div>

  <div class="flipbook-wrapper" id="wrapper">
    <div class="flipbook" id="flipbook">

      <!-- SPREAD 0: COVER -->
      <div class="page page-left cover" data-page="0">
        <h1>📖 I can see.</h1>
        <div class="sub">✦ tap the page ✦</div>
      </div>
      <div class="page page-right empty-page" data-page="1">
        <span style="opacity:0.4;">· · ·</span>
      </div>

      <!-- SPREAD 1: TITLE INTRO -->
      <div class="page page-left empty-page" data-page="2">
        <span style="opacity:0.3;">⋆</span>
      </div>
      <div class="page page-right" data-page="3">
        <div class="page-title">I can see.</div>
        <div style="font-size:2rem; margin-top:0.2rem;">👁️</div>
      </div>

      <!-- SPREAD 2: FLOWER -->
      <div class="page page-left" data-page="4">
        <div class="page-sentence">I can see the flower.</div>
      </div>
      <div class="page page-right" data-page="5">
        <div class="page-emoji">🌸</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">flower</div>
      </div>

      <!-- SPREAD 3: DOG -->
      <div class="page page-left" data-page="6">
        <div class="page-sentence">I can see the dog.</div>
      </div>
      <div class="page page-right" data-page="7">
        <div class="page-emoji">🐕</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">dog</div>
      </div>

      <!-- SPREAD 4: CAT -->
      <div class="page page-left" data-page="8">
        <div class="page-sentence">I can see the cat.</div>
      </div>
      <div class="page page-right" data-page="9">
        <div class="page-emoji">🐈</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">cat</div>
      </div>

      <!-- SPREAD 5: CAR -->
      <div class="page page-left" data-page="10">
        <div class="page-sentence">I can see the car.</div>
      </div>
      <div class="page page-right" data-page="11">
        <div class="page-emoji">🚗</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">car</div>
      </div>

      <!-- SPREAD 6: TREE -->
      <div class="page page-left" data-page="12">
        <div class="page-sentence">I can see the tree.</div>
      </div>
      <div class="page page-right" data-page="13">
        <div class="page-emoji">🌳</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">tree</div>
      </div>

      <!-- SPREAD 7: SUN -->
      <div class="page page-left" data-page="14">
        <div class="page-sentence">I can see the sun.</div>
      </div>
      <div class="page page-right" data-page="15">
        <div class="page-emoji">☀️</div>
        <div style="font-size:0.9rem; opacity:0.5; margin-top:0.3rem;">sun</div>
      </div>

      <!-- Touch overlays -->
      <div class="touch-zone touch-left" id="touchLeft"></div>
      <div class="touch-zone touch-right" id="touchRight"></div>

    </div>
  </div>

  <script>
    (function(){
      const pageIndicator = document.getElementById('pageIndicator');
      const wrapper = document.getElementById('wrapper');
      const pages = document.querySelectorAll('.page');

      const TOTAL_PAGES = pages.length;
      const SPREADS = TOTAL_PAGES / 2; 
      let currentSpread = 0;

      const spreadLabels = [
        'cover · empty',
        'empty · I can see.',
        'flower sentence · 🌸',
        'dog sentence · 🐕',
        'cat sentence · 🐈',
        'car sentence · 🚗',
        'tree sentence · 🌳',
        'sun sentence · ☀️'
      ];

      function updateFlip() {
        pages.forEach(page => {
          const pageNum = parseInt(page.getAttribute('data-page'), 10);
          const pageSpread = Math.floor(pageNum / 2);

          if (pageSpread < currentSpread) {
            if (page.classList.contains('page-right')) {
              page.style.transform = 'rotateY(-180deg)';
            } else {
              page.style.transform = 'rotateY(0deg)';
            }
            page.style.zIndex = 10 + pageSpread; 
          } 
          else if (pageSpread === currentSpread) {
            page.style.transform = 'rotateY(0deg)';
            page.style.zIndex = 150; 
          } 
          else {
            if (page.classList.contains('page-left')) {
              page.style.transform = 'rotateY(180deg)';
            } else {
              page.style.transform = 'rotateY(0deg)';
            }
            page.style.zIndex = 10 + (TOTAL_PAGES - pageNum);
          }
        });

        if (currentSpread < spreadLabels.length) {
          pageIndicator.textContent = spreadLabels[currentSpread];
        } else {
          pageIndicator.textContent = `spread ${currentSpread + 1}`;
        }
      }

      function goToSpread(spreadIndex) {
        if (spreadIndex < 0 || spreadIndex >= SPREADS || spreadIndex === currentSpread) return;
        currentSpread = spreadIndex;
        updateFlip();
      }

      function handleTap(e) {
        const rect = wrapper.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = clientX - rect.left;
        const mid = rect.width / 2;

        if (x < mid) {
          if (currentSpread > 0) goToSpread(currentSpread - 1);
        } else {
          if (currentSpread < SPREADS - 1) goToSpread(currentSpread + 1);
        }
      }

      wrapper.addEventListener('click', handleTap);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          if (currentSpread > 0) goToSpread(currentSpread - 1);
        } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          if (currentSpread < SPREADS - 1) goToSpread(currentSpread + 1);
        }
      });

      wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

      updateFlip();
    })();
  </script>

</body>
</html>
