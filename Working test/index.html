<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Balance Scale · attached trays</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #e2e8f0 0%, #f1f5f9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 8px 20px;
    }
    h2 {
      font-weight: 500;
      font-size: clamp(1.4rem, 6vw, 2.2rem);
      margin: 6px 0 12px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
    }
    #palette {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 16px;
      justify-content: center;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(4px);
      border-radius: 60px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 12px;
      min-height: 80px;
      width: 100%;
      max-width: 700px;
      border: 1px solid rgba(255,255,255,0.5);
    }
    .item {
      width: 58px;
      height: 58px;
      border-radius: 30px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      transition: box-shadow 0.15s, transform 0.1s;
      touch-action: none;
      cursor: grab;
      will-change: transform;
      position: relative;
      border: 1px solid #d1d9e6;
    }
    .item:active {
      cursor: grabbing;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transform: scale(0.96);
    }
    #scene {
      position: relative;
      width: min(700px, 96vw);
      max-width: 700px;
      height: 420px;
      margin: 8px auto 0;
      touch-action: none;
    }
    /* beam group: everything rotates together */
    #beamGroup {
      position: absolute;
      left: 50%;
      top: 170px;
      width: 500px;
      max-width: 78vw;
      height: 8px;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: center center;
      transition: transform 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);
      will-change: transform;
      pointer-events: none; /* allow clicks to pass to items */
    }
    #beam {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 8px;
      background: #5a3e2b;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #pivot {
      position: absolute;
      left: 50%;
      top: -28px;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 110px solid #4a3a2a;
      transform: translateX(-50%);
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
      z-index: 5;
      pointer-events: none;
    }
    .tray {
      position: absolute;
      width: 180px;
      max-width: 38vw;
      height: 22px;
      background: #b8a99a;
      border-radius: 0 0 100px 100px;
      border: 2px solid #5a4a3a;
      border-top: 1px solid #7a6a5a;
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.08), 0 6px 12px rgba(0,0,0,0.1);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0 6px;
      flex-wrap: wrap;
      gap: 2px;
      min-height: 50px;
      touch-action: none;
      background: #cfc1b0;
      pointer-events: auto; /* items inside can be grabbed */
    }
    #leftTray {
      left: -120px;  /* relative to beamGroup center */
      top: 30px;
    }
    #rightTray {
      right: -120px;
      top: 30px;
    }
    .tray .item {
      width: 42px;
      height: 42px;
      font-size: 24px;
      border-radius: 24px;
      position: absolute;
      top: -38px;
      left: 4px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border: 1px solid #b0a090;
      transition: none;
      background: #fefefe;
      pointer-events: auto;
      cursor: grab;
    }
    .tray .item:active {
      cursor: grabbing;
    }
    /* dynamic layout for tray items */
    .tray .item:nth-child(2) { left: 50px; }
    .tray .item:nth-child(3) { left: 96px; }
    .tray .item:nth-child(4) { left: 142px; }
    .tray .item:nth-child(5) { left: 188px; }
    .tray .item:nth-child(6) { left: 234px; }

    @media (max-width: 550px) {
      .tray { width: 140px; max-width: 40vw; }
      .tray .item { width: 34px; height: 34px; font-size: 20px; top: -32px; }
      .tray .item:nth-child(2) { left: 38px; }
      .tray .item:nth-child(3) { left: 72px; }
      .tray .item:nth-child(4) { left: 106px; }
      #leftTray { left: -90px; }
      #rightTray { right: -90px; }
      #beamGroup { width: 70vw; max-width: 70vw; top: 160px; }
      #pivot { border-bottom-width: 90px; top: -24px; }
    }
    @media (max-width: 400px) {
      .tray .item { width: 28px; height: 28px; font-size: 16px; top: -26px; }
      .tray .item:nth-child(2) { left: 30px; }
      .tray .item:nth-child(3) { left: 56px; }
      .tray .item:nth-child(4) { left: 82px; }
      #leftTray { left: -70px; }
      #rightTray { right: -70px; }
    }
    #status {
      margin: 12px 0 4px;
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #1e293b;
      background: rgba(255,255,240,0.7);
      padding: 8px 24px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      font-weight: 450;
      border: 1px solid #d4c9b8;
      min-height: 3.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reset-btn {
      background: #d4c9b8;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      transition: 0.1s;
      border: 1px solid #b8a99a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      touch-action: manipulation;
    }
    .reset-btn:active { background: #c0b09a; transform: scale(0.96); }
    .footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
<h2>⚖️ attached balance</h2>
<div id="palette"></div>
<div id="scene">
  <div id="beamGroup">
    <div id="beam"></div>
    <div id="pivot"></div>
    <div id="leftTray" class="tray"></div>
    <div id="rightTray" class="tray"></div>
  </div>
</div>
<div class="footer">
  <div id="status">⚖️ drag & drop items</div>
  <button class="reset-btn" id="resetBtn">⟳ reset</button>
</div>
<script>
  (function() {
    const defs = [
      ["🍎", 1], ["🍌", 1], ["🧱", 5], ["⚽", 2], 
      ["📚", 4], ["🪨", 6], ["🐘", 9], ["🪶", 0.5],
      ["🥥", 3], ["🎁", 2]
    ];

    const palette = document.getElementById('palette');
    const leftTray = document.getElementById('leftTray');
    const rightTray = document.getElementById('rightTray');
    const beamGroup = document.getElementById('beamGroup');
    const statusDiv = document.getElementById('status');

    // ----- helper: arrange items in a tray (fixed horizontal) -----
    function arrangeTray(tray) {
      const children = [...tray.children];
      const count = children.length;
      if (count === 0) return;
      const containerWidth = tray.offsetWidth || 140;
      const maxItemWidth = Math.min(44, (containerWidth - 16) / Math.max(1, count));
      const gap = Math.min(30, (containerWidth - 16) / Math.max(1, count + 1));
      const baseLeft = 6;
      children.forEach((el, i) => {
        el.style.position = 'absolute';
        el.style.left = (baseLeft + i * gap) + 'px';
        el.style.top = '-38px';
        const size = Math.min(42, maxItemWidth);
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.fontSize = Math.min(26, size * 0.65) + 'px';
      });
    }

    // ----- update beam tilt + move trays together (attached) -----
    function updateScale() {
      const leftItems = [...leftTray.children];
      const rightItems = [...rightTray.children];
      let leftWeight = leftItems.reduce((sum, el) => sum + parseFloat(el.dataset.w || 0), 0);
      let rightWeight = rightItems.reduce((sum, el) => sum + parseFloat(el.dataset.w || 0), 0);
      
      let diff = rightWeight - leftWeight; 
      let angle = Math.max(-15, Math.min(15, diff * 2.2)); 
      
      // rotate the whole beamGroup (trays are children → move together)
      beamGroup.style.transform = `translateX(-50%) rotate(${angle}deg)`;
      
      // update status
      let statusText = '';
      if (Math.abs(diff) < 0.3) statusText = '⚖️ balanced';
      else if (diff > 0) statusText = '⬅️ right side heavier';
      else statusText = '➡️ left side heavier';
      statusDiv.innerHTML = `${statusText}  ·  (L: ${leftWeight.toFixed(1)}  R: ${rightWeight.toFixed(1)})`;
      
      // rearrange items in trays (keep them tidy)
      arrangeTray(leftTray);
      arrangeTray(rightTray);
    }

    // ----- drag & drop (pointer events) -----
    function makeDraggable(el) {
      let isDragging = false;
      let startX, startY, origX, origY;
      
      el.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        const rect = el.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origX = rect.left;
        origY = rect.top;
        
        // detach from current parent, attach to body for free movement
        const parent = el.parentNode;
        if (parent) {
          // store original parent for later
          el._origParent = parent;
          el._origNextSibling = el.nextSibling;
          parent.removeChild(el);
        }
        document.body.appendChild(el);
        el.style.position = 'fixed';
        el.style.left = origX + 'px';
        el.style.top = origY + 'px';
        el.style.width = rect.width + 'px';
        el.style.height = rect.height + 'px';
        el.style.zIndex = 1000;
        el.style.pointerEvents = 'none';
        el.setPointerCapture(e.pointerId);
        isDragging = true;
      });

      el.addEventListener('pointermove', function(e) {
        if (!isDragging) return;
        e.preventDefault();
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        el.style.left = (origX + dx) + 'px';
        el.style.top = (origY + dy) + 'px';
      });

      el.addEventListener('pointerup', function(e) {
        if (!isDragging) return;
        isDragging = false;
        el.style.pointerEvents = 'auto';
        el.releasePointerCapture(e.pointerId);

        const dropX = e.clientX;
        const dropY = e.clientY;
        const elRect = el.getBoundingClientRect();

        // check collision with trays (using getBoundingClientRect)
        const leftRect = leftTray.getBoundingClientRect();
        const rightRect = rightTray.getBoundingClientRect();

        function isOver(rect) {
          return elRect.left < rect.right - 6 && elRect.right > rect.left + 6 &&
                 elRect.top < rect.bottom - 6 && elRect.bottom > rect.top + 6;
        }

        let targetTray = null;
        if (isOver(leftRect)) targetTray = leftTray;
        else if (isOver(rightRect)) targetTray = rightTray;

        // remove from body
        if (el.parentNode === document.body) {
          document.body.removeChild(el);
        } else if (el.parentNode) {
          el.parentNode.removeChild(el);
        }
        // reset styles
        el.style.position = '';
        el.style.left = '';
        el.style.top = '';
        el.style.width = '';
        el.style.height = '';
        el.style.zIndex = '';
        el.style.pointerEvents = '';

        if (targetTray) {
          targetTray.appendChild(el);
          el.style.position = 'absolute';
          el.style.top = '-38px';
          el.style.left = '4px';
          arrangeTray(targetTray);
        } else {
          // return to palette
          palette.appendChild(el);
          el.style.position = 'relative';
          el.style.left = '0';
          el.style.top = '0';
          el.style.width = '';
          el.style.height = '';
          el.style.fontSize = '';
        }
        updateScale();
      });
    }

    // ----- build palette items -----
    defs.forEach(([emoji, weight]) => {
      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = emoji;
      item.dataset.w = weight;
      item.setAttribute('draggable', 'false');
      palette.appendChild(item);
      makeDraggable(item);
    });

    // ----- reset -----
    document.getElementById('resetBtn').addEventListener('click', function() {
      const allItems = [...leftTray.children, ...rightTray.children];
      allItems.forEach(el => {
        el.parentNode.removeChild(el);
        el.style.position = 'relative';
        el.style.left = '0';
        el.style.top = '0';
        el.style.width = '';
        el.style.height = '';
        el.style.fontSize = '';
        palette.appendChild(el);
      });
      beamGroup.style.transform = 'translateX(-50%) rotate(0deg)';
      statusDiv.innerHTML = '⚖️ reset · drag items to trays';
      arrangeTray(leftTray);
      arrangeTray(rightTray);
    });

    // ----- arrange on resize -----
    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        arrangeTray(leftTray);
        arrangeTray(rightTray);
        updateScale();
      }, 80);
    });

    // initial setup
    setTimeout(() => {
      arrangeTray(leftTray);
      arrangeTray(rightTray);
      updateScale();
    }, 20);

    // mutation observer for tray children
    const observer = new MutationObserver(() => {
      arrangeTray(leftTray);
      arrangeTray(rightTray);
    });
    observer.observe(leftTray, { childList: true, subtree: false });
    observer.observe(rightTray, { childList: true, subtree: false });

    window.updateScale = updateScale;
  })();
</script>
</body>
</html>
