<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Balance Scale · responsive</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #e2e8f0 0%, #f1f5f9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 8px 20px;
    }
    h2 {
      font-weight: 500;
      font-size: clamp(1.4rem, 6vw, 2.2rem);
      margin: 6px 0 12px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
    }
    #palette {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 16px;
      justify-content: center;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(4px);
      border-radius: 60px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 12px;
      min-height: 80px;
      width: 100%;
      max-width: 700px;
      border: 1px solid rgba(255,255,255,0.5);
    }
    .item {
      width: 58px;
      height: 58px;
      border-radius: 30px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      transition: box-shadow 0.15s, transform 0.1s;
      touch-action: none;
      cursor: grab;
      will-change: transform;
      position: relative;
      border: 1px solid #d1d9e6;
    }
    .item:active {
      cursor: grabbing;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transform: scale(0.96);
    }
    #scene {
      position: relative;
      width: min(700px, 96vw);
      max-width: 700px;
      height: 380px;
      margin: 8px auto 0;
      touch-action: none;
    }
    #beam {
      position: absolute;
      left: 50%;
      top: 170px;
      width: 440px;
      max-width: 78vw;
      height: 8px;
      background: #5a3e2b;
      border-radius: 12px;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: center center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
      will-change: transform;
    }
    #pivot {
      position: absolute;
      left: 50%;
      top: 148px;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 110px solid #4a3a2a;
      transform: translateX(-50%);
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
      z-index: 5;
    }
    .tray {
      position: absolute;
      width: 180px;
      max-width: 42vw;
      height: 22px;
      background: #b8a99a;
      border-radius: 0 0 100px 100px;
      border: 2px solid #5a4a3a;
      border-top: 1px solid #7a6a5a;
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.08), 0 6px 12px rgba(0,0,0,0.1);
      transition: top 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0 6px;
      flex-wrap: wrap;
      gap: 2px;
      min-height: 50px;
      touch-action: none;
      background: #cfc1b0;
    }
    #left {
      left: 20px;
      top: 200px;
    }
    #right {
      right: 20px;
      top: 200px;
    }
    .tray .item {
      width: 42px;
      height: 42px;
      font-size: 24px;
      border-radius: 24px;
      position: absolute;
      top: -38px;
      left: 4px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border: 1px solid #b0a090;
      transition: none;
      background: #fefefe;
    }
    .tray .item:nth-child(2) { left: 50px; }
    .tray .item:nth-child(3) { left: 96px; }
    .tray .item:nth-child(4) { left: 142px; }
    .tray .item:nth-child(5) { left: 188px; }
    .tray .item:nth-child(6) { left: 234px; }
    /* responsive tray items */
    @media (max-width: 500px) {
      .tray { width: 150px; max-width: 42vw; }
      .tray .item { width: 34px; height: 34px; font-size: 20px; top: -32px; }
      .tray .item:nth-child(2) { left: 40px; }
      .tray .item:nth-child(3) { left: 76px; }
      .tray .item:nth-child(4) { left: 112px; }
      .tray .item:nth-child(5) { left: 148px; }
      .tray .item:nth-child(6) { left: 184px; }
      #beam { width: 70vw; max-width: 70vw; top: 160px; }
      #pivot { border-bottom-width: 90px; top: 138px; }
      #left { top: 190px; }
      #right { top: 190px; }
    }
    @media (max-width: 400px) {
      .tray .item { width: 28px; height: 28px; font-size: 16px; top: -26px; }
      .tray .item:nth-child(2) { left: 32px; }
      .tray .item:nth-child(3) { left: 60px; }
      .tray .item:nth-child(4) { left: 88px; }
    }
    #status {
      margin: 12px 0 4px;
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #1e293b;
      background: rgba(255,255,240,0.7);
      padding: 8px 24px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      font-weight: 450;
      border: 1px solid #d4c9b8;
      min-height: 3.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reset-btn {
      background: #d4c9b8;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      transition: 0.1s;
      border: 1px solid #b8a99a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      touch-action: manipulation;
    }
    .reset-btn:active { background: #c0b09a; transform: scale(0.96); }
    .footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
<h2>⚖️ balance scale</h2>
<div id="palette"></div>
<div id="scene">
  <div id="pivot"></div>
  <div id="beam"></div>
  <div id="left" class="tray"></div>
  <div id="right" class="tray"></div>
</div>
<div class="footer">
  <div id="status">⚖️ drag & drop items</div>
  <button class="reset-btn" id="resetBtn">⟳ reset</button>
</div>
<script>
  (function() {
    // ----- define items (emoji, weight) -----
    const defs = [
      ["🍎", 1], ["🍌", 1], ["🧱", 5], ["⚽", 2], 
      ["📚", 4], ["🪨", 6], ["🐘", 9], ["🪶", 0.5],
      ["🥥", 3], ["🎁", 2]
    ];

    const palette = document.getElementById('palette');
    const leftTray = document.getElementById('left');
    const rightTray = document.getElementById('right');
    const beam = document.getElementById('beam');
    const statusDiv = document.getElementById('status');

    // ----- helper: place items in tray (fixed horizontal) -----
    function arrangeTray(tray) {
      const children = [...tray.children];
      const count = children.length;
      // use dynamic spacing based on container width
      const containerWidth = tray.offsetWidth || 180;
      const itemWidth = Math.min(48, (containerWidth - 20) / Math.max(1, count));
      const baseLeft = 6;
      const gap = Math.min(28, (containerWidth - 20) / Math.max(1, count + 1));
      children.forEach((el, i) => {
        el.style.position = 'absolute';
        el.style.left = (baseLeft + i * gap) + 'px';
        el.style.top = '-38px';
        el.style.width = Math.min(44, itemWidth) + 'px';
        el.style.height = Math.min(44, itemWidth) + 'px';
        el.style.fontSize = Math.min(26, itemWidth * 0.65) + 'px';
      });
    }

    // ----- update beam tilt and tray positions -----
    function updateScale() {
      const leftItems = [...leftTray.children];
      const rightItems = [...rightTray.children];
      let leftWeight = leftItems.reduce((sum, el) => sum + parseFloat(el.dataset.w || 0), 0);
      let rightWeight = rightItems.reduce((sum, el) => sum + parseFloat(el.dataset.w || 0), 0);
      
      // clamp diff to avoid extreme tilt
      let diff = rightWeight - leftWeight; 
      let angle = Math.max(-15, Math.min(15, diff * 2.2)); 
      
      beam.style.transform = `translateX(-50%) rotate(${angle}deg)`;
      // move trays proportionally
      leftTray.style.top = (200 + angle) + 'px';
      rightTray.style.top = (200 - angle) + 'px';

      // update status
      let statusText = '';
      if (Math.abs(diff) < 0.3) statusText = '⚖️ balanced';
      else if (diff > 0) statusText = '⬅️ right side heavier';
      else statusText = '➡️ left side heavier';
      statusDiv.innerHTML = `${statusText}  ·  (L: ${leftWeight.toFixed(1)}  R: ${rightWeight.toFixed(1)})`;
      
      // rearrange items in trays (keep them tidy)
      arrangeTray(leftTray);
      arrangeTray(rightTray);
    }

    // ----- drag & drop logic (with pointer events) -----
    function makeDraggable(el) {
      let isDragging = false;
      let startX, startY, origX, origY;
      let rect, parentRect;
      
      el.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        const touch = e;
        const rectEl = el.getBoundingClientRect();
        // store initial offset
        startX = touch.clientX;
        startY = touch.clientY;
        origX = rectEl.left;
        origY = rectEl.top;
        
        // store current parent
        const parent = el.parentNode;
        if (parent === palette) {
          // already in palette – fine
        } else {
          // detach from tray and attach to body for free movement
          const bodyRect = document.body.getBoundingClientRect();
          const elRect = el.getBoundingClientRect();
          el.style.position = 'fixed';
          el.style.left = elRect.left + 'px';
          el.style.top = elRect.top + 'px';
          el.style.width = elRect.width + 'px';
          el.style.height = elRect.height + 'px';
          el.style.zIndex = 1000;
          // remove from tray
          if (el.parentNode) el.parentNode.removeChild(el);
          document.body.appendChild(el);
        }
        el.style.position = 'fixed';
        el.style.left = origX + 'px';
        el.style.top = origY + 'px';
        el.style.zIndex = 1000;
        el.style.pointerEvents = 'none';
        el.setPointerCapture(e.pointerId);
        isDragging = true;
      });

      el.addEventListener('pointermove', function(e) {
        if (!isDragging) return;
        e.preventDefault();
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        el.style.left = (origX + dx) + 'px';
        el.style.top = (origY + dy) + 'px';
      });

      el.addEventListener('pointerup', function(e) {
        if (!isDragging) return;
        isDragging = false;
        el.style.pointerEvents = 'auto';
        el.releasePointerCapture(e.pointerId);

        const dropX = e.clientX;
        const dropY = e.clientY;

        // check collision with trays
        const leftRect = leftTray.getBoundingClientRect();
        const rightRect = rightTray.getBoundingClientRect();
        const elRect = el.getBoundingClientRect();

        function isOver(rect) {
          return elRect.left < rect.right - 6 && elRect.right > rect.left + 6 &&
                 elRect.top < rect.bottom - 6 && elRect.bottom > rect.top + 6;
        }

        let targetTray = null;
        if (isOver(leftRect)) targetTray = leftTray;
        else if (isOver(rightRect)) targetTray = rightTray;

        // detach from body
        if (el.parentNode === document.body) {
          document.body.removeChild(el);
        } else if (el.parentNode) {
          el.parentNode.removeChild(el);
        }
        el.style.position = '';
        el.style.left = '';
        el.style.top = '';
        el.style.width = '';
        el.style.height = '';
        el.style.zIndex = '';
        el.style.pointerEvents = '';

        if (targetTray) {
          targetTray.appendChild(el);
          el.style.position = 'absolute';
          el.style.top = '-38px';
          el.style.left = '4px';
          arrangeTray(targetTray);
        } else {
          // return to palette
          palette.appendChild(el);
          el.style.position = 'relative';
          el.style.left = '0';
          el.style.top = '0';
          el.style.width = '';
          el.style.height = '';
          el.style.fontSize = '';
        }
        updateScale();
      });
    }

    // ----- build palette items -----
    defs.forEach(([emoji, weight]) => {
      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = emoji;
      item.dataset.w = weight;
      item.setAttribute('draggable', 'false');
      palette.appendChild(item);
      makeDraggable(item);
    });

    // ----- reset functionality -----
    document.getElementById('resetBtn').addEventListener('click', function() {
      // move all items from trays back to palette
      const allItems = [...leftTray.children, ...rightTray.children];
      allItems.forEach(el => {
        el.parentNode.removeChild(el);
        el.style.position = 'relative';
        el.style.left = '0';
        el.style.top = '0';
        el.style.width = '';
        el.style.height = '';
        el.style.fontSize = '';
        palette.appendChild(el);
      });
      // reset beam
      beam.style.transform = 'translateX(-50%) rotate(0deg)';
      leftTray.style.top = '200px';
      rightTray.style.top = '200px';
      statusDiv.innerHTML = '⚖️ reset · drag items to trays';
      // rearrange palette (no-op, default flex)
    });

    // extra: ensure trays arrange on window resize
    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        arrangeTray(leftTray);
        arrangeTray(rightTray);
        updateScale();
      }, 80);
    });

    // initial arrangement
    setTimeout(() => {
      arrangeTray(leftTray);
      arrangeTray(rightTray);
      updateScale();
    }, 20);

    // also observe if items added later (mutation)
    const observer = new MutationObserver(() => {
      arrangeTray(leftTray);
      arrangeTray(rightTray);
    });
    observer.observe(leftTray, { childList: true, subtree: false });
    observer.observe(rightTray, { childList: true, subtree: false });

    // expose update for manual calls
    window.updateScale = updateScale;
  })();
</script>
</body>
</html>
