<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Place Value Blocks</title>
<style>
  :root{
    --paper:#faf7f0;
    --ink:#2e2a24;
    --line:#d8d0c0;
    --yellow:#f4c430;
    --yellow-dark:#c99a00;
    --accent:#3d5a52;
    --accent-soft:#e8efec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:24px;
  }
  h1{
    font-size:1.4rem;
    margin:0 0 4px 0;
    letter-spacing:.02em;
  }
  p.sub{
    margin:0 0 20px 0;
    color:#6b6455;
    font-size:.92rem;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  select{
    font-size:.95rem;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:white;
    color:var(--ink);
  }
  button.reset{
    font-size:.85rem;
    padding:8px 14px;
    border-radius:8px;
    border:1px solid var(--accent);
    background:white;
    color:var(--accent);
    cursor:pointer;
  }
  button.reset:hover{ background:var(--accent-soft); }

  .layout{
    display:flex;
    gap:28px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  /* --- Palette (the "drawing" area with source blocks) --- */
  .palette{
    background:white;
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    width:220px;
    flex-shrink:0;
  }
  .palette h2{
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:#8a8271;
    margin:0 0 14px 0;
  }
  .palette-item{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
    cursor:grab;
  }
  .palette-item:active{ cursor:grabbing; }
  .palette-label{
    font-size:.85rem;
    color:#544e40;
  }
  .palette-label b{ display:block; color:var(--ink); font-size:.9rem; }

  /* block shapes */
  .block-ones{
    width:26px; height:26px;
    background:var(--yellow);
    border:1.5px solid var(--yellow-dark);
    border-radius:3px;
  }
  .block-tens{
    width:26px; height:130px;
    background:var(--yellow);
    border:1.5px solid var(--yellow-dark);
    border-radius:3px;
    display:flex;
    flex-direction:column;
  }
  .block-tens .seg{
    flex:1;
    border-bottom:1px solid var(--yellow-dark);
  }
  .block-tens .seg:last-child{ border-bottom:none; }
  .block-hundreds{
    width:130px; height:130px;
    background:var(--yellow);
    border:1.5px solid var(--yellow-dark);
    border-radius:3px;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(10,1fr);
  }
  .block-hundreds .cell{
    border:.5px solid var(--yellow-dark);
  }

  /* small preview scale used inside table columns */
  .mini-ones{ width:20px; height:20px; }
  .mini-tens{ width:20px; height:100px; }
  .mini-hundreds{ width:100px; height:100px; }

  /* --- Table --- */
  table{
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  th{
    background:var(--accent);
    color:white;
    font-size:.8rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:10px 6px;
    text-align:center;
  }
  td{
    vertical-align:top;
    border:1px solid var(--line);
    padding:10px;
    min-width:150px;
    height:340px;
  }
  .col-body{
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:6px;
    height:260px;
    overflow-y:auto;
    border-radius:8px;
    transition:background .15s;
  }
  .col-body.dragover{ background:var(--accent-soft); }
  .col-footer{
    margin-top:8px;
    font-size:.8rem;
    color:#6b6455;
    display:flex;
    justify-content:space-between;
  }
  .col-footer button{
    border:none;
    background:none;
    color:var(--accent);
    cursor:pointer;
    font-size:.78rem;
    text-decoration:underline;
    padding:0;
  }
  .placed{ animation:pop .15s ease-out; }
  @keyframes pop{ from{ transform:scale(.6); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .rejected{ animation:shake .3s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }
  .no-table-msg{
    color:#8a8271;
    font-style:italic;
    font-size:.9rem;
  }
</style>
</head>
<body>

<h1>Place Value Blocks</h1>
<p class="sub">Drag a yellow block from the shelf on the left into the matching column. Each drag makes a copy — the shelf never runs out.</p>

<div class="controls">
  <label for="layoutSelect"><b>Table layout:</b></label>
  <select id="layoutSelect">
    <option value="none">No table</option>
    <option value="two" selected>2 columns — Ones &amp; Tens</option>
    <option value="three">3 columns — Ones, Tens &amp; Hundreds</option>
  </select>
  <button class="reset" id="resetAll">Clear all blocks</button>
</div>

<div class="layout">

  <div class="palette">
    <h2>Shelf</h2>

    <div class="palette-item" draggable="true" data-type="ones">
      <div class="block-ones"></div>
      <div class="palette-label"><b>Ones</b>single unit</div>
    </div>

    <div class="palette-item" draggable="true" data-type="tens">
      <div class="block-tens">
        <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
        <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
      </div>
      <div class="palette-label"><b>Tens</b>rod of 10</div>
    </div>

    <div class="palette-item" draggable="true" data-type="hundreds">
      <div class="block-hundreds" id="hundredsGrid"></div>
      <div class="palette-label"><b>Hundreds</b>flat of 100</div>
    </div>
  </div>

  <div id="tableWrap"></div>

</div>

<script>
// build the 10x10 grid cells for the hundreds palette block
const hGrid = document.getElementById('hundredsGrid');
for(let i=0;i<100;i++){
  const c = document.createElement('div');
  c.className='cell';
  hGrid.appendChild(c);
}

const tableWrap = document.getElementById('tableWrap');
const layoutSelect = document.getElementById('layoutSelect');

const columnDefs = {
  ones:      { label:'Ones',      class:'mini-ones' },
  tens:      { label:'Tens',      class:'mini-tens' },
  hundreds:  { label:'Hundreds',  class:'mini-hundreds' }
};

function makeMiniBlock(type){
  const el = document.createElement('div');
  el.classList.add('placed');
  if(type==='ones'){
    el.className += ' block-ones mini-ones';
  } else if(type==='tens'){
    el.className += ' block-tens mini-tens';
    for(let i=0;i<10;i++){
      const seg=document.createElement('div');
      seg.className='seg';
      el.appendChild(seg);
    }
  } else if(type==='hundreds'){
    el.className += ' block-hundreds mini-hundreds';
    for(let i=0;i<100;i++){
      const cell=document.createElement('div');
      cell.className='cell';
      el.appendChild(cell);
    }
  }
  return el;
}

function updateCount(type){
  const body = document.getElementById('body-'+type);
  const countEl = document.getElementById('count-'+type);
  if(body && countEl){
    countEl.textContent = body.children.length;
  }
}

function buildTable(mode){
  tableWrap.innerHTML = '';
  if(mode === 'none'){
    const msg = document.createElement('p');
    msg.className = 'no-table-msg';
    msg.textContent = 'No table selected — choose a layout above to start placing blocks.';
    tableWrap.appendChild(msg);
    return;
  }

  const types = mode === 'two' ? ['tens','ones'] : ['hundreds','tens','ones'];
  // display order left-to-right should read hundreds, tens, ones for 3-col; tens, ones for 2-col
  const table = document.createElement('table');

  const thead = document.createElement('tr');
  types.forEach(t=>{
    const th = document.createElement('th');
    th.textContent = columnDefs[t].label;
    thead.appendChild(th);
  });
  table.appendChild(thead);

  const trow = document.createElement('tr');
  types.forEach(t=>{
    const td = document.createElement('td');

    const body = document.createElement('div');
    body.className = 'col-body';
    body.id = 'body-'+t;
    body.dataset.type = t;

    body.addEventListener('dragover', e=>{
      e.preventDefault();
      body.classList.add('dragover');
    });
    body.addEventListener('dragleave', ()=> body.classList.remove('dragover'));
    body.addEventListener('drop', e=>{
      e.preventDefault();
      body.classList.remove('dragover');
      const droppedType = e.dataTransfer.getData('text/plain');
      if(droppedType === t){
        const mini = makeMiniBlock(t);
        body.appendChild(mini);
        updateCount(t);
      } else {
        body.classList.add('rejected');
        setTimeout(()=>body.classList.remove('rejected'), 300);
      }
    });

    const footer = document.createElement('div');
    footer.className = 'col-footer';
    const countSpan = document.createElement('span');
    countSpan.id = 'count-'+t;
    countSpan.textContent = '0';
    countSpan.style.fontWeight = 'bold';
    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'clear';
    clearBtn.addEventListener('click', ()=>{
      body.innerHTML = '';
      updateCount(t);
    });
    footer.appendChild(countSpan);
    footer.appendChild(clearBtn);

    td.appendChild(body);
    td.appendChild(footer);
    trow.appendChild(td);
  });
  table.appendChild(trow);
  tableWrap.appendChild(table);
}

// drag start from palette
document.querySelectorAll('.palette-item').forEach(item=>{
  item.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', item.dataset.type);
    e.dataTransfer.effectAllowed = 'copy';
  });
});

layoutSelect.addEventListener('change', ()=> buildTable(layoutSelect.value));
document.getElementById('resetAll').addEventListener('click', ()=> buildTable(layoutSelect.value));

buildTable(layoutSelect.value);
</script>

</body>
</html>
