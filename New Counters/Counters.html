<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>បូកចំនួនដដែល វិធីគុណមានលក្ខណៈត្រឡប់</title>
<style>
*{
    box-sizing:border-box;
    touch-action:none;
}
body{
    margin:0;
    overflow:hidden;
    background:#ececec;
    font-family:Arial,sans-serif;
}
/* =========================
   TOOLBAR
========================= */
#toolbar{
    position:fixed;
    top:10px;
    left:10px;
    z-index:5000;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
    font-size:15px;
}
/* =========================
   DRAW CANVAS
========================= */
#drawCanvas{
    position:fixed;
    inset:0;
    z-index:1;
}
/* =========================
   BOARD
========================= */
#board{
    position:absolute;
    width:280px;
    height:200px;
    left:50%;
    top:50%;
    transform:
        translate(-50%,-50%)
        rotate(0deg);
    transform-origin:center center;
    border:4px solid #333;
    border-radius:14px;
    background:
        linear-gradient(to right,#d0d0d0 1px,transparent 1px),
        linear-gradient(to bottom,#d0d0d0 1px,transparent 1px);
    background-size:40px 40px;
    background-color:white;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    z-index:20;
}
/* =========================
   BOARD HEADER
========================= */
#boardHeader{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:36px;
    background:rgba(0,0,0,0.08);
    border-radius:10px 10px 0 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
}
/* =========================
   ROTATE HANDLE
========================= */
#rotateHandle{
    position:absolute;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#ff9800;
    right:-23px;
    top:-23px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
    font-weight:bold;
}
/* =========================
   COUNTERS
========================= */
.counter{
    position:absolute;
    width:36px;
    height:36px;
    background:#4caf50;
    border:2px solid #222;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
    user-select:none;
}
#board .counter{
    z-index:50;
}
body > .counter{
    z-index:100;
}
</style>
</head>
<body>
<div id="toolbar">
    <button id="addCounter">Add Counter</button>
    <button id="drawBtn">Draw</button>
    <button id="eraseBtn">Erase</button>
    <button id="clearBtn">Clear</button>
</div>
<canvas id="drawCanvas"></canvas>
<div id="board">
    <div id="boardHeader">
        អាចប្តូរទីតាំង
    </div>
    <div id="rotateHandle">⟳</div>
</div>
<script>
/* =========================
   DRAWING
========================= */
const canvas=document.getElementById("drawCanvas");
const ctx=canvas.getContext("2d");
function resizeCanvas(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);
let drawing=false;
let drawMode=true;
document.getElementById("drawBtn").onclick=()=>{
    drawMode=true;
};
document.getElementById("eraseBtn").onclick=()=>{
    drawMode=false;
};
document.getElementById("clearBtn").onclick=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
};
canvas.addEventListener("pointerdown",e=>{
    if(e.target!==canvas) return;
    drawing=true;
    ctx.beginPath();
    ctx.moveTo(e.clientX,e.clientY);
});
canvas.addEventListener("pointermove",e=>{
    if(!drawing) return;
    ctx.lineCap="round";
    if(drawMode){
        ctx.globalCompositeOperation="source-over";
        ctx.strokeStyle="black";
        ctx.lineWidth=3;
    }else{
        ctx.globalCompositeOperation="destination-out";
        ctx.lineWidth=24;
    }
    ctx.lineTo(e.clientX,e.clientY);
    ctx.stroke();
});
window.addEventListener("pointerup",()=>{
    drawing=false;
});
/* =========================
   BOARD
========================= */
const board=document.getElementById("board");
const boardHeader=document.getElementById("boardHeader");
const rotateHandle=document.getElementById("rotateHandle");
let boardX=window.innerWidth/2;
let boardY=window.innerHeight/2;
let rotation=0;
updateBoardTransform();
function updateBoardTransform(){
    board.style.left=boardX+"px";
    board.style.top=boardY+"px";
    board.style.transform=
        `translate(-50%,-50%) rotate(${rotation}deg)`;
}
/* =========================
   MOVE RECTANGLE
========================= */
let movingBoard=false;
let moveOffsetX=0;
let moveOffsetY=0;
boardHeader.addEventListener("pointerdown",e=>{
    movingBoard=true;
    moveOffsetX=e.clientX-boardX;
    moveOffsetY=e.clientY-boardY;
    boardHeader.setPointerCapture(e.pointerId);
});
window.addEventListener("pointermove",e=>{
    if(!movingBoard) return;
    boardX=e.clientX-moveOffsetX;
    boardY=e.clientY-moveOffsetY;
    updateBoardTransform();
});
window.addEventListener("pointerup",()=>{
    movingBoard=false;
});
/* =========================
   ROTATE BOARD
========================= */
let rotating=false;
rotateHandle.addEventListener("pointerdown",e=>{
    rotating=true;
    rotateHandle.setPointerCapture(e.pointerId);
});
window.addEventListener("pointermove",e=>{
    if(!rotating) return;
    const rect=board.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;
    rotation=Math.atan2(
        e.clientY-cy,
        e.clientX-cx
    )*180/Math.PI;
    updateBoardTransform();
});
window.addEventListener("pointerup",()=>{
    rotating=false;
});
/* =========================
   COUNTERS
========================= */
let counterId=0;
document.getElementById("addCounter").onclick=()=>{
    createCounter(
        40+counterId*10,
        120+counterId*10
    );
};
function createCounter(x,y){
    const counter=document.createElement("div");
    counter.className="counter";
    counter.innerText=counterId+1;
    counter.style.left=x+"px";
    counter.style.top=y+"px";
    document.body.appendChild(counter);
    makeDraggable(counter);
    counterId++;
}
/* =========================
   DRAG COUNTERS
========================= */
function makeDraggable(el){
    let dragging=false;
    let offsetX=0;
    let offsetY=0;
    el.addEventListener("pointerdown",e=>{
        dragging=true;
        const rect=el.getBoundingClientRect();
        offsetX=e.clientX-rect.left;
        offsetY=e.clientY-rect.top;
        if(el.parentElement===board){
            const worldX=rect.left;
            const worldY=rect.top;
            document.body.appendChild(el);
            el.style.left=worldX+"px";
            el.style.top=worldY+"px";
        }
        el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove",e=>{
        if(!dragging) return;
        let x=e.clientX-offsetX;
        let y=e.clientY-offsetY;
        const boardRect=board.getBoundingClientRect();
        const centerX=x+18;
        const centerY=y+18;
        const inside=
            centerX>boardRect.left &&
            centerX<boardRect.right &&
            centerY>boardRect.top &&
            centerY<boardRect.bottom;
        if(inside){
            const localX=centerX-boardRect.left;
            const localY=centerY-boardRect.top;
            const grid=40;
            x=
                boardRect.left+
                Math.round(localX/grid)*grid-
                18;
            y=
                boardRect.top+
                Math.round(localY/grid)*grid-
                18;
        }
        el.style.left=x+"px";
        el.style.top=y+"px";
    });
    el.addEventListener("pointerup",()=>{
        dragging=false;
        attachToBoard(el);
    });
}
/* =========================
   ATTACH TO BOARD
========================= */
function attachToBoard(el){
    const boardRect=board.getBoundingClientRect();
    const rect=el.getBoundingClientRect();
    const centerX=rect.left+rect.width/2;
    const centerY=rect.top+rect.height/2;
    const inside=
        centerX>boardRect.left &&
        centerX<boardRect.right &&
        centerY>boardRect.top &&
        centerY<boardRect.bottom;
    if(inside){
        const localX=centerX-boardRect.left;
        const localY=centerY-boardRect.top;
        const grid=40;
        const snappedX=
            Math.round(localX/grid)*grid-18;
        const snappedY=
            Math.round(localY/grid)*grid-18;
        board.appendChild(el);
        el.style.left=snappedX+"px";
        el.style.top=snappedY+"px";
    }
}
/* =========================
   START COUNTERS
========================= */
createCounter(40,120);
createCounter(40,180);
</script>
</body>
</html>
