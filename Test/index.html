<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Magnetic Base Ten Blocks</title>
<style>
    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
    }
    body{
        overflow:hidden;
        font-family:Arial, sans-serif;
        background:#eef2f7;
        touch-action:none;
    }
    canvas{
        background:white;
        display:block;
    }
    .toolbar{
        position:fixed;
        bottom:10px;
        left:10px;
        z-index:100;
        display:flex;
        flex-wrap:wrap;
        gap:10px;
        max-width:calc(100vw - 20px);
        align-items:center;
    }
    /* Home button now sits in the toolbar with the other buttons */
    .home-btn {
        z-index: 101;
        padding: 10px 16px;
        background: #fff;
        border: 2px solid #1976d2;
        border-radius: 10px;
        color: #1976d2;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    button{
        padding:10px 16px;
        border:none;
        border-radius:10px;
        background:#1976d2;
        color:white;
        font-size:16px;
        cursor:pointer;
    }
    button:hover, .home-btn:hover{
        opacity:0.9;
    }

    /* --- Number card tray --- */
    .number-tray{
        position:fixed;
        bottom:64px;
        left:10px;
        z-index:100;
        display:flex;
        flex-wrap:wrap;
        gap:6px;
        max-width:calc(100vw - 20px);
        background:rgba(255,255,255,0.85);
        border:2px solid #90a4ae;
        border-radius:12px;
        padding:8px;
    }
    .number-btn{
        width:36px;
        height:36px;
        padding:0;
        border-radius:8px;
        background:#fff;
        border:2px solid #5e35b1;
        color:#5e35b1;
        font-weight:bold;
        font-size:18px;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
    }
    .number-btn:hover{
        background:#5e35b1;
        color:#fff;
    }

    /* --- Dice --- */
    .dice-scene{
        position:fixed;
        width:100px;
        height:100px;
        perspective:700px;
        z-index:99;
        cursor:grab;
        touch-action:none;
    }
    .dice-scene.dragging{
        cursor:grabbing;
    }
    .dice{
        width:100%;
        height:100%;
        position:relative;
        transform-style:preserve-3d;
        transition:transform 1.1s cubic-bezier(.34,1.4,.4,1);
        transform: rotateX(-18deg) rotateY(24deg);
    }
    .dice.rolling{
        transition:transform 0.9s cubic-bezier(.2,.8,.3,1);
    }
    .face{
        position:absolute;
        width:100px;
        height:100px;
        left:0;
        top:0;
        background:#fffdf7;
        border:2px solid #333;
        border-radius:14px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.08);
        display:grid;
        grid-template-columns:repeat(3,1fr);
        grid-template-rows:repeat(3,1fr);
        padding:14px;
    }
    .pip{
        width:16px;
        height:16px;
        border-radius:50%;
        background:#c62828;
        justify-self:center;
        align-self:center;
        opacity:0;
    }
    .pip.on{ opacity:1; }
    .face-1 { transform: rotateY(0deg)    translateZ(50px); }
    .face-6 { transform: rotateY(180deg)  translateZ(50px); }
    .face-2 { transform: rotateY(-90deg)  translateZ(50px); }
    .face-5 { transform: rotateY(90deg)   translateZ(50px); }
    .face-3 { transform: rotateX(90deg)   translateZ(50px); }
    .face-4 { transform: rotateX(-90deg)  translateZ(50px); }

    .dice-label{
        position:absolute;
        top:-30px;
        left:0;
        width:100px;
        text-align:center;
        font-family:'Battambang', cursive, Arial;
        color:#555;
        font-size:14px;
        pointer-events:none;
        user-select:none;
    }
</style>
</head>
<body>

<div class="toolbar">
    <button id="addOneBtn">➕ វត្ថុសម្រាប់រាប់</button>
    <button id="deleteBtn">🗑 លុប</button>
    <a href="../index.html" class="home-btn" style="font-family:'Battambang', cursive; font-size: 20px;">
        🏡 Home
    </a>
</div>

<div class="number-tray" id="numberTray"></div>

<div class="dice-scene" id="diceScene">
    <div class="dice-label">ចុចដើម្បីបោះ</div>
    <div class="dice" id="dice">
        <div class="face face-1">
            <div></div><div></div><div></div>
            <div></div><div class="pip on"></div><div></div>
            <div></div><div></div><div></div>
        </div>
        <div class="face face-2">
            <div class="pip on"></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div class="pip on"></div>
        </div>
        <div class="face face-3">
            <div class="pip on"></div><div></div><div></div>
            <div></div><div class="pip on"></div><div></div>
            <div></div><div></div><div class="pip on"></div>
        </div>
        <div class="face face-4">
            <div class="pip on"></div><div></div><div class="pip on"></div>
            <div></div><div></div><div></div>
            <div class="pip on"></div><div></div><div class="pip on"></div>
        </div>
        <div class="face face-5">
            <div class="pip on"></div><div></div><div class="pip on"></div>
            <div></div><div class="pip on"></div><div></div>
            <div class="pip on"></div><div></div><div class="pip on"></div>
        </div>
        <div class="face face-6">
            <div class="pip on"></div><div></div><div class="pip on"></div>
            <div class="pip on"></div><div></div><div class="pip on"></div>
            <div class="pip on"></div><div></div><div class="pip on"></div>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", ()=>{
    resizeCanvas();
    layoutBoxes();
});
const BOX_SIZE = 26;
const magneticBox = { x:0, y:0, width:200, height:500 };
const tensBox = { x:0, y:0, width:200, height:500 };
const hundredsBox = { x:0, y:0, width:200, height:500 };

const dropSpot = { x:0, y:0 };
function layoutBoxes(){
    const gap = 20;
    const dropAreaWidth = 70; // space reserved to the right of the ones box for the drop spot
    const margin = 40;
    let boxWidth = 280;
    const totalWidth = boxWidth * 3 + gap * 2 + dropAreaWidth;

    if(totalWidth > canvas.width - margin){
        boxWidth = Math.max(90, (canvas.width - margin - gap * 2 - dropAreaWidth) / 3);
    }

    const finalTotalWidth = boxWidth * 3 + gap * 2 + dropAreaWidth;
    // Centering the boxes + reserved drop area together shifts the hundreds,
    // tens & ones boxes to the left, opening space on the right for the drop spot.
    const startX = (canvas.width - finalTotalWidth) / 2;

    const topMargin = 110;
    const bottomMargin = 130;
    const usableHeight = canvas.height - topMargin - bottomMargin;
    const boxHeight = Math.max(180, Math.min(500, usableHeight));
    const y = topMargin + Math.max(0, (usableHeight - boxHeight) / 2);

    hundredsBox.x = startX;
    hundredsBox.y = y;
    hundredsBox.width = boxWidth;
    hundredsBox.height = boxHeight;

    tensBox.x = startX + boxWidth + gap;
    tensBox.y = y;
    tensBox.width = boxWidth;
    tensBox.height = boxHeight;

    magneticBox.x = startX + (boxWidth + gap) * 2;
    magneticBox.y = y;
    magneticBox.width = boxWidth;
    magneticBox.height = boxHeight;

    // Drop spot sits outside, to the right of the ones box, in the reserved space
    dropSpot.x = magneticBox.x + magneticBox.width + (dropAreaWidth - BOX_SIZE) / 2;
    dropSpot.y = magneticBox.y + 12;
}
layoutBoxes();
let blocks = [];
let selected = null;
let dragging = false;
let offsetX = 0;
let offsetY = 0;
class OneBlock{
    constructor(x,y){
        this.type = "one";
        this.x = x;
        this.y = y;
        this.size = BOX_SIZE;
        this.selected = false;
    }
    draw(){
        ctx.fillStyle = this.selected ? "#ff9800" : "#4caf50";
        ctx.fillRect(
            this.x,
            this.y,
            this.size,
            this.size
        );
        ctx.strokeStyle = "#222";
        ctx.lineWidth = 2;
        ctx.strokeRect(
            this.x,
            this.y,
            this.size,
            this.size
        );
    }
    contains(px,py){
        return (
            px >= this.x &&
            px <= this.x + this.size &&
            py >= this.y &&
            py <= this.y + this.size
        );
    }
}
class TenStick{
    constructor(x,y){
        this.type = "ten";
        this.x = x;
        this.y = y;
        this.width = BOX_SIZE;
        this.height = BOX_SIZE * 10;
        this.selected = false;
    }
    draw(){
        for(let i=0;i<10;i++){
            ctx.fillStyle = this.selected ? "#ff9800" : "#2196f3";
            ctx.fillRect(
                this.x,
                this.y + i * BOX_SIZE,
                this.width,
                BOX_SIZE
            );
            ctx.strokeStyle = "#222";
            ctx.lineWidth = 2;
            ctx.strokeRect(
                this.x,
                this.y + i * BOX_SIZE,
                this.width,
                BOX_SIZE
            );
        }
    }
    contains(px,py){
        return (
            px >= this.x &&
            px <= this.x + this.width &&
            py >= this.y &&
            py <= this.y + this.height
        );
    }
}
/* --- New: draggable number card (0-9) --- */
class NumberCard{
    constructor(x,y,digit){
        this.type = "number";
        this.digit = digit;
        this.x = x;
        this.y = y;
        this.width = 56;
        this.height = 74;
        this.selected = false;
    }
    draw(){
        ctx.fillStyle = this.selected ? "#ffe0b2" : "#ffffff";
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.strokeStyle = this.selected ? "#ff9800" : "#5e35b1";
        ctx.lineWidth = 3;
        ctx.strokeRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = "#5e35b1";
        ctx.font = "bold 36px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
            String(this.digit),
            this.x + this.width/2,
            this.y + this.height/2 + 2
        );
        ctx.textAlign = "start";
        ctx.textBaseline = "alphabetic";
    }
    contains(px,py){
        return (
            px >= this.x &&
            px <= this.x + this.width &&
            py >= this.y &&
            py <= this.y + this.height
        );
    }
}
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawMagneticBox();
    blocks.forEach(block=>{
        block.draw();
    });
    requestAnimationFrame(draw);
}
function drawMagneticBox(){
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 4;
    ctx.strokeRect(
        magneticBox.x,
        magneticBox.y,
        magneticBox.width,
        magneticBox.height
    );
    ctx.fillStyle = "#666";
    ctx.font = "22px Arial";
    ctx.fillText(
        "ខ្ទង់រាយ",
        magneticBox.x + 18,
        magneticBox.y - 20
    );

    ctx.strokeStyle = "#777";
    ctx.lineWidth = 4;
    ctx.strokeRect(
        tensBox.x,
        tensBox.y,
        tensBox.width,
        tensBox.height
    );
    ctx.fillStyle = "#666";
    ctx.font = "22px Arial";
    ctx.fillText(
        "ដប់",
        tensBox.x + 18,
        tensBox.y - 20
    );
}
draw();
document.getElementById("addOneBtn").addEventListener("click",()=>{
    blocks.push(
        new OneBlock(
            dropSpot.x,
            dropSpot.y
        )
    );
});

/* --- Build the 0-9 number tray buttons --- */
const numberTray = document.getElementById("numberTray");
for(let d=0; d<=9; d++){
    const btn = document.createElement("button");
    btn.className = "number-btn";
    btn.textContent = String(d);
    btn.addEventListener("click", ()=>{
        blocks.push(
            new NumberCard(
                80 + Math.random()*150,
                120 + Math.random()*150,
                d
            )
        );
    });
    numberTray.appendChild(btn);
}

function getPointer(e){
    const rect = canvas.getBoundingClientRect();
    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}
canvas.addEventListener("pointerdown",(e)=>{
    const p = getPointer(e);
    dragging = false;
    selected = null;
    for(let i=blocks.length-1;i>=0;i--){
        if(blocks[i].contains(p.x,p.y)){
            selected = blocks[i];
            blocks.forEach(b=>b.selected=false);
            selected.selected = true;
            dragging = true;
            offsetX = p.x - selected.x;
            offsetY = p.y - selected.y;
            break;
        }
    }
    if(!selected){
        blocks.forEach(b=>b.selected=false);
    }
});
canvas.addEventListener("pointermove",(e)=>{
    if(!dragging || !selected) return;
    const p = getPointer(e);
    selected.x = p.x - offsetX;
    selected.y = p.y - offsetY;
});
canvas.addEventListener("pointerup",()=>{
    dragging = false;
    combineOnesToTen();
});
function combineOnesToTen(){
    const onesInside = blocks.filter(block=>{
        return (
            block.type === "one" &&
            block.x > magneticBox.x &&
            block.x < magneticBox.x + magneticBox.width &&
            block.y > magneticBox.y &&
            block.y < magneticBox.y + magneticBox.height
        );
    });
    if(onesInside.length >= 10){
        for(let i=0;i<10;i++){
            const index = blocks.indexOf(onesInside[i]);
            if(index !== -1){
                blocks.splice(index,1);
            }
        }
        blocks.push(
            new TenStick(
                magneticBox.x + 80,
                magneticBox.y + 40
            )
        );
    }
}
let lastTap = 0;
canvas.addEventListener("pointerup",(e)=>{
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if(tapLength < 300 && tapLength > 0){
        const p = getPointer(e);
        for(let i=blocks.length-1;i>=0;i--){
            const block = blocks[i];
            if(
                block.type === "ten" &&
                block.contains(p.x,p.y)
            ){
                blocks.splice(i,1);
                for(let n=0;n<10;n++){
                    blocks.push(
                        new OneBlock(
                            block.x + (n % 2) * 50,
                            block.y + Math.floor(n / 2) * 50
                        )
                    );
                }
                break;
            }
        }
    }
    lastTap = currentTime;
});
document.getElementById("deleteBtn").addEventListener("click",()=>{
    if(selected){
        const index = blocks.indexOf(selected);
        if(index !== -1){
            blocks.splice(index,1);
        }
        selected = null;
    }
});

/* ================= Real rollable dice ================= */
const diceScene = document.getElementById("diceScene");
const dice = document.getElementById("dice");

// Starting position for the dice scene (near top center-left, below toolbar)
diceScene.style.left = "260px";
diceScene.style.top = "140px";

const faceRotation = {
    1: { x: 0,   y: 0   },
    2: { x: 0,   y: 90  },
    3: { x: -90, y: 0   },
    4: { x: 90,  y: 0   },
    5: { x: 0,   y: -90 },
    6: { x: 0,   y: 180 }
};

let currentX = -18;
let currentY = 24;
let isRolling = false;

let dicePointerDown = false;
let diceDragging = false;
let diceMoved = 0;
let diceStartLeft = 0;
let diceStartTop = 0;
let dicePointerStartX = 0;
let dicePointerStartY = 0;

diceScene.addEventListener("pointerdown",(e)=>{
    dicePointerDown = true;
    diceDragging = false;
    diceMoved = 0;
    diceStartLeft = diceScene.offsetLeft;
    diceStartTop = diceScene.offsetTop;
    dicePointerStartX = e.clientX;
    dicePointerStartY = e.clientY;
    diceScene.setPointerCapture(e.pointerId);
});

diceScene.addEventListener("pointermove",(e)=>{
    if(!dicePointerDown) return;
    const dx = e.clientX - dicePointerStartX;
    const dy = e.clientY - dicePointerStartY;
    diceMoved = Math.abs(dx) + Math.abs(dy);
    if(diceMoved > 6){
        diceDragging = true;
        diceScene.classList.add("dragging");
        diceScene.style.left = (diceStartLeft + dx) + "px";
        diceScene.style.top = (diceStartTop + dy) + "px";
    }
});

diceScene.addEventListener("pointerup",(e)=>{
    dicePointerDown = false;
    diceScene.classList.remove("dragging");
    if(!diceDragging && diceMoved <= 6){
        rollDice();
    }
    diceDragging = false;
});

function rollDice(){
    if(isRolling) return;
    isRolling = true;
    const result = 1 + Math.floor(Math.random() * 6);
    const target = faceRotation[result];
    const spinsX = (2 + Math.floor(Math.random()*2)) * 360 * (Math.random() < 0.5 ? 1 : -1);
    const spinsY = (2 + Math.floor(Math.random()*2)) * 360 * (Math.random() < 0.5 ? 1 : -1);
    currentX += spinsX;
    currentY += spinsY;
    // land exactly on the target face angles (mod 360) after the spins
    const finalX = currentX - (currentX % 360) + target.x;
    const finalY = currentY - (currentY % 360) + target.y;
    currentX = finalX;
    currentY = finalY;
    dice.classList.add("rolling");
    dice.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
    setTimeout(()=>{
        dice.classList.remove("rolling");
        isRolling = false;
    }, 950);
}
</script>
</body>
</html>
