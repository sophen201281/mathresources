<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1,user-scalable=no">

<title>Crocodile Compare Counters</title>

<style>

*{

box-sizing:border-box;

}

body{

margin:0;

font-family:Arial,sans-serif;

background:#eef3f7;

overflow:hidden;

}

.toolbar{

display:flex;

flex-wrap:wrap;

gap:8px;

padding:10px;

background:white;

box-shadow:0 2px 6px rgba(0,0,0,.1);

position:relative;

z-index:100;

}

button,

.home-btn{

border:none;

padding:10px 14px;

border-radius:10px;

background:#2d89ef;

color:white;

font-size:14px;

text-decoration:none;

}

.activeMode{

background:#ff5722;

}

#workspace{

position:relative;

width:100vw;

height:calc(100vh - 65px);

overflow:hidden;

}

canvas{

position:absolute;

inset:0;

z-index:1;

touch-action:none;

}

#middleZone{

position:absolute;

left:40%;

width:20%;

top:0;

bottom:0;

border-left:3px dashed rgba(0,0,0,.15);

border-right:3px dashed rgba(0,0,0,.15);

pointer-events:none;

z-index:2;

}

.countLabel{

position:absolute;

top:10px;

font-size:56px;

font-weight:bold;

pointer-events:none;

z-index:20;

}

#leftCount{

left:20%;

}

#rightCount{

right:20%;

}

.counter{

position:absolute;

width:46px;

height:46px;

border-radius:50%;

background:#ff9800;

border:2px solid rgba(0,0,0,.15);

touch-action:none;

z-index:15;

}

#croc{

position:absolute;

left:50%;

top:55%;

transform:translate(-50%,-50%);

width:140px;

height:auto;

user-select:none;

cursor:grab;

touch-action:none;

-webkit-user-drag:none;

z-index:30;

}

</style>

</head>

<body>

<div class="toolbar">

<button onclick="addCounter()">

វត្ថុសម្រាប់រាប់

</button>

<button id="drawBtn"

onclick="setMode('draw')">

សរសេរ

</button>

<button id="eraseBtn"

onclick="setMode('erase')">

លុប

</button>

<button onclick="clearCanvas()">

សម្អាត

</button>

<a href="../index.html"

class="home-btn">

🏡 Home

</a>

</div>

<div id="workspace">

<canvas id="drawCanvas"></canvas>

<div id="middleZone"></div>

<div id="leftCount"

class="countLabel">

0

</div>

<div id="rightCount"

class="countLabel">

0

</div>

<img

id="croc"

src="images/crocodile.jpg"

alt="crocodile">

</div>

<script>

const workspace=

document.getElementById(

"workspace"

);

const canvas=

document.getElementById(

"drawCanvas"

);

const ctx=

canvas.getContext(

"2d"

);

const croc=

document.getElementById(

"croc"

);

const leftCount=

document.getElementById(

"leftCount"

);

const rightCount=

document.getElementById(

"rightCount"

);

const drawBtn=

document.getElementById(

"drawBtn"

);

const eraseBtn=

document.getElementById(

"eraseBtn"

);

let counters=[];

let mode="draw";

/* CANVAS */

function resize(){

canvas.width=

workspace.clientWidth;

canvas.height=

workspace.clientHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

function setMode(newMode){

mode=newMode;

drawBtn.classList.remove(

"activeMode"

);

eraseBtn.classList.remove(

"activeMode"

);

if(mode==="draw")

drawBtn.classList.add(

"activeMode"

);

if(mode==="erase")

eraseBtn.classList.add(

"activeMode"

);

}

setMode("draw");

let drawing=false;

function getPos(e){

const p=

e.touches?

e.touches[0]:

e;

const rect=

canvas.getBoundingClientRect();

return{

x:p.clientX-rect.left,

y:p.clientY-rect.top

};

}

function startDraw(e){

if(

e.target.classList.contains(

"counter"

)

||

e.target.id==="croc"

){

return;

}

drawing=true;

const p=

getPos(e);

ctx.beginPath();

ctx.moveTo(

p.x,

p.y

);

}

function draw(e){

if(!drawing)

return;

e.preventDefault();

const p=

getPos(e);

ctx.lineCap=

"round";

ctx.lineWidth=

mode==="erase"

? 28

: 4;

ctx.strokeStyle=

mode==="erase"

?

"#eef3f7"

:

"black";

ctx.lineTo(

p.x,

p.y

);

ctx.stroke();

}

function stopDraw(){

drawing=false;

}

workspace.addEventListener(

"mousedown",

startDraw

);

workspace.addEventListener(

"mousemove",

draw

);

document.addEventListener(

"mouseup",

stopDraw

);

workspace.addEventListener(

"touchstart",

startDraw,

{passive:false}

);

workspace.addEventListener(

"touchmove",

draw,

{passive:false}

);

document.addEventListener(

"touchend",

stopDraw

);

function clearCanvas(){

ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);

}

/* COUNTERS */

function addCounter(){

const c=

document.createElement(

"div"

);

c.className=

"counter";

if(Math.random()<0.5){

c.style.left=

(40+

Math.random()*180)

+"px";

}else{

c.style.left=

(window.innerWidth

-240+

Math.random()*120)

+"px";

}

c.style.top=

(150+

Math.random()*260)

+"px";

workspace.appendChild(c);

counters.push(c);

makeCounterDrag(c);

updateCounts();

}

function makeCounterDrag(el){

let ox,oy;

let lastTap=0;

function deleteCounter(){

counters=

counters.filter(

c=>c!==el

);

el.remove();

updateCounts();

}

el.addEventListener(

"dblclick",

deleteCounter

);

el.addEventListener(

"touchstart",

e=>{

const now=

Date.now();

if(

now-lastTap

<300

){

deleteCounter();

return;

}

lastTap=now;

const r=

el.getBoundingClientRect();

ox=

e.touches[0]

.clientX-r.left;

oy=

e.touches[0]

.clientY-r.top;

document.addEventListener(

"touchmove",

move,

{passive:false}

);

document.addEventListener(

"touchend",

stop

);

});

el.addEventListener(

"mousedown",

e=>{

ox=e.offsetX;

oy=e.offsetY;

document.addEventListener(

"mousemove",

move

);

document.addEventListener(

"mouseup",

stop

);

});

function move(e){

const p=

e.touches?

e.touches[0]:

e;

el.style.left=

(p.clientX-ox)

+"px";

el.style.top=

(p.clientY-oy-65)

+"px";

updateCounts();

}

function stop(){

document.removeEventListener(

"mousemove",

move

);

document.removeEventListener(

"mouseup",

stop

);

document.removeEventListener(

"touchmove",

move

);

document.removeEventListener(

"touchend",

stop

);

}

}

/* COUNTING */

function updateCounts(){

let left=0;

let right=0;

const middle=

window.innerWidth/2;

counters.forEach(c=>{

const x=

c.offsetLeft+23;

if(x<middle){

left++;

}else{

right++;

}

});

leftCount.textContent=

left;

rightCount.textContent=

right;

updateCroc(

left,

right

);

}

/* CROCODILE */

function updateCroc(

left,

right

){

const x=

croc.offsetLeft;

const activeZone=

x>

window.innerWidth*0.4

&&

x<

window.innerWidth*0.6;

if(!activeZone){

croc.style.transform=

"translate(-50%,-50%) rotate(0deg)";

return;

}

if(left>right){

croc.style.transform=

"translate(-50%,-50%) rotate(180deg)";

}

else if(right>left){

croc.style.transform=

"translate(-50%,-50%) rotate(0deg)";

}

else{

croc.style.transform=

"translate(-50%,-50%) rotate(90deg)";

}

}

let draggingCroc=false;

let crocOffsetX=0;

let crocOffsetY=0;

function moveCroc(e){

if(!draggingCroc)

return;

e.preventDefault();

const p=

e.touches?

e.touches[0]:

e;

croc.style.left=

(p.clientX

-crocOffsetX)

+"px";

croc.style.top=

(p.clientY

-crocOffsetY

-65)

+"px";

updateCounts();

}

function stopCroc(){

draggingCroc=false;

document.removeEventListener(

"mousemove",

moveCroc

);

document.removeEventListener(

"touchmove",

moveCroc

);

}

croc.addEventListener(

"mousedown",

e=>{

draggingCroc=true;

const r=

croc.getBoundingClientRect();

crocOffsetX=

e.clientX-r.left;

crocOffsetY=

e.clientY-r.top;

document.addEventListener(

"mousemove",

moveCroc

);

document.addEventListener(

"mouseup",

stopCroc

);

});

croc.addEventListener(

"touchstart",

e=>{

draggingCroc=true;

const r=

croc.getBoundingClientRect();

crocOffsetX=

e.touches[0]

.clientX-r.left;

crocOffsetY=

e.touches[0]

.clientY-r.top;

document.addEventListener(

"touchmove",

moveCroc,

{passive:false}

);

document.addEventListener(

"touchend",

stopCroc

);

});

</script>

</body>

</html>
