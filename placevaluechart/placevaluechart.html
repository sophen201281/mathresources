<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Crocodile Compare Counters</title>

<style>

*{box-sizing:border-box;}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#eef3f7;

    overflow:hidden;

}

.toolbar{

    display:flex;

    gap:8px;

    padding:10px;

    background:white;

    box-shadow:0 2px 6px rgba(0,0,0,.1);

    position:relative;

    z-index:100;

}

button{

    border:none;

    padding:10px 14px;

    border-radius:10px;

    background:#2d89ef;

    color:white;

    font-size:14px;

}

#workspace{

    position:relative;

    width:100vw;

    height:calc(100vh - 65px);

    overflow:hidden;

}

canvas{

    position:absolute;

    inset:0;

    z-index:1;

    touch-action:none;

}

#middleZone{

    position:absolute;

    left:40%;

    width:20%;

    top:0;

    bottom:0;

    border-left:3px dashed rgba(0,0,0,.2);

    border-right:3px dashed rgba(0,0,0,.2);

    pointer-events:none;

    z-index:2;

}

.countLabel{

    position:absolute;

    top:10px;

    font-size:50px;

    font-weight:bold;

    z-index:20;

}

#leftCount{left:20%;}

#rightCount{right:20%;}

.counter{

    position:absolute;

    width:45px;

    height:45px;

    border-radius:50%;

    background:#ff9800;

    z-index:15;

}

/* 🐊 CROCODILE */

#croc{

    position:absolute;

    left:50%;

    top:55%;

    transform:translate(-50%,-50%);

    z-index:30;

    cursor:grab;

    user-select:none;

    touch-action:none;

}

#croc img{

    width:95px;

    pointer-events:none;

}

</style>

</head>

<body>

<div class="toolbar">

    <button onclick="addCounter()">Add</button>

</div>

<div id="workspace">

    <canvas id="drawCanvas"></canvas>

    <div id="middleZone"></div>

    <div id="leftCount" class="countLabel">0</div>

    <div id="rightCount" class="countLabel">0</div>

    <div id="croc">

        <img id="crocImg" src="images/crocodile-equal.jpg">

    </div>

</div>

<script>

const workspace = document.getElementById("workspace");

const canvas = document.getElementById("drawCanvas");

const ctx = canvas.getContext("2d");

const croc = document.getElementById("croc");

const crocImg = document.getElementById("crocImg");

const leftCount = document.getElementById("leftCount");

const rightCount = document.getElementById("rightCount");

let counters = [];

/* ---------------- RESIZE ---------------- */

function resize(){

    canvas.width = workspace.clientWidth;

    canvas.height = workspace.clientHeight;

}

resize();

window.addEventListener("resize", resize);

/* ---------------- COUNTERS ---------------- */

function addCounter(){

    const c = document.createElement("div");

    c.className = "counter";

    c.style.left = Math.random()*80 + "%";

    c.style.top = (150 + Math.random()*200) + "px";

    workspace.appendChild(c);

    counters.push(c);

    dragCounter(c);

    updateCounts();

}

function dragCounter(el){

    let ox, oy;

    el.addEventListener("mousedown", e=>{

        ox = e.offsetX;

        oy = e.offsetY;

        document.addEventListener("mousemove", move);

        document.addEventListener("mouseup", stop);

    });

    function move(e){

        el.style.left = (e.clientX - ox) + "px";

        el.style.top = (e.clientY - oy - 65) + "px";

        updateCounts();

    }

    function stop(){

        document.removeEventListener("mousemove", move);

        document.removeEventListener("mouseup", stop);

    }

}

/* ---------------- COUNT ---------------- */

function updateCounts(){

    let left = 0;

    let right = 0;

    const mid = window.innerWidth/2;

    counters.forEach(c=>{

        const x = c.offsetLeft;

        if(x < mid) left++;

        else right++;

    });

    leftCount.textContent = left;

    rightCount.textContent = right;

    updateCroc(left,right);

}

/* ---------------- CROCODILE ---------------- */

function updateCroc(left,right){

    const x = croc.offsetLeft;

    const active =

        x > window.innerWidth*0.4 &&

        x < window.innerWidth*0.6;

    if(!active){

        crocImg.src = "images/crocodile-equal.jpg";

        return;

    }

    if(left > right){

        crocImg.src = "images/crocodile-right.jpg";

    }

    else if(right > left){

        crocImg.src = "images/crocodile-left.jpg";

    }

    else{

        crocImg.src = "images/crocodile-equal.jpg";

    }

}

/* ---------------- FIXED DRAG CROCODILE ---------------- */

let dragging = false;

let ox = 0, oy = 0;

croc.addEventListener("mousedown", startDrag);

croc.addEventListener("touchstart", startDrag, {passive:false});

function startDrag(e){

    dragging = true;

    const p = e.touches ? e.touches[0] : e;

    const r = croc.getBoundingClientRect();

    ox = p.clientX - r.left;

    oy = p.clientY - r.top;

    document.addEventListener("mousemove", moveDrag);

    document.addEventListener("touchmove", moveDrag, {passive:false});

    document.addEventListener("mouseup", stopDrag);

    document.addEventListener("touchend", stopDrag);

}

function moveDrag(e){

    if(!dragging) return;

    const p = e.touches ? e.touches[0] : e;

    croc.style.left = (p.clientX - ox) + "px";

    croc.style.top = (p.clientY - oy - 65) + "px";

    updateCounts();

}

function stopDrag(){

    dragging = false;

    document.removeEventListener("mousemove", moveDrag);

    document.removeEventListener("touchmove", moveDrag);

    document.removeEventListener("mouseup", stopDrag);

    document.removeEventListener("touchend", stopDrag);

}

</script>

</body>

</html>
