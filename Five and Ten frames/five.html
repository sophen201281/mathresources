<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Frames + Counters + Drawing App</title>

<style>

*{

    box-sizing:border-box;

    user-select:none;

    touch-action:none;

}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#eef2f7;

    overflow:hidden;

}

/* TOOLBAR */

#toolbar{

    position:fixed;

    top:0;

    left:0;

    right:0;

    height:60px;

    background:#fff;

    display:flex;

    align-items:center;

    gap:10px;

    padding:8px;

    box-shadow:0 2px 8px rgba(0,0,0,.15);

    z-index:1000;

}

button,select{

    padding:8px 12px;

    font-size:14px;

}

/* WORKSPACE */

#workspace{

    position:absolute;

    inset:60px 0 0 0;

    overflow:hidden;

}

/* CANVAS */

#drawCanvas{

    position:absolute;

    inset:0;

    z-index:1;

}

/* FRAME */

.frame{

    position:absolute;

    background:white;

    border:3px solid #333;

    border-radius:10px;

    padding:6px;

    z-index:5;

    cursor:move;

}

/* GRID */

.grid{

    display:grid;

    gap:4px;

}

.five{

    grid-template-columns:repeat(5,1fr);

}

.ten{

    grid-template-columns:repeat(5,1fr);

    grid-template-rows:repeat(2,1fr);

}

.cell{

    width:55px;

    height:55px;

    border:2px solid #aaa;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

}

/* COUNTER (NO NUMBER NOW) */

.counter{

    width:35px;

    height:35px;

    border-radius:50%;

    background:#ff4d4d;

    transition:transform .3s ease;

}

</style>

</head>

<body>

<div id="toolbar">

<select id="frameType">

    <option value="five">Five Frame</option>

    <option value="ten">Ten Frame</option>

</select>

<button id="addFrameBtn">Add Frame</button>

<button id="addCounterBtn">Add Counter</button>

<button id="penBtn">Pen</button>

<button id="eraserBtn">Eraser</button>

<button id="clearBtn">Clear</button>

</div>

<div id="workspace">

<canvas id="drawCanvas"></canvas>

</div>

<script>

const workspace = document.getElementById("workspace");

const canvas = document.getElementById("drawCanvas");

const ctx = canvas.getContext("2d");

let selectedFrame = null;

/* CANVAS */

function resize(){

    canvas.width = workspace.clientWidth;

    canvas.height = workspace.clientHeight;

}

resize();

window.addEventListener("resize", resize);

let drawing=false;

let erasing=false;

canvas.addEventListener("pointerdown",(e)=>{

    drawing=true;

    ctx.beginPath();

    ctx.moveTo(e.offsetX,e.offsetY);

});

canvas.addEventListener("pointermove",(e)=>{

    if(!drawing) return;

    if(erasing){

        ctx.globalCompositeOperation="destination-out";

        ctx.lineWidth=25;

    }else{

        ctx.globalCompositeOperation="source-over";

        ctx.strokeStyle="black";

        ctx.lineWidth=3;

    }

    ctx.lineTo(e.offsetX,e.offsetY);

    ctx.stroke();

});

window.addEventListener("pointerup",()=>drawing=false);

document.getElementById("penBtn").onclick=()=>erasing=false;

document.getElementById("eraserBtn").onclick=()=>erasing=true;

document.getElementById("clearBtn").onclick=()=>{

    ctx.clearRect(0,0,canvas.width,canvas.height);

};

/* FRAME CREATION */

document.getElementById("addFrameBtn").onclick=()=>{

    const type = document.getElementById("frameType").value;

    const frame = document.createElement("div");

    frame.className="frame";

    frame.style.left="120px";

    frame.style.top="120px";

    const grid = document.createElement("div");

    grid.className="grid " + type;

    const count = type==="five" ? 5 : 10;

    for(let i=0;i<count;i++){

        const cell=document.createElement("div");

        cell.className="cell";

        grid.appendChild(cell);

    }

    frame.appendChild(grid);

    workspace.appendChild(frame);

    frame.nextIndex = 0;

    selectedFrame = frame;

    frame.addEventListener("pointerdown",()=>{

        selectedFrame=frame;

    });

    makeFrameDraggable(frame);

};

/* ADD COUNTER (NOW STORED INSIDE CELLS) */

document.getElementById("addCounterBtn").onclick=()=>{

    if(!selectedFrame) return;

    const cells = selectedFrame.querySelectorAll(".cell");

    if(selectedFrame.nextIndex === undefined){

        selectedFrame.nextIndex = 0;

    }

    if(selectedFrame.nextIndex >= cells.length){

        return;

    }

    const cell = cells[selectedFrame.nextIndex];

    selectedFrame.nextIndex++;

    const counter = document.createElement("div");

    counter.className="counter";

    // start animation position

    counter.style.position="fixed";

    counter.style.left="20px";

    counter.style.top="20px";

    document.body.appendChild(counter);

    const targetRect = cell.getBoundingClientRect();

    requestAnimationFrame(()=>{

        counter.style.left = targetRect.left + targetRect.width/2 - 17 + "px";

        counter.style.top = targetRect.top + targetRect.height/2 - 17 + "px";

        setTimeout(()=>{

            // FINAL: move inside cell (so it follows frame)

            counter.style.position="absolute";

            counter.style.left="50%";

            counter.style.top="50%";

            counter.style.transform="translate(-50%,-50%)";

            cell.appendChild(counter);

        },300);

    });

};

/* FRAME DRAG */

function makeFrameDraggable(el){

    let dx,dy,drag=false;

    el.addEventListener("pointerdown",(e)=>{

        if(e.target.classList.contains("counter")) return;

        drag=true;

        dx=e.clientX-el.offsetLeft;

        dy=e.clientY-el.offsetTop;

    });

    window.addEventListener("pointermove",(e)=>{

        if(!drag) return;

        el.style.left=(e.clientX-dx)+"px";

        el.style.top=(e.clientY-dy)+"px";

    });

    window.addEventListener("pointerup",()=>drag=false);

}

</script>

</body>

</html>
