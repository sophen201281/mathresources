<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Frames + Counters + Drawing App</title>

<style>

*{

    box-sizing:border-box;

    user-select:none;

    touch-action:none;

}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#eef2f7;

    overflow:hidden;

}

/* ================= TOOLBAR ================= */

#toolbar{

    position:fixed;

    top:0;

    left:0;

    right:0;

    height:60px;

    background:#fff;

    display:flex;

    align-items:center;

    gap:10px;

    padding:8px;

    box-shadow:0 2px 8px rgba(0,0,0,.15);

    z-index:1000;

}

button,select{

    padding:8px 12px;

    font-size:14px;

}

/* ================= WORKSPACE ================= */

#workspace{

    position:absolute;

    inset:60px 0 0 0;

    overflow:hidden;

}

/* ================= CANVAS ================= */

#drawCanvas{

    position:absolute;

    inset:0;

    z-index:1;

}

/* ================= FRAMES ================= */

.frame{

    position:absolute;

    background:white;

    border:3px solid #333;

    border-radius:10px;

    padding:6px;

    z-index:5;

    cursor:move;

}

.grid{

    display:grid;

    gap:4px;

}

.five{

    grid-template-columns:repeat(5,1fr);

}

.ten{

    grid-template-columns:repeat(5,1fr);

    grid-template-rows:repeat(2,1fr);

}

.cell{

    width:55px;

    height:55px;

    border:2px solid #aaa;

    position:relative;

}

/* ================= COUNTERS ================= */

.counter{

    width:40px;

    height:40px;

    border-radius:50%;

    background:#ff4d4d;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;

    position:absolute;

    z-index:1000;

    transition:left .5s ease, top .5s ease;

    touch-action:none;

}

</style>

</head>

<body>

<!-- ================= TOOLBAR ================= -->

<div id="toolbar">

<select id="frameType">

    <option value="five">Five Frame</option>

    <option value="ten">Ten Frame</option>

</select>

<button id="addFrameBtn">Add Frame</button>

<button id="addCounterBtn">Add Counter</button>

<button id="penBtn">Pen</button>

<button id="eraserBtn">Eraser</button>

<button id="clearBtn">Clear</button>

</div>

<!-- ================= WORKSPACE ================= -->

<div id="workspace">

<canvas id="drawCanvas"></canvas>

</div>

<script>

const workspace = document.getElementById("workspace");

const canvas = document.getElementById("drawCanvas");

const ctx = canvas.getContext("2d");

let selectedFrame = null;

let counterNumber = 1;

/* ================= RESIZE CANVAS ================= */

function resize(){

    canvas.width = workspace.clientWidth;

    canvas.height = workspace.clientHeight;

}

resize();

window.addEventListener("resize", resize);

/* ================= DRAWING ================= */

let drawing = false;

let erasing = false;

canvas.addEventListener("pointerdown", (e)=>{

    drawing = true;

    ctx.beginPath();

    ctx.moveTo(e.offsetX, e.offsetY);

});

canvas.addEventListener("pointermove", (e)=>{

    if(!drawing) return;

    if(erasing){

        ctx.globalCompositeOperation = "destination-out";

        ctx.lineWidth = 25;

    }else{

        ctx.globalCompositeOperation = "source-over";

        ctx.strokeStyle = "black";

        ctx.lineWidth = 3;

    }

    ctx.lineTo(e.offsetX, e.offsetY);

    ctx.stroke();

});

window.addEventListener("pointerup", ()=> drawing=false);

document.getElementById("penBtn").onclick = ()=> erasing=false;

document.getElementById("eraserBtn").onclick = ()=> erasing=true;

document.getElementById("clearBtn").onclick = ()=>{

    ctx.clearRect(0,0,canvas.width,canvas.height);

};

/* ================= ADD FRAME ================= */

document.getElementById("addFrameBtn").onclick = ()=>{

    const type = document.getElementById("frameType").value;

    const frame = document.createElement("div");

    frame.className = "frame";

    frame.style.left = "120px";

    frame.style.top = "120px";

    const grid = document.createElement("div");

    grid.className = "grid " + type;

    const count = type === "five" ? 5 : 10;

    for(let i=0;i<count;i++){

        const cell = document.createElement("div");

        cell.className = "cell";

        grid.appendChild(cell);

    }

    frame.appendChild(grid);

    workspace.appendChild(frame);

    frame.nextCellIndex = 0;

    selectedFrame = frame;

    frame.addEventListener("pointerdown", ()=>{

        selectedFrame = frame;

    });

    makeFrameDraggable(frame);

};

/* ================= ADD COUNTER (FIXED SEQUENCE) ================= */

document.getElementById("addCounterBtn").onclick = ()=>{

    if(!selectedFrame) return;

    const cells = selectedFrame.querySelectorAll(".cell");

    if(selectedFrame.nextCellIndex === undefined){

        selectedFrame.nextCellIndex = 0;

    }

    if(selectedFrame.nextCellIndex >= cells.length){

        return;

    }

    const targetCell = cells[selectedFrame.nextCellIndex];

    selectedFrame.nextCellIndex++;

    const counter = document.createElement("div");

    counter.className = "counter";

    counter.textContent = counterNumber++;

    counter.style.left = "20px";

    counter.style.top = "20px";

    workspace.appendChild(counter);

    makeCounterDraggable(counter);

    const wr = workspace.getBoundingClientRect();

    const cr = targetCell.getBoundingClientRect();

    const x = cr.left - wr.left + (cr.width - 40)/2;

    const y = cr.top - wr.top + (cr.height - 40)/2;

    requestAnimationFrame(()=>{

        counter.style.left = x + "px";

        counter.style.top = y + "px";

    });

};

/* ================= FRAME DRAG ================= */

function makeFrameDraggable(el){

    let dx,dy,drag=false;

    el.addEventListener("pointerdown",(e)=>{

        if(e.target.classList.contains("counter")) return;

        drag=true;

        dx = e.clientX - el.offsetLeft;

        dy = e.clientY - el.offsetTop;

    });

    window.addEventListener("pointermove",(e)=>{

        if(!drag) return;

        el.style.left = (e.clientX - dx) + "px";

        el.style.top = (e.clientY - dy) + "px";

    });

    window.addEventListener("pointerup",()=> drag=false);

}

/* ================= COUNTER DRAG ================= */

function makeCounterDraggable(el){

    let dx,dy,drag=false;

    el.addEventListener("pointerdown",(e)=>{

        drag=true;

        el.style.transition="none";

        dx = e.clientX - el.offsetLeft;

        dy = e.clientY - el.offsetTop;

        e.stopPropagation();

    });

    window.addEventListener("pointermove",(e)=>{

        if(!drag) return;

        el.style.left = (e.clientX - dx) + "px";

        el.style.top = (e.clientY - dy) + "px";

    });

    window.addEventListener("pointerup",()=>{

        drag=false;

        el.style.transition="left .5s ease, top .5s ease";

    });

}

</script>

</body>

</html>
