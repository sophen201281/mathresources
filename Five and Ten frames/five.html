<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Responsive Five & Ten Frames</title>
    <style>
        /* ----- reset & base ----- */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            overflow: hidden;
        }

        /* ----- workspace & drawing canvas ----- */
        #workspace {
            position: absolute;
            inset: 0 0 90px 0;
        }

        #drawCanvas {
            position: absolute;
            inset: 0;
            z-index: 1;
            touch-action: none;
        }

        /* ----- frame (five / ten grid) ----- */
        .frame {
            position: absolute;
            background: #fff;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 6px;
            z-index: 5;
            cursor: grab;
            touch-action: none;
            will-change: transform;
        }

        .grid {
            display: grid;
            gap: 4px;
        }

        .five {
            grid-template-columns: repeat(5, 1fr);
        }

        .ten {
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        .cell {
            width: min(12vw, 60px);
            height: min(12vw, 60px);
            border: 2px solid #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: #ff4d4d;
            touch-action: none;
        }

        /* ----- toolbar ----- */
        #toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            min-height: 90px;
            background: #fff;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, .15);
            z-index: 1000;
        }

        button,
        select {
            padding: 10px 12px;
            font-size: 13px;
            border: none;
            border-radius: 10px;
        }

        #addFrameBtn {
            background: #4caf50;
            color: #fff;
        }
        #addCounterBtn {
            background: #2196f3;
            color: #fff;
        }
        #penBtn {
            background: #ff9800;
            color: #fff;
        }
        #eraserBtn {
            background: #f44336;
            color: #fff;
        }
        #clearBtn {
            background: #9c27b0;
            color: #fff;
        }
        .homeBtn {
            background: #607d8b;
            color: #fff;
        }
        select {
            background: #e0e0e0;
        }
    </style>
</head>

<body>
    <!-- workspace + drawing canvas -->
    <div id="workspace">
        <canvas id="drawCanvas"></canvas>
    </div>

    <!-- toolbar -->
    <div id="toolbar">
        <select id="frameType">
            <option value="five">បន្ទះ៥</option>
            <option value="ten">បន្ទះដប់</option>
        </select>
        <button id="addFrameBtn">➕ Frame</button>
        <button id="addCounterBtn">🔴 Counter</button>
        <button id="penBtn">✏️ Pen</button>
        <button id="eraserBtn">🧽 Eraser</button>
        <button id="clearBtn">🗑️ Clear</button>
        <button class="homeBtn" onclick="window.location.href='../index.html'">🏡 Home</button>
    </div>

    <script>
        // ----- DOM refs -----
        const workspace = document.getElementById("workspace");
        const canvas = document.getElementById("drawCanvas");
        const ctx = canvas.getContext("2d");

        let selectedFrame = null;
        let mode = "pen"; // "pen" | "eraser"

        // ----- canvas sizing -----
        function resize() {
            canvas.width = workspace.clientWidth;
            canvas.height = workspace.clientHeight;
        }
        resize();
        addEventListener("resize", resize);

        // ----- drawing state -----
        let drawing = false;

        function pos(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        canvas.onpointerdown = (e) => {
            drawing = true;
            const p = pos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
        };

        canvas.onpointermove = (e) => {
            if (!drawing) return;
            const p = pos(e);
            if (mode === "eraser") {
                ctx.globalCompositeOperation = "destination-out";
                ctx.lineWidth = 25;
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.strokeStyle = "#222";
                ctx.lineWidth = 3;
            }
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        };

        addEventListener("pointerup", () => (drawing = false));

        // ----- toolbar buttons -----
        penBtn.onclick = () => (mode = "pen");
        eraserBtn.onclick = () => (mode = "eraser");
        clearBtn.onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ----- double‑tap delete (frames & counters) -----
        function doubleTapDelete(el) {
            let lastTap = 0;
            el.addEventListener("pointerdown", (e) => {
                const now = Date.now();
                if (now - lastTap < 300) {
                    // double‑tap → remove the element
                    const parent = el.parentElement;
                    if (parent && parent.classList.contains("cell")) {
                        parent.dataset.occupied = "0";
                    }
                    el.remove();
                    return;
                }
                lastTap = now;
                e.stopPropagation();
            });
        }

        // ----- drag‑and‑drop for frames -----
        function makeDraggable(el) {
            let dragging = false;
            let offsetX = 0,
                offsetY = 0;
            let x = 40,
                y = 40;
            el.style.transform = `translate(${x}px, ${y}px)`;

            el.addEventListener("pointerdown", (e) => {
                // ignore if the pointer is on a counter (counters have their own handlers)
                if (e.target.classList.contains("counter")) return;
                dragging = true;
                offsetX = e.clientX - x;
                offsetY = e.clientY - y;
                el.setPointerCapture(e.pointerId);
                e.preventDefault();
                e.stopPropagation();
            });

            el.addEventListener("pointermove", (e) => {
                if (!dragging) return;
                x = e.clientX - offsetX;
                y = e.clientY - offsetY;
                el.style.transform = `translate(${x}px, ${y}px)`;
                e.preventDefault();
            });

            function endDrag(e) {
                if (!dragging) return;
                dragging = false;
                try { el.releasePointerCapture(e.pointerId); } catch (_) {}
            }
            el.addEventListener("pointerup", endDrag);
            el.addEventListener("pointercancel", endDrag);
        }

        // ----- add new frame -----
        addFrameBtn.onclick = () => {
            const type = frameType.value;
            const frame = document.createElement("div");
            frame.className = "frame";
            frame.style.left = "0";
            frame.style.top = "0";

            const grid = document.createElement("div");
            grid.className = "grid " + type;

            const count = type === "five" ? 5 : 10;
            for (let i = 0; i < count; i++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.occupied = "0";
                grid.appendChild(cell);
            }

            frame.appendChild(grid);
            workspace.appendChild(frame);
            selectedFrame = frame;

            frame.onpointerdown = () => (selectedFrame = frame);
            makeDraggable(frame);
            doubleTapDelete(frame);
        };

        // ----- add counter to selected frame -----
        addCounterBtn.onclick = () => {
            if (!selectedFrame) return;
            const cells = selectedFrame.querySelectorAll(".cell");
            const empty = Array.from(cells).find((c) => c.dataset.occupied === "0");
            if (!empty) return;

            empty.dataset.occupied = "1";
            const dot = document.createElement("div");
            dot.className = "counter";
            empty.appendChild(dot);
            doubleTapDelete(dot);
        };
    </script>
</body>
</html>
