<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Responsive Five & Ten Frames</title>

<style>

*{

    box-sizing:border-box;

    user-select:none;

}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#eef2f7;

    overflow:hidden;

}

/* ================= WORKSPACE ================= */

#workspace{

    position:absolute;

    inset:0 0 90px 0;

}

/* ================= CANVAS ================= */

#drawCanvas{

    position:absolute;

    inset:0;

    z-index:1;

    touch-action:none;

}

/* ================= FRAME ================= */

.frame{

    position:absolute;

    background:#fff;

    border:3px solid #333;

    border-radius:12px;

    padding:6px;

    z-index:5;

    cursor:grab;

}

/* GRID */

.grid{

    display:grid;

    gap:4px;

}

.five{ grid-template-columns:repeat(5,1fr); }

.ten{

    grid-template-columns:repeat(5,1fr);

    grid-template-rows:repeat(2,1fr);

}

/* CELL */

.cell{

    width:min(12vw,60px);

    height:min(12vw,60px);

    border:2px solid #aaa;

    display:flex;

    align-items:center;

    justify-content:center;

}

/* COUNTER */

.counter{

    width:70%;

    height:70%;

    border-radius:50%;

    background:#ff4d4d;

}

/* ================= TOOLBAR ================= */

#toolbar{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    min-height:90px;

    background:#fff;

    display:flex;

    flex-wrap:wrap;

    align-items:center;

    justify-content:center;

    gap:8px;

    padding:10px;

    box-shadow:0 -2px 12px rgba(0,0,0,.15);

    z-index:1000;

}

button,select{

    padding:10px 12px;

    font-size:13px;

    border:none;

    border-radius:10px;

}

/* COLORS */

#addFrameBtn{ background:#4caf50; color:#fff; }

#addCounterBtn{ background:#2196f3; color:#fff; }

#penBtn{ background:#ff9800; color:#fff; }

#eraserBtn{ background:#f44336; color:#fff; }

#clearBtn{ background:#9c27b0; color:#fff; }

.homeBtn{ background:#607d8b; color:#fff; }

select{

    background:#e0e0e0;

}

/* RESPONSIVE */

@media (max-width:768px){

    #workspace{

        inset:0 0 110px 0;

    }

}

@media (max-width:480px){

    button,select{

        flex:1 1 40%;

        font-size:12px;

        padding:9px 10px;

    }

    #workspace{

        inset:0 0 130px 0;

    }

}

</style>

</head>

<body>

<div id="workspace">

<canvas id="drawCanvas"></canvas>

</div>

<!-- TOOLBAR -->

<div id="toolbar">

<select id="frameType">

    <option value="five">បន្ទះ៥</option>

    <option value="ten">បន្ទះដប់</option>

</select>

<button id="addFrameBtn">➕ Frame</button>

<button id="addCounterBtn">🔴 Counter</button>

<button id="penBtn">✏️ Pen</button>

<button id="eraserBtn">🧽 Eraser</button>

<button id="clearBtn">🗑️ Clear</button>

<button class="homeBtn" onclick="window.location.href='../index.html'">🏡 Home</button>

</div>

<script>

const workspace = document.getElementById("workspace");

const canvas = document.getElementById("drawCanvas");

const ctx = canvas.getContext("2d");

let selectedFrame = null;

let mode = "pen";

/* ================= RESIZE ================= */

function resize(){

    canvas.width = workspace.clientWidth;

    canvas.height = workspace.clientHeight;

}

resize();

window.addEventListener("resize", resize);

/* ================= DRAWING ================= */

let drawing = false;

function getPos(e){

    const rect = canvas.getBoundingClientRect();

    return {

        x: e.clientX - rect.left,

        y: e.clientY - rect.top

    };

}

canvas.addEventListener("pointerdown",(e)=>{

    drawing = true;

    const p = getPos(e);

    ctx.beginPath();

    ctx.moveTo(p.x, p.y);

});

canvas.addEventListener("pointermove",(e)=>{

    if(!drawing) return;

    const p = getPos(e);

    if(mode === "eraser"){

        ctx.globalCompositeOperation = "destination-out";

        ctx.lineWidth = 25;

    }else{

        ctx.globalCompositeOperation = "source-over";

        ctx.strokeStyle = "#222";

        ctx.lineWidth = 3;

    }

    ctx.lineTo(p.x, p.y);

    ctx.stroke();

});

window.addEventListener("pointerup",()=> drawing = false);

/* ================= TOOLS ================= */

document.getElementById("penBtn").onclick = () => mode = "pen";

document.getElementById("eraserBtn").onclick = () => mode = "eraser";

document.getElementById("clearBtn").onclick = () => {

    ctx.clearRect(0,0,canvas.width,canvas.height);

};

/* ================= DOUBLE TAP DELETE (FIXED) ================= */

function doubleTapDelete(el){

    let lastTap = 0;

    el.addEventListener("pointerdown",(e)=>{

        const now = Date.now();

        if(now - lastTap < 300){

            const parentCell = el.parentElement;

            // FREE CELL WHEN COUNTER IS DELETED

            if(parentCell && parentCell.classList.contains("cell")){

                parentCell.dataset.occupied = "0";

            }

            el.remove();

            return;

        }

        lastTap = now;

        e.stopPropagation();

    });

}

/* ================= DRAG FRAME ================= */

function makeDraggable(el){

    let dx=0, dy=0, drag=false;

    el.addEventListener("pointerdown",(e)=>{

        if(e.target.classList.contains("counter")) return;

        drag = true;

        el.setPointerCapture(e.pointerId);

        dx = e.clientX - el.offsetLeft;

        dy = e.clientY - el.offsetTop;

    });

    el.addEventListener("pointermove",(e)=>{

        if(!drag) return;

        el.style.left = (e.clientX - dx) + "px";

        el.style.top = (e.clientY - dy) + "px";

    });

    el.addEventListener("pointerup",()=> drag = false);

}

/* ================= ADD FRAME ================= */

document.getElementById("addFrameBtn").onclick = () => {

    const type = document.getElementById("frameType").value;

    const frame = document.createElement("div");

    frame.className = "frame";

    frame.style.left = "10vw";

    frame.style.top = "10vh";

    const grid = document.createElement("div");

    grid.className = "grid " + type;

    const count = type === "five" ? 5 : 10;

    for(let i=0;i<count;i++){

        const cell = document.createElement("div");

        cell.className = "cell";

        cell.dataset.occupied = "0";

        grid.appendChild(cell);

    }

    frame.appendChild(grid);

    workspace.appendChild(frame);

    frame.cells = Array.from(frame.querySelectorAll(".cell"));

    selectedFrame = frame;

    frame.addEventListener("pointerdown",()=> selectedFrame = frame);

    makeDraggable(frame);

    doubleTapDelete(frame);

};

/* ================= ADD COUNTER ================= */

document.getElementById("addCounterBtn").onclick = () => {

    if(!selectedFrame) return;

    const cells = selectedFrame.querySelectorAll(".cell");

    const cell = Array.from(cells).find(c => c.dataset.occupied === "0");

    if(!cell) return;

    cell.dataset.occupied = "1";

    const counter = document.createElement("div");

    counter.className = "counter";

    cell.appendChild(counter);

    doubleTapDelete(counter);

};

</script>

</body>

</html>
