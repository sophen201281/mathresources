<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Counting Game</title>
<style>
body{
    font-family:Arial;
    text-align:center;
    background:#eef3f7;
    margin:0;
}
/* ---------- MATCHED AREA ---------- */
#matchedArea{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:10px;
    background:#e8f5e9;
    border-bottom:4px solid #66bb6a;
}
/* MATCH CARD */
.matchPair{
    display:flex;
    align-items:center;
    gap:10px;
    background:white;
    border:3px solid #43a047;
    border-radius:10px;
    padding:8px;
}
/* DOT CARD (matched) */
.cardBox{
    width:90px;
    height:90px;
    border:3px solid #444;
    border-radius:10px;
    display:grid;
    grid-template-columns:repeat(5,10px);
    gap:3px;
    justify-content:center;
    align-content:center;
    background:white;
}
/* DOT (matched) */
.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#1e88e5;
}
/* NUMBER CARD (matched) */
.numberCard{
    width:90px;
    height:90px;
    border:3px solid #444;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    background:white;
}
/* ---------- NUMBER OPTIONS ---------- */
#numberCards{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    max-width:500px;
    margin:20px auto;
    padding:10px;
}
.numberOption{
    height:60px;
    border:3px solid #444;
    border-radius:10px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    cursor:pointer;
}
.numberOption:hover{
    transform:scale(1.05);
}
/* ---------- ⭐ IMPROVED DOT CARD (CLEAR PATTERN) ---------- */
#dotCard{
    width:95%;
    max-width:320px;
    height:220px;
    margin:20px auto;
    background:white;
    border:5px solid #333;
    border-radius:18px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-auto-rows:1fr;
    gap:15px;
    justify-items:center;
    align-items:center;
    padding:20px;
}
/* BIG DOT */
.bigDot{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#2196f3;
    cursor:pointer;
    transition:0.2s;
}
.bigDot.active{
    background:#ff9800;
    transform:scale(1.2);
}
</style>
</head>
<body>
<h2>Matched Cards</h2>
<div id="matchedArea"></div>
<h2>Choose Number</h2>
<div id="numberCards"></div>
<h2>Count the Dots</h2>
<div id="dotCard"></div>
<script>
const dotCard=document.getElementById("dotCard");
const numberCards=document.getElementById("numberCards");
const matchedArea=document.getElementById("matchedArea");
let dotCount=0;
/* ---------- NUMBER CARDS ---------- */
for(let i=1;i<=10;i++){
    let c=document.createElement("div");
    c.className="numberOption";
    c.textContent=i;
    c.onclick=()=>checkAnswer(i);
    numberCards.appendChild(c);
}
/* ---------- NEW ROUND ---------- */
function newRound(){
    dotCount=Math.floor(Math.random()*10)+1;
    dotCard.innerHTML="";
    for(let i=0;i<dotCount;i++){
        let d=document.createElement("div");
        d.className="bigDot";
        d.onclick=()=>d.classList.toggle("active");
        dotCard.appendChild(d);
    }
}
/* ---------- CHECK ANSWER ---------- */
function checkAnswer(num){
    if(num===dotCount){
        addMatch(num);
        newRound();
    }
}
/* ---------- MATCH DISPLAY ---------- */
function addMatch(count){
    let pair=document.createElement("div");
    pair.className="matchPair";
    // DOT CARD
    let dots=document.createElement("div");
    dots.className="cardBox";
    for(let i=0;i<count;i++){
        let d=document.createElement("div");
        d.className="dot";
        dots.appendChild(d);
    }
    // NUMBER CARD
    let num=document.createElement("div");
    num.className="numberCard";
    num.textContent=count;
    pair.appendChild(dots);
    pair.appendChild(num);
    matchedArea.appendChild(pair);
}
newRound();
</script>
</body>
</html>
