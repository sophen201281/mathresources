<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Place Value Learning Tool</title>

<style>
body{
  font-family: Arial;
  background:#f4f7fb;
  text-align:center;
}

/* ===== CONTROL PANEL ===== */
#controls{
  background:#fff;
  padding:10px;
  margin:10px;
  border-radius:10px;
  display:inline-block;
}

select, button{
  padding:6px;
  margin:5px;
  font-size:14px;
}

/* ===== TABLE ===== */
.table{
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  gap:10px;
  margin:20px;
}

.col{
  background:#fff;
  border:2px solid #ccc;
  border-radius:10px;
  padding:5px;
}

.cell{
  border:1px dashed #aaa;
  min-height:130px;
  margin:5px 0;
  border-radius:8px;
  position:relative;
}

.row-label{
  font-size:12px;
  color:#666;
  margin-bottom:5px;
}

/* ===== COUNTER ===== */
.counter{
  width:26px;
  height:26px;
  border-radius:50%;
  position:absolute;
  touch-action:none;
  cursor:pointer;
}

/* colors by column */
.c0{ background:#ff4d4d; } /* Ten Thousands */
.c1{ background:#b84dff; } /* Thousands */
.c2{ background:#ffd24d; } /* Hundreds */
.c3{ background:#4dff88; } /* Tens */
.c4{ background:#4da6ff; } /* Ones */
</style>
</head>

<body>

<h2>📊 Place Value Learning Tool</h2>

<!-- ===== CONTROL PANEL ===== -->
<div id="controls">
  <label>Column:</label>
  <select id="colSelect">
    <option value="0">Ten Thousands</option>
    <option value="1">Thousands</option>
    <option value="2">Hundreds</option>
    <option value="3">Tens</option>
    <option value="4">Ones</option>
  </select>

  <label>Row:</label>
  <select id="rowSelect">
    <option value="0">Row 1</option>
    <option value="1">Row 2</option>
    <option value="2">Row 3 (Regroup)</option>
  </select>

  <button onclick="addCounter()">➕ Add Counter</button>
</div>

<!-- ===== TABLE ===== -->
<div id="table" class="table"></div>

<script>

const cols = ["Ten Thousands","Thousands","Hundreds","Tens","Ones"];

/* state[row][col] */
let state = Array(3).fill().map(()=> Array(5).fill().map(()=> []));

const table = document.getElementById("table");

/* =========================
   BUILD GRID
========================= */
function build(){
  table.innerHTML = "";

  cols.forEach((name,col)=>{

    const column = document.createElement("div");
    column.className = "col";
    column.innerHTML = `<h4>${name}</h4>`;

    for(let row=0; row<3; row++){

      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.row = row;
      cell.dataset.col = col;

      column.appendChild(cell);
    }

    table.appendChild(column);
  });

  render();
}

/* =========================
   ADD COUNTER (CONTROL PANEL)
========================= */
function addCounter(){
  const col = +colSelect.value;
  const row = +rowSelect.value;

  state[row][col].push({id: Date.now()});

  normalize();
  render();
}

/* =========================
   CREATE COUNTER (DRAG)
========================= */
function createCounter(row,col,index){

  const c = document.createElement("div");
  c.className = `counter c${col}`;

  let offsetX = 0;
  let offsetY = 0;
  let dragging = false;

  function start(e){
    dragging = true;

    const ev = e.touches ? e.touches[0] : e;

    offsetX = ev.clientX - c.offsetLeft;
    offsetY = ev.clientY - c.offsetTop;

    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", end);
    document.addEventListener("touchmove", move, {passive:false});
    document.addEventListener("touchend", end);
  }

  function move(e){
    if(!dragging) return;
    e.preventDefault();

    const ev = e.touches ? e.touches[0] : e;

    c.style.left = (ev.clientX - offsetX) + "px";
    c.style.top = (ev.clientY - offsetY) + "px";
  }

  function end(){
    dragging = false;

    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", end);
    document.removeEventListener("touchmove", move);
    document.removeEventListener("touchend", end);

    dropCheck(c,row,col,index);
  }

  c.addEventListener("mousedown", start);
  c.addEventListener("touchstart", start);

  return c;
}

/* =========================
   DROP DETECTION
========================= */
function dropCheck(counter, fr, fc, index){

  const rect = counter.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  let target = null;

  document.querySelectorAll(".cell").forEach(cell=>{
    const r = cell.getBoundingClientRect();

    if(cx>r.left && cx<r.right && cy>r.top && cy<r.bottom){
      target = cell;
    }
  });

  if(!target){
    render();
    return;
  }

  const tr = +target.dataset.row;
  const tc = +target.dataset.col;

  moveCounter(fr,fc,index,tr,tc);
}

/* =========================
   MOVE COUNTER
========================= */
function moveCounter(fr,fc,index,tr,tc){

  const item = state[fr][fc][index];
  if(!item) return;

  state[fr][fc].splice(index,1);
  state[tr][tc].push(item);

  normalize();
  render();
}

/* =========================
   REGROUPING RULE (10 = 1)
========================= */
function normalize(){

  for(let col=4; col>0; col--){
    for(let row=2; row>=0; row--){
      while(state[row][col].length >= 10){
        for(let i=0;i<10;i++) state[row][col].pop();
        state[row][col-1].push({id: Date.now()});
      }
    }
  }
}

/* =========================
   RENDER EVERYTHING
========================= */
function render(){

  document.querySelectorAll(".cell").forEach(cell=>{
    cell.innerHTML = "";

    const row = +cell.dataset.row;
    const col = +cell.dataset.col;

    state[row][col].forEach((item,i)=>{

      const c = createCounter(row,col,i);

      c.style.left = (10 + (i%5)*30) + "px";
      c.style.top  = (10 + Math.floor(i/5)*30) + "px";

      cell.appendChild(c);
    });
  });
}

build();
</script>

</body>
</html>
