<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tracing App + Eraser</title>

<style>

*{

box-sizing:border-box;

user-select:none;

}

body{

margin:0;

height:100vh;

overflow:hidden;

background:#eaf6ff;

font-family:"Comic Sans MS",Arial;

text-align:center;

}

h1{

color:#2563eb;

margin:10px 0;

}

/* 🎛 tools */

.tools{

display:flex;

justify-content:center;

gap:15px;

align-items:center;

flex-wrap:wrap;

margin-bottom:10px;

}

button{

padding:8px 15px;

border:0;

border-radius:20px;

background:#2563eb;

color:white;

cursor:pointer;

}

/* 🖊 tool toggle */

.tool-btn{

background:#16a34a;

}

/* 📦 deck */

.deck{

position:relative;

width:340px;

height:460px;

margin:auto;

}

/* 📄 card */

.card{

position:absolute;

width:340px;

height:460px;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:0 8px 20px #888;

transition:.3s;

}

.active{ z-index:20; }

.back{

z-index:1;

transform:translateX(35px) scale(.94) rotate(-5deg);

}

/* 🔢 number */

.number{

position:absolute;

top:15px;

width:100%;

font-size:190px;

font-weight:bold;

color:#dbeafe;

-webkit-text-stroke:5px #60a5fa;

z-index:2;

}

/* ✍️ canvas */

canvas{

position:absolute;

left:0;

top:0;

width:100%;

height:100%;

z-index:5;

touch-action:none;

background-image:url("https://images.unsplash.com/photo-1513151233558-d860c5398176");

background-size:cover;

background-position:center;

opacity:.25;

}

/* 📖 flip */

.handle{

position:absolute;

right:-40px;

top:180px;

width:45px;

height:90px;

background:#2563eb;

color:white;

border-radius:0 20px 20px 0;

z-index:50;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

cursor:pointer;

}

/* 🍎 fruits */

.fruit-area{

position:absolute;

bottom:0;

width:100%;

height:120px;

background:#dcfce7;

z-index:10;

display:flex;

flex-wrap:wrap;

justify-content:center;

align-items:center;

gap:8px;

padding:10px;

}

.fruit{

position:relative;

font-size:35px;

cursor:grab;

}

.copy{

position:absolute;

right:-10px;

top:-10px;

width:22px;

height:22px;

border-radius:50%;

background:white;

border:1px solid #2563eb;

color:#2563eb;

font-size:16px;

line-height:20px;

}

</style>

</head>

<body>

<h1>🔢 Trace, Erase & Count 🍎</h1>

<!-- 🎛 tools -->

<div class="tools">

<label>

Color:

<input type="color" id="colorPicker" value="#22c55e">

</label>

<label>

Size:

<input type="range" id="sizePicker" min="2" max="25" value="8">

</label>

<button onclick="clearTrace()">🧼 Clean</button>

<button class="tool-btn" onclick="toggleEraser()">🧽 Eraser</button>

</div>

<div class="deck" id="deck"></div>

<script>

const deck=document.getElementById("deck");

let current=0;

let strokeColor="#22c55e";

let strokeSize=8;

let eraserMode=false;

/* 🎨 controls */

document.getElementById("colorPicker").oninput=e=>{

strokeColor=e.target.value;

};

document.getElementById("sizePicker").oninput=e=>{

strokeSize=e.target.value;

};

/* 🧽 toggle eraser */

function toggleEraser(){

eraserMode=!eraserMode;

}

/* 🍎 fruits */

const fruits=["🍎","🍌","🍊","🍓","🍇"];

/* 🔢 cards */

for(let num=0; num<=9; num++){

let card=document.createElement("div");

card.className = num===0 ? "card active" : "card back";

let fruitHTML="";

for(let i=0;i<num;i++){

fruitHTML+=`

<div class="fruit">

${fruits[num%fruits.length]}

<span class="copy">+</span>

</div>`;

}

card.innerHTML=`

<div class="number">${num}</div>

<canvas></canvas>

<div class="fruit-area">

${fruitHTML}

</div>

<div class="handle">➜</div>

`;

deck.appendChild(card);

/* ✍️ canvas */

let canvas=card.querySelector("canvas");

let ctx=canvas.getContext("2d");

canvas.width=340;

canvas.height=460;

let drawing=false;

canvas.onpointerdown=e=>{

drawing=true;

ctx.beginPath();

ctx.moveTo(e.offsetX,e.offsetY);

};

canvas.onpointermove=e=>{

if(!drawing)return;

ctx.lineWidth=strokeSize;

ctx.lineCap="round";

/* ✍️ pen or eraser */

ctx.strokeStyle = eraserMode ? "white" : strokeColor;

ctx.lineTo(e.offsetX,e.offsetY);

ctx.stroke();

};

canvas.onpointerup=()=>drawing=false;

/* 🔄 flip */

card.querySelector(".handle").onclick=()=>{

let cards=document.querySelectorAll(".card");

cards[current].className="card back";

current++;

if(current>9) current=0;

cards[current].className="card active";

};

}

/* 🧼 clear current canvas only */

function clearTrace(){

document.querySelectorAll("canvas").forEach(c=>{

c.getContext("2d").clearRect(0,0,c.width,c.height);

});

}

/* 🍎 fruit drag + copy + delete */

function enableDrag(f){

let dragging=false;

let ox,oy;

let lastTap=0;

f.onpointerdown=e=>{

let now=Date.now();

/* 👆 double tap delete */

if(now-lastTap<350){

f.remove();

return;

}

lastTap=now;

dragging=true;

ox=e.offsetX;

oy=e.offsetY;

f.setPointerCapture(e.pointerId);

/* ➕ copy */

if(e.target.classList.contains("copy")){

let clone=f.cloneNode(true);

f.parentElement.appendChild(clone);

enableDrag(clone);

}

};

f.onpointermove=e=>{

if(!dragging)return;

let rect=f.parentElement.getBoundingClientRect();

f.style.position="absolute";

f.style.left=(e.clientX-rect.left-ox)+"px";

f.style.top=(e.clientY-rect.top-oy)+"px";

};

f.onpointerup=()=>dragging=false;

}

/* activate fruits */

document.querySelectorAll(".fruit").forEach(enableDrag);

</script>

</body>

</html>
