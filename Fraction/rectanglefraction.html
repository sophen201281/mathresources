<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Number Learning App</title>

<style>

*{

box-sizing:border-box;

user-select:none;

}

body{

margin:0;

height:100vh;

overflow:hidden;

background:#eaf6ff;

font-family:"Comic Sans MS",Arial;

text-align:center;

}

h1{

color:#2563eb;

margin:10px 0;

}

/* tools */

.tools{

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

align-items:center;

margin-bottom:10px;

}

button{

padding:8px 15px;

border:0;

border-radius:20px;

background:#2563eb;

color:white;

cursor:pointer;

}

.tool-btn{

background:#16a34a;

}

/* deck */

.deck{

position:relative;

width:340px;

height:460px;

margin:auto;

}

/* card */

.card{

position:absolute;

width:340px;

height:460px;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:0 8px 20px #888;

opacity:0;

pointer-events:none;

transform:scale(0.95);

transition:.3s;

}

.card.active{

opacity:1;

pointer-events:auto;

transform:scale(1);

z-index:10;

}

/* number */

.number{

position:absolute;

top:10px;

width:100%;

font-size:150px;

font-weight:bold;

color:#dbeafe;

-webkit-text-stroke:5px #60a5fa;

z-index:2;

}

/* 🖼 number image */

.number-img{

position:absolute;

top:120px;

left:50%;

transform:translateX(-50%);

width:120px;

height:120px;

object-fit:contain;

z-index:3;

}

/* canvas */

canvas{

position:absolute;

left:0;

top:0;

width:100%;

height:100%;

z-index:5;

touch-action:none;

background-image:url("image.png");

background-size:cover;

background-position:center;

opacity:0.25;

}

/* handles */

.handle-left,

.handle-right{

position:absolute;

top:160px;

width:80px;

height:130px;

display:flex;

align-items:center;

justify-content:center;

font-size:40px;

color:white;

cursor:pointer;

z-index:50;

}

.handle-left{

left:-60px;

background:#16a34a;

border-radius:25px 0 0 25px;

}

.handle-right{

right:-60px;

background:#2563eb;

border-radius:0 25px 25px 0;

}

/* fruits */

.fruit-area{

position:absolute;

bottom:0;

width:100%;

height:120px;

background:#dcfce7;

display:flex;

flex-wrap:wrap;

justify-content:center;

align-items:center;

gap:8px;

padding:10px;

z-index:10;

}

.fruit{

position:relative;

font-size:35px;

cursor:grab;

}

.copy{

position:absolute;

right:-10px;

top:-10px;

width:22px;

height:22px;

border-radius:50%;

background:white;

border:1px solid #2563eb;

color:#2563eb;

font-size:16px;

}

/* random */

.bottom-handle{

position:absolute;

bottom:15px;

left:50%;

transform:translateX(-50%);

width:160px;

height:60px;

background:#f59e0b;

color:white;

border-radius:30px;

display:flex;

align-items:center;

justify-content:center;

font-size:24px;

font-weight:bold;

cursor:pointer;

z-index:100;

}

</style>

</head>

<body>

<h1>🔢 Number Learn + Images 🍎</h1>

<div class="tools">

<label>

Color:

<input type="color" id="colorPicker" value="#22c55e">

</label>

<label>

Size:

<input type="range" id="sizePicker" min="2" max="25" value="8">

</label>

<button onclick="clearTrace()">🧼 Clean</button>

<button class="tool-btn" onclick="toggleEraser()">🧽 Eraser</button>

</div>

<div class="deck" id="deck"></div>

<div class="bottom-handle" onclick="randomCard()">🎲 Random</div>

<script>

const deck=document.getElementById("deck");

let current=0;

let strokeColor="#22c55e";

let strokeSize=8;

let eraserMode=false;

const canvases=[];

/* number images (you can replace with your own PNG files) */

const numberImages=[

"https://cdn-icons-png.flaticon.com/512/1828/1828884.png", //0

"https://cdn-icons-png.flaticon.com/512/1828/1828919.png", //1

"https://cdn-icons-png.flaticon.com/512/1828/1828885.png", //2

"https://cdn-icons-png.flaticon.com/512/1828/1828886.png", //3

"https://cdn-icons-png.flaticon.com/512/1828/1828887.png", //4

"https://cdn-icons-png.flaticon.com/512/1828/1828888.png", //5

"https://cdn-icons-png.flaticon.com/512/1828/1828889.png", //6

"https://cdn-icons-png.flaticon.com/512/1828/1828890.png", //7

"https://cdn-icons-png.flaticon.com/512/1828/1828891.png", //8

"https://cdn-icons-png.flaticon.com/512/1828/1828892.png"  //9

];

/* controls */

document.getElementById("colorPicker").oninput=e=>{

strokeColor=e.target.value;

};

document.getElementById("sizePicker").oninput=e=>{

strokeSize=e.target.value;

};

function toggleEraser(){

eraserMode=!eraserMode;

}

const fruits=["🍎","🍌","🍊","🍓","🍇"];

/* build cards */

for(let num=0; num<=9; num++){

const card=document.createElement("div");

card.className="card"+(num===0?" active":"");

let fruitHTML="";

for(let i=0;i<num;i++){

fruitHTML+=`

<div class="fruit">

${fruits[num%fruits.length]}

<span class="copy">+</span>

</div>`;

}

card.innerHTML=`

<div class="number">${num}</div>

<img class="number-img" src="${numberImages[num]}">

<canvas></canvas>

<div class="fruit-area">${fruitHTML}</div>

<div class="handle-left">⬅</div>

<div class="handle-right">➜</div>

`;

deck.appendChild(card);

/* canvas */

const canvas=card.querySelector("canvas");

const ctx=canvas.getContext("2d");

canvas.width=340;

canvas.height=460;

let drawing=false;

canvas.addEventListener("pointerdown",e=>{

drawing=true;

ctx.beginPath();

ctx.moveTo(e.offsetX,e.offsetY);

});

canvas.addEventListener("pointermove",e=>{

if(!drawing) return;

ctx.lineWidth=strokeSize;

ctx.lineCap="round";

ctx.strokeStyle=eraserMode?"white":strokeColor;

ctx.lineTo(e.offsetX,e.offsetY);

ctx.stroke();

});

canvas.addEventListener("pointerup",()=>drawing=false);

canvases.push(canvas);

/* fruits */

card.querySelectorAll(".fruit").forEach(enableDrag);

}

/* navigation */

function showCard(index){

document.querySelectorAll(".card").forEach(c=>{

c.classList.remove("active");

});

current=index;

document.querySelectorAll(".card")[index].classList.add("active");

}

function nextCard(){

showCard((current+1)%10);

}

function prevCard(){

showCard((current+9)%10);

}

function randomCard(){

showCard(Math.floor(Math.random()*10));

}

/* attach handles */

document.querySelectorAll(".handle-right").forEach(b=>b.onclick=nextCard);

document.querySelectorAll(".handle-left").forEach(b=>b.onclick=prevCard);

/* clear drawing */

function clearTrace(){

canvases[current].getContext("2d")

.clearRect(0,0,340,460);

}

/* fruit system */

function enableDrag(f){

let dragging=false;

let ox,oy;

let lastTap=0;

f.onpointerdown=e=>{

let now=Date.now();

if(now-lastTap<300){

f.remove();

return;

}

lastTap=now;

dragging=true;

ox=e.offsetX;

oy=e.offsetY;

f.setPointerCapture(e.pointerId);

if(e.target.classList.contains("copy")){

let clone=f.cloneNode(true);

f.parentElement.appendChild(clone);

enableDrag(clone);

}

};

f.onpointermove=e=>{

if(!dragging) return;

let rect=f.parentElement.getBoundingClientRect();

f.style.position="absolute";

f.style.left=(e.clientX-rect.left-ox)+"px";

f.style.top=(e.clientY-rect.top-oy)+"px";

};

f.onpointerup=()=>dragging=false;

}

</script>

</body>

</html>
