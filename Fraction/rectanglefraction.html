<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Responsive Place Value Tool</title>

<style>
body{
  font-family: Arial;
  background:#f4f7fb;
  text-align:center;
  margin:0;
}

/* ===== CONTROLS ===== */
#controls{
  background:#fff;
  padding:10px;
  margin:10px;
  border-radius:10px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

button{
  padding:10px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  color:white;
  font-size:14px;
}

/* ===== GRID RESPONSIVE ===== */
.table{
  display:flex;
  gap:10px;
  padding:10px;
  overflow-x:auto; /* 🔥 important for mobile */
}

/* ===== COLUMN ===== */
.col{
  background:#fff;
  border:2px solid #ccc;
  border-radius:10px;

  flex:0 0 clamp(140px, 18vw, 220px); /* 🔥 responsive width */

  display:flex;
  flex-direction:column;
}

/* title */
.col h4{
  margin:6px 0;
  font-size:14px;
}

/* ===== SECTION ===== */
.section{
  min-height:clamp(80px, 10vh, 120px);
  border:1px dashed #aaa;
  border-radius:8px;
  margin:4px;
  position:relative;
}

/* ===== CANVAS SPACES ===== */
.canvas-space{
  height:clamp(60px, 8vh, 90px);
  margin:4px;
  position:relative;
}

canvas{
  width:100%;
  height:100%;
  touch-action:none;
}

/* ===== COUNTERS ===== */
.counter{
  width:clamp(18px, 3vw, 26px);
  height:clamp(18px, 3vw, 26px);
  border-radius:50%;
  position:absolute;
  cursor:pointer;
  touch-action:none;
}

/* colors */
.c0{ background:#ff4d4d; }
.c1{ background:#b84dff; }
.c2{ background:#ffd24d; }
.c3{ background:#4dff88; }
.c4{ background:#4da6ff; }

</style>
</head>

<body>

<h2>Place Value Learning Tool</h2>

<div id="controls">
  <button style="background:#ff4d4d" onclick="addCounter(0)">10,000</button>
  <button style="background:#b84dff" onclick="addCounter(1)">1,000</button>
  <button style="background:#ffd24d;color:black" onclick="addCounter(2)">100</button>
  <button style="background:#4dff88;color:black" onclick="addCounter(3)">10</button>
  <button style="background:#4da6ff" onclick="addCounter(4)">1</button>
</div>

<div id="table" class="table"></div>

<script>

const cols=["Ten Thousands","Thousands","Hundreds","Tens","Ones"];
let state=Array(3).fill().map(()=>Array(5).fill().map(()=>[]));

const table=document.getElementById("table");

/* ================= BUILD ================= */
function build(){
  table.innerHTML="";

  cols.forEach((name,col)=>{

    const column=document.createElement("div");
    column.className="col";

    column.innerHTML=`<h4>${name}</h4>`;

    const canvasWraps=[];

    for(let i=0;i<3;i++){

      const section=document.createElement("div");
      section.className="section";
      section.dataset.row=i;
      section.dataset.col=col;

      const canvasSpace=document.createElement("div");
      canvasSpace.className="canvas-space";

      const canvas=document.createElement("canvas");
      canvasSpace.appendChild(canvas);

      initCanvas(canvas);

      column.appendChild(section);
      column.appendChild(canvasSpace);
    }

    table.appendChild(column);
  });

  render();
}

/* ================= CANVAS ================= */
function initCanvas(canvas){

  const ctx=canvas.getContext("2d");
  let drawing=false;

  function resize(){
    const rect=canvas.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;

    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2;
    ctx.strokeStyle="rgba(0,0,0,0.6)";
  }

  resize();
  new ResizeObserver(resize).observe(canvas);

  function pos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:t.clientX-rect.left,y:t.clientY-rect.top};
  }

  canvas.addEventListener("mousedown",e=>{
    drawing=true;
    const p=pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
  });

  canvas.addEventListener("mousemove",e=>{
    if(!drawing) return;
    const p=pos(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
  });

  canvas.addEventListener("mouseup",()=>drawing=false);
  canvas.addEventListener("mouseleave",()=>drawing=false);

  canvas.addEventListener("touchstart",e=>{
    drawing=true;
    const p=pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    e.preventDefault();
  },{passive:false});

  canvas.addEventListener("touchmove",e=>{
    if(!drawing) return;
    const p=pos(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    e.preventDefault();
  },{passive:false});

  canvas.addEventListener("touchend",()=>drawing=false);
}

/* ================= ADD COUNTER ================= */
function addCounter(col){
  state[0][col].push({id:Date.now()});
  normalize();
  render();
}

/* ================= COUNTERS ================= */
function createCounter(row,col,index){

  const c=document.createElement("div");
  c.className=`counter c${col}`;

  let dx=0,dy=0,drag=false;

  function start(e){
    drag=true;
    const ev=e.touches?e.touches[0]:e;

    dx=ev.clientX-c.offsetLeft;
    dy=ev.clientY-c.offsetTop;

    document.addEventListener("mousemove",move);
    document.addEventListener("mouseup",end);
    document.addEventListener("touchmove",move,{passive:false});
    document.addEventListener("touchend",end);
  }

  function move(e){
    if(!drag) return;
    const ev=e.touches?e.touches[0]:e;
    c.style.left=(ev.clientX-dx)+"px";
    c.style.top=(ev.clientY-dy)+"px";
    e.preventDefault();
  }

  function end(){
    drag=false;
    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",end);
    document.removeEventListener("touchmove",move);
    document.removeEventListener("touchend",end);
  }

  c.addEventListener("mousedown",start);
  c.addEventListener("touchstart",start);

  return c;
}

/* ================= REGROUP ================= */
function normalize(){
  for(let col=4;col>0;col--){
    for(let row=2;row>=0;row--){
      while(state[row][col].length>=10){
        for(let i=0;i<10;i++) state[row][col].pop();
        state[row][col-1].push({id:Date.now()});
      }
    }
  }
}

/* ================= RENDER ================= */
function render(){

  document.querySelectorAll(".section").forEach(sec=>{
    sec.innerHTML="";

    const r=+sec.dataset.row;
    const c=+sec.dataset.col;

    state[r][c].forEach((item,i)=>{

      const el=createCounter(r,c,i);

      const size=30;
      const perRow=4;

      el.style.left=(8+(i%perRow)*size)+"px";
      el.style.top=(8+Math.floor(i/perRow)*size)+"px";

      sec.appendChild(el);
    });
  });
}

build();
</script>

</body>
</html>
