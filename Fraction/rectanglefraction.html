<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Place Value Drag + Regroup</title>

<style>

body{

  font-family: Arial;

  background:#f4f7fb;

  text-align:center;

  margin:0;

}

.table{

  display:flex;

  gap:10px;

  padding:10px;

  overflow-x:auto;

}

.col{

  background:#fff;

  border:2px solid #ccc;

  border-radius:10px;

  flex:0 0 180px;

  display:flex;

  flex-direction:column;

}

.col h4{ margin:6px 0; }

.section{

  min-height:180px;

  border:1px dashed #aaa;

  margin:4px;

  border-radius:8px;

  position:relative;

  background:#fff;

  overflow:hidden;

}

.counter{

  width:26px;

  height:26px;

  border-radius:50%;

  position:absolute;

  cursor:grab;

  touch-action:none;

  user-select:none;

}

.counter:active{ cursor:grabbing; }

.c0{ background:#ff4d4d; }

.c1{ background:#b84dff; }

.c2{ background:#ffd24d; }

.c3{ background:#4dff88; }

.c4{ background:#4da6ff; }

/* popup */

.popup{

  position:fixed;

  top:50%;

  left:50%;

  transform:translate(-50%,-50%);

  background:white;

  padding:20px;

  border-radius:12px;

  box-shadow:0 10px 30px rgba(0,0,0,0.2);

  display:none;

  z-index:999;

}

.popup button{

  margin:10px;

  padding:8px 12px;

  cursor:pointer;

}

</style>

</head>

<body>

<h2>Place Value Tool (Drag + Regroup Fixed)</h2>

<div id="table" class="table"></div>

<div id="popup" class="popup">

  <p>Do you want to exchange these 10 counters?</p>

  <button onclick="confirmExchange(true)">Yes</button>

  <button onclick="confirmExchange(false)">No</button>

</div>

<script>

const cols=["Ten Thousands","Thousands","Hundreds","Tens","Ones"];

let state=Array(3).fill().map(()=>Array(5).fill().map(()=>[]));

const table=document.getElementById("table");

const popup=document.getElementById("popup");

let pending=null;

/* ================= BUILD ================= */

function build(){

  table.innerHTML="";

  cols.forEach((name,col)=>{

    const column=document.createElement("div");

    column.className="col";

    column.innerHTML=`<h4>${name}</h4>`;

    for(let row=0;row<3;row++){

      const section=document.createElement("div");

      section.className="section";

      section.dataset.row=row;

      section.dataset.col=col;

      /* click add */

      section.addEventListener("click",(e)=>{

        if(e.target.classList.contains("counter")) return;

        const rect=section.getBoundingClientRect();

        addCounter(

          row,

          col,

          e.clientX-rect.left,

          e.clientY-rect.top

        );

      });

      column.appendChild(section);

    }

    table.appendChild(column);

  });

  render();

}

/* ================= ADD ================= */

function addCounter(row,col,x,y){

  state[row][col].push({

    id:Date.now(),

    row,

    col,

    x,

    y

  });

  checkRegroup(row,col);

  render();

}

/* ================= DRAG ================= */

function makeDraggable(el,item){

  let dx=0,dy=0,drag=false;

  function start(e){

    drag=true;

    const ev=e.touches?e.touches[0]:e;

    dx=ev.clientX-el.offsetLeft;

    dy=ev.clientY-el.offsetTop;

    document.addEventListener("mousemove",move);

    document.addEventListener("mouseup",end);

    document.addEventListener("touchmove",move,{passive:false});

    document.addEventListener("touchend",end);

  }

  function move(e){

    if(!drag) return;

    const ev=e.touches?e.touches[0]:e;

    el.style.left=(ev.clientX-dx)+"px";

    el.style.top=(ev.clientY-dy)+"px";

    e.preventDefault();

  }

  function end(){

    drag=false;

    document.removeEventListener("mousemove",move);

    document.removeEventListener("mouseup",end);

    document.removeEventListener("touchmove",move);

    document.removeEventListener("touchend",end);

    snap(el,item);

  }

  el.addEventListener("mousedown",start);

  el.addEventListener("touchstart",start);

  return el;

}

/* ================= SNAP (IMPORTANT FIX) ================= */

function snap(el,item){

  const rect=el.getBoundingClientRect();

  const cx=rect.left+rect.width/2;

  const cy=rect.top+rect.height/2;

  let found=false;

  document.querySelectorAll(".section").forEach(sec=>{

    const r=sec.getBoundingClientRect();

    if(cx>r.left && cx<r.right && cy>r.top && cy<r.bottom){

      found=true;

      const newRow=+sec.dataset.row;

      const newCol=+sec.dataset.col;

      /* REMOVE FROM OLD */

      state[item.row][item.col] =

        state[item.row][item.col].filter(x=>x.id!==item.id);

      /* UPDATE */

      item.row=newRow;

      item.col=newCol;

      const secRect=sec.getBoundingClientRect();

      item.x=cx-secRect.left;

      item.y=cy-secRect.top;

      /* ADD TO NEW */

      state[newRow][newCol].push(item);

      checkRegroup(newRow,newCol);

    }

  });

  render();

}

/* ================= REGROUP CHECK ================= */

function checkRegroup(row,col){

  if(state[row][col].length>=10){

    pending={row,col};

    popup.style.display="block";

  }

}

/* ================= POPUP ================= */

function confirmExchange(ok){

  popup.style.display="none";

  if(!ok){

    pending=null;

    return;

  }

  const {row,col}=pending;

  /* remove 10 */

  state[row][col].splice(0,10);

  /* move 1 left */

  if(col>0){

    state[row][col-1].push({

      id:Date.now(),

      row,

      col:col-1,

      x:20,

      y:20

    });

  }

  pending=null;

  render();

}

/* ================= RENDER ================= */

function render(){

  document.querySelectorAll(".section").forEach(sec=>{

    sec.innerHTML="";

    const r=+sec.dataset.row;

    const c=+sec.dataset.col;

    state[r][c].forEach(item=>{

      const el=document.createElement("div");

      el.className=`counter c${c}`;

      el.style.left=item.x+"px";

      el.style.top=item.y+"px";

      makeDraggable(el,item);

      sec.appendChild(el);

    });

  });

}

build();

</script>

</body>

</html>
