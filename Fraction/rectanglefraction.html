<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Dot Pattern Math Game</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:#eef3f7;
    margin:0;
}

/* ---------- MATCHED AREA ---------- */
#matchedArea{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:10px;
    background:#e8f5e9;
    border-bottom:4px solid #66bb6a;
}

.matchPair{
    display:flex;
    align-items:center;
    gap:10px;
    background:white;
    border:3px solid #43a047;
    border-radius:10px;
    padding:8px;
}

/* MATCH DOT CARD */
.cardBox{
    width:90px;
    height:90px;
    border:3px solid #444;
    border-radius:10px;
    position:relative;
}

/* DOT */
.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#1e88e5;
    position:absolute;
}

/* NUMBER CARD */
.numberCard{
    width:90px;
    height:90px;
    border:3px solid #444;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    background:white;
}

/* ---------- NUMBER OPTIONS ---------- */
#numberCards{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    max-width:500px;
    margin:20px auto;
}

.numberOption{
    height:60px;
    border:3px solid #444;
    border-radius:10px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    cursor:pointer;
}

/* ---------- DOT AREA ---------- */
#dotCard{
    width:95%;
    max-width:260px;
    height:160px;
    margin:20px auto;
    background:white;
    border:4px solid #333;
    border-radius:16px;
    position:relative;
}

/* DOT */
.bigDot{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#2196f3;
    position:absolute;
    cursor:pointer;
    transition:0.2s;
}

.bigDot.active{
    background:#ff9800;
    transform:scale(1.2);
}
</style>
</head>

<body>

<h2>Matched Cards</h2>
<div id="matchedArea"></div>

<h2>Choose Number</h2>
<div id="numberCards"></div>

<h2>Count the Dots</h2>
<div id="dotCard"></div>

<script>
const dotCard=document.getElementById("dotCard");
const numberCards=document.getElementById("numberCards");
const matchedArea=document.getElementById("matchedArea");

let dotCount=0;

/* ---------- NUMBER CARDS ---------- */
for(let i=1;i<=10;i++){
    let c=document.createElement("div");
    c.className="numberOption";
    c.textContent=i;
    c.onclick=()=>checkAnswer(i);
    numberCards.appendChild(c);
}

/* ---------- CREATE DOT ---------- */
function dot(x,y){
    let d=document.createElement("div");
    d.className="bigDot";
    d.style.left=x+"px";
    d.style.top=y+"px";
    d.onclick=()=>d.classList.toggle("active");
    dotCard.appendChild(d);
}

/* ---------- PATTERN SYSTEM ---------- */
function buildPattern(n){

    dotCard.innerHTML="";

    let c=80;   // center x
    let r=70;   // center y
    let s=30;   // spacing

    // 1 — center dot
    if(n===1){
        dot(c,r);
    }

    // 2 — diagonal pair
    else if(n===2){
        dot(c-s,r-s);
        dot(c+s,r+s);
    }

    // 3 — diagonal trio
    else if(n===3){
        dot(c-s,r-s);
        dot(c,r);
        dot(c+s,r+s);
    }

    // 4 — square corners
    else if(n===4){
        dot(c-s,r-s);
        dot(c+s,r-s);
        dot(c-s,r+s);
        dot(c+s,r+s);
    }

    // 5 — quincunx (X shape)
    else if(n===5){
        dot(c-s,r-s);
        dot(c+s,r-s);
        dot(c-s,r+s);
        dot(c+s,r+s);
        dot(c,r);
    }

    // 6 — parallel rows (3 + 3)
    else if(n===6){
        for(let i=-1;i<=1;i++){
            dot(c+i*s,r-s);
            dot(c+i*s,r+s);
        }
    }

    // 7 — 5 + 2
    else if(n===7){
        // 5 (X)
        dot(c-s,r-s);
        dot(c+s,r-s);
        dot(c-s,r+s);
        dot(c+s,r+s);
        dot(c,r);

        // 2 vertical right
        dot(c+60,r-15);
        dot(c+60,r+15);
    }

    // 8 — 4 + 4
    else if(n===8){
        let left=-40;
        let right=40;

        // left square
        dot(c+left-s,r-s);
        dot(c+left+s,r-s);
        dot(c+left-s,r+s);
        dot(c+left+s,r+s);

        // right square
        dot(c+right-s,r-s);
        dot(c+right+s,r-s);
        dot(c+right-s,r+s);
        dot(c+right+s,r+s);
    }

    // 9 — 5 + 4
    else if(n===9){
        // 5
        dot(c-40-s,r-s);
        dot(c-40+s,r-s);
        dot(c-40-s,r+s);
        dot(c-40+s,r+s);
        dot(c-40,r);

        // 4
        dot(c+40-s,r-s);
        dot(c+40+s,r-s);
        dot(c+40-s,r+s);
        dot(c+40+s,r+s);
    }

    // 10 — 5 + 5
    else if(n===10){
        let L=-40;
        let R=40;

        // left 5
        dot(c+L-s,r-s);
        dot(c+L+s,r-s);
        dot(c+L-s,r+s);
        dot(c+L+s,r+s);
        dot(c+L,r);

        // right 5
        dot(c+R-s,r-s);
        dot(c+R+s,r-s);
        dot(c+R-s,r+s);
        dot(c+R+s,r+s);
        dot(c+R,r);
    }
}

/* ---------- NEW ROUND ---------- */
function newRound(){
    dotCount=Math.floor(Math.random()*10)+1;
    buildPattern(dotCount);
}

/* ---------- CHECK ---------- */
function checkAnswer(num){
    if(num===dotCount){
        addMatch(num);
        newRound();
    }
}

/* ---------- MATCH DISPLAY ---------- */
function addMatch(count){

    let pair=document.createElement("div");
    pair.className="matchPair";

    let box=document.createElement("div");
    box.className="cardBox";

    function d(x,y){
        let dot=document.createElement("div");
        dot.className="dot";
        dot.style.left=x+"px";
        dot.style.top=y+"px";
        box.appendChild(dot);
    }

    // simple matched representation (clean visual)
    for(let i=0;i<count;i++){
        d(10+(i%5)*15,10+Math.floor(i/5)*15);
    }

    let num=document.createElement("div");
    num.className="numberCard";
    num.textContent=count;

    pair.appendChild(box);
    pair.appendChild(num);

    matchedArea.appendChild(pair);
}

newRound();
</script>

</body>
</html>
