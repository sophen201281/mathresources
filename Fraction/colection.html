<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Interactive Fraction Shapes + Drawing</title>

<style>

/* =========================

   GLOBAL FIX (IMPORTANT)

========================= */

*{

    box-sizing:border-box;

}

body{

    margin:0;

    overflow:hidden;

    font-family:Arial,sans-serif;

    background:#eef3f8;

    /* allow input to work */

    touch-action:none;

}

/* =========================

   TOOLBAR

========================= */

.toolbar{

    position:fixed;

    top:10px;

    left:10px;

    z-index:1000;

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    background:rgba(255,255,255,.95);

    padding:10px;

    border-radius:16px;

    box-shadow:0 4px 10px rgba(0,0,0,.12);

}

button,input{

    padding:10px 14px;

    border:none;

    border-radius:12px;

    font-size:16px;

}

button{

    background:#1976d2;

    color:white;

}

button.active{

    background:#d84315;

}

input{

    width:70px;

    text-align:center;

    font-weight:bold;

    border:2px solid #1976d2;

    background:white;

    /* FIX INPUT ISSUE */

    pointer-events:auto;

    touch-action:auto;

    user-select:auto;

}

/* =========================

   WORKSPACE

========================= */

#workspace{

    position:absolute;

    inset:0;

}

/* =========================

   CANVAS

========================= */

#drawCanvas{

    position:absolute;

    inset:0;

    z-index:1;

}

/* =========================

   SHAPES

========================= */

.shape{

    position:absolute;

    z-index:5;

}

.part{

    position:absolute;

    cursor:grab;

}

.label{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    font-weight:bold;

    font-size:16px;

    pointer-events:none;

}

/* =========================

   DELETE ANIMATION

========================= */

.deleteAnim{

    animation:pop .25s forwards;

}

@keyframes pop{

    to{

        transform:scale(0);

        opacity:0;

    }

}

</style>

</head>

<body>

<div class="toolbar">

    <input

        type="number"

        id="partsInput"

        value="4"

        min="1"

        max="24"

    >

    <button onclick="createCircle()">⭕ Circle</button>

    <button onclick="createSquare()">⬜ Square</button>

    <button onclick="createRectangle()">▭ Rectangle</button>

    <button id="eraserBtn" onclick="toggleEraser()">

        🩹 Eraser OFF

    </button>

    <button onclick="clearCanvas()">🧹 Clear</button>

</div>

<div id="workspace">

    <canvas id="drawCanvas"></canvas>

</div>

<script>

/* =========================

   CANVAS

========================= */

const canvas =

document.getElementById("drawCanvas");

const ctx =

canvas.getContext("2d");

function resize(){

    canvas.width = innerWidth;

    canvas.height = innerHeight;

}

resize();

addEventListener("resize",resize);

let drawing=false;

let eraser=false;

canvas.addEventListener("pointerdown",e=>{

    drawing=true;

    ctx.beginPath();

    ctx.moveTo(e.clientX,e.clientY);

});

canvas.addEventListener("pointermove",e=>{

    if(!drawing) return;

    ctx.lineWidth = eraser ? 30 : 4;

    ctx.lineCap="round";

    ctx.globalCompositeOperation =

    eraser ? "destination-out" : "source-over";

    ctx.strokeStyle="#111";

    ctx.lineTo(e.clientX,e.clientY);

    ctx.stroke();

});

addEventListener("pointerup",()=>drawing=false);

function clearCanvas(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

}

function toggleEraser(){

    eraser=!eraser;

    document.getElementById("eraserBtn")

    .innerText =

    eraser ? "🩹 Eraser ON" : "🩹 Eraser OFF";

}

/* =========================

   INPUT FIX (KEY PART)

========================= */

function getParts(){

    const input =

    document.getElementById("partsInput");

    let parts =

    input.valueAsNumber;

    if(!Number.isFinite(parts) || parts < 1)

        parts = 1;

    if(parts > 24)

        parts = 24;

    parts = Math.floor(parts);

    input.value = parts;

    return parts;

}

/* =========================

   UTIL

========================= */

function color(){

    return `hsl(${Math.random()*360},70%,65%)`;

}

/* =========================

   DRAG PART

========================= */

function drag(el){

    let down=false;

    let sx=0,sy=0,sl=0,st=0;

    el.addEventListener("pointerdown",e=>{

        down=true;

        sx=e.clientX;

        sy=e.clientY;

        sl=parseFloat(el.style.left)||0;

        st=parseFloat(el.style.top)||0;

        el.setPointerCapture(e.pointerId);

    });

    el.addEventListener("pointermove",e=>{

        if(!down) return;

        el.style.left =

        sl + (e.clientX-sx)+"px";

        el.style.top =

        st + (e.clientY-sy)+"px";

    });

    el.addEventListener("pointerup",()=>{

        down=false;

    });

}

/* =========================

   DELETE (DOUBLE TAP)

========================= */

function del(el){

    let last=0;

    el.addEventListener("pointerdown",()=>{

        let now=Date.now();

        if(now-last<250){

            el.classList.add("deleteAnim");

            setTimeout(()=>el.remove(),250);

        }

        last=now;

    });

}

/* =========================

   CIRCLE

========================= */

function createCircle(){

    const parts=getParts();

    const r=110;

    const size=r*2;

    const shape=document.createElement("div");

    shape.className="shape";

    shape.style.left="100px";

    shape.style.top="150px";

    workspace.appendChild(shape);

    for(let i=0;i<parts;i++){

        const a1=(Math.PI*2/parts)*i - Math.PI/2;

        const a2=(Math.PI*2/parts)*(i+1) - Math.PI/2;

        const x1=r+r*Math.cos(a1);

        const y1=r+r*Math.sin(a1);

        const x2=r+r*Math.cos(a2);

        const y2=r+r*Math.sin(a2);

        const large=(a2-a1)>Math.PI?1:0;

        const part=document.createElement("div");

        part.className="part";

        part.style.width=size+"px";

        part.style.height=size+"px";

        part.innerHTML=`

        <svg width="${size}" height="${size}">

        <path d="

        M ${r} ${r}

        L ${x1} ${y1}

        A ${r} ${r} 0 ${large} 1 ${x2} ${y2}

        Z"

        fill="${color()}"

        stroke="white"/>

        </svg>`;

        const label=document.createElement("div");

        label.className="label";

        label.innerText=`1/${parts}`;

        part.appendChild(label);

        shape.appendChild(part);

        drag(part);

        del(part);

    }

}

/* =========================

   SQUARE

========================= */

function createSquare(){

    const parts=getParts();

    const size=220;

    const shape=document.createElement("div");

    shape.className="shape";

    shape.style.left="420px";

    shape.style.top="150px";

    workspace.appendChild(shape);

    const cols=Math.ceil(Math.sqrt(parts));

    const w=size/cols;

    const h=size/cols;

    for(let i=0;i<parts;i++){

        const col=i%cols;

        const row=Math.floor(i/cols);

        const part=document.createElement("div");

        part.className="part";

        part.style.width=w+"px";

        part.style.height=h+"px";

        part.style.left=(col*w)+"px";

        part.style.top=(row*h)+"px";

        part.style.background=color();

        const label=document.createElement("div");

        label.className="label";

        label.innerText=`1/${parts}`;

        part.appendChild(label);

        shape.appendChild(part);

        drag(part);

        del(part);

    }

}

/* =========================

   RECTANGLE

========================= */

function createRectangle(){

    const parts=getParts();

    const w=320;

    const h=160;

    const shape=document.createElement("div");

    shape.className="shape";

    shape.style.left="750px";

    shape.style.top="150px";

    workspace.appendChild(shape);

    const pw=w/parts;

    for(let i=0;i<parts;i++){

        const part=document.createElement("div");

        part.className="part";

        part.style.width=pw+"px";

        part.style.height=h+"px";

        part.style.left=(i*pw)+"px";

        part.style.top="0px";

        part.style.background=color();

        const label=document.createElement("div");

        label.className="label";

        label.innerText=`1/${parts}`;

        part.appendChild(label);

        shape.appendChild(part);

        drag(part);

        del(part);

    }

}

</script>

</body>

</html>
