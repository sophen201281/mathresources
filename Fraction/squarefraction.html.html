<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Place Value Drag System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:Arial;
    margin:0;
    background:#eef3f7;
    text-align:center;
}

h2{ margin:10px; }

button{
    margin:5px;
    padding:6px 10px;
}

/* 3 SECTIONS */
.container{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:10px;
}

.section{
    background:white;
    border-radius:10px;
    padding:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* GRID */
.columns{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    border:2px solid #333;
    border-radius:8px;
    overflow:hidden;
}

/* COLUMN */
.col{
    min-height:140px;
    border-right:1px solid #aaa;
    padding:5px;
}

.col:last-child{
    border-right:none;
}

.col h4{
    margin:0;
    font-size:12px;
    background:#f0f0f0;
    padding:3px;
}

/* COUNTERS */
.counter{
    width:30px;
    height:30px;
    border-radius:50%;
    background:#4CAF50;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:4px auto;
    user-select:none;
    touch-action:none;
    cursor:grab;
}

.counter:active{
    cursor:grabbing;
}

/* DRAG GHOST */
.ghost{
    position:fixed;
    z-index:9999;
    pointer-events:none;
    opacity:0.9;
    transform:scale(1.2);
}
</style>
</head>

<body>

<h2>Place Value System 🔢</h2>

<button onclick="add('A')">Add Section 1</button>
<button onclick="add('B')">Add Section 2</button>
<button onclick="regroup()">Regroup</button>

<div class="container">

<div class="section">
<h3>Section 1</h3>
<div class="columns" id="A"></div>
</div>

<div class="section">
<h3>Section 2</h3>
<div class="columns" id="B"></div>
</div>

<div class="section">
<h3>Section 3 (Answer)</h3>
<div class="columns" id="C"></div>
</div>

</div>

<script>

/* ======================
   PLACE VALUE ORDER
====================== */
const places = [
    "Ten Thousands",
    "Thousands",
    "Hundreds",
    "Tens",
    "Ones"
];

/* ======================
   DATA
====================== */
let A = [0,0,0,0,0];
let B = [0,0,0,0,0];
let C = [0,0,0,0,0];

function getArr(name){
    if(name==="A") return A;
    if(name==="B") return B;
    return C;
}

/* ======================
   RENDER
====================== */
function render(){
    draw("A",A);
    draw("B",B);
    draw("C",C);
}

function draw(id,data){
    const box = document.getElementById(id);
    box.innerHTML = "";

    for(let i=0;i<5;i++){
        let col = document.createElement("div");
        col.className="col";
        col.dataset.col=i;

        col.ondragover = e => e.preventDefault();

        col.ondrop = drop;

        let title = document.createElement("h4");
        title.innerText = places[i];
        col.appendChild(title);

        for(let j=0;j<data[i];j++){
            let c = document.createElement("div");
            c.className="counter";
            c.innerText="●";

            c.dataset.from = id;
            c.dataset.col = i;

            c.addEventListener("pointerdown",startDrag);

            col.appendChild(c);
        }

        box.appendChild(col);
    }
}

/* ======================
   ADD COUNTERS
====================== */
function add(section){
    getArr(section)[4]++;
    render();
}

/* ======================
   DRAG SYSTEM
====================== */
let drag = null;
let ghost = null;

function startDrag(e){
    const el = e.target;

    drag = {
        from: el.dataset.from,
        col: parseInt(el.dataset.col)
    };

    ghost = el.cloneNode(true);
    ghost.classList.add("ghost");
    document.body.appendChild(ghost);

    move(e);

    el.setPointerCapture(e.pointerId);

    el.addEventListener("pointermove",move);
    el.addEventListener("pointerup",end);
}

function move(e){
    if(!ghost) return;

    ghost.style.left = (e.clientX - 15) + "px";
    ghost.style.top = (e.clientY - 15) + "px";
}

/* ======================
   DROP LOGIC (STABLE)
====================== */
function end(e){
    if(!ghost) return;

    const cols = document.querySelectorAll(".col");

    for(let col of cols){
        const r = col.getBoundingClientRect();

        if(
            e.clientX >= r.left &&
            e.clientX <= r.right &&
            e.clientY >= r.top &&
            e.clientY <= r.bottom
        ){
            let toCol = parseInt(col.dataset.col);

            let fromArr = getArr(drag.from);

            if(fromArr[drag.col] > 0){
                fromArr[drag.col]--;
                C[toCol]++; // always goes to answer section
            }
        }
    }

    ghost.remove();
    ghost = null;
    drag = null;

    render();
}

/* ======================
   REGROUP LOGIC
====================== */
function regroup(){
    for(let i=4;i>0;i--){
        if(C[i] >= 10){
            let carry = Math.floor(C[i]/10);
            C[i] %= 10;
            C[i-1] += carry;
        }
    }
    render();
}

render();

</script>

</body>
</html>
