<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Fraction Circle</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#f2f5fa;
}

#toolbar{
    position:absolute;
    top:10px;
    left:10px;
    z-index:100;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

input{
    width:60px;
}

button{
    padding:6px 12px;
    cursor:pointer;
}

canvas{
    display:block;
    touch-action:none;
}
</style>
</head>
<body>

<div id="toolbar">
    Parts:
    <input id="partsInput" type="number" min="2" max="24" value="6">
    <button onclick="createPuzzle()">Create</button>
</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let pieces=[];
let dragPiece=null;
let offsetX=0;
let offsetY=0;

const circleRadius=120;
let centerX;
let centerY;

function randomColor(i,total){
    return `hsl(${i*360/total},80%,65%)`;
}

function createPuzzle(){

    pieces=[];

    const count=Math.max(
        2,
        parseInt(document.getElementById("partsInput").value)||6
    );

    centerX=canvas.width/2;
    centerY=canvas.height/2;

    const angleStep=(Math.PI*2)/count;

    for(let i=0;i<count;i++){

        let angleStart=i*angleStep;
        let angleEnd=angleStart+angleStep;

        let piece={
            id:i,

            correctX:centerX,
            correctY:centerY,

            x:centerX+(Math.random()*500-250),
            y:centerY+(Math.random()*400-200),

            start:angleStart,
            end:angleEnd,

            color:randomColor(i,count),

            locked:false
        };

        pieces.push(piece);
    }
}

createPuzzle();

function drawPiece(piece){

    ctx.save();

    ctx.translate(piece.x,piece.y);

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(
        0,
        0,
        circleRadius,
        piece.start,
        piece.end
    );
    ctx.closePath();

    ctx.fillStyle=piece.color;
    ctx.fill();

    ctx.lineWidth=3;
    ctx.strokeStyle="#333";
    ctx.stroke();

    ctx.restore();
}

function drawGuide(){

    ctx.save();

    ctx.translate(centerX,centerY);

    ctx.beginPath();
    ctx.arc(0,0,circleRadius,0,Math.PI*2);

    ctx.strokeStyle="rgba(0,0,0,.15)";
    ctx.lineWidth=4;
    ctx.setLineDash([10,10]);

    ctx.stroke();

    ctx.restore();
}

function render(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGuide();

    pieces.forEach(drawPiece);

    requestAnimationFrame(render);
}
render();

function getPointerPosition(e){

    const rect=canvas.getBoundingClientRect();

    let clientX,clientY;

    if(e.touches){
        clientX=e.touches[0].clientX;
        clientY=e.touches[0].clientY;
    }else{
        clientX=e.clientX;
        clientY=e.clientY;
    }

    return{
        x:clientX-rect.left,
        y:clientY-rect.top
    };
}

function pointInsidePiece(px,py,piece){

    const dx=px-piece.x;
    const dy=py-piece.y;

    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist>circleRadius) return false;

    let angle=Math.atan2(dy,dx);

    if(angle<0) angle+=Math.PI*2;

    let start=piece.start%(Math.PI*2);
    let end=piece.end%(Math.PI*2);

    if(end<start){
        return angle>=start || angle<=end;
    }

    return angle>=start && angle<=end;
}

function pointerDown(e){

    const pos=getPointerPosition(e);

    for(let i=pieces.length-1;i>=0;i--){

        const piece=pieces[i];

        if(pointInsidePiece(pos.x,pos.y,piece)){

            dragPiece=piece;

            offsetX=pos.x-piece.x;
            offsetY=pos.y-piece.y;

            pieces.splice(i,1);
            pieces.push(piece);

            break;
        }
    }
}

function pointerMove(e){

    if(!dragPiece) return;

    const pos=getPointerPosition(e);

    dragPiece.x=pos.x-offsetX;
    dragPiece.y=pos.y-offsetY;

    e.preventDefault();
}

function pointerUp(){

    if(!dragPiece) return;

    snapPiece(dragPiece);

    dragPiece=null;
}

function snapPiece(piece){

    const dx=piece.correctX-piece.x;
    const dy=piece.correctY-piece.y;

    const distance=Math.sqrt(dx*dx+dy*dy);

    // Strong magnetic attraction
    if(distance<120){

        piece.x=piece.correctX;
        piece.y=piece.correctY;
        piece.locked=true;

        return;
    }

    // Magnetic pull when nearby
    if(distance<220){

        piece.x += dx*0.7;
        piece.y += dy*0.7;
    }
}

canvas.addEventListener("mousedown",pointerDown);
canvas.addEventListener("mousemove",pointerMove);
canvas.addEventListener("mouseup",pointerUp);

canvas.addEventListener("touchstart",pointerDown,{passive:false});
canvas.addEventListener("touchmove",pointerMove,{passive:false});
canvas.addEventListener("touchend",pointerUp);

</script>
</body>
</html>
