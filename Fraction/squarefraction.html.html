<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Place Value + Drawing Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:Arial;
    margin:0;
    background:#eef3f7;
    text-align:center;
}

/* Layout */
.container{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    padding:10px;
}

.section{
    background:white;
    border-radius:10px;
    padding:10px;
    min-height:300px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* Columns */
.columns{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.col{
    flex:1;
    border:1px solid #ddd;
    margin:2px;
    border-radius:5px;
    min-height:120px;
    padding:5px;
}

.col h4{
    margin:0;
    font-size:12px;
    background:#f0f0f0;
}

/* counters */
.counter{
    width:25px;
    height:25px;
    border-radius:50%;
    background:#4CAF50;
    color:white;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin:2px;
    font-size:12px;
    cursor:pointer;
}

/* buttons */
button{
    margin:3px;
    padding:5px 8px;
    font-size:12px;
}

/* canvas */
canvas{
    border:1px solid #aaa;
    background:white;
    touch-action:none;
}
</style>
</head>

<body>

<h2>Place Value Regrouping + Drawing 🎨🔢</h2>

<div class="container">

<!-- SECTION A -->
<div class="section">
<h3>Section A (Build 1)</h3>
<button onclick="addCounter(1)">Add Counter</button>
<button onclick="moveToB(1)">Move → B</button>

<div class="columns" id="Acols"></div>
</div>

<!-- SECTION B -->
<div class="section">
<h3>Section B (Build 2)</h3>
<button onclick="addCounter(2)">Add Counter</button>
<button onclick="moveToC()">Move → C</button>

<div class="columns" id="Bcols"></div>
</div>

<!-- SECTION C -->
<div class="section">
<h3>Section C (Regroup & Answer)</h3>
<button onclick="regroup()">Regroup 10 → 1</button>

<div class="columns" id="Ccols"></div>
</div>

</div>

<hr>

<h3>Drawing Canvas ✏️</h3>
<canvas id="board" width="500" height="250"></canvas><br>
<button onclick="clearCanvas()">Clear</button>
<button onclick="eraserMode=true">Eraser</button>
<button onclick="eraserMode=false">Pen</button>

<script>

/* =========================
   PLACE VALUE DATA
========================= */
const places = ["ones","tens","hundreds","thousands","tenThousands"];

let A = [0,0,0,0,0];
let B = [0,0,0,0,0];
let C = [0,0,0,0,0];

function render(){
    renderCols("Acols",A);
    renderCols("Bcols",B);
    renderCols("Ccols",C);
}

function renderCols(id,data){
    const container = document.getElementById(id);
    container.innerHTML = "";

    for(let i=0;i<5;i++){
        let col = document.createElement("div");
        col.className="col";

        let title = document.createElement("h4");
        title.innerText = places[i];

        col.appendChild(title);

        for(let j=0;j<data[i];j++){
            let c = document.createElement("div");
            c.className="counter";
            c.innerText="●";
            col.appendChild(c);
        }

        container.appendChild(col);
    }
}

/* =========================
   SECTION ACTIONS
========================= */

function addCounter(section){
    if(section===1) A[0]++;
    if(section===2) B[0]++;
    render();
}

function moveToB(){
    B[0] += A[0];
    A = [0,0,0,0,0];
    render();
}

function moveToC(){
    C[0] += B[0];
    B = [0,0,0,0,0];
    render();
}

/* =========================
   REGROUP LOGIC
========================= */
function regroup(){
    for(let i=0;i<4;i++){
        if(C[i] >= 10){
            let carry = Math.floor(C[i]/10);
            C[i] = C[i] % 10;
            C[i+1] += carry;
        }
    }
    render();
}

/* =========================
   DRAWING CANVAS
========================= */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

let drawing = false;
let eraserMode = false;

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mouseup",stop);
canvas.addEventListener("mousemove",draw);

canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchend",stop);
canvas.addEventListener("touchmove",draw);

function getPos(e){
    if(e.touches){
        return {
            x:e.touches[0].clientX - canvas.offsetLeft,
            y:e.touches[0].clientY - canvas.offsetTop
        };
    }
    return {
        x:e.offsetX,
        y:e.offsetY
    };
}

function start(e){
    drawing = true;
    draw(e);
}

function stop(){
    drawing = false;
    ctx.beginPath();
}

function draw(e){
    if(!drawing) return;
    let pos = getPos(e);

    ctx.lineWidth = 3;
    ctx.lineCap = "round";

    ctx.strokeStyle = eraserMode ? "white" : "black";

    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x,pos.y);
}

function clearCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

render();

</script>

</body>
</html>
