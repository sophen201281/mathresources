<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Fraction Circle Puzzle</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
}

/* Drawing canvas background */
#drawCanvas{
    position:fixed;
    inset:0;
    background:white;
}

/* UI panel */
#ui{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

/* Center container */
#container{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* SVG */
svg{
    overflow:visible;
}

/* Fraction pieces */
.path-piece{
    cursor:grab;
    transition:transform .15s ease;
}

.path-piece.dragging{
    cursor:grabbing;
}
</style>
</head>

<body>

<canvas id="drawCanvas"></canvas>

<div id="ui">
    Parts:
    <select id="parts">
        <option>2</option>
        <option>3</option>
        <option selected>4</option>
        <option>5</option>
        <option>6</option>
        <option>8</option>
    </select>
</div>

<div id="container">
    <svg id="svg" width="320" height="320"></svg>
</div>

<script>
/* =========================
   DRAWING CANVAS
========================= */

const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let drawing = false;

canvas.addEventListener("pointerdown", e=>{
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.clientX, e.clientY);
});

canvas.addEventListener("pointermove", e=>{
    if(!drawing) return;

    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#0066ff";

    ctx.lineTo(e.clientX, e.clientY);
    ctx.stroke();
});

window.addEventListener("pointerup", ()=>{
    drawing = false;
});



/* =========================
   FRACTION GENERATOR
========================= */

const svg = document.getElementById("svg");
const cx = 160, cy = 160;
const R = 140;

let pieces = [];

function polar(angle, r){
    return {
        x: cx + Math.cos(angle)*r,
        y: cy + Math.sin(angle)*r
    };
}

function createSlice(i, n){

    const start = (Math.PI*2/n)*i;
    const end = (Math.PI*2/n)*(i+1);

    const p1 = polar(start, R);
    const p2 = polar(end, R);

    const largeArc = (end-start) > Math.PI ? 1 : 0;

    const d = `
        M ${cx} ${cy}
        L ${p1.x} ${p1.y}
        A ${R} ${R} 0 ${largeArc} 1 ${p2.x} ${p2.y}
        Z
    `;

    const path = document.createElementNS("http://www.w3.org/2000/svg","path");

    path.setAttribute("d", d);
    path.setAttribute("fill", `hsl(${i*60},70%,60%)`);
    path.setAttribute("stroke", "#222");
    path.classList.add("path-piece");

    path.dataset.tx = 0;
    path.dataset.ty = 0;

    let dragging = false;
    let ox = 0, oy = 0;

    path.addEventListener("pointerdown", e=>{
        dragging = true;
        path.classList.add("dragging");
        path.setPointerCapture(e.pointerId);

        ox = e.clientX - path.dataset.tx;
        oy = e.clientY - path.dataset.ty;
    });

    path.addEventListener("pointermove", e=>{
        if(!dragging) return;

        const tx = e.clientX - ox;
        const ty = e.clientY - oy;

        path.dataset.tx = tx;
        path.dataset.ty = ty;

        path.setAttribute("transform", `translate(${tx},${ty})`);
    });

    path.addEventListener("pointerup", ()=>{
        dragging = false;
        path.classList.remove("dragging");

        const tx = parseFloat(path.dataset.tx);
        const ty = parseFloat(path.dataset.ty);

        const dist = Math.hypot(tx, ty);

        // STRONG SNAP BACK 🔥
        if(dist < 140){
            path.dataset.tx = 0;
            path.dataset.ty = 0;
            path.setAttribute("transform", "translate(0,0)");
        }
    });

    svg.appendChild(path);
    pieces.push(path);
}



/* =========================
   BUILD SYSTEM
========================= */

function build(){
    svg.innerHTML = "";
    pieces = [];

    const n = parseInt(document.getElementById("parts").value);

    for(let i=0;i<n;i++){
        createSlice(i,n);
    }
}

document.getElementById("parts").addEventListener("change", build);

build();
</script>

</body>
</html>
