<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Magnetic Circle Puzzle + Drawing Canvas</title>

<style>
html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    background:#f3f6fb;
}

/* Drawing canvas background */
#draw{
    position:absolute;
    top:0;
    left:0;
    z-index:0;
    touch-action:none;
}

/* Puzzle canvas on top */
#puzzle{
    position:absolute;
    top:0;
    left:0;
    z-index:1;
    touch-action:none;
}

/* Toolbar */
#toolbar{
    position:absolute;
    top:10px;
    left:10px;
    z-index:5;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

button,input{
    font-size:14px;
}
</style>
</head>

<body>

<canvas id="draw"></canvas>
<canvas id="puzzle"></canvas>

<div id="toolbar">
    Parts:
    <input id="count" type="number" min="2" max="24" value="6">
    <button onclick="build()">Build</button>
    <button onclick="clearDraw()">Clear Draw</button>
</div>

<script>

/* =========================
   CANVAS SETUP
========================= */
const drawCanvas = document.getElementById("draw");
const drawCtx = drawCanvas.getContext("2d");

const puzzleCanvas = document.getElementById("puzzle");
const ctx = puzzleCanvas.getContext("2d");

function resize(){
    drawCanvas.width = puzzleCanvas.width = window.innerWidth;
    drawCanvas.height = puzzleCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* =========================
   DRAWING LAYER
========================= */
let drawing = false;

drawCanvas.addEventListener("mousedown", e=>{
    drawing = true;
    drawCtx.beginPath();
    drawCtx.moveTo(e.clientX, e.clientY);
});

drawCanvas.addEventListener("mousemove", e=>{
    if(!drawing) return;
    drawCtx.lineWidth = 2;
    drawCtx.strokeStyle = "#333";
    drawCtx.lineTo(e.clientX, e.clientY);
    drawCtx.stroke();
});

drawCanvas.addEventListener("mouseup", ()=> drawing=false);

drawCanvas.addEventListener("touchstart", e=>{
    drawing = true;
    const t = e.touches[0];
    drawCtx.beginPath();
    drawCtx.moveTo(t.clientX, t.clientY);
});

drawCanvas.addEventListener("touchmove", e=>{
    if(!drawing) return;
    const t = e.touches[0];
    drawCtx.lineWidth = 2;
    drawCtx.strokeStyle = "#333";
    drawCtx.lineTo(t.clientX, t.clientY);
    drawCtx.stroke();
});

drawCanvas.addEventListener("touchend", ()=> drawing=false);

function clearDraw(){
    drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
}

/* =========================
   PUZZLE DATA
========================= */
let pieces = [];
let drag = null;

const RADIUS = 110;
const SNAP_DIST = 90;

function color(i,n){
    return `hsl(${i*360/n},80%,60%)`;
}

function build(){

    const n = +document.getElementById("count").value;

    pieces = [];

    const cx = window.innerWidth/2;
    const cy = window.innerHeight/2;

    const step = (Math.PI*2)/n;

    for(let i=0;i<n;i++){

        pieces.push({
            id:i,
            angleStart:i*step,
            angleEnd:(i+1)*step,

            correctX:cx,
            correctY:cy,

            x:cx + (Math.random()*400-200),
            y:cy + (Math.random()*300-150),

            locked:false,
            color:color(i,n)
        });
    }
}

build();

/* =========================
   DRAW PIECES
========================= */
function drawPiece(p){

    ctx.save();
    ctx.translate(p.x,p.y);

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,RADIUS,p.angleStart,p.angleEnd);
    ctx.closePath();

    ctx.fillStyle = p.color;
    ctx.fill();

    ctx.strokeStyle = "#222";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
}

/* =========================
   RENDER LOOP
========================= */
function render(){
    ctx.clearRect(0,0,puzzleCanvas.width,puzzleCanvas.height);
    pieces.forEach(drawPiece);
    requestAnimationFrame(render);
}
render();

/* =========================
   POINTER HELPERS
========================= */
function pos(e){
    const r = puzzleCanvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x:t.clientX-r.left, y:t.clientY-r.top };
}

function inside(px,py,p){
    const dx=px-p.x, dy=py-p.y;
    return Math.sqrt(dx*dx+dy*dy) < RADIUS;
}

/* =========================
   DRAG SYSTEM
========================= */
puzzleCanvas.addEventListener("mousedown",start);
puzzleCanvas.addEventListener("mousemove",move);
puzzleCanvas.addEventListener("mouseup",end);

puzzleCanvas.addEventListener("touchstart",start,{passive:false});
puzzleCanvas.addEventListener("touchmove",move,{passive:false});
puzzleCanvas.addEventListener("touchend",end);

function start(e){
    const p = pos(e);

    for(let i=pieces.length-1;i>=0;i--){
        if(inside(p.x,p.y,pieces[i])){
            drag = pieces[i];
            drag.offX = p.x - drag.x;
            drag.offY = p.y - drag.y;
            break;
        }
    }
}

function move(e){
    if(!drag) return;
    const p = pos(e);
    drag.x = p.x - drag.offX;
    drag.y = p.y - drag.offY;
    e.preventDefault();
}

function end(){
    if(drag){
        magneticSnap(drag);
        drag = null;
    }
}

/* =========================
   🧲 MAGNETIC NEIGHBOR SNAP
========================= */
function magneticSnap(p){

    let best = null;
    let bestDist = Infinity;

    for(const q of pieces){
        if(q === p) continue;

        const dx = q.x - p.x;
        const dy = q.y - p.y;
        const d = Math.sqrt(dx*dx + dy*dy);

        // check if they are "angle neighbors"
        const angleDiff = Math.abs(p.angleStart - q.angleEnd);

        if(d < SNAP_DIST && angleDiff < 0.6){

            if(d < bestDist){
                bestDist = d;
                best = q;
            }
        }
    }

    if(best){

        // snap p next to best neighbor direction
        const dx = best.x - p.x;
        const dy = best.y - p.y;

        const len = Math.sqrt(dx*dx + dy*dy) || 1;

        // place tightly connected
        p.x = best.x + (dx/len)*RADIUS*1.8;
        p.y = best.y + (dy/len)*RADIUS*1.8;
    }
}

</script>
</body>
</html>
